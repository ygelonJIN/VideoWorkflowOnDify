          :\n            scene[\"visual_brief\"] = rich_brief(template)\n        \
          \    warnings.append(\"%s visual_brief 过于空泛，已补充完整组件布局\" % scene_id)\n\n\
          \        avatar = scene.get(\"avatar_pip\") if isinstance(scene.get(\"avatar_pip\"\
          ), dict) else {}\n        avatar[\"visible\"] = True\n        avatar[\"\
          position\"] = \"top_right\"\n        avatar[\"behavior\"] = str(avatar.get(\"\
          behavior\") or \"persistent\")\n        scene[\"avatar_pip\"] = avatar\n\
          \n        variables = scene.get(\"content_variables\")\n        if not isinstance(variables,\
          \ dict) or len(variables) < 4:\n            variables = rich_variables(template)\n\
          \            warnings.append(\"%s content_variables 不足 4 项，已补充具体演示数据\" %\
          \ scene_id)\n        if variables is not None and not isinstance(variables,\
          \ dict):\n            warnings.append(\"%s content_variables 不是对象，已改为空对象\"\
          \ % scene_id)\n            variables = {}\n        if isinstance(variables,\
          \ dict) and variables:\n            labels = str(scene.get(\"labeling\"\
          , \"\"))\n            if \"示例\" not in labels and \"场景演示\" not in labels:\n\
          \                scene[\"labeling\"] = \"场景演示\"\n                warnings.append(\"\
          %s 已自动标记“场景演示”\" % scene_id)\n        scene[\"content_variables\"] = variables\
          \ if isinstance(variables, dict) else {}\n\n        if not str(scene.get(\"\
          voiceover_text\", \"\")).strip():\n            refs_text = [item.get(\"\
          text\", \"\") for item in script.get(\"sentences\", []) if isinstance(item,\
          \ dict) and str(item.get(\"id\")) in valid_refs]\n            scene[\"voiceover_text\"\
          ] = \" \".join(str(x) for x in refs_text if x).strip()\n        normalized_scenes.append(scene)\n\
          \n    scenes = normalized_scenes\n    if \"hook\" not in purposes:\n   \
          \     scenes[0][\"purpose\"] = \"hook\"\n        warnings.append(\"缺少 hook，已将第一个场景设为\
          \ hook\")\n    if \"cta\" not in purposes:\n        scenes[-1][\"purpose\"\
          ] = \"cta\"\n        warnings.append(\"缺少 cta，已将最后一个场景设为 cta\")\n    if\
          \ \"solution\" not in {item[\"purpose\"] for item in scenes}:\n        scenes[min(1,\
          \ len(scenes) - 1)][\"purpose\"] = \"solution\"\n        warnings.append(\"\
          缺少 solution，已将中间场景设为 solution\")\n\n    storyboard[\"scenes\"] = scenes\n\
          \    storyboard[\"validation\"] = {\"errors\": [], \"warnings\": warnings}\n\
          \    return {\n        \"storyboard_json\": json.dumps(storyboard, ensure_ascii=False),\n\
          \        \"scene_count\": len(scenes),\n        \"storyboard_valid\": True,\n\
          \        \"storyboard_errors_json\": \"[]\",\n        \"storyboard_warnings_json\"\
          : json.dumps(warnings, ensure_ascii=False)\n    }\n"
