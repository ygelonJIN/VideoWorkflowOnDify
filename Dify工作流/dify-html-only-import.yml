    - id: a11
      type: custom
      data:
        type: code
        title: A11_整理动效
        code_language: python3
        code: "def main(motion_text: str, storyboard_json: str, recommended_motion_count_min:\
          \ int) -> dict:\n    import json\n    import re\n\n    def parse(raw, label):\n\
          \        value = str(raw or \"\").strip()\n        value = re.sub(r\"^```(?:json)?\\\
          s*|\\s*```$\", \"\", value, flags=re.I)\n        try:\n            return\
          \ json.loads(value)\n        except Exception:\n            start, end =\
          \ value.find(\"{\"), value.rfind(\"}\")\n            if start >= 0 and end\
          \ > start:\n                try:\n                    return json.loads(value[start:end\
          \ + 1])\n                except Exception:\n                    pass\n \
          \           return {\"__invalid_json__\": True, \"__label__\": label}\n\n\
          \    motion = parse(motion_text, \"动效\")\n    storyboard = parse(storyboard_json,\
          \ \"分镜\")\n    if not isinstance(storyboard, dict):\n        storyboard\
          \ = {}\n    warnings = []\n    if not isinstance(motion, dict) or motion.get(\"\
          __invalid_json__\"):\n        warnings.append(\"动效 JSON 无法解析，已按分镜生成基础动效继续\"\
          )\n        motion = {}\n    sequences = motion.get(\"sequences\")\n    if\
          \ not isinstance(sequences, list) or not sequences:\n        raw_scenes\
          \ = storyboard.get(\"scenes\", []) if isinstance(storyboard.get(\"scenes\"\
          ), list) else []\n        base_scenes = raw_scenes or [{\"scene_id\": \"\
          s01\"}]\n        actions = [\"enter\", \"highlight\", \"state_change\"]\n\
          \        sequences = []\n        for index in range(max(6, len(base_scenes)\
          \ * 2)):\n            scene = base_scenes[index % len(base_scenes)] if isinstance(base_scenes[index\
          \ % len(base_scenes)], dict) else {}\n            sequences.append({\n \
          \               \"motion_id\": \"m%02d\" % (index + 1),\n              \
          \  \"scene_id\": str(scene.get(\"scene_id\") or \"s01\"),\n            \
          \    \"sentence_id\": str(scene.get(\"sentence_id\") or \"s01\"),\n    \
          \            \"action\": actions[index % len(actions)],\n              \
          \  \"target\": \"focus_element\",\n                \"duration_ms\": 600,\n\
          \                \"easing\": \"power3.out\",\n                \"start_trigger\"\
          : \"sentence_start\",\n                \"semantic_reason\": \"与当前口播语义同步的基础动效\"\
          \n            })\n        motion = {\"sequences\": sequences}\n        warnings.append(\"\
          motion.sequences 为空，已生成基础动效继续\")\n    scenes = [str(x.get(\"scene_id\"))\
          \ for x in storyboard.get(\"scenes\", []) if isinstance(x, dict) and x.get(\"\
          scene_id\")]\n    if not scenes:\n        scenes = [\"s01\"]\n    sentences\
          \ = []\n    for scene in storyboard.get(\"scenes\", []):\n        if isinstance(scene,\
          \ dict):\n            sentences.extend(str(x) for x in scene.get(\"sentence_ids\"\
          , []) if str(x).strip())\n    if not sentences:\n        sentences = [\"\
          s01\"]\n\n    allowed_actions = {\n        \"enter\", \"count_up\", \"highlight\"\
          , \"path_draw\", \"cursor_move\",\n        \"click\", \"state_change\",\
          \ \"zoom_focus\", \"keyword_highlight\",\n        \"row_reveal\", \"status_update\"\
          \n    }\n    allowed_eases = {\"power3.out\", \"power2.inOut\", \"expo.out\"\
          , \"power2.out\"}\n    seen_ids = set()\n    normalized = []\n\n    for\
          \ index, item in enumerate(sequences, 1):\n        if not isinstance(item,\
          \ dict):\n            item = {\"target\": str(item)}\n            warnings.append(\"\
          第 %d 条动效不是对象，已转换为简单动作\" % index)\n\n        motion_id = str(item.get(\"\
          motion_id\") or \"m%02d\" % index)\n        while motion_id in seen_ids:\n\
          \            motion_id += \"_dup\"\n        seen_ids.add(motion_id)\n  \
          \      item[\"motion_id\"] = motion_id\n\n        scene_id = str(item.get(\"\
          scene_id\", \"\"))\n        if scene_id not in scenes:\n            old\
          \ = scene_id or \"empty\"\n            scene_id = scenes[min(index - 1,\
          \ len(scenes) - 1)]\n            item[\"scene_id\"] = scene_id\n       \
          \     warnings.append(\"%s scene_id=%s 已归一化为 %s\" % (motion_id, old, scene_id))\n\
          \        sentence_id = str(item.get(\"sentence_id\", \"\"))\n        if\
          \ sentence_id not in sentences:\n            old = sentence_id or \"empty\"\
          \n            sentence_id = sentences[min(index - 1, len(sentences) - 1)]\n\
          \            item[\"sentence_id\"] = sentence_id\n            warnings.append(\"\
          %s sentence_id=%s 已归一化为 %s\" % (motion_id, old, sentence_id))\n\n      \
          \  action = str(item.get(\"action\", \"\")).strip()\n        if action ==\
          \ \"fade\":\n            item[\"action\"] = \"enter\"\n            warnings.append(\"\
          %s action=fade 已改为 enter\" % motion_id)\n        elif action not in allowed_actions:\n\
          \            item[\"action\"] = \"state_change\"\n            warnings.append(\"\
          %s action=%s 已改为 state_change\" % (motion_id, action or \"empty\"))\n\n\
          \        for key in (\"repeat\", \"loop\"):\n            if key in item:\n\
          \                item.pop(key)\n                warnings.append(\"%s 已移除禁止字段\
          \ %s\" % (motion_id, key))\n\n        try:\n            duration = int(item.get(\"\
          duration_ms\") or 0)\n        except Exception:\n            duration =\
          \ 0\n        clamped = max(250, min(2200, duration or 600))\n        if\
          \ clamped != duration:\n            warnings.append(\"%s duration_ms=%s\
          \ 已归一化为 %s\" % (motion_id, duration, clamped))\n        item[\"duration_ms\"\
          ] = clamped\n\n        easing = str(item.get(\"easing\", \"\")).strip()\n\
          \        if easing not in allowed_eases:\n            item[\"easing\"] =\
          \ \"power3.out\"\n            warnings.append(\"%s easing=%s 已归一化为 power3.out\"\
          \ % (motion_id, easing or \"empty\"))\n\n        if not str(item.get(\"\
          start_trigger\", \"\")).strip():\n            item[\"start_trigger\"] =\
          \ \"sentence_start\"\n            warnings.append(\"%s start_trigger 缺失，已设为\
          \ sentence_start\" % motion_id)\n\n        target = str(item.get(\"target\"\
          , \"\")).strip()\n        if item[\"action\"] == \"zoom_focus\" and target\
          \ in {\"root\", \"screen\", \"global\", \"\"}:\n            item[\"action\"\
          ] = \"highlight\"\n            item[\"target\"] = target or \"focus_element\"\
          \n            warnings.append(\"%s 整图 zoom_focus 已改为局部 highlight\" % motion_id)\n\
          \n        if not str(item.get(\"semantic_reason\", \"\")).strip():\n   \
          \         item[\"semantic_reason\"] = \"与当前句子的语义变化同步\"\n            warnings.append(\"\
          %s semantic_reason 缺失，已生成默认说明\" % motion_id)\n\n        normalized.append(item)\n\
          \n    minimum = max(6, int(recommended_motion_count_min or 0))\n    if len(normalized)\
          \ < minimum:\n        warnings.append(\"动效数量少于建议值 %d，已继续输出\" % minimum)\n\
          \n    motion[\"sequences\"] = normalized\n    motion[\"validation\"] = {\"\
          errors\": [], \"warnings\": warnings}\n    return {\n        \"motion_plan_json\"\
          : json.dumps(motion, ensure_ascii=False),\n        \"motion_count\": len(normalized),\n\
          \        \"motion_valid\": True,\n        \"motion_errors_json\": \"[]\"\
          ,\n        \"motion_warnings_json\": json.dumps(warnings, ensure_ascii=False)\n\
          \    }\n"
        variables:
        - variable: motion_text
          value_selector:
          - a10
          - text
          value_type: string
        - variable: storyboard_json
          value_selector:
          - a09
          - storyboard_json
          value_type: string
        - variable: recommended_motion_count_min
          value_selector:
          - a07
          - recommended_motion_count_min
          value_type: number
        outputs:
          motion_plan_json:
            type: string
            children: null
          motion_count:
            type: number
            children: null
          motion_valid:
            type: boolean
            children: null
          motion_errors_json:
            type: string
            children: null
          motion_warnings_json:
            type: string
            children: null
