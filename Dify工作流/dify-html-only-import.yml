            creative\": {\n    \"topic_mode\": \"rotate\",\n    \"angle_preference\"\
            : \"可选角度偏好\"\n  },\n  \"brand\": {},\n  \"history\": {}\n}\n```\n\n规则：\n\
            \n- 用户没有填写的可选内容使用空对象或空字符串。\n- 不得发明用户未提供的数字、案例、价格或承诺。\n- `duration_seconds`\
