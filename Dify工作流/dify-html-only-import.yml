    - id: h01
      type: custom
      data:
        type: llm
        title: H01_生成HTML视频组合
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen3.8-flash
          mode: chat
          completion_params:
            temperature: 0.15
            max_tokens: 24000
        prompt_template:
        - id: h01-system
          role: system
          text: '# HTML 视频编排


            你是 HTML 动效视频导演。根据已批准内容，输出一个完整的、可放入 HyperFrames 项目的 HTML 文件。


            ## 硬性要求


            - 输出完整 HTML 文档，不输出 Markdown 代码围栏，不输出解释。

            - 使用固定生产模板骨架：CSS 变量、类名、栅格、边距、对齐、卡片结构、数字人窗口和字幕位置每次完全一致。禁止根据 request_id
            自由更换视觉风格、布局、字体、配色或对齐方式；request_id 只用于区分项目和内容。

            - 画布固定为 CSS `width: 1080px; height: 1920px`（竖屏 9:16，禁止横屏/16:9），普通浏览器打开时用
            `fitRootToViewport` 整体等比缩放。根 composition 必须直接挂在 `id="stage"`，包含 `data-composition-id`、`data-width="1080"`、`data-height="1920"`、`data-duration="30"`、`data-caption-sync="transcript-required"`。

            - 每个场景的主要内容必须作为一个整体在屏幕纵向中心显示；水平对齐沿用固定模板原规则，原本左对齐的保持左对齐，原本居中的保持居中。禁止修改任何原始组件尺寸，包括标题的 font-size、width、height、min-height、padding、gap、border-radius。内容少时保留自然高度和呼吸感，但必须用独立组件、数据、列表或流程充实，不得强制拉伸，也不得出现只有标题的场景。标题字号
            72–84px，正文 28–36px，卡片文字 22–40px，卡片/流程/看板主块高度至少 240px；主要组件必须在860px内容列内居中，禁止撑满画布宽度。

            - 场景内容使用 `width: 100%; height: 100%; display: flex; flex-direction: column`，主内容及其卡片组必须使用
            `flex: 1` 向下延伸。所有场景都必须使用 `data-coverage="full"` 的全高块状布局，主要内容在安全区域内垂直居中，水平对齐保持模板原规则，不要求铺满画面；每个场景至少包含3类、8个可见组件节点和80字有效信息，禁止只有标题或一句说明。

            - 字幕必须使用简体中文（`lang="zh-CN"`），禁止繁体中文。字幕是中下部的小型字幕框：`position: absolute`、`bottom:
            22%` 至 `26%`（推荐 24%）、水平居中、`max-width: 58%` 至 `66%`、字号固定 37px（原 31px 基础上加大
            6px）。背景只能包住文字，禁止全屏字幕底板。

            - 数字人只允许作为右上角小窗叠在完整 HTML 主画面之上，不能全屏、不能把 HTML 缩成横屏或只占半屏。数字人窗口使用 `.pip`，并保留
            `data-video-role="avatar"` 的 template 媒体占位。

            - 右上角数字人外层小窗固定为 `top: 96px; right: 48px; width: 214px; height: 380px`，内部视频必须严格
            `top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:cover`
            填满外层。若媒体占位位于 `.avatar-zone` 内，禁止再次应用 `top:96px/right:48px`，只能由最外层定位一次，避免数字人偏到左下并被裁切。该区域不得显示标签、占位文字或其他
            UI。

            - 直接用普通浏览器打开时，也必须只显示 `data-start=0` 的首场景；播放口播后按音频 `currentTime` 切换场景和字幕，禁止多个场景叠在一起。

            - 字幕区保留 `<!-- CAPTIONS_START -->` 和 `<!-- CAPTIONS_END -->`，每条字幕使用 `class="clip
            caption"`、`data-start`、`data-duration`、`data-track-index="4"`。

            - 最终字幕时间由真实 HeyGen transcript 或 ASR 时间码重写，不得把模型估算时间当成最终同步。数字人视频、口播音频、背景音乐、场景切换和字幕必须共用同一真实时间轴：所有媒体占位统一
            `data-start="0"`，最终 `data-duration` 由同步脚本写成同一成片时长；场景与字幕只能由 HyperFrames
            时间线驱动，保证音画、字幕、数字人同步。

            - 为避免 Dify 直接执行 HTML 时产生 `Network error`，本地脚本和媒体必须使用预览安全占位：外部脚本使用 `<script
            data-src="...">`；视频/音频使用 `<template data-media-type="video|audio" data-media-id="..."
            data-media-src="...">`。禁止在 H01 输出中直接使用本地 `src="媒体/..."` 或 `src="素材/..."`。`sync_video.py`
            会在正式渲染前把它们激活为真实标签。

            - HeyGen 视频标记 `data-video-role="avatar"`，口播标记 `data-audio-role="voiceover"`，背景音乐标记
            `data-audio-role="background-music"`。

            - 外部 GSAP 未加载时必须使用无报错的预览桩时间线，至少支持 `from/to/set/eventCallback/seek/time/duration`；禁止
            raw HTML 预览抛出 `gsap is not defined`。

            - 根节点必须包含 `data-authoring-duration="30"` 和 `data-timeline-scale="1"`。定义
            `const at = (seconds) => Number(seconds) * timelineScale`，所有 GSAP 时间位置必须使用
            `at(seconds)`；本地同步脚本会根据真实媒体时长缩放场景和时间线。

            - 使用一个暂停的 GSAP 时间线，并注册到 `window.__timelines`。

            - 禁止静态 PNG 冒充完整动效、整图缩放、循环呼吸、随机漂移、无限粒子。

            - 禁止 `performance.now()`、`requestAnimationFrame` 和墙钟驱动；场景、字幕、进度只能由 HyperFrames
            时间线/媒体时间驱动。所有 CJK 字体必须提供 `@font-face`，系统字体使用 `src: local("字体名")`。

            '
        - id: h01-user
          role: user
          text: '已批准内容：


            {{#a16.approved_package_json#}}



            生产要求：


            {{#a00.production_requirements#}}



            请求编号：


            {{#a00.request_id#}}



            目标成片：1080×1920。使用固定生产模板骨架，只替换本次文案、数据和场景信息；不要根据 request_id 更换风格。所有主要内容必须作为一个整体在屏幕纵向中心显示；水平对齐严格沿用固定模板原规则，禁止统一改成水平居中。不得修改标题、卡片、流程、指标、按钮的原始字号、宽高、内边距、间距或圆角。顶部栏、右上数字人、底部状态条和字幕保持固定位置。只输出完整简体中文
            HTML 文档。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 7600
        y: 365
      positionAbsolute:
        x: 7600
        y: 365
      sourcePosition: right
      targetPosition: left
      width: 310
      height: 155
    - id: h02
      type: custom
      data:
        type: code
        title: H02_检查HTML组合
        code_language: python3
        code: "def main(html_document: str, production_requirements: str) -> dict:\n\
          \    import json\n    import re\n\n    html = str(html_document or \"\"\
          )\n    errors = []\n    warnings = []\n    if not re.search(r'<div\\b[^>]*\\\
          bid=[\"\\']stage[\"\\'][^>]*\\bdata-composition-id=', html, re.I):\n   \
          \     errors.append(\"根 composition 必须直接挂在 #stage，不能只放在内层 div\")\n    if\
          \ \"performance.now(\" in html or \"requestAnimationFrame(\" in html:\n\
          \        errors.append(\"禁止 performance.now/requestAnimationFrame，必须由 HyperFrames\
          \ 时间线驱动\")\n\n    if \"<!doctype html>\" not in html.lower():\n        errors.append(\"\
          缺少完整 HTML 文档头\")\n    for token in [\n        \"data-composition-id\", \"\
          data-width\", \"data-height\", \"data-duration\",\n        \"window.__timelines\"\
          , \"CAPTIONS_START\", \"CAPTIONS_END\", \"data-caption-sync\",\n       \
          \ \"fitRootToViewport\", \"data-authoring-duration\", \"data-timeline-scale\"\
          ,\n    ]:\n        if token not in html:\n            errors.append(\"缺少\
          \ \" + token)\n    if not re.search(r\"width:\\s*1080px[\\s\\S]*height:\\\
          s*1920px\", html):\n        errors.append(\"根画布必须固定为 CSS 1080×1920\")\n\
          \    if re.search(r'width\\s*:\\s*1920px|height\\s*:\\s*1080px|data-width=\"\
          1920\"|data-height=\"1080\"', html):\n        errors.append(\"禁止横屏/16:9\
          \ 画布，必须是 1080×1920 竖屏\")\n    if 'data-video-role=\"avatar\"' not in html:\n\
          \        errors.append(\"缺少数字人角色标记 data-video-role=\\\"avatar\\\"\")\n \
          \   if 'data-audio-role=\"voiceover\"' not in html:\n        errors.append(\"\
          缺少独立口播音频图层 data-audio-role=\\\"voiceover\\\"\")\n    if 'data-audio-role=\"\
          background-music\"' not in html:\n        warnings.append(\"未发现背景音乐图层\"\
          )\n    if not re.search(r'<template[^>]+data-media-type=\"video\"[^>]+data-video-role=\"\
          avatar\"[^>]*>', html, re.I):\n        errors.append(\"数字人必须使用预览安全的 template\
          \ 媒体占位\")\n    if re.search(r'(?<!data-)(?<!data-media-)src\\s*=\\s*[\"\\\
          '](?:媒体|素材)/', html):\n        errors.append(\"H01 输出不得直接引用本地媒体，必须使用 data-media-src\
          \ 占位\")\n    if not re.search(r'class=[\"\\'][^[\"\\']*\\bclip\\b', html):\n\
          \        errors.append(\"缺少 clip 时间片段\")\n    if \"data-start\" not in html\
          \ or \"data-duration\" not in html:\n        errors.append(\"缺少时间片段属性\"\
          )\n    if html.count('data-coverage=\"full\"') < 5:\n        errors.append(\"\
          五个场景都必须使用 data-coverage=\\\"full\\\" 全高布局\")\n    if not re.search(r'height:\\\
          s*100%', html):\n        errors.append(\"场景内容未声明 height:100%，不能只占画面局部\"\
          )\n    if not re.search(r'justify-content:\\s*center', html):\n        errors.append(\"主要内容必须在安全可视区域内垂直居中\")\n    scene_chunks = re.split(r'<(?:section|div)\\b[^>]*class=[\"\\'][^\"\\']*\\bscene\\b', html, flags=re.I)[1:]\n    if len(scene_chunks) < 5:\n        errors.append(\"至少需要5个独立场景\")\n    component_pattern = r'class=[\"\\'][^\"\\']*(?:card|panel|tool|step|metric|cmp-item|cmp-list|status|chip|flow|grid|list|cta)'\n    for scene_index, scene_html in enumerate(scene_chunks, 1):\n        scene_html = re.split(r'<!--\\s*CAPTIONS_START|class=[\"\\']caption-layer', scene_html, maxsplit=1, flags=re.I)[0]\n        component_count = len(re.findall(component_pattern, scene_html, re.I))\n        visible_text = re.sub(r'<[^>]+>', ' ', scene_html)\n        text_chars = len(re.sub(r'\\s+', '', visible_text))\n        component_types = set(re.findall(component_pattern, scene_html, re.I))\n        if component_count < 8:\n            errors.append(f\"场景{scene_index}组件不足：至少需要8个可见组件节点，当前只有{component_count}个\")\n        if len(component_types) < 3:\n            errors.append(f\"场景{scene_index}组件类型不足：至少需要3类卡片、列表、流程、指标、工具或CTA组件\")\n        if text_chars < 80:\n            errors.append(f\"场景{scene_index}信息量不足：可见文字至少80字，当前只有{text_chars}字\")\n\n    traditional_chars = \"個們這為與後時問體驗網絡數據臺灣點擊開團隊發現溝銷線錄\"\
          \n    used = sorted(set(html) & set(traditional_chars))\n    if used:\n\
          \        errors.append(\"HTML 文案必须使用简体中文，发现繁体字：\" + \"\".join(used))\n\n\
          \    for token in [\"VIDEO_WORKER\", \"production-jobs\", \"webhook\"]:\n\
          \        if token.lower() in html.lower():\n            errors.append(\"\
          HTML 中不应引用 Worker/生产接口：\" + token)\n    if not re.search(r'(?:const|var)\\\
          s+at\\s*=', html) or not re.search(r'\\}\\s*,\\s*at\\(', html):\n      \
          \  errors.append(\"所有 GSAP 时间位置必须使用 at()\")\n    if not re.search(r\"(gsap|__timelines)\"\
          , html, re.I):\n        errors.append(\"未发现可寻址时间线\")\n    if len(html) >\
          \ 800000:\n        warnings.append(\"HTML 体积较大，建议拆分为模板和数据\")\n\n    return\
          \ {\n        \"html_valid\": not errors,\n        \"html_errors_json\":\
          \ json.dumps(errors, ensure_ascii=False),\n        \"html_warnings_json\"\
          : json.dumps(warnings, ensure_ascii=False),\n        \"production_requirements\"\
          : str(production_requirements or \"\")\n    }\n\n"
        variables:
        - variable: html_document
