    - id: a04
      type: custom
      data:
        type: llm
        title: A04_选择内容角度
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen3.8-flash
          mode: chat
          completion_params:
            temperature: 0.2
            max_tokens: 1200
        prompt_template:
        - id: a04-system
          role: system
          text: "# 内容策略师\n\n你是 B2B 外贸获客短视频的内容策略师。只能从已确认 brief 和审核主题池中选择一个角度，不得自行发明事实。\n\
            \n## 输入\n\n- `brief`: 品牌、产品、受众、痛点、证据、offer、CTA、平台、目标时长\n- `approved_topics`:\
            \ 已审核主题池\n- `history`: 已使用主题和效果反馈\n\n## 目标\n\n一条视频只解决一个用户认知任务：确认问题、理解一个产品动作、看到一组证据，或执行一个\
            \ CTA。\n\n## 约束\n\n1. 不选择无法由 brief 证据支持的案例角度。\n2. 不把所有产品模块塞入一个主题。\n3.\
            \ Hook 必须具体，避免“大家好”“今天介绍”。\n4. 数字、价格和案例只能来自 `facts_confirmed`。\n5. 输出\
            \ JSON，不输出 Markdown。\n\n## 输出 JSON\n\n```json\n{\n  \"angle_id\": \"string\"\
            ,\n  \"angle_type\": \"痛点型|案例型|功能型|结果型|行业型|转化型\",\n  \"core_message\"\
            : \"一句话核心结论\",\n  \"audience_tension\": \"目标用户当前在意的问题\",\n  \"hook_candidates\"\
            : [\"候选 Hook 1\", \"候选 Hook 2\", \"候选 Hook 3\"],\n  \"proof_priority\"\
            : [\"本条优先使用的已确认证据\"],\n  \"claims_to_verify\": [\"无法确认、需要人工核验的内容\"],\n\
            \  \"selection_reason\": \"选择该角度的原因\",\n  \"excluded_topics\": [\"本次明确不讲的内容\"\
            ]\n}\n```\n\n只输出严格合法 JSON：字符串内的双引号必须转义，不能包含未闭合字符串、尾逗号、Markdown 或代码围栏。"
        - id: a04-user
          role: user
          text: 'BRIEF:

            {{#a03.brief_json#}}


            APPROVED_TOPICS:

            {{#a00.history_notes#}}


            只选择一个角度，只输出 JSON。


            只输出严格合法 JSON：字符串内的双引号必须转义，不能包含未闭合字符串、尾逗号、Markdown 或代码围栏。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 1710
        y: 295
      positionAbsolute:
        x: 1710
        y: 295
      sourcePosition: right
      targetPosition: left
      width: 310
      height: 155
    - id: a05
      type: custom
      data:
        type: code
        title: A05_解析内容角度
        code_language: python3
        code: "def main(strategy_text: str) -> dict:\n    import json\n    import\
          \ re\n\n    raw = str(strategy_text or \"\").strip()\n    raw = re.sub(r\"\
          ^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.I)\n    try:\n       \
          \ data = json.loads(raw)\n    except Exception:\n        start, end = raw.find(\"\
          {\"), raw.rfind(\"}\")\n        data = {}\n        if start >= 0 and end\
          \ > start:\n            try:\n                data = json.loads(raw[start:end\
          \ + 1])\n            except Exception:\n                data = {}\n    if\
          \ not isinstance(data, dict):\n        data = {}\n    fallback_warning =\
          \ \"\"\n    if not data:\n        fallback_warning = \"内容策略 JSON 无法解析，已生成基础角度继续\"\
          \n        data = {\"core_message\": raw[:200] or \"聚焦一个具体业务问题\", \"angle_id\"\
          : \"angle_generated\"}\n\n    warnings = [fallback_warning] if fallback_warning\
          \ else []\n    core_message = str(data.get(\"core_message\", \"\")).strip()\n\
          \    hook = str(data.get(\"hook\", \"\")).strip()\n    hooks = data.get(\"\
          hook_candidates\")\n    if not isinstance(hooks, list):\n        hooks =\
          \ []\n    hooks = [str(item).strip() for item in hooks if str(item).strip()]\n\
          \    if not hooks:\n        hooks = [hook or core_message or \"聚焦一个具体业务问题\"\
          ]\n        warnings.append(\"hook_candidates 缺失，已使用 hook/core_message 生成\"\
          )\n    data[\"hook_candidates\"] = hooks\n    data[\"hook\"] = hooks[0]\n\
          \n    if not core_message:\n        core_message = data[\"hook\"]\n    \
          \    data[\"core_message\"] = core_message\n        warnings.append(\"core_message\
          \ 缺失，已使用 hook 生成\")\n    if not str(data.get(\"angle_id\", \"\")).strip():\n\
          \        data[\"angle_id\"] = \"angle_generated\"\n        warnings.append(\"\
          angle_id 缺失，已生成 angle_generated\")\n    data[\"normalization_warnings\"\
          ] = warnings\n\n    return {\n        \"strategy_json\": json.dumps(data,\
          \ ensure_ascii=False),\n        \"angle_id\": str(data[\"angle_id\"]),\n\
          \        \"hook\": str(data[\"hook\"]),\n        \"core_message\": core_message,\n\
          \        \"parse_ok\": True\n    }\n"
        variables:
        - variable: strategy_text
          value_selector:
          - a04
          - text
          value_type: string
        outputs:
          strategy_json:
            type: string
            children: null
          angle_id:
            type: string
            children: null
          hook:
            type: string
            children: null
          core_message:
            type: string
            children: null
          parse_ok:
            type: boolean
            children: null
      position:
        x: 2065
        y: 315
      positionAbsolute:
        x: 2065
        y: 315
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 177
    - id: a06
      type: custom
      data:
        type: llm
        title: A06_生成口播文案
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen3.8-flash
          mode: chat
          completion_params:
            temperature: 0.2
            max_tokens: 2200
        prompt_template:
        - id: a06-system
          role: system
          text: "# 数字人口播文案\n\n你是懂 B2B 外贸获客和短视频投放的中文口播文案。活动需求只是内容种子，不是完整口播。请把它扩写成完整、自然、信息充分的视频叙事。\n\
            \n## 生成策略\n\n- 以成功生成视频为第一目标，内容宁可写充分，也不要输出过短口播。\n- 30 秒方案优先写到 320–420 个字符、12–18\
            \ 个完整句子，至少是活动需求信息量的两倍。\n- 最终门禁保持宽：80–500 个字符、至少 3 个完整句子都通过。不要为了精确字数反复删减或输出失败。\n\
            - 根据活动需求扩展痛点背景、客户搜索、名单筛选、决策人识别、批量触达、沟通记录、团队协作、跟进提醒、结果复盘和 CTA。\n- 只能使用已确认数字、案例、价格和效果；通用流程动作可以合理扩写，但不得编造数据或承诺。\n\
            \n## 硬性规则\n\n1. 首句在 2 秒内提出问题、冲突或结果。\n2. 一条视频只讲一个核心角度，但可以把这个角度讲完整。\n3.\
            \ 不确定内容进入 `claims_to_verify`。\n4. 禁止绝对化承诺和贬低竞品。\n5. 口播不得包含镜头指令、括号、Markdown\
            \ 或舞台说明。\n6. 单条字幕不超过 16 个汉字，最终时间由真实 transcript/ASR 重写。\n\n## 输出 JSON\n\
            \n```json\n{\n  \"angle_id\": \"string\",\n  \"hook\": \"string\",\n \
            \ \"sentences\": [{\"id\": \"s01\", \"text\": \"自然口播句\", \"purpose\":\
            \ \"hook|pain|solution|proof|cta\"}],\n  \"voiceover_script\": \"完整扩写口播全文\"\
            ,\n  \"burned_in_caption_lines\": [\"逐句短字幕\"],\n  \"title\": \"发布标题\"\
            ,\n  \"hashtags\": [\"#标签\"],\n  \"claims_to_verify\": [],\n  \"compliance_notes\"\
            : [],\n  \"estimated_duration_seconds\": 30.0\n}\n```"
        - id: a06-user
          role: user
          text: 'BRIEF：


            {{#a03.brief_json#}}



            STRATEGY：


            {{#a05.strategy_json#}}



            MIN_VOICE_CHARS（宽门禁下限）：


            {{#a03.min_voice_chars#}}



            MAX_VOICE_CHARS（宽门禁上限）：


            {{#a03.max_voice_chars#}}



            请把 BRIEF 当作种子扩写：优先目标 320–420 字、12–18 句；最终 80–500 字、至少 3 句即可通过。只输出严格合法
            JSON。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 2420
