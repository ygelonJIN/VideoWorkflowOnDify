      data:
        type: code
        title: A09_整理分镜
        code_language: python3
        code: "def main(storyboard_text: str, script_json: str) -> dict:\n    import\
          \ json\n    import re\n\n    def parse(raw, label):\n        value = str(raw\
          \ or \"\").strip()\n        value = re.sub(r\"^```(?:json)?\\s*|\\s*```$\"\
          , \"\", value, flags=re.I)\n        try:\n            return json.loads(value)\n\
          \        except Exception:\n            start, end = value.find(\"{\"),\
          \ value.rfind(\"}\")\n            if start >= 0 and end > start:\n     \
          \           try:\n                    return json.loads(value[start:end\
          \ + 1])\n                except Exception:\n                    pass\n \
          \           return {\"__invalid_json__\": True, \"__label__\": label}\n\n\
          \    briefs = {\n        \"buyer_search\": \"顶部展示关键词、国家和行业筛选器，中部展示搜索结果卡、客户名称、采购意向与匹配度，底部展示批量加入线索池、触达建议和示例数据状态。\"\
          ,\n        \"lead_list\": \"顶部展示线索池总览和状态筛选，中部展示客户名单、国家、需求标签、负责人和跟进状态，底部展示批量分配、提醒和转化预测。\"\
          ,\n        \"data_dashboard\": \"顶部展示核心指标和趋势，中部展示图表、来源分布、区域排名和异常状态，底部展示数据明细、导出和操作建议。\"\
          ,\n        \"outreach\": \"顶部展示沟通渠道和联系人状态，中部展示消息模板、会话记录、回复状态和风险提示，底部展示发送、跟进和日程安排。\"\
          ,\n        \"crm_followup\": \"顶部展示客户阶段和负责人，中部展示跟进时间线、需求摘要、报价状态和下一步动作，底部展示自动同步、提醒和成交概率。\"\
          ,\n        \"workflow\": \"顶部展示搜索客户入口和筛选条件，中部展示搜索、触达、跟进三个大型流程模块及状态数据，底部展示统一后台、自动同步和效率提升结果。\"\
          ,\n        \"comparison\": \"左侧展示过去分散工具、人工操作和时间成本，右侧展示统一平台、自动化流程和收益指标，底部展示对比结论与行动入口。\"\
          ,\n        \"none\": \"顶部展示核心问题，中部展示大型数据卡、流程或对比组件，底部展示结论、指标和行动提示。\",\n \
          \   }\n    variable_presets = {\n        \"buyer_search\": {\"目标市场\": \"\
          德国 · 工业设备\", \"采购意向\": \"A+\", \"匹配客户\": \"128 家\", \"最近活跃\": \"12 分钟前\"\
          },\n        \"lead_list\": {\"新增线索\": \"86 条\", \"高意向客户\": \"23 家\", \"\
          待跟进\": \"17 条\", \"预计转化\": \"32%\"},\n        \"data_dashboard\": {\"本月询盘\"\
          : \"428\", \"有效客户\": \"176\", \"平均响应\": \"8 分钟\", \"转化率\": \"24.6%\"},\n\
          \        \"outreach\": {\"待回复消息\": \"18\", \"今日触达\": \"64\", \"回复率\": \"\
          42%\", \"下一步\": \"自动提醒\"},\n        \"crm_followup\": {\"自动同步\": \"100%\"\
          , \"漏跟进\": \"0\", \"成交概率\": \"68%\", \"下次跟进\": \"今天 16:30\"},\n        \"\
          workflow\": {\"搜索客户\": \"已连接\", \"触达沟通\": \"自动同步\", \"CRM 跟进\": \"实时写入\"\
          , \"效率提升\": \"72%\"},\n        \"comparison\": {\"过去耗时\": \"3.5 小时\", \"\
          现在耗时\": \"42 分钟\", \"减少切换\": \"72%\", \"数据完整度\": \"98%\"},\n        \"none\"\
          : {\"核心指标\": \"72%\", \"当前状态\": \"自动处理中\", \"覆盖流程\": \"搜索·触达·跟进\", \"结果\"\
          : \"高效转化\"},\n    }\n    def rich_brief(template):\n        return briefs.get(template,\
          \ briefs[\"none\"])\n    def rich_variables(template):\n        return dict(variable_presets.get(template,\
          \ variable_presets[\"none\"]))\n\n    storyboard = parse(storyboard_text,\
          \ \"分镜\")\n    script = parse(script_json, \"文案\")\n    if not isinstance(script,\
          \ dict):\n        script = {}\n    warnings = []\n    if not isinstance(storyboard,\
          \ dict) or storyboard.get(\"__invalid_json__\"):\n        warnings.append(\"\
          分镜 JSON 无法解析，已按口播句子生成基础分镜继续\")\n        storyboard = {}\n    scenes = storyboard.get(\"\
          scenes\")\n    if not isinstance(scenes, list) or not scenes:\n        sentences\
          \ = [item for item in script.get(\"sentences\", []) if isinstance(item,\
          \ dict) and str(item.get(\"text\", \"\")).strip()]\n        if not sentences:\n\
          \            sentences = [{\"id\": \"s01\", \"text\": str(script.get(\"\
          voiceover_script\") or \"继续介绍产品流程\")}]\n        scenes = [{\n          \
          \  \"scene_id\": \"s%02d\" % (index + 1),\n            \"sentence_ids\"\
          : [str(item.get(\"id\") or \"s%02d\" % (index + 1))],\n            \"voiceover_text\"\
          : str(item.get(\"text\", \"\")),\n            \"purpose\": item.get(\"purpose\"\
          ) if item.get(\"purpose\") in {\"hook\", \"pain\", \"solution\", \"proof\"\
          , \"cta\"} else (\"hook\" if index == 0 else (\"cta\" if index == len(sentences)\
          \ - 1 else \"solution\")),\n            \"visual_source\": \"reusable_ui_template\"\
          ,\n            \"ui_template\": \"workflow\",\n            \"on_screen_text\"\
          : re.sub(r\"\\s+\", \"\", str(item.get(\"text\", \"\")))[:40],\n       \
          \     \"visual_brief\": rich_brief(\"workflow\"),\n            \"content_variables\"\
          : rich_variables(\"workflow\"),\n            \"motion\": \"关键信息逐项出现\",\n\
          \            \"transition\": \"cut\"\n        } for index, item in enumerate(sentences[:7])]\n\
          \        storyboard = {\"scenes\": scenes}\n        warnings.append(\"storyboard.scenes\
          \ 为空，已生成基础分镜继续\")\n        scenes = storyboard[\"scenes\"]\n    if not 4\
          \ <= len(scenes) <= 12:\n        warnings.append(\"视频建议 4-12 个信息密度足够的场景，当前\
          \ %d 个，已继续输出\" % len(scenes))\n\n    sentence_ids = [str(item.get(\"id\"\
          )) for item in script.get(\"sentences\", []) if isinstance(item, dict) and\
          \ item.get(\"id\")]\n    if not sentence_ids:\n        sentence_ids = [\"\
          s%02d\" % i for i in range(1, len(scenes) + 1)]\n    seen_scene_ids = set()\n\
          \    purposes = set()\n\n    allowed_visual = {\n        \"reusable_ui_template\"\
          , \"real_footage\", \"supplied_image\",\n        \"generated_image\", \"\
          motion_graphic\"\n    }\n    allowed_templates = {\n        \"buyer_search\"\
          , \"lead_list\", \"data_dashboard\", \"outreach\",\n        \"crm_followup\"\
          , \"workflow\", \"comparison\", \"none\"\n    }\n    allowed_purposes =\
          \ {\"hook\", \"pain\", \"solution\", \"proof\", \"cta\"}\n    normalized_scenes\
          \ = []\n    for index, scene in enumerate(scenes, 1):\n        if not isinstance(scene,\
          \ dict):\n            scene = {\"voiceover_text\": str(scene)}\n       \
          \     warnings.append(\"第 %d 个 scene 不是对象，已转换为简单场景\" % index)\n\n      \
          \  scene_id = str(scene.get(\"scene_id\") or \"s%02d\" % index)\n      \
          \  original_scene_id = scene_id\n        while scene_id in seen_scene_ids:\n\
          \            scene_id += \"_dup\"\n        if scene_id != original_scene_id:\n\
          \            warnings.append(\"scene_id 重复，%s 已改为 %s\" % (original_scene_id,\
          \ scene_id))\n        seen_scene_ids.add(scene_id)\n        scene[\"scene_id\"\
          ] = scene_id\n\n        refs = [str(x) for x in scene.get(\"sentence_ids\"\
          , []) if str(x).strip()]\n        valid_refs = [ref for ref in refs if ref\
          \ in sentence_ids]\n        if not valid_refs:\n            fallback = sentence_ids[min(index\
          \ - 1, len(sentence_ids) - 1)]\n            valid_refs = [fallback]\n  \
          \          warnings.append(\"%s sentence_ids 缺失或无效，已绑定 %s\" % (scene_id,\
          \ fallback))\n        elif len(valid_refs) != len(refs):\n            warnings.append(\"\
          %s 部分 sentence_ids 无效，已移除\" % scene_id)\n        scene[\"sentence_ids\"\
          ] = valid_refs\n\n        purpose = str(scene.get(\"purpose\", \"\")).strip()\n\
          \        if purpose not in allowed_purposes:\n            old = purpose\
          \ or \"empty\"\n            purpose = \"hook\" if index == 1 else (\"cta\"\
          \ if index == len(scenes) else \"solution\")\n            warnings.append(\"\
          %s purpose=%s 已归一化为 %s\" % (scene_id, old, purpose))\n        scene[\"purpose\"\
          ] = purpose\n        purposes.add(purpose)\n\n        template = str(scene.get(\"\
          ui_template\", \"none\")).strip() or \"none\"\n        if template not in\
          \ allowed_templates:\n            old = template\n            template =\
          \ \"none\"\n            warnings.append(\"%s ui_template=%s 已归一化为 none\"\
          \ % (scene_id, old))\n        source = str(scene.get(\"visual_source\",\
          \ \"\")).strip()\n        if source not in allowed_visual:\n           \
          \ old = source or \"empty\"\n            source = \"reusable_ui_template\"\
          \ if template != \"none\" else \"motion_graphic\"\n            warnings.append(\"\
          %s visual_source=%s 已归一化为 %s\" % (scene_id, old, source))\n        if source\
          \ == \"generated_image\" and template != \"none\":\n            warnings.append(\"\
          %s 生成图不能伪装为产品 UI 模板，ui_template 已改为 none\" % scene_id)\n            template\
          \ = \"none\"\n        scene[\"visual_source\"] = source\n        scene[\"\
          ui_template\"] = template\n\n        on_screen = re.sub(r\"\\s+\", \"\"\
          , str(scene.get(\"on_screen_text\", \"\")))\n        if len(on_screen) >\
          \ 48:\n            warnings.append(\"%s on_screen_text 超过 48 字，已截断\" % scene_id)\n\
          \            on_screen = on_screen[:48]\n        if len(on_screen) < 12:\n\
          \            fallback_text = re.sub(r\"\\s+\", \"\", str(scene.get(\"voiceover_text\"\
          , \"\")))[:40]\n            on_screen = fallback_text or str(scene.get(\"\
          ui_template\", \"workflow\"))\n            warnings.append(\"%s on_screen_text\
          \ 信息量不足，已补充具体屏幕文案\" % scene_id)\n        scene[\"on_screen_text\"] = on_screen\n\
          \n        brief = re.sub(r\"\\s+\", \"\", str(scene.get(\"visual_brief\"\
