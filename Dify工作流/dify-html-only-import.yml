            {{#a09.storyboard_json#}}


            MIN_MOTION_COUNT:

            {{#a07.recommended_motion_count_min#}}


            只输出 JSON，严格使用允许的 action、easing 和 duration_ms。


            只输出严格合法 JSON：字符串内的双引号必须转义，不能包含未闭合字符串、尾逗号、Markdown 或代码围栏。'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
