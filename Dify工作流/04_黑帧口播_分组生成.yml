 'sigma': 1.9, 'dur': 1.5, 'stagger': 0.05},\n        \"T47\": {'rot': -22, 'stagger': 0.055, 'dur': 0.55, 'ease': 'back.out(1.6)', 'z': 6},\n        \"T48\": {'from': 0.2, 'stagger': 0.05, 'dur': 0.6, 'ease': 'back.out(2.2)', 'z': 6},\n        \"X63\": {'dur': 1.2, 'ease': 'power2.inOut', 'z': 6, 'stagger': 0.05},\n        \"X64\": {'dash': 40, 'cycles': 3, 'dur': 1.6, 'z': 6, 'stagger': 0.05},\n        \"X65\": {'dur': 1.6, 'band': 0.34, 'color': '#86F0C0', 'sw': 14, 'z': 6, 'stagger': 0.05},\n        \"X66\": {'or': 300, 'iratio': 0.62, 'sw': 0, 'color': '#86F0C0', 'fill': 'rgba(134,240,192,.16)', 'dur': 1.1, 'ease': 'power2.out', 'z': 6, 'stagger': 0.05},\n        \"X68\": {'copies': 10, 'sides': 6, 'radius': 300, 'size': 62, 'spin': 26, 'sw': 5, 'color': '#86F0C0', 'fill': 'rgba(134,240,192,.12)', 'dur': 1.2, 'ease': 'power2.out', 'z': 6, 'stagger': 0.05},\n        \"X69\": {'iratio': 0.42, 'count': 26, 'size': 34, 'spread': 0.82, 'seed': 7, 'color': '#86F0C0', 'fill': 'rgba(134,240,192,.18)', 'dur': 1.0, 'ease': 'power2.out', 'z': 6, 'stagger': 0.05},\n        \"X71\": {'copies': 9, 'size': 32, 'span': 560, 'fade': 0.86, 'sw': 0, 'color': '#86F0C0', 'fill': '#86F0C0', 'dur': 1.0, 'ease': 'power3.out', 'z': 6, 'stagger': 0.05},\n        \"X72\": {'skew': 20, 'squash': 0.66, 'dur': 1.15, 'z': 6, 'stagger': 0.05},\n        \"X73\": {'depth': 90, 'shift': 190, 'dur': 1.2, 'ease': 'power2.inOut', 'z': 6, 'stagger': 0.05},\n        \"X74\": {'r': 92, 'cx': 50, 'cy': 50, 'dur': 1.0, 'ease': 'power2.inOut', 'z': 6, 'stagger': 0.05},\n        \"X75\": {'skew': 26, 'dur': 1.0, 'ease': 'power2.inOut', 'z': 6, 'stagger': 0.05},\n    }\n\n    # 不能落在常驻文字上的卡：落在 data-role 节点时换同槽位替身。\n    # 由 sync_expander.py 从 presets.json 的 text_safe / text_swap 生成，不要手改。\n    UNSAFE_TEXT = {\n        \"S12\": \"T05\",\n        \"T16\": \"T02\",\n        \"T20\": \"T13\",\n        \"T21\": \"T01\",\n        \"X31\": \"X01\",\n        \"S20\": \"X01\",\n        \"S21\": \"T05\",\n        \"X39\": \"X01\",\n        \"S35\": \"X01\",\n        \"S37\": \"X01\",\n    }\n\n\n    parts = []\n    # 背景只有 B23–B39 这一批 canvas 卡，集合由 CANVAS_BG 决定；不在集合里的编号\n    # 一个 canvas 都不建。别再用正则去猜编号区间——以前猜错过，bgkit 回落到 B08，\n    # 结果是背景卡被另一张卡的图案悄悄顶替。\n    TEXT_PRESETS = {\"T01\", \"T02\", \"T03\", \"T05\", \"T09\", \"T12\", \"T15\",\n                    \"K01\", \"K03\", \"K04\", \"K21\", \"K22\", \"K23\"}\n    CAMERA_PRESETS = {\"C01\", \"C02\", \"C03\", \"W01\", \"W02\", \"W11\", \"W12\", \"W13\",\n                      \"W15\", \"W18\", \"W20\", \"W21\"}\n    # 可绑定的背景 = 选择层真正发出去的背景卡（catalog.background）。\n    # 以前这里写死 B23–B39：目录里的 B49/B50/B51/B53/B54 能选、却一个 canvas 都不建，\n    # 选了就是一块纯色空屏（2026-11-21 s07 的 B51 实测）。目录给什么，这里就绑什么；\n    # 没传 catalog（本地单独跑）才退回旧集合。\n    CANVAS_BG = set((catalog.get(\"background\") or {}).keys()) if isinstance(catalog.get(\"background\"), dict) else set()\n    if not CANVAS_BG:\n        CANVAS_BG = set(\"B%02d\" % i for i in range(23, 40)) - {\"B22\", \"B33\"}\n    visual = scene_data.get(\"visual_budget\") if isinstance(scene_data.get(\"visual_budget\"), dict) else {}\n    bg_id = str(visual.get(\"background\") or \"\").strip().upper()\n    # 背景编号以页面 <div class=\"scene-bg\" data-bg=\"Bxx\"> 上写的为准（R2 按 S2 的分配写进 HTML），\n    # 这里只负责建 canvas 并绑定；S2 给的编号是唯一来源，页面 data-bg 与它必须一致。\n    # 背景参数：motion_plan 里的 background_params 覆盖卡片默认值。\n    # 以前 bind 只传编号，模型改了也没处放，\"选了卡不能写参数\"。\n    bg_opts = {}\n    if isinstance(data, dict):\n        raw_opts = data.get(\"background_params\")\n        if isinstance(raw_opts, dict):\n            for k, v in raw_opts.items():\n                if isinstance(v, (int, float, str)) and not isinstance(v, bool):\n                    bg_opts[str(k)] = v\n    scene_vb = scene_data.get(\"visual_budget\") if isinstance(scene_data.get(\"visual_budget\"), dict) else {}\n    if isinstance(scene_vb.get(\"background_params\"), dict):\n        for k, v in scene_vb[\"background_params\"].items():\n            if isinstance(v, (int, float, str)) and not isinstance(v, bool):\n                bg_opts[str(k)] = v\n    import json as _json\n    bg_opt_lit = _json.dumps(bg_opts, ensure_ascii=False) if bg_opts else \"\"\n    if bg_id in CANVAS_BG:\n        bg_js = (\"(function(){var box=document.querySelector('[data-scene=\\\"%s\\\"] [data-anim=\\\"bg\\\"]');\"\n                 \"if(!box)return;var cv=box.querySelector('canvas');\"\n                 \"if(!cv){cv=document.createElement('canvas');cv.style.cssText=\"\n                 \"'position:absolute;inset:0;width:100%%;height:100%%;';box.appendChild(cv);}\"\n                 \"var id=String(box.getAttribute('data-bg')||'%s').trim().toUpperCase();\"\n                 \"bgkit.bind(timeline,cv,id%s);})();\" % (\n                     sid, bg_id, (\",\" + bg_opt_lit) if bg_opt_lit else \"\"))\n        parts.append(\"/* preset: %s */\\n\" % bg_id + bg_js)\n    used = []\n    skipped = []\n    used_targets = set()\n    bound_params = {}\n    # ---- 屏内出场顺序：role 决定槽位，不让 beat 决定先后（2026-11-20 定）----\n    # 以前每个元素的位置就是它那个 beat 在口播里的时刻。标题是概括句，模型把 beat\n    # 挑在句子落点上，于是 6 屏里 5 屏标题最后出场；最后一屏的标题\"人生成立\"的 beat\n    # 就是全片最后四个字，它只能剩 0.47s。现在 role 定先后、__slot 按真实屏长算网格，\n    # beat 只在槽位里微调。\n    RANK = {\"title\": 0, \"lead\": 1, \"note\": 1, \"num\": 1, \"label\": 1, \"accent\": 1,\n            \"body\": 2, \"media\": 3, \"component\": 4, \"state\": 5, \"deco\": 3, \"out\": 6}\n    TEXT_ROLE_SET = {\"title\", \"lead\", \"body\", \"note\", \"num\", \"label\", \"accent\"}\n    # deco 必须排在**它自己的目标**之后：它的第一件事是把目标显示出来（opacity:1），\n    # 排在目标入场之前会把还没入场的元素提前露出来，紧接着入场再把它藏回去（闪一下）。\n    TARGET_RANK = {}\n    for _item in motions:\n        if not isinstance(_item, dict):\n            continue\n        _role = str(_item.get(\"role\") or \"\").strip()\n        _tgt = str(_item.get(\"target\") or \"\").strip()\n        if _role in TEXT_ROLE_SET or _role in (\"component\", \"media\"):\n            TARGET_RANK.setdefault(_tgt, RANK.get(_role, 2))\n\n    def rank_of(item):\n        role = str(item.get(\"role\") or \"\").strip()\n        if role == \"deco\":\n            return TARGET_RANK.get(str(item.get(\"target\") or \"\").strip(), 3) + 0.5\n        return RANK.get(role, 2)\n\n    def plannable(item):\n        # 只有真正会落地成一段动作的才占槽位：背景卡挂场景背景层，不占内容槽位。\n        if not isinstance(item, dict):\n            return False\n        # 离场卡也不占：它固定在切点前 0.5 秒，不参与\"按屏长铺格子\"。\n        if str(item.get(\"role\") or \"\").strip() == \"out\":\n            return False\n        preset = str(item.get(\"preset\") or \"\").strip().upper()\n        if preset.startswith(\"B\") and preset[1:].isdigit():\n            return False\n        if preset not in TPL:\n            return False\n        return bool(str(item.get(\"target\") or \"\").strip())\n\n    planned = [i for i, item in enumerate(motions) if plannable(item)]\n    planned.sort(key=lambda i: (rank_of(motions[i]), i))\n    slot_of = {orig: k for k, orig in enumerate(planned)}\n    slot_total = len(planned)\n    card_dur_by_slot = {}\n\n    def estimate_card_dur(code, values):\n        \"\"\"从展开后的卡代码量这张卡自己要演多久。\n\n        三段相加，不是取最大：\n          单段 tween 时长 ＋ 子元素级联（stagger × 4）＋ 链上最大偏移量。\n        以前 stagger 走 max()，被时长盖掉：UA01 在 s01 报 0.71s、真实 0.92s，\n        末位余量算成 0.35s、实际只剩 0.14s，四个 chip 的最后一个被切尾\n        （2026-11-20 s01）。\n        \"\"\"\n        durs = []\n        for found in re.findall(r\"['\\\"]?duration['\\\"]?\\s*:\\s*([0-9.]+)\", code):\n            durs.append(float(found))\n        for found in re.findall(r\"\\b_d\\s*=\\s*([0-9.]+)\", code):\n            durs.append(float(found))\n        # 子元素级联：只有真的对「多个子元素」stagger 才算。\n        # 判据是展开后的代码里出现了集合类目标（`> *` / querySelectorAll / kit.split /\n        # children / 批量数组变量）——T14 的 stagger 落在单个 _t 上本来不起作用，\n        # 不设这个门就会白加 0.88s，把整屏预算吃光（2026-11-20 s05）。\n        multi = bool(re.search(r\">\\s*\\*|querySelectorAll|kit\\.split|\\.children|\\b_els\\b|\\b_items\\b|\\b_k\\b\", code))\n        stags = [float(x) for x in re.findall(r\"['\\\"]?stagger['\\\"]?\\s*:\\s*([0-9.]+)\", code)]\n        cascade = (max(stags) * 4) if (stags and multi) else 0.0\n        # 有些卡是几段 tween 串起来的（S20 甩出 1.0 + 0.5 + 1.0，S21 来回 1.6 + 0.9）：\n        # 单段时长代表不了它占屏多久，链上的最大偏移量也要算进去。\n        offsets = [float(a) * float(b or 1) for a, b in\n                   re.findall(r\"\\)\\s*\\+\\s*([0-9.]+)(?:\\s*\\*\\s*([0-9.]+))?\", code)]\n        base = (max(durs) if durs else float(values.get(\"dur\") or 0.6)) + cascade\n        if offsets:\n            base += max(offsets)\n        return max(0.35, min(2.6, base))\n    for idx, item in enumerate(motions):\n        if not isinstance(item, dict):\n            continue\n        # 离场卡走下面单独一轮（固定在切点前），不进内容槽位循环。\n        if str(item.get(\"role\") or \"\").strip() == \"out\":\n            continue\n        preset = str(item.get(\"preset\") or \"\").strip().upper()\n        if preset.startswith(\"B\") and preset[1:].isdigit() and preset in CANVAS_BG:\n            bg = (\"(function(){var box=document.querySelector('[data-scene=\\\"%s\\\"] [data-anim=\\\"bg\\\"]');\"\n                  \"if(!box)return;var cv=box.querySelector('canvas');\"\n                  \"if(!cv){cv=document.createElement('canvas');cv.style.cssText=\"\n                  \"'position:absolute;inset:0;width:100%%;height:100%%;';box.appendChild(cv);}\"\n                  \"var id=String(box.getAttribute('data-bg')||'%s').trim().toUpperCase();\"\n                  \"bgkit.bind(timeline,cv,id);})();\" % (sid, preset))\n            parts.append(\"/* preset: %s */\\n\" % preset + bg)\n            used.append(preset)\n            continue\n        if preset not in TPL:\n            # 不换卡、不猜：编号不在表里说明上游选错了，记录原样编号交给 S2 重出。\n            skipped.append(preset or \"?\")\n            continue\n        # 2026-11-21：照片带只接 entrance_media 里的卡。S2 原来只能从 entrance_block 挑，\n        # G09（Flip + gridTemplateColumns + 动 _t.children 的版面卡）就落到单张 <img> 上：\n        # 整张卡退化成\"屏首藏起来、2.6 秒后才淡入\"，成片里那段就是一块空占位板。\n        if (str(item.get(\"role\") or \"\").strip() == \"media\" and media_entrance_ids\n                and preset not in media_entrance_ids):\n            skipped.append(preset + \"(照片槽只接 entrance_media)\")\n            continue\n        target = str(item.get(\"target\") or \"\").strip()\n        # 拆字/拆词类卡只作用在文字节点上。指到 copy / card-1 这类容器，\n        # kit.split 会把整块文本一起拆，观感是整片字糊成一团、一起浮。\n        # 这里直接把目标归一到文字 role，不靠模型每次都选对。\n        TEXT_ROLES = {\"title\", \"lead\", \"body\", \"note\", \"num\", \"label\", \"accent\"}\n        if preset in TEXT_PRESETS and target not in TEXT_ROLES:\n            target = \"title\"\n        # 2026-11-16：不能落在常驻文字上的卡，判据写在定义层（presets.json 的\n        # text_safe / text_swap），这里只按表换卡。三类都在这张表里：\n        # 1) 离场动作：T20 抛落 / T21 冲出 1296px / S12 整体上滚 780px / X39 横移出画；\n        # 2) 结束时不在原位：S21 甩到 x=840 只回到 120、S20 甩 600 转 90°、T17 冲 780；\n        # 3) 放大不回落：T16 从 1 倍放到 4 倍（9 个字 97px ×4 宽 3492px，整屏只剩笔画）。\n        # 判据以前只有\"结束时还在原位吗\"，S21 回了原位就从缝里过；现在由定义层显式声明。\n        # UNSAFE_TEXT 由 sync_expander.py 从 presets.json 生成，不要手改。\n        if target in TEXT_ROLES and preset in UNSAFE_TEXT:\n            replacement = UNSAFE_TEXT[preset]\n            skipped.append(preset + \"(不能落在文字上→\" + replacement + \"，需重跑 S2 换目标)\")\n            preset = replacement\n            if preset not in TPL:\n                skipped.append(replacement + \"(替身卡不在 TPL)\")\n                continue\n        # 照片层也要有自己的入场（2026-11-18 晚改）：以前这里把非 CAMERA 卡一律丢掉，\n        # 理由是\"屏内再给 media 写 opacity/clip 会和转场抢同一个属性\"（2026-11-15 s07 照片停在 0）。\n        # 但转场动的是 section，屏内卡动的是 media 子元素，两者不是同一个属性；\n        # 而一刀切的结果是照片永远没有屏内入场——切点一到照片就在画面上，\n        # \"每一屏先空屏、所有东西都有入场\"在照片这一层根本不成立。\n        # 现在放开：照片和文字用同一张入场卡也行，卡自己带 from(不可见)，配上 R2 的屏首隐藏即可。\n        if target == \"media\" and not preset:\n            skipped.append(\"(media 没有可用卡)\")\n            continue\n        if not target:\n            skipped.append(preset + \"(no target)\")\n            continue\n        # target 允许直接给 data-anim 名，也允许给完整选择器\n        sel = target if target.startswith((\"[\", \".\", \"#\")) else '[data-anim=\"%s\"]' % target\n        if sid and not sel.startswith('[data-scene='):\n            sel = '[data-scene=\"%s\"] %s' % (sid, sel)\n        # 这一层的根：R2 在屏首隐起来的就是它（[data-anim=\"<target>\"]）。\n        # 下面按锚点把 sel 收窄到组件内部的元素，但\"把它显示出来\"永远打在根上——\n        # 打在元素上会让逐条 stagger 的后面几项提前现身再跳回去（2109 s01 的「感受」闪一下）。\n        layer_sel = sel\n\n        # 状态卡落点（2026-11-22）：判据来自定义层的 state_meta，这里执行。\n        # 比例条（requires_number）只认真实数字：这一屏一个字都没提数字，\n        # 画一条 720px 的进度条就是装饰。\n        # 1) 改写文字的卡只能落文字节点——落在组件根上会把组件内容清空重写\n        #    （2026-11-22 s05：三格指标被清成一行 16px 的「富豪财富集中」）。\n        # 2) 会 append 自己造的元素、又没声明锚点的卡，也不许落组件根：元素会插进\n        #    栅格变成一格，或者贴在容器边缘，看着像半空里冒出来的圆点（s04 的勾选）。\n        # 3) 触发卡（点击/勾选/拖动/切换/状态灯）后面必须还有一拍落在同一目标上：\n        #    只说\"发生了一件事\"、没有结果，就是假交互。\n        _role = str(item.get(\"role\") or \"\").strip()\n        _meta = state_meta.get(preset) if isinstance(state_meta.get(preset), dict) else {}\n        if _role.startswith(\"state\") or _meta:\n            if _meta.get(\"requires\") == \"text\" and target not in TEXT_ROLE_SET:\n                skipped.append(preset + \"(只改文字，目标不是文字节点→重跑 S2)\")\n                continue\n            if (not (card_needs.get(preset) or [])) and target in comp_by_anim \\\n                    and _meta.get(\"writes\") in (\"content\", \"overlay\"):\n                skipped.append(preset + \"(会改写/插入内容，不能落在组件根上→重跑 S2)\")\n                continue\n            if _meta.get(\"requires_number\"):\n                _txt = \" \".join([str(x.get(\"text\") or \"\") for x in (data.get(\"copy\") or []) if isinstance(x, dict)]\n                                + [str(t) for c in (data.get(\"components\") or []) if isinstance(c, dict)\n                                   for t in (c.get(\"texts\") or [])])\n                if not re.search(r\"[0-9０-９]|[%％]|倍|成|个百分点\", _txt):\n                    skipped.append(preset + \"(要真实数值，本屏没有数字→重跑 S2)\")\n                    continue\n            if _meta.get(\"trigger\"):\n                _later = [m for m in motions[idx + 1:]\n                          if isinstance(m, dict)\n                          and str(m.get(\"target\") or \"\").strip() == target\n                          and str(m.get(\"preset\") or \"\").strip().upper() in TPL]\n                if not _later:\n                    skipped.append(preset + \"(触发卡后面没有结果→重跑 S2 补 then)\")\n                    continue\n\n        # deco：只有声明了 text 的卡必须落文字；其余（框注/色带/描边）跟着目标走。\n        # 标注不许落在标题上：标题已经是全屏最大字号，再压一道荧光笔/圈就是糊住它\n        # （2026-11-22 s01 的 K45 把 96px 荧光笔压在一整句标题上）。\n        if _role == \"deco\":\n            _needs = {str(n) for n in (motion_needs.get(preset) or [])}\n            if target == \"title\":\n                skipped.append(preset + \"(标注不许落在标题上→重跑 S2)\")\n                continue\n            if \"text\" in _needs and target not in TEXT_ROLE_SET:\n                skipped.append(preset + \"(只落在文字上，目标不是文字→重跑 S2)\")\n                continue\n\n        # 组件动效：先按契约校验，再把锚点解析成组件内的真实选择器。\n        if preset in component_motion_ids:\n            comp = comp_by_anim.get(target)\n            if not comp:\n                skipped.append(preset + \"(组件动效找不到目标组件)\")\n                continue\n            cid = str(comp.get(\"id\") or \"\").strip()\n            allowed = motion_by_component.get(cid)\n            if isinstance(allowed, list) and preset not in allowed:\n                skipped.append(preset + \"(组件 \" + cid + \" 不提供它需要的锚点)\")\n                continue\n            meta = motion_meta.get(preset) if isinstance(motion_meta.get(preset), dict) else {}\n            provides = (component_meta.get(cid) or {}).get(\"provides\") if isinstance(component_meta.get(cid), dict) else {}\n            if not isinstance(provides, dict):\n                provides = {}\n            mode = str(meta.get(\"target\") or \"container\").strip().lower()\n            if mode == \"items\":\n                anchor = str(meta.get(\"anchor\") or \"\").strip()\n                segment = str(provides.get(anchor) or \"\").strip()\n                if not segment:\n                    skipped.append(preset + \"(组件 \" + cid + \" 没有 \" + anchor + \" 锚点)\")\n                    continue\n                sel = sel + \" \" + segment\n            elif mode == \"container\":\n                binds = meta.get(\"bind\") if isinstance(meta.get(\"bind\"), dict) else {}\n                if not binds:\n                    anchor = str(meta.get(\"anchor\") or \"\").strip()\n                    binds = {\"child\": anchor} if anchor else {}\n                bad_bind = []\n                for key, anchor in binds.items():\n                    segment = str(provides.get(str(anchor)) or \"\").strip()\n                    if not segment:\n                        bad_bind.append(str(anchor))\n                    else:\n                        bound_params[str(key)] = segment\n                if bad_bind:\n                    skipped.append(preset + \"(组件 \" + cid + \" 缺少锚点 \" + \"、\".join(bad_bind) + \")\")\n                    continue\n\n        # 带锚点的状态卡（S36 要 num）：和组件动效一样，sel 指到组件声明的锚点元素。\n        # 以前 sel 停在组件根，卡自己在里面找 .num，找不到就回落 _t，\n        # 把整块标签文字改写成计数（2026-11-21 s07 的「156」）。\n        state_anchors = [str(a) for a in (card_needs.get(preset) or [])] if preset not in component_motion_ids else []\n        if state_anchors:\n            comp = comp_by_anim.get(target)\n            if not comp:\n                skipped.append(preset + \"(锚点卡找不到目标组件)\")\n                continue\n            cid = str(comp.get(\"id\") or \"\").strip()\n            provides = (component_meta.get(cid) or {}).get(\"provides\") if isinstance(component_meta.get(cid), dict) else {}\n            if not isinstance(provides, dict):\n                provides = {}\n            missing = [a for a in state_anchors if not str(provides.get(a) or \"\").strip()]\n            if missing:\n                skipped.append(preset + \"(组件 \" + cid + \" 缺锚点 \" + \"、\".join(missing) + \")\")\n                continue\n            sel = sel + \" \" + str(provides[state_anchors[0]]).strip()\n\n        # 同一屏的两个动效不许落在同一个目标上。\n        # 2026-11-14 踩过：s05 的入场 T02 和状态 X01 都指向 card-1，\n        # X01 是\"从裁切到揭示\"，immediateRender 把整张卡从屏头藏到 cue 时刻，\n        # 3.5 秒的屏有 2.3 秒是空的。状态类重复目标直接跳过。\n        # 只有「会重置初始态」的卡不能在已入场的元素上再来一次；\n        # 只写终态的状态卡（S02 进度条 / S04 勾选 / X01 位移）允许叠在同一目标上。\n        RESET_PRESETS = {\"S31\", \"S37\", \"X31\", \"T20\", \"T21\", \"T13\", \"T19\"}\n        if preset in RESET_PRESETS and target in used_targets:\n            skipped.append(preset + \"(target 与入场重复)\")\n            continue\n        used_targets.add(target)\n\n        trigger = str(item.get(\"trigger\") or \"sentence_start\").strip()\n        word = \"\"\n        if trigger.startswith(\"word:\"):\n            word = trigger[5:].strip().replace(\"'\", \"\")\n\n        values = dict(DEFAULTS.get(preset, {}))\n        params = item.get(\"params\")\n        if isinstance(params, dict):\n            for key, value in params.items():\n                values[str(key)] = value\n        # 锚点选择器由组件结构决定，优先于模型给的 params（模型无权改组件结构）。\n        if bound_params:\n            values.update(bound_params)\n        values.setdefault(\"sel2\", sel)\n        values.update({\"sel\": sel, \"k\": \"%d\" % idx})\n        values.setdefault(\"dur\", 0.6)\n        values.setdefault(\"stagger\", 0.05)\n        values.setdefault(\"from\", 0)\n        values.setdefault(\"to\", 100)\n        values.setdefault(\"seed\", 7)\n        values.setdefault(\"color\", \"#38d6ff\")\n        values[\"dur\"] = float(values[\"dur\"])\n        values[\"stagger\"] = float(values[\"stagger\"])\n\n        # 先拿占位时刻渲一遍，量出这张卡自己要演多久；槽位起点才敢按它反推。\n        try:\n            probe = TPL[preset] % dict(values, at=\"at(0)\")\n            card_dur = estimate_card_dur(probe, values)\n        except Exception:\n            card_dur = float(values.get(\"dur\") or 0.6)\n        slot_index = slot_of.get(idx, 0)\n        at_expr = \"at(slot('%s', %d, %d, '%s', __cardDur[%d]))\" % (\n            sid, slot_index, max(1, slot_total), word, slot_index)\n        card_dur_by_slot[slot_index] = card_dur\n        values[\"at\"] = at_expr\n\n        try:\n            block = TPL[preset] % values\n            # 统一把目标在它自己的时刻显示出来（首帧被整体隐藏过）\n            block = \"timeline.set('%s', {'opacity':1}, %s);\\n\" % (layer_sel.replace(\"'\", \"\"), at_expr) + block\n            parts.append(\"/* preset: %s */\\n\" % preset + block)\n            used.append(preset)\n        except Exception:\n            skipped.append(preset + \"(模板参数不匹配)\")\n\n    # 屏尾收束（out）：离场卡不占槽位，固定在切点前 0.5 秒。\n    # 位置按 __slot 同一口径换算（__slot 返回 t/scale，at() 再乘回来），\n    # 所以这里把 (屏长 - 0.5) 先除以 timelineScale。\n    for idx2, item in enumerate(motions):\n        if not isinstance(item, dict) or str(item.get(\"role\") or \"\").strip() != \"out\":\n            continue\n        preset = str(item.get(\"preset\") or \"\").strip().upper()\n        target = str(item.get(\"target\") or \"\").strip()\n        if preset not in TPL:\n            skipped.append(preset or \"?(out)\")\n            continue\n        if not target:\n            skipped.append(preset + \"(out 没有目标)\")\n            continue\n        sel = target if target.startswith((\"[\", \".\", \"#\")) else '[data-anim=\"%s\"]' % target\n        if sid and not sel.startswith('[data-scene='):\n            sel = '[data-scene=\"%s\"] %s' % (sid, sel)\n        values = dict(DEFAULTS.get(preset, {}))\n        if isinstance(item.get(\"params\"), dict):\n            values.update({str(k): v for k, v in item[\"params\"].items()})\n        values.setdefault(\"sel2\", sel)\n        values.update({\"sel\": sel, \"k\": \"%d\" % idx2})\n        values.setdefault(\"dur\", 0.45)\n        values.setdefault(\"stagger\", 0.05)\n        values.setdefault(\"from\", 0)\n        values.setdefault(\"to\", 100)\n        values.setdefault(\"seed\", 7)\n        values.setdefault(\"color\", \"#38d6ff\")\n        values[\"dur\"] = float(values[\"dur\"])\n        values[\"stagger\"] = float(values[\"stagger\"])\n        values[\"at\"] = \"at(((((window.__cueWindows || {})['%s'] || [0,6])[1]) - %.2f) / (window.__timelineScale || 1))\" % (sid, 0.5)\n        try:\n            parts.append(\"/* preset: %s */\\n\" % preset + TPL[preset] % values)\n            used.append(preset)\n        except Exception:\n            skipped.append(preset + \"(模板参数不匹配)\")\n\n    body = \"\\n\\n\".join(parts)\n    # 本屏每个槽位的卡片时长：__slot 拿它算\"末位起点 = 真实屏长 - 最长卡 - 驻留\"，\n    # 全屏共用一个 last/step，元素先后才不会因为卡片长短不同而反转。\n    card_dur_lit = \"[%s]\" % \",\".join(\n        \"%.2f\" % float(card_dur_by_slot.get(i, 0.6)) for i in range(max(1, slot_total)))\n    script = (\n        \"<script>\\nwindow.__sceneBuilders.push(function(timeline, at){\\n\"\n        \"  var cue = function(s, w, f){ return window.__cue ? window.__cue(s, w, f) : f; };\\n\"\n        \"  var slot = function(s, k, n, w, d){ return window.__slot ? window.__slot(s, k, n, w, d) : (window.__cue ? window.__cue(s, w, 0.4) : 0.4); };\\n\"\n        \"  var __cardDur = \" + card_dur_lit + \";\\n\"\n        \"  (window.__sceneCardDur = window.__sceneCardDur || {})['\" + sid + \"'] = __cardDur;\\n\"\n        \"  /* 本屏动效由判断节点出力，本地按编号展开 */\\n\"\n        + body + \"\\n});\\n</script>\"\n    ) if body else \"<script>\\n/* 本屏没有可用动效编号：跳过 */\\n</script>\"\n\n    return {\n        \"script\": script,\n        \"motion_used_json\": json.dumps({\"scene_id\": sid, \"used\": used, \"skipped\": skipped}, ensure_ascii=False),\n    }\n\n\ndef main(specs_json: str, catalog_json: str = \"\") -> dict:\n    \"\"\"整片动效展开：逐屏把编号展开成 <script>，返回 {scene_id: script}。\"\"\"\n    import json\n\n    specs = json.loads(specs_json or \"[]\")\n    scripts, used, skipped = {}, {}, {}\n    for spec in specs:\n        if not isinstance(spec, dict):\n            continue\n        sid = str(spec.get(\"scene_id\") or \"\").strip()\n        if not sid:\n            continue\n        scene = {\"scene_id\": sid, \"visual_budget\": {\"background\": str(spec.get(\"bg\") or \"\").strip().upper()}}\n        result = expand_one(json.dumps(spec, ensure_ascii=False), json.dumps(scene, ensure_ascii=False), catalog_json)\n        scripts[sid] = result.get(\"script\") or \"\"\n        report = json.loads(result.get(\"motion_used_json\") or \"{}\")\n        used[sid] = report.get(\"used\") or []\n        skipped[sid] = report.get(\"skipped\") or []\n    return {\n        \"scripts_json\": json.dumps(scripts, ensure_ascii=False),\n        \"motion_report_json\": json.dumps({\"used\": used, \"skipped\": skipped}, ensure_ascii=False),\n    }\n"
        variables:
