"></i><div class=\\\"ui-browser-url\\\"><b>{s0}</b>{s1}</div></div><div class=\\\"ui-browser-body\\\"><div class=\\\"ui-browser-side\\\"><i class=\\\"i on\\\"></i><i class=\\\"i\\\"></i><i class=\\\"i\\\"></i><i class=\\\"i\\\"></i></div><div class=\\\"ui-browser-main\\\"><div class=\\\"ui-browser-kpi\\\"><div class=\\\"k\\\"><b>{s2}</b><span>{s3}</span></div><div class=\\\"k\\\"><b>{s4}</b><span>{s5}</span></div></div><div class=\\\"ui-browser-chart\\\"><i class=\\\"bar\\\" style=\\\"left:4%;height:34%\\\"></i><i class=\\\"bar\\\" style=\\\"left:22%;height:52%\\\"></i><i class=\\\"bar\\\" style=\\\"left:40%;height:44%\\\"></i><i class=\\\"bar\\\" style=\\\"left:58%;height:68%\\\"></i><i class=\\\"bar\\\" style=\\\"left:76%;height:82%\\\"></i></div></div></div></div>\", \"before\": 6, \"row_slots\": 0, \"after\": 0, \"row\": null, \"repeat\": false}, \"U68\": {\"tpl\": \"<div class=\\\"ui-tweet\\\"><div class=\\\"ui-tweet-hd\\\"><i class=\\\"ui-tweet-av\\\"></i><div><div class=\\\"ui-tweet-name\\\">{s0}</div><div class=\\\"ui-tweet-handle\\\">{s1}</div></div></div><div class=\\\"ui-tweet-body\\\">{s2}</div><div class=\\\"ui-tweet-meta\\\">{s3}</div><div class=\\\"ui-tweet-line\\\"></div><div class=\\\"ui-tweet-stats\\\"><span><b>{s4}</b>{s5}</span><span><b>{s6}</b>{s7}</span><span><b>{s8}</b>{s9}</span></div></div>\", \"before\": 10, \"row_slots\": 0, \"after\": 0, \"row\": null, \"repeat\": false}}\"\"\")\n    return {\"catalog_json\": json.dumps(CATALOG, ensure_ascii=False),\n            \"component_tpl_json\": json.dumps(COMPONENT_TPL, ensure_ascii=False)}\n"
