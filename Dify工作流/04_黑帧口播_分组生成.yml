        title: H01PV_整理图像计划
        code_language: python3
        code: "def main(image_plan_text: str, approved_package_json: str) -> dict:\n    \"\"\"归一化图像计划：保证每个分镜都有画面承担者，字段合法，并拆出给 HTML 节点用的精简版。\"\"\"\n    import json\n    import re\n\n    warnings = []\n    raw = str(image_plan_text or \"\").strip()\n    raw = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.I)\n    plan = None\n    if raw:\n        try:\n            plan = json.loads(raw)\n        except Exception as error:\n            start = raw.find(\"{\")\n            if start >= 0:\n                for index in range(len(raw) - 1, start, -1):\n                    if raw[index] != \"}\":\n                        continue\n                    candidate = re.sub(r\",\\s*([}\\]])\", r\"\\1\", raw[start:index + 1])\n                    try:\n                        plan = json.loads(candidate)\n                        break\n                    except Exception:\n                        continue\n            if plan is None:\n                warnings.append(\"图像计划 JSON 无法解析（%s）\" % str(error)[:60])\n    if not isinstance(plan, dict):\n        plan = {}\n\n    try:\n        package = json.loads(approved_package_json or \"{}\")\n    except Exception:\n        package = {}\n    storyboard = package.get(\"storyboard\") if isinstance(package.get(\"storyboard\"), dict) else {}\n    scenes = [item for item in (storyboard.get(\"scenes\") or []) if isinstance(item, dict)]\n\n    # html = 这一屏不生成照片，由场景组用 CSS 背景承担画面。\n    allowed_roles = {\"full\", \"inset\", \"portrait\", \"texture\", \"html\"}\n    allowed_sizes = {\"1024x1536\", \"1536x1024\", \"1024x1024\"}\n    allowed_motion = {\"push-in\", \"pull-out\", \"pan-left\", \"pan-right\", \"tilt-up\", \"reveal\", \"parallax\", \"hold\"}\n    allowed_zones = {\"top\", \"bottom\", \"left\", \"right\", \"center\"}\n\n    items = plan.get(\"images\") if isinstance(plan.get(\"images\"), list) else []\n    by_scene = {}\n    cleaned = []\n    used_ids = set()\n    for index, item in enumerate(items):\n        if not isinstance(item, dict):\n            continue\n        scene_id = str(item.get(\"scene_id\") or \"\").strip()\n        image_id = str(item.get(\"id\") or scene_id or \"img%02d\" % (index + 1)).strip()\n        image_id = re.sub(r\"[^A-Za-z0-9_-]\", \"\", image_id) or \"img%02d\" % (index + 1)\n        while image_id in used_ids:\n            image_id += \"_b\"\n        used_ids.add(image_id)\n        role = str(item.get(\"role\") or \"full\").strip().lower()\n        if role not in allowed_roles:\n            warnings.append(\"%s role=%s 已归一化为 full\" % (image_id, role))\n            role = \"full\"\n        size = str(item.get(\"size\") or \"\").strip().lower()\n        if size not in allowed_sizes:\n            size = \"1536x1024\" if role == \"inset\" else \"1024x1536\"\n        zone = str(item.get(\"text_safe_zone\") or \"\").strip().lower()\n        if zone not in allowed_zones:\n            zone = \"center\" if role == \"html\" else \"bottom\"\n        motion = str(item.get(\"motion_hint\") or \"\").strip().lower()\n        if motion not in allowed_motion:\n            motion = \"reveal\" if role == \"html\" else \"hold\"\n        prompt = str(item.get(\"prompt\") or \"\").strip()\n        subject = str(item.get(\"subject\") or \"\").strip()\n        html_brief = str(item.get(\"html_brief\") or \"\").strip()\n        why = str(item.get(\"why\") or \"\").strip()\n        if role == \"html\":\n            if not html_brief and subject:\n                html_brief = subject\n            if not html_brief:\n                warnings.append(\"%s 是 html 屏但没有 html_brief：场景组只能按背景语言兜底\" % image_id)\n        else:\n            if not prompt:\n                warnings.append(\"%s 没有 prompt，已用兜底镜头补上\" % image_id)\n                prompt = (\n                    \"A quiet photographic scene consistent with the film's established look, \"\n                    \"soft directional daylight from one side, shallow depth of field, \"\n                    \"generous negative space, photographic, no text, no logos.\"\n                )\n        entry = {\n            \"id\": image_id,\n            \"scene_id\": scene_id or image_id,\n            \"role\": role,\n            \"subject\": subject,\n            \"why\": why,\n            \"html_brief\": html_brief,\n            \"prompt\": prompt,\n            \"prompt_zh\": str(item.get(\"prompt_zh\") or \"\").strip(),\n            \"negative\": str(item.get(\"negative\") or \"\").strip(),\n            \"size\": size,\n            \"text_safe_zone\": zone,\n            \"motion_hint\": motion,\n        }\n        cleaned.append(entry)\n        if scene_id and scene_id not in by_scene:\n            by_scene[scene_id] = entry\n\n    prefix = str(plan.get(\"prompt_prefix\") or \"\").strip()\n    if not prefix:\n        warnings.append(\"图像计划没有 prompt_prefix：每张图的风格一致性没有统一来源\")\n\n    # 每个分镜都必须有画面承担者。漏掉的屏不再补通用照片（那样只会生成无关画面），\n    # 改为补一屏 HTML 背景，交给场景组按本片背景语言做。\n    scene_ids = [str(scene.get(\"scene_id\") or \"\").strip() for scene in scenes]\n    missing = []\n    for scene in scenes:\n        scene_id = str(scene.get(\"scene_id\") or \"\").strip()\n        if not scene_id or scene_id in by_scene:\n            continue\n        missing.append(scene_id)\n        brief = str(scene.get(\"visual_brief\") or scene.get(\"on_screen_text\") or \"\").strip()[:80]\n        entry = {\n            \"id\": scene_id,\n            \"scene_id\": scene_id,\n            \"role\": \"html\",\n            \"subject\": brief or \"按分镜补的无图屏\",\n            \"why\": \"图像计划漏了这一屏，先用 HTML 背景兜底，避免出现无关照片\",\n            \"html_brief\": \"按本片 art_direction 的底色、材质和线条做一屏抽象背景，文字为主；不画具象物体。%s\" % (brief or \"\"),\n            \"prompt\": \"\",\n            \"prompt_zh\": \"\",\n            \"negative\": \"\",\n            \"size\": \"1024x1536\",\n            \"text_safe_zone\": \"center\",\n            \"motion_hint\": \"reveal\",\n        }\n        cleaned.append(entry)\n        by_scene[scene_id] = entry\n    if missing:\n        warnings.append(\"这些分镜没有配图，已补 HTML 背景兜底：\" + \"、\".join(missing[:8]))\n\n    extra = [entry[\"scene_id\"] for entry in cleaned if entry[\"scene_id\"] and entry[\"scene_id\"] not in scene_ids]\n    if extra:\n        warnings.append(\"图像计划里有分镜之外的多余图片（下游不会用）：\" + \"、\".join(sorted(set(extra))[:8]))\n\n    photo_count = sum(1 for entry in cleaned if entry[\"role\"] != \"html\")\n    html_count = sum(1 for entry in cleaned if entry[\"role\"] == \"html\")\n    if photo_count == 0:\n        warnings.append(\"全片没有任何真实照片：至少需要一张，否则会退化成纯文字 PPT\")\n\n    ordered = [entry for entry in cleaned if entry[\"scene_id\"] in scene_ids]\n    for left, right in zip(ordered, ordered[1:]):\n        if left[\"role\"] == right[\"role\"]:\n            warnings.append(\"%s 与 %s 的 role 都是 %s：相邻两屏画面用法重复\" % (\n                left[\"scene_id\"], right[\"scene_id\"], left[\"role\"]))\n\n    style_bible = plan.get(\"style_bible\") if isinstance(plan.get(\"style_bible\"), dict) else {}\n    coverage = plan.get(\"coverage\") if isinstance(plan.get(\"coverage\"), dict) else {}\n    role_mix = {}\n    for entry in cleaned:\n        role_mix[entry[\"role\"]] = role_mix.get(entry[\"role\"], 0) + 1\n    full_plan = {\n        \"image_plan_version\": plan.get(\"image_plan_version\") or \"1.1\",\n        \"prompt_prefix\": prefix,\n        \"style_bible\": style_bible,\n        \"images\": cleaned,\n        \"coverage\": {\n            \"scene_count\": len(scenes),\n            \"photo_count\": photo_count,\n            \"html_count\": html_count,\n            \"role_mix\": role_mix,\n            \"notes\": str(coverage.get(\"notes\") or \"\"),\n        },\n    }\n    brief_items = [{\n        \"id\": entry[\"id\"],\n        \"scene_id\": entry[\"scene_id\"],\n        \"role\": entry[\"role\"],\n        \"why\": entry[\"why\"],\n        \"html_brief\": entry[\"html_brief\"],\n        \"size\": entry[\"size\"],\n        \"text_safe_zone\": entry[\"text_safe_zone\"],\n        \"motion_hint\": entry[\"motion_hint\"],\n        \"subject\": entry[\"subject\"][:80],\n    } for entry in cleaned]\n\n    return {\n        \"image_plan_json\": json.dumps(full_plan, ensure_ascii=False),\n        \"image_brief_json\": json.dumps({\n            \"prompt_prefix\": prefix,\n            \"style_bible\": {key: style_bible.get(key) for key in (\"medium\", \"optics\", \"lighting\", \"palette\", \"texture\", \"avoid\")},\n            \"images\": brief_items,\n        }, ensure_ascii=False),\n        \"image_count\": photo_count,\n        \"image_valid\": photo_count >= 1 and len(missing) == 0,\n        \"image_warnings_json\": json.dumps(warnings, ensure_ascii=False),\n    }\n"
        variables:
        - variable: image_plan_text
          value_selector:
          - h01p
          - text
          value_type: string
        - variable: approved_package_json
          value_selector:
          - a16
          - approved_package_json
          value_type: string
        outputs:
          image_plan_json:
            type: string
            children: null
          image_brief_json:
            type: string
            children: null
          image_count:
            type: number
            children: null
          image_valid:
            type: boolean
            children: null
          image_warnings_json:
            type: string
            children: null
      position:
        x: 8060
        y: 840
      positionAbsolute:
        x: 8060
        y: 840
      sourcePosition: right
      targetPosition: left
      width: 280
      height: 172
    - id: h01c
      type: custom
      data:
        type: llm
        title: H01C_组件语法
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        prompt_template:
        - id: h01c-system
          role: system
          text: "# 组件语法\n\n你是这支视频的界面设计负责人。视觉定调已经定了隐喻、色彩、字体、材质和光，你负责把它变成**这套片子专用的文字语言**：字怎么排、怎么分级、怎么在一句话里做出可见变化。**这一版画面只许用能力卡编号**（U 组件 / B 背景 / T-X 动效），编号之外不画；你的语法核心是文字块，不是形状。\n\n## 输入\n\n- `approved_package_json`：{{#a16.approved_package_json#}}\n- `art_direction_json`：{{#h01d.text#}}\n- `design_brief`：{{#h00.design_brief#}}\n- `image_brief_json`：{{#h01pv.image_brief_json#}}（每一屏的 `role`：full / inset / portrait / texture / html，图占多大、文字压哪一侧、镜头怎么动）\n\n## 你要决定的\n\n1. **字法**：这套片子的文字怎么排（字级关系、字重对比、行距、字距、对齐、断行策略、留白节奏）。写清允许的做法和禁止的做法；不要写圆角、描边、边框、色块、线条这类形的规矩。\n2. **文字块与组件**：U 组件编号由 H00 的 `visual_budget` 分配，你不改编号；只写每一屏要哪几个文字块、组件里填什么内容（标题/数字/步骤）。\n3. **层级与尺度**：同一屏里哪些字是主角、哪些是证据、哪些是注脚；字级之间差多少倍，靠什么拉开（大小、字重、字距、留白）。\n4. **状态语言**：这套片子用什么表达\"从 A 变成 B\"——描边、填充、位移、遮罩、灰度、勾选、进度、标签切换，任你选；每种写清怎么被看出来，以及禁止什么（例如只有颜色变化、观众看不出来）。\n5. **可动接口命名**：给场景组一套 `data-anim` 命名规则（由你定，例如 `组件名-部件-动作`），保证同屏唯一、语义可读。这套名字是动效节点写选择器的唯一依据。\n6. **视觉承担者容器**：每一屏的画面由照片或纯文字承担。你要定义两套容器：照片容器（满屏/内容块/视觉锚/底纹，文字压哪一侧、遮罩怎么给可读性）和纯文字屏（`data-anim=\"bg\"` 槽位留空，靠主标题多大、断在哪、留白多少撑住画面；不画线条、色块、网格、刻度）。\n\n## 硬边界：只用能力卡编号\n\n- 具象视觉来自图像计划的照片，用 `<img src=\"{{IMG:图片id}}\">`。\n- 界面组件只能用 **U01–U10**（`components.css`）；背景只能用 **B01–B21**（`backgrounds.css` / bg-kit）；动效只能用 **T/X/P/W** 编号。\n- 编号之外**不许自己画**：图标、插画、示意图、数据图表、线条、分隔线、网格、刻度、进度条、色块、圆点、卡片、标签框、SVG、canvas、emoji 当图形。\n- 你的组件语法只写**文字块**，以及\"这一屏用哪个 U 编号、组件里填什么内容\"；不要写组件样式，也不要设计编号外的图形。\n\n## 输出（硬性）\n\n只输出 JSON 对象，第一个字符 `{`，最后一个 `}`，不要代码围栏：\n\n```json\n{\n  \"text_language_version\": \"1.0\",\n  \"type_language\": {\n    \"from_metaphor\": \"字的排法从隐喻的哪一部分来（例：碑刻的竖排、告示的大字压边）\",\n    \"allowed\": [\"允许的字级/字重/对齐/断行做法\"],\n    \"forbidden\": [\"禁止自己画编号外的图形（线、色块、卡片、图表、SVG）\"],\n    \"level_ratio\": \"主标题/次标题/正文的字号倍率，例如 3.4 / 1.8 / 1\",\n    \"weight_logic\": \"字重怎么用：哪一级用 700，哪一级用 400\"\n  },\n  \"text_blocks\": [\n    {\n      \"name\": \"文字块名（例：压边主张、竖排引句、编号清单）\",\n      \"role\": \"主角|证据|注脚\",\n      \"structure\": [\"这一块由哪几行字组成，从上到下\"],\n      \"variables\": [\"可变参数：字数、字号档、对齐\"],\n      \"state_expression\": [\"这块字怎么表达变化：换行、字号跳变、行距展开、整块位移\"],\n      \"avoid_when\": \"什么时候不该用它\",\n      \"html_hint\": \"文字排法建议，一两句，不写完整代码\"\n    }\n  ],\n  \"visual_containers\": {\n    \"photo\": {\n      \"full\": \"满屏照片：文字压哪一侧、遮罩怎么给可读性\",\n      \"inset\": \"照片内容块：占多大、怎么留边、和文字的距离\",\n      \"portrait\": \"视觉锚：怎么裁切、怎么和文字绕排\",\n      \"texture\": \"底纹：降到什么程度、什么时候用\"\n    },\n    \"text_screen\": {\n      \"how\": \"无图屏怎么只靠字撑住：主标题多大、断在哪、留白留多少\",\n      \"forbidden\": [\"无图屏不能出现的东西：线、色块、网格、卡片、图标、图表\"]\n    }\n  },\n  \"hierarchy\": {\n    \"per_scene_slots\": [\"一屏里的槽位：主张、证据、注脚\"],\n    \"size_relation\": \"字块之间的大小关系\",\n    \"spacing_rhythm\": \"间距节奏怎么来（只靠留白，不靠分割线）\"\n  },\n  \"state_language\": {\n    \"primary\": \"主要状态表达手段（换行/字号/行距/整块位移/遮罩揭示）\",\n    \"support\": [\"辅助手段\"],\n    \"must_be_visible\": \"观众必须一眼看出 A 变成 B 的下限\",\n    \"forbidden\": [\"看不见的变化：只换颜色、只把透明度从 0.35 调到 1\"]\n  },\n  \"anim_naming\": {\n    \"pattern\": \"data-anim 命名模式\",\n    \"examples\": [\"三个符合规则的例子\"],\n    \"rules\": [\"同屏唯一、语义可读、不跨屏复用同名\"]\n  }\n}\n```\n\n## 纪律\n\n- 不提供通用组件目录（不要默认\"卡片/按钮/标签/进度条\"四件套）；这里根本没有组件，只有字的排法。\n- 组件语法必须全片统一：圆角、描边、标签形态、材质一套到底，允许的变体要写明。\n- **构图不归你**：每屏文字压在哪、怎么对齐、主标题用什么力度，由分镜的 `composition` 决定；组件语法只管\"形、层级、状态\"，不要写\"标题一律在左上、正文一律在下\"这类版式规矩，那会把每屏钉成同一个样。\n- 不写完整 HTML、不写 GSAP。给结构和命名，写法交给场景组，动作交给动效节点。\n- 状态变化必须落在能被看见的东西上。\n- 不设计靠 CSS/SVG 绘制具象图形的组件（插画、图标、场景示意、数据图）：具象视觉由照片承担。\n- 视觉承担者容器是组件族里的一等公民：照片容器（满屏、内容块、视觉锚、底纹）和无图屏背景容器都要写清参数；无图屏背景至少两层，遮住文字后仍要能表达这一屏。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 8405
        y: 424
      positionAbsolute:
        x: 8405
        y: 424
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 168
