    - id: h02sx
      parentId: h02i
      type: custom
      data:
        type: code
        title: H02SX_按编号展开动效
        code_language: python3
        code: "def main(motion_json: str, scene_json: str = \"\") -> dict:\n    \"\"\"把动效判断（JSON）展开成本屏的 <script>；编号由 H00 统一分配，模型只选目标与时机。\"\"\"\n    import json\n    import re\n\n    raw = str(motion_json or \"\").strip()\n    data = {}\n    if raw:\n        try:\n            data = json.loads(raw)\n        except Exception:\n            start, end = raw.find(\"{\"), raw.rfind(\"}\")\n            if 0 <= start < end:\n                try:\n                    data = json.loads(raw[start:end + 1])\n                except Exception:\n                    data = {}\n\n    motions = data.get(\"motions\") if isinstance(data, dict) else None\n    if not isinstance(motions, list):\n        motions = []\n    scene_data = {}\n    try:\n        scene_data = json.loads(str(scene_json or \"{}\"))\n    except Exception:\n        scene_data = {}\n    if not isinstance(scene_data, dict):\n        scene_data = {}\n    sid = str(data.get(\"scene_id\") or scene_data.get(\"scene_id\") or \"\").strip()\n\n    # 全片编号由 H00 统一分配：这里只把编号套到模型选的目标/时机上。\n    budget = scene_data.get(\"motion_budget\") if isinstance(scene_data.get(\"motion_budget\"), dict) else {}\n    if isinstance(motions, list):\n        motions = [item for item in motions if isinstance(item, dict)]\n    # 每屏条数不设上限：模型选多少展开多少。预算只在模型一条都没选时兜底。\n    if budget and isinstance(motions, list) and not motions:\n        entrance = str(budget.get(\"entrance\") or \"\").strip().upper()\n        state = str(budget.get(\"state\") or \"\").strip().upper()\n        if entrance:\n            motions.append({\"preset\": entrance, \"target\": \"title\", \"trigger\": \"sentence_start\",\n                            \"fallback\": 0.2, \"reason\": \"预算兜底：入场\"})\n        if state:\n            motions.append({\"preset\": state, \"target\": \"stat\", \"trigger\": \"sentence_start\",\n                            \"fallback\": 0.9, \"reason\": \"预算兜底：状态变化\"})\n\n    # 每个编号 = 一段可复制的代码模板；%(x)s 由这里填。\n    TPL = {\n        \"T01\": \"\"\"var _c = kit.split('%(sel)s', 'chars');\ntimeline.fromTo(_c, {opacity:0, y:'0.5em'},\n  {opacity:1, y:0, duration:%(dur)s, ease:'power3.out', stagger:%(stagger)s}, %(at)s);\"\"\",\n        \"T02\": \"\"\"var _w = kit.split('%(sel)s', 'words');\ntimeline.fromTo(_w, {opacity:0, filter:'blur(10px)', y:50},\n  {opacity:1, filter:'blur(0px)', y:0, duration:%(dur)s, ease:'power2.out', stagger:%(stagger)s}, %(at)s);\"\"\",\n        \"T03\": \"\"\"var _c = kit.split('%(sel)s', 'chars');\ntimeline.fromTo(_c, {opacity:0, rotationX:92, transformOrigin:'50%% 0%%', transformPerspective:700},\n  {opacity:1, rotationX:0, duration:%(dur)s, ease:'power3.out', stagger:%(stagger)s}, %(at)s);\"\"\",\n        \"T04\": \"\"\"var _t = document.querySelector('%(sel)s');\n_t.style.webkitTextStroke = '1.4px currentColor';\n_t.style.color = 'transparent';\ntimeline.to(_t, {color:'%(color)s', duration:0.4, ease:'power1.out'}, %(at)s+%(dur)s);\"\"\",\n        \"T05\": \"\"\"var _t = document.querySelector('%(sel)s');\nvar _txt = _t.textContent; _t.textContent = '';\nfor (var i = 1; i <= _txt.length; i++) {\n  timeline.set(_t, {textContent: _txt.slice(0, i)}, %(at)s + i*0.05);\n}\"\"\",\n        \"T06\": \"\"\"var _n = document.querySelector('%(sel)s');\nvar _o = {'v':%(from)s};\ntimeline.to(_o, {'v':%(to)s, 'duration':%(dur)s, 'ease':'power2.out',\n  'onUpdate':function(){ _n.textContent = Math.round(_o.v); }}, %(at)s);\"\"\",\n        \"T07\": \"\"\"/* 固定种子，渲染可复现 */\nvar _r = kit.seeded(7), _t = document.querySelector('%(sel)s');\nvar _final = _t.textContent, _sp = ':.'; _t.textContent = '';\nfor (var i = 0; i < _final.length; i++) {\n  (function (idx) {\n    timeline.set(_t, {textContent: _final.slice(0, idx) + _sp[(idx + 1) %% _sp.length]}, %(at)s + idx * 0.03);\n    timeline.set(_t, {textContent: _final.slice(0, idx + 1)}, %(at)s + idx * 0.03 + 0.09);\n  })(i);\n}\ntimeline.set(_t, {textContent: _final}, %(at)s + _final.length * 0.03);\"\"\",\n        \"T08\": \"\"\"var _r = kit.seeded(11), _t = document.querySelector('%(sel)s');\nvar _final = _t.textContent, _c = 'ABCDEF0123';\nfor (var i = 0; i < _final.length; i++) {\n  (function (idx) {\n    timeline.set(_t, {textContent: _final.slice(0, idx) + _c[Math.floor(_r() * _c.length)]}, %(at)s + idx * 0.04);\n    timeline.set(_t, {textContent: _final.slice(0, idx + 1)}, %(at)s + idx * 0.04 + 0.08);\n  })(i);\n}\"\"\",\n        \"T09\": \"\"\"/* 每字上下两片，rotationX 由 -90 收敛到 0，翻 3 次落定 */\nvar _c = kit.split('%(sel)s', 'chars');\n_c.forEach(function (el, i) {\n  el.style.transformStyle = 'preserve-3d';\n  timeline.fromTo(el, {rotationX: -90, opacity: 0},\n    {rotationX: 0, opacity: 1, duration: %(dur)s, ease: 'back.out(1.4)'}, %(at)s + i * 0.06);\n});\"\"\",\n        \"T10\": \"\"\"/* 单次沿弧线摆位，不循环 */\nvar _c = kit.split('%(sel)s', 'chars');\nvar _n = _c.length;\n_c.forEach(function (el, i) {\n  var a = (-60 + (120 / Math.max(1, _n - 1)) * i) * Math.PI / 180;\n  timeline.fromTo(el,\n    {x: 0, y: 0, rotation: a * 57.3, opacity: 0},\n    {x: Math.sin(a) * 420, y: (1 - Math.cos(a)) * 420, opacity: 1,\n     duration: %(dur)s, ease: 'power2.out'}, %(at)s + i * 0.05);\n});\"\"\",\n        \"T11\": \"\"\"var _c = kit.split('%(sel)s', 'chars');\nfor (var i = 0; i < 8; i++) {\n  timeline.fromTo(_c, {opacity:0, x:i*36, filter:'blur(3px)'},\n    {opacity:0.35*(1-i/8), x:0, filter:'blur(0px)', duration:0.5, ease:'power2.out', stagger:0.03},\n    %(at)s + i*0.04);\n}\"\"\",\n        \"P01\": \"\"\"(function () {\n  var _b = document.querySelector('%(sel)s');\n  if (!_b) return;\n  _b.style.position = _b.style.position || 'relative';\n  var _s = document.createElement('i');\n  _s.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:26;';\n  _b.appendChild(_s);\n  var _o = {'x': 22, 'y': 78};\n  function _paint() {\n    _s.style.background = 'radial-gradient(%(size)s %(size)s at ' + _o.x + '%% ' + _o.y + '%%, rgba(255,240,210,%(alpha)s), transparent 70%%)';\n  }\n  _paint();\n  timeline.fromTo(_o, {'x': 22, 'y': 78}, {'x': 64, 'y': 34, 'duration':%(dur)s, 'ease':'power2.inOut', 'onUpdate':_paint}, %(at)s);\n})();\"\"\",\n        \"P02\": \"\"\"(function () {\n  var _b = document.querySelector('%(sel)s');\n  if (!_b) return;\n  _b.style.position = _b.style.position || 'relative';\n  var _e = document.createElement('i');\n  _e.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:25;opacity:0;background:radial-gradient(%(radius)spx %(radius)spx at 78%% 28%%, rgba(255,240,210,.55), transparent 64%%)';\n  _b.appendChild(_e);\n  timeline.to(_e, {'opacity':%(alpha)s, 'duration':%(dur)s, 'ease':'power2.inOut'}, %(at)s);\n})();\"\"\",\n        \"P03\": \"\"\"timeline.fromTo('%(sel)s', {'rotationX': -%(rx)s, 'rotationY': -%(ry)s, 'transformPerspective': %(perspective)s},\n  {'rotationX':0, 'rotationY':0, 'duration':%(dur)s, 'ease':'power2.out'}, %(at)s);\"\"\",\n        \"W01\": \"\"\"timeline.fromTo('%(sel)s', {'borderRadius':'0px', 'scale':1.03, 'overflow':'hidden'},\n  {'borderRadius':'%(r)spx', 'scale':1, 'duration':%(dur)s, 'ease':'power2.out'}, %(at)s);\"\"\",\n        \"X01\": \"\"\"timeline.fromTo('%(sel)s', {clipPath:'inset(100%% 0%% 0%% 0%%)'},\n  {clipPath:'inset(0%% 0%% 0%% 0%%)', duration:%(dur)s, ease:'power3.inOut'}, %(at)s);\"\"\",\n        \"C01\": \"\"\"timeline.fromTo('%(sel)s', {'scale':1}, {'scale':%(to)s, 'duration':%(dur)s, 'ease':'none'}, %(at)s);\"\"\",\n        \"C02\": \"\"\"timeline.fromTo('%(sel)s', {'scale':%(from)s}, {'scale':1, 'duration':%(dur)s, 'ease':'none'}, %(at)s);\"\"\",\n        \"C03\": \"\"\"timeline.fromTo('%(sel)s', {'xPercent':%(from)s}, {'xPercent':%(to)s, 'duration':%(dur)s, 'ease':'sine.inOut'}, %(at)s);\"\"\",\n        \"L01\": \"\"\"timeline.fromTo('%(sel)s', {'xPercent':%(a)s}, {'xPercent':%(b)s, 'duration':%(dur)s, 'ease':'none'}, %(at)s);\ntimeline.fromTo('%(sel2)s', {'xPercent':%(a2)s}, {'xPercent':%(b2)s, 'duration':%(dur)s, 'ease':'none'}, %(at)s);\"\"\",\n        \"D01\": \"\"\"timeline.fromTo('%(sel)s', {'scale':1}, {'sc