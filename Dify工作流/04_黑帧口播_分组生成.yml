    - id: h00
      type: custom
      data:
        type: code
        title: H00_选择层
        code_language: python3
        code: "def main() -> dict:\n    \"\"\"选择层：目录（含槽位元数据）与组件模板。由 gen_catalog.py 生成，不要手改。\"\"\"\n    import json\n    CATALOG = json.loads(r\"\"\"{\"background\": {\"B23\": {\"name\": \"半调网点\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"这一屏在讲社会评价、舆论、被审视时选它；网点自带「被印刷、被记录」的味道\", \"avoid\": \"满屏照片（会和照片抢）；标题压在网纹最密处会糊，字区先垫柔光\", \"note\": \"报纸印刷式网点，密度随位置变化；偏社会、舆论、被评价\"}, \"B24\": {\"name\": \"扫描线\", \"family\": \"line\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"讲检测、审核、一条条过目、读数据时选它；扫描带就是「正在读」\", \"avoid\": \"满屏照片；横线正好穿过正文行距会把字切碎，让文字带避开扫描线\", \"note\": \"细横线加一条扫描带，像仪表在读数据；偏检测、审核\"}, \"B25\": {\"name\": \"点阵辉光\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"这一屏有数字指标、成绩、金额，需要「仪表感」时选它\", \"avoid\": \"满屏照片；最亮的中心别落标题（抢焦点）\", \"note\": \"密集亮点向中心聚，有指标感；偏数字、成绩、金额\"}, \"B26\": {\"name\": \"同心环\", \"family\": \"ring\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"要把注意力收回一个点、讲聚焦、回到自身时选它\", \"avoid\": \"满屏照片；一屏只留一个视觉中心，别再叠第二个放射图形\", \"note\": \"一圈一圈扩散，把注意力收到一个点；偏聚焦、回到自身\"}, \"B27\": {\"name\": \"等高线\", \"family\": \"line\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"讲门槛、尺度、被衡量、一层层往下压时选它\", \"avoid\": \"满屏照片；波纹和小字正文会互相干扰，正文区留干净\", \"note\": \"一层层波动的线场，像把标准画成地形；偏尺度、门槛、审判\"}, \"B28\": {\"name\": \"横向拉丝\", \"family\": \"line\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"讲迭代、速度、赶、一批批往前推时选它\", \"avoid\": \"满屏照片；一屏别同时用两种「横向流动」的东西（会显得乱）\", \"note\": \"细横线快速掠过，有速度和迭代感\"}, \"B29\": {\"name\": \"雪点\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"讲时间、回忆、等待这种慢下来的段落时选它\", \"avoid\": \"满屏照片；和 B51 流星同屏（都是粒子，看不出谁在动）\", \"note\": \"小点慢慢飘，安静；偏时间、回忆、等待\"}, \"B30\": {\"name\": \"雨丝\", \"family\": \"line\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"情绪往下压、讲压力、怕、低落时选它\", \"avoid\": \"满屏照片；同一片别连用三屏以上（情绪会一直沉下去）\", \"note\": \"斜斜的细线，压着情绪；偏低落、压力、怕\"}, \"B31\": {\"name\": \"像素溶解\", \"family\": \"block\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"讲推翻、重塑、换掉旧东西、转折时选它\", \"avoid\": \"满屏照片；和 B32 棋盘相邻两屏（都是大块面，观感重）\", \"note\": \"块状像素聚散，东西在重组；偏推翻、重塑、转折\"}, \"B32\": {\"name\": \"棋盘\", \"family\": \"block\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"这一屏是两种选择、取舍、规则对照时选它\", \"avoid\": \"满屏照片；和 B31 像素溶解相邻（同族大块面）\", \"note\": \"明暗方格，天生的对照与秩序；偏两种选择、取舍、规则\"}, \"B34\": {\"name\": \"光束\", \"family\": \"light\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"讲出路、方向、被照亮、找到答案时选它\", \"avoid\": \"满屏照片；亮部别落在标题上（吃掉文字对比）\", \"note\": \"一束锥形光打下来，给出路和方向\"}, \"B35\": {\"name\": \"浮尘\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"讲日常、痕迹、资料感、安静的记录时选它\", \"avoid\": \"满屏照片；和 B54 纵深粒子同屏（都是点，看不出谁在动）\", \"note\": \"细颗粒浮在光里，安静的资料感；偏日常、痕迹\"}, \"B36\": {\"name\": \"渐变网格\", \"family\": \"light\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"语气温和、讲包容、自由、不需要强图形时选它；最安全的一张\", \"avoid\": \"满屏照片；这一屏需要一个明确的结构感时别用（太柔）\", \"note\": \"四团色光慢慢游，柔和有空气；偏温和、包容、自由\"}, \"B37\": {\"name\": \"云纹噪声\", \"family\": \"noise\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"科技底、烟雾、肌理；整屏氛围\", \"avoid\": \"正文字号小于 40px 的屏（对比不够）\", \"note\": \"雾一样的云纹，适合抽象概念\"}, \"B38\": {\"name\": \"扰动噪声\", \"family\": \"noise\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"流体、烟雾、能量场\", \"avoid\": \"和 B37 相邻两屏（同族观感）\", \"note\": \"两层噪声互相扭曲，流体感强；偏混乱、纠缠、复杂\"}, \"B39\": {\"name\": \"有机漂移\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\", \"use\": \"片头片尾、暗场氛围、星空感\", \"avoid\": \"需要高对比正文字的屏\", \"note\": \"点群随噪声场起伏，像星空也像人群\"}, \"B49\": {\"name\": \"抖动网点\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf7f1\", \"use\": \"低日加雾带，按 8×8 Bayer 阈值排成一格格方块点；复古印刷、监控回放、终端、旧档案\", \"avoid\": \"和照片满屏同屏；标题正落在点最密处会糊，先垫柔光或把 lv 调低\", \"note\": \"方点按明度疏密排开，暗处留黑；像老印刷或监控回放\"}, \"B50\": {\"name\": \"透视网格\", \"family\": \"line\", \"base\": \"#0a0710\", \"ink_primary\": \"#eaf7f1\", \"use\": \"地平线在画面下方，网格一格格往你脚下推；赛博、复古未来、加速、往前走\", \"avoid\": \"字别压在地平线附近（那一带最亮）；和 M30 扫描线同屏会花\", \"note\": \"带透视的网格从地平线往画面外推，中间一条暖光\"}, \"B51\": {\"name\": \"流星\", \"family\": \"line\", \"base\": \"#05070c\", \"ink_primary\": \"#eef6ff\", \"use\": \"斜下划过的短光，带渐隐尾巴；运气、一瞬间、机会、夜里的决定\", \"avoid\": \"和 B29 雪点 / B35 浮尘同屏（都是粒子，会打架）；一屏别超过 30 秒的连续使用\", \"note\": \"十几颗流星错峰斜下，配一层会呼吸的星点；暗底最适合压亮字\"}, \"B53\": {\"name\": \"蜂巢网格\", \"family\": \"line\", \"base\": \"#070a0a\", \"ink_primary\": \"#eaf7f1\", \"use\": \"六边形蜂巢按距离中心远近一波波亮起；结构、组织、材料、细胞、底层架构\", \"avoid\": \"和 B32 棋盘同屏；字落在蜂窝最亮那圈会花，把 r 调大让它变疏\", \"note\": \"六边形网格从中心向外一波波亮起，冷青线；科技、结构类话题\"}, \"B54\": {\"name\": \"纵深粒子\", \"family\": \"dot\", \"base\": \"#05070a\", \"ink_primary\": \"#eef6ff\", \"use\": \"点云向镜头漂过来、近大远小；进入、深入、星空、数据纵深\", \"avoid\": \"和 B35 浮尘同屏（都是点，看不出谁在动）；别配高密度文案\", \"note\": \"伪 3D 点云往镜头漂，近的点更大更亮；适合讲纵深与进入\"}}, \"component\": {\"U01\": {\"id\": \"U01\", \"name\": \"信息卡片\", \"note\": \"标题 + 2–3 行正文；一屏一个主张，最通用\", \"repeat\": false, \"before\": 2, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"一屏一个主张、要「标题 + 2–3 行说明」时选它；没有更贴的结构就它\", \"avoid\": \"同屏再放第二块同级内容（一屏一块）；只有数字没有说明时换 U05 / U54\"}, \"U02\": {\"id\": \"U02\", \"name\": \"步骤条\", \"note\": \"横向 3–4 步带完成态；讲流程、先后\", \"repeat\": false, \"before\": 6, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"讲流程、先后，屏上有 3–4 个阶段时选它\", \"avoid\": \"超过 4 段；阶段之间没有先后关系时别用（那是 U03）\"}, \"U03\": {\"id\": \"U03\", \"name\": \"网格面板\", \"note\": \"2×2 / 3×2 标签格；并列概念、清单\", \"repeat\": true, \"before\": 0, \"row\": 1, \"after\": 0, \"rows_default\": 2, \"use\": \"并列的概念、清单、要点，2×2 或 3×2 排得下时选它\", \"avoid\": \"超过 6 格；每格超过 8 个字（会挤成一团）\"}, \"U04\": {\"id\": \"U04\", \"name\": \"状态标签\", \"note\": \"一排 pill 标签；状态、等级、分类\", \"repeat\": false, \"before\": 2, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"状态、等级、分类这种「一排短标签」时选它\", \"avoid\": \"同屏超过 8 个标签；标签本身是整句时换 U53 或 U03\"}, \"U05\": {\"id\": \"U05\", \"name\": \"数据行\", \"note\": \"标签与数值对齐成行；有数字指标\", \"repeat\": true, \"before\": 0, \"row\": 2, \"after\": 0, \"rows_default\": 1, \"use\": \"有数字指标、要「标签 + 数值」对齐时选它；两三条最稳\", \"avoid\": \"超过 6 行（会拖）；只有描述没有数值时换 U03\"}, \"U06\": {\"id\": \"U06\", \"name\": \"便当网格\", \"note\": \"大小格混排；一件事 + 三个证据\", \"repeat\": false, \"before\": 6, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"一件事 + 几个证据，主次分明时选它（大格放主张，小格放证据）\", \"avoid\": \"四块一样重（那就不是便当，用 U03）；每格文字超过 10 字\"}, \"U07\": {\"id\": \"U07\", \"name\": \"瀑布流\", \"note\": \"两列不等高卡片；多条同质信息\", \"repeat\": true, \"before\": 0, \"row\": 1, \"after\": 0, \"rows_default\": 3, \"use\": \"多条同质信息、两列不等高时选它\", \"avoid\": \"少于 4 条（撑不住两列）；需要严格对齐时换 U03\"}, \"U08\": {\"id\": \"U08\", \"name\": \"名片\", \"note\": \"标识 + 两行身份；讲人、讲机构\", \"repeat\": false, \"before\": 2, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"讲一个人或一个机构、要「标识 + 两行身份」时选它\", \"avoid\": \"同屏放两张（分不清主次）；不是真实人物或机构时文案里标「场景演示」\"}, \"U09\": {\"id\": \"U09\", \"name\": \"滑动行\", \"note\": \"横向一排卡片；时间线、阶段\", \"repeat\": false, \"before\": 1, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"横向一排、把时间线或阶段切成几张卡时选它\", \"avoid\": \"超过 5 张（溢出）；内容有强先后时换 U02 / U20\"}, \"U10\": {\"id\": \"U10\", \"name\": \"色格阵\", \"note\": \"纯色块矩阵；分类、覆盖、密度\", \"repeat\": false, \"before\": 0, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"分类、覆盖、密度这种「不用读字」的矩阵时选它\", \"avoid\": \"每格都要写字（换 U03）；同屏再放一张图表（两种图形会打架）\"}, \"U11\": {\"id\": \"U11\", \"name\": \"聊天气泡\", \"note\": \"一来一回两条消息；讲对话、客户回复。整幅通栏：一条贴左、一条贴右\", \"repeat\": false, \"before\": 2, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"一来一回、讲对话或客户回复时选它；整幅通栏，一条贴左一条贴右\", \"avoid\": \"同屏再放第二条正文（气泡本身就是文案）；超过三轮对话\"}, \"U12\": {\"id\": \"U12\", \"name\": \"表格\", \"note\": \"多行多列对照；横向比参数、核清单\", \"repeat\": true, \"before\": 2, \"row\": 2, \"after\": 0, \"rows_default\": 1, \"use\": \"多行多列对照、横向比参数、核清单时选它\", \"avoid\": \"列数超过 3；同屏再放第二个表格\"}, \"U13\": {\"id\": \"U13\", \"name\": \"柱状图\", \"note\": \"一组柱子比高低；有量级对比\", \"repeat\": false, \"before\": 0, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"一组柱子比高低、有量级对比时选它\", \"avoid\": \"只有 2 根柱子（看不出对比）；没有真实数字时别用，必须标「场景演示」\"}, \"U14\": {\"id\": \"U14\", \"name\": \"折线\", \"note\": \"一条走势线；讲趋势、增长、波动\", \"repeat\": false, \"before\": 0, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"讲走势、增长、波动这种「一条线」时选它\", \"avoid\": \"只有两个点（那是 U05）；没有真实数据时标「场景演示」\"}, \"U15\": {\"id\": \"U15\", \"name\": \"价格表\", \"note\": \"两档并列、突出其中一档；讲方案与定价\", \"repeat\": false, \"before\": 6, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"两档并列、要突出其中一档、讲方案与定价时选它\", \"avoid\": \"超过两档（挤）；每档说明超过 2 行\"}, \"U16\": {\"id\": \"U16\", \"name\": \"通知条\", \"note\": \"单条即时提示；讲新消息、提醒、告警\", \"repeat\": false, \"before\": 1, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"单条即时提示、讲新消息、提醒、告警时选它\", \"avoid\": \"一屏放两条（那是列表，换 U05）\"}, \"U17\": {\"id\": \"U17\", \"name\": \"头像组\", \"note\": \"一排头像；讲团队、用户规模\", \"repeat\": false, \"before\": 0, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"讲团队、用户规模、一群人时选它\", \"avoid\": \"同屏再放第二个头像组；头像数超过 6\"}, \"U20\": {\"id\": \"U20\", \"name\": \"时间轴\", \"note\": \"几个节点串成一条线；讲阶段、里程碑\", \"repeat\": false, \"before\": 2, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"几个节点串成一条线、讲阶段或里程碑时选它\", \"avoid\": \"节点超过 5 个；节点之间有分支时换 U02\"}, \"U48\": {\"id\": \"U48\", \"name\": \"播放器\", \"note\": \"视频封面 + 播放态；讲演示、课程、录屏\", \"repeat\": false, \"before\": 1, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"讲演示、课程、录屏、视频内容时选它\", \"avoid\": \"同屏再放第二个播放器；没有视频内容时别用（成了假播放器）\"}, \"U49\": {\"id\": \"U49\", \"name\": \"文件卡\", \"note\": \"文件名 + 体积/状态；讲交付物、合同、报告\", \"repeat\": false, \"before\": 2, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"讲交付物、合同、报告、附件时选它\", \"avoid\": \"一屏超过两张（会退化成列表）；文件名超过 12 字\"}, \"U50\": {\"id\": \"U50\", \"name\": \"地图卡\", \"note\": \"坐标点 + 区域说明；讲覆盖、门店、客户分布\", \"repeat\": false, \"before\": 1, \"row\": 0, \"after\": 0, \"rows_default\": 1, \"use\": \"讲覆盖、门店、客户分布这种「有位置」的内容时选它\", \"avoid\": \"不是真地理关系时别用（会误导）；同屏再放第二张地图\"}, \"U