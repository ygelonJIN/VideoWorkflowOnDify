  name: 通用｜02_黑帧口播无数字人视频
  description: 无数字人、无头像窗口、无黑帧占位的口播视频；生成 HTML 和已批准口播，由 MiMo TTS 生成语音，并以真实口播时钟同步场景、字幕和元素动效。
  icon: 📝
  icon_type: emoji
  icon_background: '#E4FBCC'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/opencode_go:0.5.2@31f6a79969e7c240fb2fa8c9331d89079ccb048283aeba032634c5f0b831658e
    version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: a00
      type: custom
      data:
        type: start
        title: A00_输入活动需求
        variables:
        - label: 主题、原始文本或随口一句话
          variable: campaign_brief
          type: paragraph
          required: true
          max_length: 30000
        - label: 可选创作偏好
