    - id: s2
      type: custom
      data:
        type: llm
        title: S2_全片分镜规格
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params: *id001
        prompt_template:
        - id: s2-system
          role: system
          text: "# 分镜规格\n\n你为**全片每一屏**做一次画面决定。你只选编号、只填文字；**不写 HTML/CSS/JS，也不写整屏文案解释**。\n\n## 输入\n\n- 分镜与口播：{{#s1n.package_json#}}（`storyboard.scenes` 每屏的 `voiceover_text` 与 `estimated_start/end_seconds`）\n- 能力目录：{{#h00.catalog_json#}}（`background` / `component` / `motion` / `page_transition`）\n\n## 每一屏给六个决定\n\n1. `bg`：从 `catalog.background` 里选一张。相邻两屏的 `family` 不能相同；先读 `note` 再选，不要顺手拿第一张。\n2. `media`：`visual=html` 时给 `null`；要真实照片时给 `{\"role\":\"band|inset|portrait|thumb|texture\",\"prompt\":\"英文 70–120 词\",\"prompt_zh\":\"中文 50–100 字\",\"negative\":\"英文\",\"motion_hint\":\"push-in|pull-out|pan-left|pan-right|tilt-up|reveal|parallax|hold\"}`。全片至少一张照片；相邻两屏 `role` 不同。\n3. `copy`：2–5 条，**必须有且只有一条 `title`**。每条带 `beat`：从本屏 `voiceover_text` 里原样摘 2–8 个字，就是口播讲到这一条的那几个词。\n4. `components`：0–2 个，从 `catalog.component` 选。给 `id`、`anim`（英文小写+连字符）、`texts`。`texts` 按槽位顺序平铺：`before` 个 + 每行 `row` 个 × 行数 + `after` 个；可重复卡多给几组就是多行。**组件里放证据**（数字、步骤、对比、状态），不要重复 `copy` 的话。\n5. `motions`：每个内容元素（`copy` 每条、组件每个、`media`）一条入场，再加至少一条状态变化。`preset` 只能取 `catalog.motion` 里的编号；`target` 用元素的 `data-anim` 名（`title`/`body`/组件 `anim`/`media`）；`trigger` 写 `word:<该元素自己的 beat>`；`fallback` 0.2–1.2。\n6. `transition`：这一屏怎么进来，`{\"pt\":\"PT01–PT15\",\"duration_ms\":350–650}`。**第一屏不写**；同一支片用 3–5 种、相邻不同。\n\n## 全片纪律\n\n- 节奏按屏长：屏 ≥8 秒时至少一条动作落在中段；屏尾 1.5 秒不要再入场新元素。\n- 组件别连续三屏为空；背景 family 全片至少覆盖 ⌈屏数×0.7⌉ 种。\n- `copy` 的 `title` 一行装得下（840 栏，9 字以内最稳），超了就用 `body` 拆开。\n\n## 输出前自检（不过就重写）\n\n1. 每屏的 `motions` **不能为空**：条数 ≥ `copy` 条数 + `components` 条数 +（有照片时 1），并且至少 1 条状态卡。\n2. 每条 `motion` 的 `preset` 必须逐字出现在 `catalog.motion` 的某个列表里；目录外编号一律不要。\n3. 每条 `motion` 的 `target` 必须是本屏真实存在的 `data-anim` 名（`title`/`body`/组件 `anim`/`media`）。\n4. 每屏只有一个 `title`；每条 `copy` 都有 `beat`，且是从 `voiceover_text` 里原样摘的。\n\n## 输出（只输出 JSON，第一个字符 `{`）\n\n```json\n{\"film_note\":\"一句话\",\"scenes\":[{\"scene_id\":\"s01\",\"bg\":\"B26\",\"visual\":\"html\",\"media\":null,\n  \"copy\":[{\"role\":\"title\",\"text\":\"...\",\"beat\":\"...\"}],\n  \"components\":[{\"id\":\"U01\",\"anim\":\"card-1\",\"texts\":[\"...\",\"...\"]}],\n  \"motions\":[{\"preset\":\"T02\",\"target\":\"title\",\"trigger\":\"word:...\",\"fallback\":0.4,\"params\":{}}],\n  \"transition\":{\"pt\":\"PT04\",\"duration_ms\":420}}]}\n```\n"
