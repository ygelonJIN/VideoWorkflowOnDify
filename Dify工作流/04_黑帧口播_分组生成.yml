    - id: s2
      type: custom
      data:
        type: llm
        title: S2_全片分镜规格
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params: *id001
        prompt_template:
        - id: s2-system
          role: system
          text: "# 分镜规格\n\n你为**全片每一屏**做一次画面决定。只选编号、只填文字；**不写 HTML/CSS/JS**。\n\n## 输入\n\n- 分镜与口播：{{#s1n.package_json#}}（`storyboard.scenes` 每屏的 `voiceover_text` 与 `estimated_start/end_seconds`）\n- 能力目录：{{#h00.catalog_json#}}（`background` / `component` / `motion` / `motion_cards` / `page_transition` / `state_meta` / `card_needs` / `recent_usage`）\n- 每张可选卡都带描述，**选卡前必须读**：动效卡查 `catalog.motion_cards[编号]`（`name`/`use`/`avoid`）；背景/组件/转场查各自条目里的 `note`（这张卡是什么、适合什么）和 `use`/`avoid`。`avoid` 里写到的限制一律不许踩；目录里不存在\"只有编号、没有描述\"的卡，别对着编号猜。\n\n## 每一屏\n\n1. `bg`：从 `catalog.background` 选一张，相邻两屏 `family` 不能相同。\n2. `media`：无图屏写 `null`；要真实照片写 `{\"role\":\"band|inset|portrait|thumb|texture\",\"prompt\":\"英文 70–120 词\",\"prompt_zh\":\"中文 50–100 字\",\"negative\":\"英文\",\"motion_hint\":\"push-in|pull-out|pan-left|pan-right|tilt-up|reveal|parallax|hold\",\"motion\":{\"preset\":\"入场编号\"}}`。全片至少一张照片，相邻两屏 `role` 不同。\n3. `copy`：2–5 条，**有且只有一条 `title`**。每条写成 `{\"role\":\"title\",\"text\":\"...\",\"beat\":\"原文 2–8 字\",\"motion\":{\"preset\":\"入场编号\"}}`。\n4. `components`：0–2 个，从 `catalog.component` 选，写成 `{\"id\":\"U05\",\"anim\":\"rows\",\"texts\":[\"...\",\"...\"],\"motion\":{\"preset\":\"组件动效编号\"}}`。`texts` 按槽位平铺：`before` 个 + 每行 `row` 个 × 行数 + `after` 个。**组数由你给的数据决定**：给几组就是几个格子/几张卡；没填满的组会整组丢掉，不会补空卡。做一张卡就给两段（如 U55 每卡 `h3` + `p`），做双卡就给四段；只想要一张卡就换单卡组件 `U01`。组件里放证据，不要重复 `copy`。**`motion.preset` 只能从 `catalog.motion_by_component[<组件id>]` 里选；列表为空就不写 `motion`。**\n5. `state`：本屏的一次状态变化，`{\"preset\":\"状态编号\",\"target\":\"本屏的 data-anim 名\",\"word\":\"该元素 beat 里的词\"}`。只写终态、不重置初始态；没有就不写。落点由 `catalog.state_meta[编号].requires` 定：\n   - `requires:\"text\"`（改写文字的那几张：数位滚动、文案替换、数字归零…）：**只能落在 `copy` 的文字上**，落在组件上会把组件拆掉，代码会丢弃。\n   - `requires:\"item\"`（S02/S04/S06/S11/S18/S36）：必须落在提供对应锚点的组件上（`catalog.card_needs` 要的锚点，在 `catalog.component_meta[<组件id>].provides` 里有），落在文字上会被丢弃。\n   - `catalog.state_meta[编号].requires_number:true`（`S02 进度填充`、`S18 数值映射条`）：本屏文字里**必须有真实数字/百分比/倍数**才允许用，否则那条进度条只是装饰。\n   - `catalog.state_meta[编号].trigger:true`（点击/勾选/拖动/切换/状态灯）：它只说\"发生了一件事\"，**同一屏必须再给一条 `then` 说结果**——`\"then\":{\"preset\":\"另一张状态编号\",\"target\":\"同一个元素或它的子元素\",\"word\":\"...\"}`，`then` 不许再用触发型卡。给不出结果就别用这张触发卡：孤零零一次点击不是动效，是错的。\n6. `deco`：**默认不写**。它是\"在一句话上做一个手绘标注\"，不是每屏配一件装饰。\n   格式 `{\"preset\":\"编号\",\"target\":\"本屏已有的 data-anim 名\"}`，从 `catalog.motion.decoration` 选，`needs` 里有 `text` 的只能落 `lead`/`body`/`note`。\n   **只在下面四种情况之一成立时才写**，而且必须能一句话说清\"它在标什么\"：\n   - 要**否掉**一个具体做法/旧说法 → 叉、划掉（`use` 里写着\"划掉/否定/错误做法\"的卡）。**描述一个现象、陈述一个事实都不算否定**，别在\"分肉\"\"有人不干活\"这种句子上打叉；\n   - 要给一句话**补一句旁注/归组** → 括号、框选（`use` 里写着\"旁注/归组/夹住\"的卡）。旁边没有那句旁注就别画括号；\n   - 要**强调一个关键词** → 圈、荧光笔、下划线（`use` 里写着\"关键词/重点\"的卡）。标的是词，不是整句；\n   - 要按口播**逐处依次标** → `use` 里明确写着\"三处/逐处/逐行\"的卡，且本屏确实有那么多处要标。\n   **不许落在 `title` 上**：标题已经是全屏最大字号，再压一道荧光笔/圈就是糊住它（代码会丢弃这样的 deco）。\n   全片 `deco` 最多 ⌈屏数÷3⌉ 条，相邻两屏不能都写；凑不满就空着，空着是对的。\n7. `out`：0–1 条，切点前收束，`{\"preset\":\"X03|X05\",\"target\":\"...\"}`，从 `catalog.motion.exit` 选。目标挑这一屏最不重要的那一层（组件或照片），**不要动标题**；代码会把它固定在切点前 0.5 秒。\n8. `transition`：这一屏怎么进来，`{\"pt\":\"PT01–PT15\",\"duration_ms\":350–650}`。**第一屏不写**。切点表是权威的：N 屏一定出 N-1 刀，你漏写的那一刀会被本片已选的转场族自动补上（那不是你想要的画面），所以每一刀都要给。同片 3–5 种、相邻不同。\n\n## 动效编号怎么选\n\n`motion` 是**元素自己的字段**，不是另开一张表——每个 `copy`、每个 `component`、每次 `media` 都要带，漏了这条元素就没有入场。\n\n**每个编号先去 `catalog.motion_cards` 查 `name` 和 `use`，确认它就是这一屏要的意思，再看 `avoid` 有没有被踩到。**编号本身不说明任何事：同样是 `K` 开头的标注卡，有的是\"划掉一个错误做法\"，有的是\"给一句话挂一句旁注\"，有的是\"折行后逐行划线\"——选错就是把叉打在没犯错的地方。\n\n- `copy` 的文字用 `catalog.motion.entrance_text`；成块的面板/组件根用 `entrance_block`；\n- `media` 的照片入场只能用 `catalog.motion.entrance_media`：这一格只收\"只动根节点、不依赖子结构和元素自带属性\"的卡。列表里没有合适的就留空 `motion`（代码会给一条默认淡入）。`entrance_block` 是给成块面板/文字块的，网格、Flip、逐行那类卡不许往照片上用。\n- `components` 只能用 `catalog.motion_by_component[<组件id>]` 列出的卡（空列表 = 这张组件没有安全的组件动效，不要写），卡名见 `catalog.motion_meta`；`state` 只能用 `state_text` / `state_block`；`deco` 只能用 `motion.decoration`；`out` 只能用 `motion.exit`。\n- `preset` 必须逐字来自对应族，不能跨族、不能自造；\n- 屏尾留白与中段节奏由代码按真实屏长排，你只需要保证一张卡演得完：卡片自己的时长不要超过 2.5 秒。\n\n## 全片纪律（这几条是硬约束，违反的那条会被记名退回重出）\n\n- `copy.title` 一行装得下（840 栏，9 字以内最稳），超了用 `body` 拆开。\n- **标注要抠着用**：`deco` 全片 ≤ ⌈屏数÷3⌉ 且相邻两屏不都写；`out` 也 ≤ ⌈屏数÷3⌉（`out` 是屏尾收束，不是每屏都要）。没有非标不可的东西就留空——每屏都挂一个标注，观众看到的是装饰，不是重点。\n- **任何一张卡全片最多用 2 次**（背景、文字入场、组件动效、状态、`deco`、`out` 都算；转场按刀数另算）。第三次就换同等观感的另一张。\n- **组件至少 4 种不同编号，同一张组件全片最多 2 次**。`catalog.component` 有 38 张：对照用单卡/双卡、数字用指标三连或数据行、流程用步骤条、明细用表格、界面用设备/浏览器/终端、引语用推文——按内容挑，不要每屏都 `U55`/`U53`。\n- **文字入场全片至少 3 种不同观感**：不要整片都是\"模糊聚焦 + 手绘落位\"。\n- **`catalog.recent_usage`**：最近三支成片各自用过哪些编号（值 = 出现过的片数）。列在里面的、值越高的，同等条件下越要换掉；值等于 3 的（连续三支都在用）除非这一屏非它不可，别再用。\n- 组件别连续三屏为空；背景 `family` 全片至少覆盖 ⌈屏数×0.7⌉ 种。\n- **出场先后由 `role` 决定，不由 `beat` 决定**：一屏里 `title` 永远最先、`lead/note/num` 其次、`body` 再次、`media` 再后、`deco` 紧随、`components` 再后、`state` 最后、`out` 固定在切点前；代码按这个顺序把元素排到按真实屏长算出的网格上，`beat` 只让它在自己那一格前后 ±0.4 格内微调。所以 `title` 的 `beat` 给\"这一屏开始说的那个词\"，不要给句尾的落点——给句尾它也只会在屏首出现，白白丢掉一次对齐机会。\n\n## 输出（只输出 JSON，第一个字符 `{`）\n\n```json\n{\"film_note\":\"一句话\",\"scenes\":[{\n  \"scene_id\":\"s01\",\"bg\":\"B26\",\n  \"media\":null,\n  \"copy\":[{\"role\":\"title\",\"text\":\"人生成立\",\"beat\":\"人生\",\"motion\":{\"preset\":\"T17\"}}],\n  \"components\":[{\"id\":\"U05\",\"anim\":\"rows\",\"texts\":[\"一千万\",\"非必选项\",\"房子\",\"非必选项\"],\"motion\":{\"preset\":\"UA02\"}}],\n  \"state\":{\"preset\":\"S04\",\"target\":\"rows\",\"word\":\"资格\",\"then\":{\"preset\":\"S07\",\"target\":\"rows\",\"word\":\"资格\"}},\n  \"deco\":null,\n  \"out\":{\"preset\":\"X03\",\"target\":\"rows\"},\n  \"transition\":{\"pt\":\"PT04\",\"duration_ms\":420}}]}\n```\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 2060
        y: 100
      positionAbsolute:
        x: 2060
        y: 100
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 160
    - id: s2n
      type: custom
      data:
        type: code
        title: S2N_归一
        code_language: python3
        code: "def main(spec_text: str, package_json: str, catalog_json: str) -> dict:\n    \"\"\"S2 归一：动效挂在元素上（copy[].motion / components[].motion / media.motion + state），\n    这里把它翻成 R1 认识的 motions[]，并校验编号、槽位与目标。\n\n    只做机械转换：编号不在目录、槽位条数不够，就丢掉那一条并记 warning；不替模型补内容。\n    \"\"\"\n    import json\n    import re\n\n    def parse(raw):\n        text = str(raw or \"\").strip()\n        text = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", text, flags=re.I)\n        try:\n            return json.loads(text)\n        except Exception:\n            start, end = text.find(\"{\"), text.rfind(\"}\")\n            if 0 <= start < end:\n                try:\n                    return json.loads(text[start:end + 1])\n                except Exception:\n                    pass\n        return {}\n\n    def num(value, default=0.0):\n        try:\n            return float(value)\n        except Exception:\n            return default\n\n    package = parse(package_json)\n    catalog = parse(catalog_json)\n    data = parse(spec_text)\n    errors, warnings = [], []\n\n    storyboard = package.get(\"storyboard\") if isinstance(package.get(\"storyboard\"), dict) else {}\n    scenes = [s for s in (storyboard.get(\"scenes\") or []) if isinstance(s, dict)]\n    if not scenes:\n        return {\"specs_json\": \"[]\", \"image_plan_json\": \"{}\", \"s2_valid\": False,\n                \"s2_errors_json\": json.dumps([\"缺少分镜：S1 没有产出 scenes\"], ensure_ascii=False),\n                \"s2_warnings_json\": \"[]\", \"scene_count\": 0, \"ledger_json\": \"{}\"}\n\n    bg_cards = catalog.get(\"background\") if isinstance(catalog.get(\"background\"), dict) else {}\n    comp_cards = catalog.get(\"component\") if isinstance(catalog.get(\"component\"), dict) else {}\n    motion_by_component = catalog.get(\"motion_by_component\") if isinstance(catalog.get(\"motion_by_component\"), dict) else {}\n    pt_cards = catalog.get(\"page_transition\") if isinstance(catalog.get(\"page_transition\"), dict) else {}\n    motion = catalog.get(\"motion\") if isinstance(catalog.get(\"motion\"), dict) else {}\n    component_meta = catalog.get(\"component_meta\") if isinstance(catalog.get(\"component_meta\"), dict) else {}\n    # 卡需要的锚点（gen_catalog 从 needs 里只留锚点词）。状态卡也走这张表：\n    # S36 要 num，落在标签组件上会把整块文字改写成计数（2026-11-21 s07 的「156」）。\n    card_needs = catalog.get(\"card_needs\") if isinstance(catalog.get(\"card_needs\"), dict) else {}\n    # 状态卡的能力声明（gen_catalog 从卡自己的 code / needs 派生）：\n    # writes=content 的只能落文字；trigger 的必须配 then。判据在定义层，这里只执行。\n    state_meta = catalog.get(\"state_meta\") if isinstance(catalog.get(\"state_meta\"), dict) else {}\n    motion_needs = catalog.get(\"motion_needs\") if isinstance(catalog.get(\"motion_needs\"), dict) else {}\n\n    entry_text = set(motion.get(\"entrance_text\") or [])\n    entry_block = set(motion.get(\"entrance_block\") or [])\n    # 照片带只接派生族 entrance_media（只动根节点、不依赖子结构的卡）。\n    # 缺这一格时退回旧行为，避免旧目录一进来就全丢。\n    entry_media = set(motion.get(\"entrance_media\") or [])\n    component_motion = set(motion.get(\"component_motion\") or [])\n    state_cards = set(motion.get(\"state_text\") or []) | set(motion.get(\"state_block\") or [])\n    deco_cards = set(motion.get(\"decoration\") or [])\n    exit_cards = set(motion.get(\"exit\") or [])\n    allowed_presets = (entry_text | entry_block | component_motion | state_cards\n                       | deco_cards | exit_cards)\n\n    specs = {}\n    for item in (data.get(\"scenes\") or []):\n        if isinstance(item, dict) and str(item.get(\"scene_id\") or \"\").strip():\n            specs[str(item[\"scene_id\"]).strip()] = item\n\n    ROLE_SIZES = {\"band\": \"1536x1024\", \"inset\": \"1536x1024\", \"portrait\": \"1536x1024\",\n                  \"thumb\": \"1536x1024\", \"texture\": \"1024x1536\"}\n    TEXT_ROLES = {\"title\", \"lead\", \"body\", \"note\", \"num\", \"label\", \"accent\"}\n    ALLOWED_MOTION = {\"push-in\", \"pull-out\", \"pan-left\", \"pan-right\", \"tilt-up\", \"reveal\", \"parallax\", \"hold\"}\n    # 比例条只认真实数字（S02/S18 的 avoid 就是这一条）：这一屏一个字都没提数字，\n    # 画一条 720px 的进度条就是装饰（2026-11-22 s03 的「付出和获得之间」）。\n    NUMBER_RE = re.compile(r\"[0-9０-９]|[%％]|倍|成|个百分点\")\n\n    def motion_of(element, target, allowed, sid, role=\"\"):\n        \"\"\"元素自带的入场：preset 必须在对应族里；trigger 由 beat 直接给出，不需要模型另写。\"\"\"\n        item = element.get(\"motion\") if isinstance(element, dict) else None\n        if not isinstance(item, dict):\n            return None\n        preset = str(item.get(\"preset\") or \"\").strip().upper()\n        if preset not in allowed or preset not in allowed_presets:\n            warnings.append(\"%s 的 %s 动效 %s 不在对应族里，已丢弃\" % (sid, target, preset or \"?\"))\n            return None\n        beat = str(element.get(\"beat\") or \"\").strip()\n        # role 要跟着走：R1 按 role 排屏内出场顺序（title 先、state 后），\n        # 只靠 beat 决定先后会让\"标题是概括句\"的屏永远把标题放到最后（2026-11-20）。\n        return {\"preset\": preset, \"target\": target, \"role\": str(role or \"\").strip(),\n                \"trigger\": (\"word:\" + beat) if beat else \"sentence_start\",\n                \"fallback\": num(item.get(\"fallback\"), 0.4),\n                \"params\": item.get(\"params\") if isinstance(item.get(\"params\"), dict) else {}}\n\n\n    def fit_component_texts(texts, before, row_slots, after, rows_default=1):\n        \"\"\"把 texts 切成模板真正吃得下的槽位。\n\n        组数由**实际给到的完整组**决定，不按 rows_default 造行：补空串会让模板\n        渲染出只有边框的空卡片（2026-11-21 s01 的 U55：双卡模板要 4 段，只给 2 段，\n        补出第二张空卡）。固定槽位缺字、组不完整、组内全空的都不落地。\n        返回 (填好的 texts 或 None, 说明)。\n        \"\"\"\n        head = texts[:before]\n        if before and (len(head) < before or any(not x for x in head)):\n            return None, \"缺少固定槽位（before=%d）\" % before\n        tail = texts[len(texts) - after:] if after else []\n        if after and (len(tail) < after or any(not x for x in tail)):\n            return None, \"缺少固定槽位（after=%d）\" % after\n        core = texts[before:len(texts) - after] if after else texts[before:]\n        if row_slots <= 0:\n            # 非重复模板：槽位全在 before / after 里，core 只是没用上的多余文字。\n            return head + tail, \"\"\n        groups = [core[i:i + row_slots] for i in range(0, len(core) - row_slots + 1, row_slots)]\n        complete = [g for g in groups if all(g)]\n        notes = []\n        if len(complete) < len(groups):\n            notes.append(\"有 %d 组没填满，已整组丢弃\" % (len(groups) - len(complete)))\n        if len(core) % row_slots:\n            notes.append(\"末尾 %d 段凑不成一组，已丢弃\" % (len(core) % row_slots))\n        if not complete:\n            return None, \"一组完整槽位都没有（每组 %d 段）\" % row_slots\n        # 少于组件常见组数时点名（不拦）：双卡组件只填了一张，报告里要看得见。\n        if rows_default and len(complete) < int(rows_default):\n            notes.append(\"只填了 %d 组（默认 %s 组）\" % (len(complete), rows_default))\n        return head + [x for g in complete for x in g] + tail, \"；\".join(notes)\n\n    ordered, images = [], []\n    for index, scene in enumerate(scenes, 1):\n        sid = str(scene.get(\"scene_id\") or \"s%02d\" % index).strip()\n        spec = specs.get(sid)\n        if not isinstance(spec, dict):\n            errors.append(\"%s 没有分镜规格\" % sid)\n            continue\n        bg = str(spec.get(\"bg\") or \"\").strip().upper()\n        if bg and bg not in bg_cards:\n            warnings.append(\"%s 的背景 %s 不在目录里，已丢弃（不换卡、不猜）\" % (sid, bg))\n            bg = \"\"\n\n        copy_items, motions = [], []\n        for raw in (spec.get(\"copy\") or []):\n            if not isinstance(raw, dict):\n                continue\n            role = str(raw.get(\"role\") or \"\").strip()\n            text = str(raw.get(\"text\") or \"\").strip()\n            if role not in TEXT_ROLES or not text:\n                continue\n            # 一个 role 一屏只能有一次（2026-11-21）：`R2` 渲染时本来就按 role 去重，\n            # 这里再去重一次是为了让**规格里也只有一条 motion**——否则同一个\n            # `<p data-anim=\"body\">` 会拿到两张入场卡，成片里先出现一次、几秒后\n            # 又被第二张从隐藏态重新长出来（2026-11-21 s04 的 T27+T28 实测）。\n            if any(item[\"role\"] == role for item in copy_items):\n                warnings.append(\"%s 的 %s 文字出现了两次，只保留第一条（一屏一个 role 一次）\" % (sid, role))\n                continue\n            copy_items.append({\"role\": role, \"text\": text, \"beat\": str(raw.get(\"beat\") or \"\").strip()})\n            m = motion_of(raw, role, entry_text | entry_block, sid, role)\n            if m:\n                motions.append(m)\n        if not any(item[\"role\"] == \"title\" for item in copy_items):\n            errors.append(\"%s 没有 title（漏写 title 视为不合格）\" % sid)\n\n        components = []\n        for raw in (spec.get(\"components\") or [])[:2]:\n            if not isinstance(raw, dict):\n                continue\n            cid = str(raw.get(\"id\") or \"\").strip().upper()\n            card = comp_cards.get(cid)\n            if not card:\n                warnings.append(\"%s 的组件 %s 不在目录里，已丢弃\" % (sid, cid or \"?\"))\n                continue\n            texts = [str(x).strip() for x in (raw.get(\"texts\") or [])]\n            fitted, slot_note = fit_component_texts(\n                texts,\n                int(card.get(\"before\") or 0),\n                int(card.get(\"row\") or 0),\n                int(card.get(\"after\") or 0),\n                int(card.get(\"rows_default\") or 1),\n            )\n            if slot_note:\n                warnings.append(\"%s 的组件 %s %s\" % (sid, cid, slot_note))\n            if fitted is None:\n                warnings.append(\"%s 的组件 %s 槽位填不满，整条丢弃（不补空串、不渲染空卡）\" % (sid, cid))\n                continue\n            texts = fitted\n            anim = str(raw.get(\"anim\") or \"\").strip() or \"comp\"\n            # 同屏两个组件用同一个 anim 名 = 两条动效指同一个 data-anim，第二张会把第一张\n            # 打回来（和被去掉的 R2 判重是同一类问题）。名字重了就只留先来的那个。\n            if any(item[\"anim\"] == anim for item in components):\n                warnings.append(\"%s 的组件 %s 用了重复的 anim 名 %s，只保留第一个\" % (sid, cid, anim))\n                continue\n            components.append({\"id\": cid, \"anim\": anim, \"texts\": texts})\n            # 组件动效必须先过契约：这个组件没提供卡需要的锚点，就直接丢掉这条动效。\n            allowed_motion = set(component_motion)\n            per_component = motion_by_component.get(cid)\n            if isinstance(per_component, list):\n                allowed_motion = set(per_component)\n            asked = (raw.get(\"motion\") or {}).get(\"preset\") if isinstance(raw.get(\"motion\"), dict) else \"\"\n            asked = str(asked or \"\").strip().upper()\n            if asked and isinstance(per_component, list) and asked not in per_component:\n                warnings.append(\"%s 的组件 %s 没有 %s 需要的锚点，动效已丢弃\" % (sid, cid, asked))\n                m = None\n            else:\n                m = motion_of(raw, anim, allowed_motion, sid, \"component\")\n            if m:\n                motions.append(m)\n\n        media = spec.get(\"media\") if isinstance(spec.get(\"media\"), dict) else None\n        role = str((media or {}).get(\"role\") or \"\").strip().lower()\n        visual = \"photo\" if media and role in ROLE_SIZES else \"html\"\n        media_out = None\n        if visual == \"photo\":\n            media_out = {\n                \"role\": role if role in (\"band\", \"inset\", \"portrait\", \"thumb\", \"texture\") else \"band\",\n                \"prompt\": str(media.get(\"prompt\") or \"\").strip(),\n                \"prompt_zh\": str(media.get(\"prompt_zh\") or \"\").strip(),\n                \"negative\": str(media.get(\"negative\") or \"\").strip(),\n                \"motion_hint\": str(media.get(\"motion_hint\") or \"reveal\").strip().lower(),\n            }\n            if media_out[\"motion_hint\"] not in ALLOWED_MOTION:\n                media_out[\"motion_hint\"] = \"reveal\"\n            if not media_out[\"prompt\"]:\n                warnings.append(\"%s 声明了照片但没有 prompt\" % sid)\n            m = motion_of(media, \"media\", entry_media or (entry_block | entry_text), sid, \"media\")\n            if m:\n                motions.append(m)\n            images.append({\n                \"id\": sid, \"scene_id\": sid, \"role\": media_out[\"role\"],\n                \"subject\": str(media.get(\"subject\") or (copy_items[0][\"text\"] if copy_items else \"\")),\n                \"why\": str(media.get(\"why\") or \"\"),\n                \"prompt\": media_out[\"prompt\"], \"prompt_zh\": media_out[\"prompt_zh\"],\n                \"negative\": media_out[\"negative\"], \"size\": ROLE_SIZES[media_out[\"role\"]],\n                \"text_safe_zone\": \"bottom\", \"motion_hint\": media_out[\"motion_hint\"],\n            })\n\n        # 状态变化：目标必须是本屏元素；trigger 用目标自己的 beat\n        # 2026-11-22：落点与因果由 state_meta 判——改写文字的卡只能落文字，触发型必须配 then。\n        state = spec.get(\"state\") if isinstance(spec.get(\"state\"), dict) else None\n        if state:\n            preset = str(state.get(\"preset\") or \"\").strip().upper()\n            target = str(state.get(\"target\") or \"\").strip()\n            beats = {item[\"role\"]: item[\"beat\"] for item in copy_items}\n            beats.update({item[\"anim\"]: \"\" for item in components})\n            needs = [str(a) for a in (card_needs.get(preset) or [])]\n            target_comp = next((c for c in components if c[\"anim\"] == target), None)\n            provides = {}\n            if target_comp is not None:\n                raw_provides = (component_meta.get(target_comp[\"id\"]) or {}).get(\"provides\")\n                provides = raw_provides if isinstance(raw_provides, dict) else {}\n            missing = [a for a in needs if a not in provides]\n            meta = state_meta.get(preset) if isinstance(state_meta.get(preset), dict) else {}\n            requires = str(meta.get(\"requires\") or \"\")\n            if missing:\n                warnings.append(\"%s 的状态卡 %s 需要 %s 锚点，目标 %s 不提供，已丢弃（换带该锚点的组件或换卡）\"\n                                % (sid, preset, \"/\".join(missing), target or \"?\"))\n            elif meta.get(\"requires_number\") and not NUMBER_RE.search(\n                    \" \".join([str(x.get(\"text\") or \"\") for x in copy_items]\n                             + [str(t) for c in components for t in (c.get(\"texts\") or [])])):\n                warnings.append(\"%s 的状态卡 %s 要真实数值，本屏文字里没有数字/百分比/倍数，已丢弃（重跑 S2）\"\n                                % (sid, preset))\n            elif requires == \"text\" and target not in TEXT_ROLES:\n                # 改写文字的卡落在组件根上 = 把组件内容清空重写（2026-11-22 s05 的「富豪财富集中」16px）\n                warnings.append(\"%s 的状态卡 %s 只改文字，目标 %s 不是文字节点，已丢弃（重跑 S2 换文字目标）\"\n                                % (sid, preset, target or \"?\"))\n            elif preset not in state_cards or target not in beats:\n                warnings.append(\"%s 的状态卡 %s→%s 不在本屏或不是状态族，已丢弃\" % (sid, preset or \"?\", target or \"?\"))\n            else:\n                beat = beats.get(target) or str(state.get(\"word\") or \"\").strip()\n                then = state.get(\"then\") if isinstance(state.get(\"then\"), dict) else {}\n                t_preset = str(then.get(\"preset\") or \"\").strip().upper()\n                # 结果必须落在同一个元素上：R1 的\"触发卡后面要有结果\"是按 target 精确匹配的，\n                # 给别的目标会连触发卡一起丢掉，所以这里直接判死。\n                t_target = str(then.get(\"target\") or \"\").strip() or target\n                t_meta = state_meta.get(t_preset) if isinstance(state_meta.get(t_preset), dict) else {}\n                ok = True\n                if meta.get(\"trigger\"):\n                    # 触发卡（点击/勾选/拖动/切换/状态灯）只在说\"发生了一件事\"：\n                    # 没有 then 就没有结果，孤零零一次点击不是动效（2026-11-22 s04 的圆点）。\n                    if not t_preset:\n                        warnings.append(\"%s 的触发卡 %s（点击/勾选/拖动/切换）缺 then：只有动作没有结果，已丢弃，重跑 S2 补 then 或换非触发卡\"\n                                        % (sid, preset))\n                        ok = False\n                    elif t_preset not in state_cards:\n                        warnings.append(\"%s 的 then 卡 %s 不是状态族，已丢弃（重跑 S2）\" % (sid, t_preset))\n                        ok = False\n                    elif t_meta.get(\"trigger\"):\n                        warnings.append(\"%s 的 then 又是触发卡 %s，不许连成链，已丢弃（重跑 S2）\" % (sid, t_preset))\n                        ok = False\n                    elif t_target != target:\n                        warnings.append(\"%s 的 then 目标 %s 与触发目标 %s 不同（结果必须落在同一个元素上），已丢弃（重跑 S2）\"\n                                        % (sid, t_target, target))\n                        ok = False\n                if ok:\n                    motions.append({\"preset\": preset, \"target\": target, \"role\": \"state\",\n                                    \"trigger\": (\"word:\" + beat) if beat else \"sentence_start\",\n                                    \"fallback\": num(state.get(\"fallback\"), 1.2),\n                                    \"params\": state.get(\"params\") if isinstance(state.get(\"params\"), dict) else {}})\n                    if meta.get(\"trigger\"):\n                        t_beat = beats.get(t_target) or str(then.get(\"word\") or \"\").strip()\n                        motions.append({\"preset\": t_preset, \"target\": t_target, \"role\": \"state\",\n                                        \"trigger\": (\"word:\" + t_beat) if t_beat else \"sentence_start\",\n                                        \"fallback\": num(then.get(\"fallback\"), 1.2),\n                                        \"params\": then.get(\"params\") if isinstance(then.get(\"params\"), dict) else {}})\n\n        # 元素级装饰（deco）：圈重点、划线、框注、色带… 落在本屏已有的元素上。\n        deco = spec.get(\"deco\") if isinstance(spec.get(\"deco\"), dict) else None\n        if deco:\n            preset = str(deco.get(\"preset\") or \"\").strip().upper()\n            target = str(deco.get(\"target\") or \"\").strip()\n            beats = {item[\"role\"]: \"\" for item in copy_items}\n            beats.update({item[\"anim\"]: \"\" for item in components})\n            d_needs = {str(n) for n in (motion_needs.get(preset) or [])}\n            if preset not in deco_cards:\n                warnings.append(\"%s 的 deco %s 不在 decoration 族，已丢弃（重跑 S2）\" % (sid, preset or \"?\"))\n            elif target not in beats and target != \"media\":\n                warnings.append(\"%s 的 deco 目标 %s 不在本屏，已丢弃（重跑 S2）\" % (sid, target or \"?\"))\n            elif target == \"title\":\n                warnings.append(\"%s 的 deco 落在标题上（标题已经最大，再标就是糊住它），已丢弃（重跑 S2）\" % sid)\n            elif \"text\" in d_needs and target not in TEXT_ROLES:\n                warnings.append(\"%s 的 deco %s 只落在文字上，目标 %s 不是文字，已丢弃（重跑 S2）\"\n                                % (sid, preset, target or \"?\"))\n            else:\n                motions.append({\"preset\": preset, \"target\": target, \"role\": \"deco\",\n                                \"trigger\": \"sentence_start\",\n                                \"fallback\": num(deco.get(\"fallback\"), 1.6),\n                                \"params\": deco.get(\"params\") if isinstance(deco.get(\"params\"), dict) else {}})\n\n        # 屏尾收束（out）：离场族，R1 把它固定在切点前。\n        out = spec.get(\"out\") if isinstance(spec.get(\"out\"), dict) else None\n        if out:\n            preset = str(out.get(\"preset\") or \"\").strip().upper()\n            target = str(out.get(\"target\") or \"\").strip()\n            beats = {item[\"role\"]: \"\" for item in copy_items}\n            beats.update({item[\"anim\"]: \"\" for item in components})\n            if preset not in exit_cards:\n                warnings.append(\"%s 的 out %s 不在 exit 族，已丢弃（重跑 S2）\" % (sid, preset or \"?\"))\n            elif target not in beats and target != \"media\":\n                warnings.append(\"%s 的 out 目标 %s 不在本屏，已丢弃（重跑 S2）\" % (sid, target or \"?\"))\n            elif target == \"title\":\n                warnings.append(\"%s 的 out 落在标题上（标题不能中途消失），已丢弃（重跑 S2）\" % sid)\n            else:\n                motions.append({\"preset\": preset, \"target\": target, \"role\": \"out\",\n                                \"trigger\": \"sentence_start\", \"fallback\": 0,\n                                \"params\": out.get(\"params\") if isinstance(out.get(\"params\"), dict) else {}})\n\n        transition = spec.get(\"transition\") if isinstance(spec.get(\"transition\"), dict) else {}\n        pt = str(transition.get(\"pt\") or \"\").strip().upper()\n        if pt and pt not in pt_cards:\n            warnings.append(\"%s 的转场 %s 不在目录里，已丢弃\" % (sid, pt))\n            pt = \"\"\n        duration = max(0.3, min(0.65, num(transition.get(\"duration_ms\"), 450) / 1000.0)) if pt else 0.0\n        ordered.append({\n            \"scene_id\": sid, \"bg\": bg, \"visual\": visual, \"media\": media_out,\n            \"copy\": copy_items, \"components\": components, \"motions\": motions,\n            \"transition\": {\"pt\": pt, \"kind\": str(pt_cards.get(pt, {}).get(\"kind\") or \"\"),\n                           \"duration\": duration} if pt else None,\n        })\n\n    if len(ordered) != len(scenes):\n        errors.append(\"有效规格 %d 屏，分镜 %d 屏，对不上\" % (len(ordered), len(scenes)))\n\n    # 全片用量（2026-11-22）：不替模型换卡，只把超额点名——重跑 S2 才有意义。\n    # 口径：同一编号 ≤2 次（转场按刀数另算，不在此列）；组件 ≥4 种、同一组件 ≤2 次。\n    tally = {}\n    for item in ordered:\n        if item.get(\"bg\"):\n            tally[item[\"bg\"]] = tally.get(item[\"bg\"], 0) + 1\n        for m in item.get(\"motions\") or []:\n            tally[m[\"preset\"]] = tally.get(m[\"preset\"], 0) + 1\n    over = sorted(k for k, v in tally.items() if v > 2)\n    if over:\n        warnings.append(\"全片超过 2 次的编号：%s（重跑 S2，换同等观感的另一张；recent_usage 里越高的越该换）\"\n                        % \"、\".join(over))\n    comp_tally = {}\n    for item in ordered:\n        for c in item.get(\"components\") or []:\n            comp_tally[c[\"id\"]] = comp_tally.get(c[\"id\"], 0) + 1\n    if len(ordered) >= 4 and len(comp_tally) < 4:\n        warnings.append(\"全片只用了 %d 种组件（%s）：对照/数据/流程/明细/界面/引语按内容挑，别每屏都用同一张\"\n                        % (len(comp_tally), \"、\".join(sorted(comp_tally)) or \"0\"))\n    # 标注配额（2026-11-22）：deco 是\"在某句话上做一个手绘标注\"，不是每屏配一件装饰。\n    # 8 屏全挂标注，观众看到的是装饰不是重点（2026-11-22 s01–s06 连着打了六个）。\n    cap = max(1, (len(ordered) + 2) // 3)\n    deco_n = sum(1 for item in ordered for m in (item.get(\"motions\") or [])\n                 if str(m.get(\"role\") or \"\") == \"deco\")\n    out_n = sum(1 for item in ordered for m in (item.get(\"motions\") or [])\n                if str(m.get(\"role\") or \"\") == \"out\")\n    if deco_n > cap:\n        warnings.append(\"全片 %d 条 deco（上限 %d，⌈屏数÷3⌉）：标注太多，重跑 S2 只留真有东西要标的屏\" % (deco_n, cap))\n    if out_n > cap:\n        warnings.append(\"全片 %d 条 out（上限 %d，⌈屏数÷3⌉）：屏尾收束不必每屏都做\" % (out_n, cap))\n    comp_over = sorted(k for k, v in comp_tally.items() if v > 2)\n    if comp_over:\n        warnings.append(\"同一组件全片超过 2 次：%s（重跑 S2）\" % \"、\".join(comp_over))\n\n    ledger = [{\"scene_id\": s.get(\"scene_id\"),\n               \"duration\": round(float(s.get(\"estimated_end_seconds\") or 0) - float(s.get(\"estimated_start_seconds\") or 0), 2),\n               \"voiceover\": str(s.get(\"voiceover_text\") or \"\")} for s in scenes]\n    coverage = {}\n    for item in images:\n        coverage[item[\"role\"]] = coverage.get(item[\"role\"], 0) + 1\n    image_plan = {\n        \"image_plan_version\": \"2.0\",\n        \"prompt_prefix\": \"\",\n        \"style_bible\": {},\n        \"images\": images,\n        \"coverage\": {\"scene_count\": len(ordered), \"photo_count\": len(images),\n                     \"html_count\": len(ordered) - len(images), \"role_mix\": coverage},\n    }\n    return {\n        \"specs_json\": json.dumps(ordered, ensure_ascii=False),\n        \"image_plan_json\": json.dumps(image_plan, ensure_ascii=False),\n        \"image_brief_json\": json.dumps({\"images\": [{\"id\": i[\"id\"], \"scene_id\": i[\"scene_id\"],\n                                                    \"role\": i[\"role\"], \"size\": i[\"size\"]} for i in images]}, ensure_ascii=False),\n        \"ledger_json\": json.dumps(ledger, ensure_ascii=False),\n        \"scene_count\": len(ordered),\n        \"s2_valid\": not errors,\n        \"s2_errors_json\": json.dumps(errors, ensure_ascii=False),\n        \"s2_warnings_json\": json.dumps(warnings, ensure_ascii=False),\n    }\n"
        variables:
        - variable: spec_text
          value_selector:
          - s2
          - text
          value_type: string
        - variable: package_json
          value_selector:
          - s1n
          - package_json
          value_type: string
        - variable: catalog_json
          value_selector:
          - h00
          - catalog_json
          value_type: string
        outputs:
          specs_json:
            type: string
            children: null
          image_plan_json:
            type: string
            children: null
          image_brief_json:
            type: string
            children: null
          ledger_json:
            type: string
            children: null
          scene_count:
            type: number
            children: null
          s2_valid:
            type: boolean
            children: null
          s2_errors_json:
            type: string
            children: null
          s2_warnings_json:
            type: string
            children: null
      position:
        x: 2400
        y: 100
      positionAbsolute:
        x: 2400
        y: 100
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 200
