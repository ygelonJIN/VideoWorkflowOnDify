    - id: h01d
      type: custom
      data:
        type: llm
        title: H01D_视觉定调
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        prompt_template:
        - id: h01d-system
          role: system
          text: "# 视觉定调\n\n你是这支视频的艺术指导。**风格、色彩、字体、材质、光、版式气质，全部由你决定，没有任何预设风格**。你不写 HTML，只产出\"这支片子长什么样\"的决定，后面的组件、背景、骨架、场景组全部照你的决定执行。\n\n## 输入\n\n- `approved_package_json`：{{#a16.approved_package_json#}}\n- `design_brief`：{{#h00.design_brief#}}\n\n## 你要决定的\n\n1. **一句话视觉隐喻**：这支片子的画面本质是什么。要能一句话讲清，并且能推出后面所有具体选择（例：纸张与墨迹、玻璃与光、旧相册与折痕、仪表盘与刻度）。隐喻不是形容词堆砌，是可执行的结构。\n2. **色彩系统**：主色相、强调色、中性阶、背景基调、文字层级色。给出每个颜色的用途，不只给色值。要说明\"为什么是这个色相\"——它和主题的关系。\n3. **字体与排版气质**：字体栈（只用系统可用中文字体）、字重用法、字号关系（相对关系而不是固定像素档位）、行距与字距倾向、对齐方式、标题断行策略。\n4. **材质与质感**：画面靠什么质感立住（纸纹、噪点、玻璃、雾、金属、织物、光晕、颗粒……）。说明质感出现在哪一层、强度如何、为什么。\n5. **光**：光从哪来、什么色温、有没有方向性、有没有体积感、明暗对比强度、暗角是否存在。\n6. **纵深策略**：画面怎么做出层次——遮挡、景深、前后景差速、投影方向、色阶分离，任你选，但要写清这一屏靠哪一招成立。\n7. **全片节奏**：这支片子在视觉上是\"越来越亮/越来越静/越来越紧\"还是别的走向；哪几屏是重音，哪几屏是留白。\n8. **摄影设定**：这支片子画面里的真实图像靠什么成立——介质（数字/胶片/纪实/显微）、焦段与景深、主光方向与色温、画面色彩倾向、质感（颗粒/雾/湿度）。这是给图像计划节点的唯一依据，写清\"这支片子长什么样\"，不写某一屏拍什么。\n\n## 输出（硬性）\n\n只输出 JSON 对象：第一个字符 `{`，最后一个字符 `}`，不要代码围栏、不要解释。结构：\n\n```json\n{\n  \"art_direction_version\": \"1.0\",\n  \"metaphor\": \"一句话视觉隐喻\",\n  \"metaphor_reading\": \"这个隐喻如何推出后面的具体选择\",\n  \"palette\": {\n    \"base\": \"背景基调色与理由\",\n    \"ink\": {\"primary\": \"主文字色\", \"secondary\": \"次级\", \"muted\": \"弱化\"},\n    \"accent\": {\"color\": \"强调色\", \"usage\": \"什么时候用、用多少\"},\n    \"neutral\": [\"中性阶，从浅到深，每个写用途\"],\n    \"rules\": [\"用色纪律，例如：强调色只给结论和状态变化\"]\n  },\n  \"typography\": {\n    \"stack\": [\"PingFang SC\", \"Noto Sans CJK SC\", \"Microsoft YaHei\"],\n    \"scale_strategy\": \"字号策略：给出 2–3 种不同的标题力度（各自对应什么内容、什么情绪），说明每屏可以选不同力度，全片不要求一套档位\",\n    \"weights\": {\"headline\": 0, \"body\": 0, \"label\": 0},\n    \"line_height\": {\"tight\": 0, \"normal\": 0},\n    \"letter_spacing\": \"字距倾向\",\n    \"alignment\": \"主对齐方式与例外；允许每屏换对齐，说明什么内容适合什么对齐\",\n    \"title_breaking\": \"长标题怎么断行、禁止什么\"\n  },\n  \"material\": [\n    {\"name\": \"质感名\", \"layer\": \"bg|mid|fg\", \"strength\": \"弱/中/强\", \"why\": \"为什么需要\"}\n  ],\n  \"light\": {\n    \"direction\": \"光的方向\",\n    \"temperature\": \"色温倾向\",\n    \"volume\": \"有没有体积感\",\n    \"contrast\": \"明暗对比强度\",\n    \"vignette\": \"暗角是否存在、强度\"\n  },\n  \"depth_strategy\": {\n    \"primary\": \"主用哪一招做纵深\",\n    \"support\": [\"辅助手段\"],\n    \"per_scene_variation\": \"不同屏之间如何变化而不失控\"\n  },\n  \"rhythm\": {\n    \"arc\": \"全片视觉走向\",\n    \"accents\": [\"哪几屏是重音，理由\"],\n    \"rests\": [\"哪几屏留白，理由\"]\n  },\n  \"tokens\": {\n    \"--color-*\": \"值\",\n    \"--font-*\": \"值\",\n    \"--radius-*\": \"值\",\n    \"--stroke-*\": \"值\",\n    \"--ease-*\": \"值\",\n    \"--dur-*\": \"值\"\n  },\n  \"image_direction\": {\n    \"medium\": \"摄影介质与理由\",\n    \"optics\": \"焦段倾向、光圈与景深\",\n    \"light\": \"主光方向、色温、对比强度\",\n    \"palette_in_image\": \"画面色彩倾向，与 palette 对齐\",\n    \"texture\": \"颗粒、雾、湿度、材质\",\n    \"consistency\": [\"每张图都要遵守的一致性锚点\"],\n    \"avoid\": [\"画面里禁止出现的东西\"]\n  },\n  \"forbidden\": [\"本片不要出现的东西，写具体\"]\n}\n```\n\n## 纪律\n\n- 不套用任何默认模板：不要默认\"卡片 + 圆角 + 阴影\"，不要默认\"淡入上浮\"，不要默认\"米色纸感\"。先由隐喻推导，再决定用不用。\n- 全片必须一致的值（颜色、字体栈、圆角、描边、缓动、时长）写进 `tokens`；**字号、行高、间距、对齐不写进 tokens**，它们由每一屏按自己的构图决定，写进去就会把每屏钉成同一个样。\n- 同一条视频内自洽：色彩、字体、材质、光、纵深必须互相支撑，不能各说各话。\n- 具体数值只写进 `tokens`（只限全片统一的那几类：颜色、字体栈、圆角、描边、缓动、时长），正文里写关系和意图，方便下游复用。\n- **字号一律写 px，不要用 rem**：画布固定 1080×1920，不需要响应式。参考档位：主标题 88–110px、次标题 64–80px、正文 36–44px、标签 26–32px。标题低于 72px 在手机上看不清。\n- 参考档位不是全片一套字阶：**主标题的力度要按屏变**（超大单行、三行块、小标题 + 大字数字、竖排……），相邻两屏不要一直用同一档；一屏内部字阶要自洽。\n- 不写 HTML、不写 CSS 规则、不写 GSAP。\n- 主题决定气质：纪念类不等于\"必须低饱和米色\"，也不等于\"必须有光晕\"，你按这次的内容判断。\n- 画面里的**真实图像**由 `image_direction` 决定，后面的图像计划节点照它决定每一屏用照片还是 HTML 背景，并为有图屏写 prompt。所以 `image_direction` 必须具体到能拍出来，不能只有\"高级感\"\"电影感\"这类形容词；它也要能支撑无图屏的抽象背景语言（底色、材质、线条、光）。\n- `image_direction` 与 `palette`、`light`、`material` 必须互相一致：不要定一套暖纸感排版，却让画面是冷蓝夜景。\n- 留白是结构，不是空白：`rhythm.rests` 里写\"留白\"的屏，指的是内容少但有重心的屏，不是大片无信息的深色区域。定调时把\"内容少时靠什么撑住画面\"（居中、间距、图片本身、一个视觉锚）写进 `depth_strategy` 或 `rhythm`。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
