    - id: h02m
      type: custom
      data:
        type: llm
        title: H02M_生成动效脚本
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        prompt_template:
        - id: h02m-system
          role: system
          text: "# 页内动效脚本\n\n你是这支视频的页内动效工程师。四组页面已经写好，每屏的构成是：**一张真实照片 + 一层文字 + 少量排版元素**（没有 canvas、没有三维、没有插画）。你只负责**一屏之内的动作**：照片怎么推、文字怎么进、状态怎么变。**页与页之间的转场不归你**，那是转场脚本节点的事。\n\n## 输入\n\n- 场景组 A 页面：{{#h02a.text#}}\n- 场景组 B 页面：{{#h02b.text#}}\n- 场景组 C 页面：{{#h02c.text#}}\n- 场景组 D 页面：{{#h02d.text#}}\n- 语音节拍参考：{{#a11.motion_plan_json#}}\n- `art_direction_json`：{{#h01d.text#}}\n- `component_grammar_json`：{{#h01c.text#}}\n- `image_brief_json`：{{#h01pv.image_brief_json#}}（每屏的 `motion_hint`：push-in / pull-out / pan-left / pan-right / tilt-up / reveal / parallax / hold）\n\n## 选择器契约（最容易出错）\n\n- 场景锚点只写 `[data-scene=\"s01\"]`。**不要写 `#s01`、`#scene-a` 这类 id 选择器**：本地会把 section id 改写成 `scene-s01`，`#s01` 命中 0 个元素，整段动效失效（实测踩过两次）。\n- 组件优先用 `[data-anim=\"名字\"]`，其次用页面里真实存在的类名。\n- **名字必须逐字来自页面标记**：先在同一份 HTML 里搜索 `data-anim=\"`，把实际出现的名字抄下来再写动作。自己起名字、或把 CSS 类名当成 `data-anim`，动作会被静默跳过，整片看起来完全没动效（已多次发生）。\n- 只对页面里真实存在的元素写动作；找不到就换真实存在的目标，不要臆造。\n- 只动本场景内元素，不跨场景。\n\n## 什么时候动：用 cue，不要猜秒\n\n页面里已经注入了 `window.__cue(scene, 关键词, 默认秒)`，返回该词在这一屏内的相对秒数。所以：\n\n- `start_trigger` 是 `word:关键词` 的节拍，**去掉 `word:` 前缀**，时间写成 `at(cue('s04', '关键词', 1.2))`，不要自己估 `at(0.8)`。\n- `sentence_start` 用 `at(0.05)`；确实没有词的节拍才写显式秒数。\n- 同一屏的动作顺序跟口播一致：先说到的先动；`priority=\"main\"` 的那一拍是该屏的主运动，其余为次级。\n\n## 每屏怎么设计（按 scene_purpose 选配方）\n\n同一屏只允许一个主运动，同一时刻只有一个焦点。次级动作在主运动落定后 80–160ms 跟随。\n\n- `hook`：照片从遮罩里揭示（`clip-path` 或 `scale` 推入），标题在照片落定后 120ms 逐行上浮。\n- `context` / `insight`：照片缓推，文字分层入场（kicker → title → body），必要时 `scrim` 加深。\n- `proof` / `example`：照片横移，数字用 `data-count` 递增，标签逐个亮起，进度/刻度生长。\n- `contrast` / `pain` / `solution`：同一屏两段内容错时出现；照片做一次短促推近或明暗切换来强调转折。\n- `ending` / `summary` / `cta`：照片缓慢拉远（pull-out）或停住，文字收束，最后一拍留 hold。\n- 没有 purpose 的屏按内容自判，但仍只做一个主运动。\n\n## 主运动按 motion_slot 换，禁止「淡入 + 上移」\n\n`group_json.scenes[].motion_slot` 指定了每屏的主运动类别，相邻两屏不能同类：\n\n- `push-in`：图推近（scale 1 → 1.12+）\n- `pan-x`：图横移（scale ≥1.12 后 x ±6%–10%）\n- `mask-reveal`：遮罩揭示（clip-path 从一侧展开，起点至少留 50%）\n- `parallax`：图与文字反向位移，制造纵深\n- `path-draw`：线条、路径、边框生长\n- `state-flip`：A 状态变 B 状态（颜色、位置、形态、选中态）\n- `type-stagger`：文字逐字/逐行重排、字距变化、关键词高亮\n\n**禁止**把 `opacity + y` 当主运动。全片统计里如果 `opacity` 和 `y` 出现次数远多于其他属性，就是没做。文字入场可以带 opacity，但那是次级动作，不是主运动。\n\n## 照片是主运动（这条最重要）\n\n每屏的主运动应该落在照片上，而不是让文字飞来飞去：\n\n- 图片容器是 `[data-anim=\"media\"]`（里面是 `<img>`，`overflow:hidden`），对**它**做变换，不要对 `<img>` 直接做。\n- 主运动按 `image_brief_json` 里这一屏的 `motion_hint` 实现：\n\n| motion_hint | 做法 | 幅度 |\n|---|---|---|\n| `push-in` | `scale: 1 → 1.10~1.18`，同时轻微 `y` 位移 | 收束、强调、靠近结论 |\n| `pull-out` | `scale: 1.16 → 1.02` | 揭示、退开、给出全貌 |\n| `pan-left` / `pan-right` | `x: ±6%~10%`，`scale` 保持 1.12 以上（否则会露边） | 铺陈、扫过环境 |\n| `tilt-up` | `y: +6% → 0`，`scale` 1.10 以上 | 从物件抬到主体 |\n| `reveal` | `clip-path: inset(...)` 从一侧揭示，或遮罩从 0 到满 | 建立、揭晓 |\n| `parallax` | 图片层与文字层反向小位移（图 8%，字 3%） | 空间感 |\n| `hold` | 不做推拉，只做遮罩/文字的轻推进 | 静场、让观众读字 |\n\n- 推拉必须**跨过 1.08 的缩放差**，否则观众看不出来。`1.0 → 1.02` 等于没做。\n- 平移类动作要把 `scale` 提前放大（≥1.12），否则图片边缘会露出画布底色。\n- 遮罩层 `[data-anim=\"scrim\"]` 可以随口播变化透明度（0.2 → 0.55），用来在文字出现时压暗图片、保证可读。这是合法的\"状态变化\"，不是装饰。\n\n## 动作词汇（别只会淡入 + 位移）\n\n一条动作要说清：**什么，从哪里，到哪里，为什么**。每屏至少用两种不同的族，全片至少覆盖五种：\n\n1. **入场/退场**：位移、缩放、遮罩（`clip-path`）、逐字/逐行。\n2. **状态变化**：颜色、描边、数值、进度、选中/展开、标签切换。观众要看到 A 变成 B，不是看到元素飞进来。\n3. **结构变化**：`width/height`、`flex-basis`、`grid-template`、卡片展开成清单、对比合并。\n4. **绘制与生长**：`strokeDashoffset` 画线、遮罩揭示、沿路径移动、粒子聚散。\n5. **空间与景深**：主体前移、背景反向缓移、轻微旋转、缩放推拉。\n6. **文字排版**：逐行/逐字上浮、字距/字重变化、关键词高亮。\n7. **模拟交互**：光标移动、点击、输入、悬停态、页面状态切换。\n\n## 幅度与节奏（看得见，不写死像素）\n\n- 入场要在一眼可见的范围：整块位移不小于元素自身高度的 10%，或缩放跨过 1.08，或遮罩从 0 揭示。**幅度以整屏看得出来为准，不设固定像素上限。**\n- 禁止肉眼无感的微动：`0.95 → 1`、个位数像素位移、只有描边换色——等于没做。\n- 每屏至少 2 次可见变化、至少 1 次状态或结构变化；短屏可以只有 1 次，但要放在中段而不是开头。\n- 每屏结尾留一小段 hold，让观众看完再切。\n- 不要 12 屏同一套动作：全片至少三种不同的开场方式，并复用 `art_direction_json` 里定的母题动作。\n\n## 输出（技术契约）\n\n只输出一段 `<script>`：\n\n```html\n<script>\nwindow.__sceneBuilders.push(function(timeline, at){\n  var cue = function(scene, word, fallback){ return window.__cue ? window.__cue(scene, word, fallback) : fallback; };\n  // 你的动效\n});\n</script>\n```\n\n- 必须立即 `window.__sceneBuilders.push(...)`，不要包 `DOMContentLoaded`、`window.onload`、`setTimeout`。\n- 时间用 `at(秒)`，是该场景内的相对时间；动作结束不超过场景时长。\n- 缓动带长尾，避免线性；动作结束时元素必须停在画布安全区内。\n\n## 禁止「先全空、再揭示」\n\n成片里最常见的废帧就是这一条：图片用 `clip-path` 从 0 开始揭示，揭示时间又落在句子后半段，前面几秒只剩白底和字幕。\n\n- 任何入场动作的 `from` 状态，主体必须**已经部分可见**：`opacity ≥ 0.45`，或 `clip-path` 至少保留 50% 面积，或 `scale ≥ 0.9`。\n- 禁止 `clipPath: \"inset(0% 0% 100% 0%)\"`、`opacity: 0` 这类把主体完全藏起来的起始值。要揭示就写 `inset(0% 0% 62% 0%)` 起步，0.3–0.5 秒内展开。\n- 图片必须在场景开始后 **0.6 秒内**开始入场或已经可见；`cue()` 只用于文字节拍，不要让图片等句子说到一半才出现。\n- 每屏 t=0 时，图片或标题至少有一个已经可见。检查方法：把 `at()` 全部当 0 想一遍，首帧不能是空白。\n\n## 禁止\n\n- **不要写页间转场**：不要对 `[data-scene]` 容器做进出场、不要做淡入淡出交接、不要动背景层——这些是转场脚本节点的职责，重叠会产生冲突。\n- `yoyo`、`repeat`、`repeatDelay`、`repeat:-1` 等循环或往复。\n- `Math.random`、`performance.now`、`requestAnimationFrame`、`setTimeout` 作为时钟。\n- 对 `#stage`、`section` 整屏做缩放或位移（要推镜就对 `[data-anim=\"media\"]` 做，不要对 section 做）。\n- 用 CSS/SVG 补画具象图形来代替照片：画面里没有照片就是场景组的问题，不要在这里补图。\n- 与口播无关的装饰动作。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 9500
        y: 860
      positionAbsolute:
        x: 9500
        y: 860
      sourcePosition: right
      targetPosition: left
      width: 300
      height: 150
    - id: a16_gate
      type: custom
      data:
        type: if-else
        title: A16_批准包门禁
        cases:
        - id: approved
          case_id: approved
          logical_operator: and
          conditions:
          - id: approved-cond
            variable_selector:
            - a16
            - approval_status
            comparison_operator: is
            value: approved
            varType: string
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      sourcePosition: right
      targetPosition: left
      width: 260
      height: 110
    - id: h01d
      type: custom
      data:
        type: llm
        title: H01D_视觉定调
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        prompt_template:
        - id: h01d-system
          role: system
          text: "# 视觉定调\n\n你是这支视频的艺术指导。**风格、色彩、字体、材质、光、版式气质，全部由你决定，没有任何预设风格**。你不写 HTML，只产出\"这支片子长什么样\"的决定，后面的组件、背景、骨架、场景组全部照你的决定执行。\n\n## 输入\n\n- `approved_package_json`：{{#a16.approved_package_json#}}\n- `design_brief`：{{#h00.design_brief#}}\n\n## 你要决定的\n\n1. **一句话视觉隐喻**：这支片子的画面本质是什么。要能一句话讲清，并且能推出后面所有具体选择（例：纸张与墨迹、玻璃与光、旧相册与折痕、仪表盘与刻度）。隐喻不是形容词堆砌，是可执行的结构。\n2. **色彩系统**：主色相、强调色、中性阶、背景基调、文字层级色。给出每个颜色的用途，不只给色值。要说明\"为什么是这个色相\"——它和主题的关系。\n3. **字体与排版气质**：字体栈（只用系统可用中文字体）、字重用法、字号关系（相对关系而不是固定像素档位）、行距与字距倾向、对齐方式、标题断行策略。\n4. **材质与质感**：画面靠什么质感立住（纸纹、噪点、玻璃、雾、金属、织物、光晕、颗粒……）。说明质感出现在哪一层、强度如何、为什么。\n5. **光**：光从哪来、什么色温、有没有方向性、有没有体积感、明暗对比强度、暗角是否存在。\n6. **纵深策略**：画面怎么做出层次——遮挡、景深、前后景差速、投影方向、色阶分离，任你选，但要写清这一屏靠哪一招成立。\n7. **全片节奏**：这支片子在视觉上是\"越来越亮/越来越静/越来越紧\"还是别的走向；哪几屏是重音，哪几屏是留白。\n8. **摄影设定**：这支片子画面里的真实图像靠什么成立——介质（数字/胶片/纪实/显微）、焦段与景深、主光方向与色温、画面色彩倾向、质感（颗粒/雾/湿度）。这是给图像计划节点的唯一依据，写清\"这支片子长什么样\"，不写某一屏拍什么。\n\n## 输出（硬性）\n\n只输出 JSON 对象：第一个字符 `{`，最后一个字符 `}`，不要代码围栏、不要解释。结构：\n\n```json\n{\n  \"art_direction_version\": \"1.0\",\n  \"metaphor\": \"一句话视觉隐喻\",\n  \"metaphor_reading\": \"这个隐喻如何推出后面的具体选择\",\n  \"palette\": {\n    \"base\": \"背景基调色与理由\",\n    \"ink\": {\"primary\": \"主文字色\", \"secondary\": \"次级\", \"muted\": \"弱化\"},\n    \"accent\": {\"color\": \"强调色\", \"usage\": \"什么时候用、用多少\"},\n    \"neutral\": [\"中性阶，从浅到深，每个写用途\"],\n    \"rules\": [\"用色纪律，例如：强调色只给结论和状态变化\"]\n  },\n  \"typography\": {\n    \"stack\": [\"PingFang SC\", \"Noto Sans CJK SC\", \"Microsoft YaHei\"],\n    \"scale_relation\": \"字号之间的关系，例如 1 / 1.35 / 2.1 / 3.4 倍\",\n    \"weights\": {\"headline\": 0, \"body\": 0, \"label\": 0},\n    \"line_height\": {\"tight\": 0, \"normal\": 0},\n    \"letter_spacing\": \"字距倾向\",\n    \"alignment\": \"主对齐方式与例外\",\n    \"title_breaking\": \"长标题怎么断行、禁止什么\"\n  },\n  \"material\": [\n    {\"name\": \"质感名\", \"layer\": \"bg|mid|fg\", \"strength\": \"弱/中/强\", \"why\": \"为什么需要\"}\n  ],\n  \"light\": {\n    \"direction\": \"光的方向\",\n    \"temperature\": \"色温倾向\",\n    \"volume\": \"有没有体积感\",\n    \"contrast\": \"明暗对比强度\",\n    \"vignette\": \"暗角是否存在、强度\"\n  },\n  \"depth_strategy\": {\n    \"primary\": \"主用哪一招做纵深\",\n    \"support\": [\"辅助手段\"],\n    \"per_scene_variation\": \"不同屏之间如何变化而不失控\"\n  },\n  \"rhythm\": {\n    \"arc\": \"全片视觉走向\",\n    \"accents\": [\"哪几屏是重音，理由\"],\n    \"rests\": [\"哪几屏留白，理由\"]\n  },\n  \"tokens\": {\n    \"--color-*\": \"值\",\n    \"--font-*\": \"值\",\n    \"--space-*\": \"值\",\n    \"--radius-*\": \"值\",\n    \"--stroke-*\": \"值\",\n    \"--ease-*\": \"值\",\n    \"--dur-*\": \"值\"\n  },\n  \"image_direction\": {\n    \"medium\": \"摄影介质与理由\",\n    \"optics\": \"焦段倾向、光圈与景深\",\n    \"light\": \"主光方向、色温、对比强度\",\n    \"palette_in_image\": \"画面色彩倾向，与 palette 对齐\",\n    \"texture\": \"颗粒、雾、湿度、材质\",\n    \"consistency\": [\"每张图都要遵守的一致性锚点\"],\n    \"avoid\": [\"画面里禁止出现的东西\"]\n  },\n  \"forbidden\": [\"本片不要出现的东西，写具体\"]\n}\n```\n\n## 纪律\n\n- 不套用任何默认模板：不要默认\"卡片 + 圆角 + 阴影\"，不要默认\"淡入上浮\"，不要默认\"米色纸感\"。先由隐喻推导，再决定用不用。\n- 同一条视频内自洽：色彩、字体、材质、光、纵深必须互相支撑，不能各说各话。\n- 具体数值只写进 `tokens`，正文里写关系和意图，方便下游复用。\n- **字号一律写 px，不要用 rem**：画布固定 1080×1920，不需要响应式。参考档位：主标题 88–110px、次标题 64–80px、正文 36–44px、标签 26–32px。标题低于 72px 在手机上看不清。\n- 不写 HTML、不写 CSS 规则、不写 GSAP。\n- 主题决定气质：纪念类不等于\"必须低饱和米色\"，也不等于\"必须有光晕\"，你按这次的内容判断。\n- 画面里的**真实图像**由 `image_direction` 决定，后面的图像计划节点照它生成每一屏的照片；HTML 只负责文字、动效和背景。所以 `image_direction` 必须具体到能拍出来，不能只有\"高级感\"\"电影感\"这类形容词。\n- `image_direction` 与 `palette`、`light`、`material` 必须互相一致：不要定一套暖纸感排版，却让画面是冷蓝夜景。\n- 留白是结构，不是空白：`rhythm.rests` 里写\"留白\"的屏，指的是内容少但有重心的屏，不是大片无信息的深色区域。定调时把\"内容少时靠什么撑住画面\"（居中、间距、图片本身、一个视觉锚）写进 `depth_strategy` 或 `rhythm`。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 8000
        y: 380
      positionAbsolute:
        x: 8000
        y: 380
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 168
    - id: h01p
      type: custom
      data:
        type: llm
        title: H01P_图像计划
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        prompt_template:
        - id: h01p-system
          role: system
          text: "# 图像计划\n\n你是这支视频的**摄影指导**。视觉定调已经定了隐喻、色彩、材质和光；画面里的**真实图像**由你出计划：每一屏拍什么、怎么拍、给文字留哪块地方。下游会用 GPT Image API 按你的 prompt 逐张生成照片，场景组只负责把图放进版面、把文字和动效叠上去。\n\n你**不写 HTML、不写 CSS、不写 GSAP**，只输出图像计划 JSON。\n\n## 输入\n\n- `approved_package_json`：{{#a16.approved_package_json#}}\n- `art_direction_json`：{{#h01d.text#}}\n- `design_brief`：{{#h00.design_brief#}}\n\n## 先定死一件事：这支片子用什么镜头语言\n\n在写任何单张之前，先给出**全片统一的摄影设定**，写进 `prompt_prefix`。它会被逐字拼到每张 prompt 前面，是画面一致性的唯一来源。必须包含：\n\n1. **介质**：数字电影 / 35mm 胶片 / 大画幅 / 手机纪实 / 监控感 / 显微。选一种，全片不许换。\n2. **光学**：焦段倾向（如 35mm 环境人像、85mm 压缩、100mm 微距）、光圈与景深（f/1.4 极浅景深 / f/8 全清晰）、是否有眩光与畸变。\n3. **光**：单一主光源方向与色温、补光比例、对比强度、有没有实用光源（窗、台灯、屏幕）。\n4. **色彩**：与 `art_direction_json.palette` 一致的色相与饱和倾向，暗部偏什么色。\n5. **质感**：颗粒、雾、灰尘、湿度、织物纹理，出现强度。\n6. **纪律句**：每张都必须遵守的两三条硬约束（主体不贴边、画面里不出现任何文字、单一光源、无拼贴）。\n\n`prompt_prefix` 用**英文**写，60–120 词，是可直接给图像模型用的句子，不是中文说明。\n\n## 每一屏配一张图\n\n`approved_package_json.storyboard.scenes` 里每个 `scene_id` 都要在 `images` 里出现，一条都不许漏。这是硬要求：下游每一屏都要有真实图像承担主视觉。\n\n- `role` 四选一：\n  - `full`：满屏底图，文字压在上面（最常用）。\n  - `inset`：局部图，占屏 40%–70%，另一半留给文字。\n  - `portrait`：人物或物件特写，做一个视觉锚。\n  - `texture`：材质/环境底纹，用于纯文字屏和转场屏。\n- `size`：竖屏满图用 `1024x1536`；局部横图用 `1536x1024`；方形特写用 `1024x1024`。画布是 1080×1920，满图会被裁掉左右约 16%，所以**主体必须留在画面中间 68% 的安全宽度里**。\n- `text_safe_zone`：这一屏文字压在图的哪一侧，写 `top` / `bottom` / `left` / `right` / `center`。构图必须真的给那边留空（天空、墙面、虚焦、暗部），不能只是\"稍微空一点\"。\n- `motion_hint`：这一屏的镜头运动方向，`push-in` / `pull-out` / `pan-left` / `pan-right` / `tilt-up` / `reveal` / `parallax` / `hold`。动效节点会照它做图层的推拉与遮罩，所以要和内容情绪一致：结论推近、铺陈横移、收尾缓拉。\n\n## 怎么写单张 prompt\n\n- 用**英文**写，40–90 词，描述\"画面里有什么 + 光怎么打 + 相机在哪 + 什么质感\"。不要写情绪形容词堆砌。\n- 同一张还要给一条**中文版** `prompt_zh`，30–80 字，是英文那条的等价说法，不是翻译腔也不是另写一个画面。手动出图时（即梦等网页端）直接复制这一条。\n- 只写**这一张能看见的东西**。不要写\"表达思念\"这种意图，要写\"一把空椅子对着亮着的窗，午后侧光，地板有长影子\"。\n- 一张图只讲一个视觉事实。要讲两个信息就拆成两张，不要塞进一张。\n- 具体到可以被拍出来：物件、材质、位置、光的方向、景深、天气、时间。\n- 允许抽象与隐喻，但必须是**可拍摄的现实场景**，不是插画、不是拼贴、不是三维渲染图。\n- **画面里不许出现任何文字、字母、数字、logo、水印、界面元素**。要出现\"纸\"\"书\"\"屏幕\"时，写清是空白纸、虚焦屏幕、背面。\n- **不出现可识别的真人正脸**。需要人时用背影、手、局部、剪影、虚焦、远景。纪念、医疗、家庭这类主题尤其如此。\n- 不要每屏换一个世界：同一支片子的场景应该在同一个\"地方\"里，靠机位、光线、景别变化推进。\n\n## 输出（硬性）\n\n只输出 JSON 对象：第一个字符 `{`，最后一个 `}`，不要代码围栏、不要解释。\n\n```json\n{\n  \"image_plan_version\": \"1.0\",\n  \"prompt_prefix\": \"English style prefix, 60-120 words, identical for every image\",\n  \"style_bible\": {\n    \"medium\": \"介质与理由\",\n    \"optics\": \"焦段、光圈、景深\",\n    \"lighting\": \"主光方向、色温、对比\",\n    \"palette\": \"色彩倾向，与 art_direction 对齐\",\n    \"texture\": \"颗粒、雾、湿度、材质\",\n    \"consistency_rules\": [\"每张都要遵守的锚点\"],\n    \"avoid\": [\"全片禁止出现的东西\"]\n  },\n  \"images\": [\n    {\n      \"id\": \"s01\",\n      \"scene_id\": \"s01\",\n      \"role\": \"full\",\n      \"subject\": \"中文一句话：这张画面里是什么\",\n      \"prompt\": \"English prompt for this single frame\",\n      \"prompt_zh\": \"同一张画面的中文提示词，可直接粘进即梦/豆包\",\n      \"negative\": \"English, what must not appear\",\n      \"size\": \"1024x1536\",\n      \"text_safe_zone\": \"bottom\",\n      \"motion_hint\": \"push-in\"\n    }\n  ],\n  \"coverage\": {\n    \"scene_count\": 0,\n    \"image_count\": 0,\n    \"notes\": \"如果有哪一屏确实只能用同构延续，写在这里\"\n  }\n}\n```\n\n## 纪律\n\n- `images` 的 `scene_id` 集合必须**等于** `storyboard.scenes` 的 `scene_id` 集合，顺序一致，不多不少。\n- 每张 `prompt` 都必须能独立使用：不要把\"同上\"\"延续上一张\"写进 prompt。\n- `prompt_zh` 与 `prompt` 必须描述同一张画面：主体、光、景别、构图一致。两条都写不出画面就说明这张还没想清楚。\n- `prompt_prefix` 里不要出现具体某一张的内容，只写全片通用的摄影设定。\n- 不写 HTML、CSS、GSAP、组件、字幕。\n- 不承诺画面里会出现文字：所有文字由 HTML 叠上去。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 8060
        y: 640
      positionAbsolute:
        x: 8060
        y: 640
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 168
    - id: h01pv
      type: custom
      data:
        type: code
        title: H01PV_整理图像计划
        code_language: python3
        code: "def main(image_plan_text: str, approved_package_json: str) -> dict:\n    \"\"\"归一化图像计划：保证每个分镜都有图，字段合法，并拆出给 HTML 节点用的精简版。\"\"\"\n    import json\n    import re\n\n    warnings = []\n    raw = str(image_plan_text or \"\").strip()\n    raw = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.I)\n    plan = None\n    if raw:\n        try:\n            plan = json.loads(raw)\n        except Exception as error:\n            start = raw.find(\"{\")\n            if start >= 0:\n                for index in range(len(raw) - 1, start, -1):\n                    if raw[index] != \"}\":\n                        continue\n                    candidate = re.sub(r\",\\s*([}\\]])\", r\"\\1\", raw[start:index + 1])\n                    try:\n                        plan = json.loads(candidate)\n                        break\n                    except Exception:\n                        continue\n            if plan is None:\n                warnings.append(\"图像计划 JSON 无法解析（%s）\" % str(error)[:60])\n    if not isinstance(plan, dict):\n        plan = {}\n\n    try:\n        package = json.loads(approved_package_json or \"{}\")\n    except Exception:\n        package = {}\n    storyboard = package.get(\"storyboard\") if isinstance(package.get(\"storyboard\"), dict) else {}\n    scenes = [item for item in (storyboard.get(\"scenes\") or []) if isinstance(item, dict)]\n\n    allowed_roles = {\"full\", \"inset\", \"portrait\", \"texture\"}\n    allowed_sizes = {\"1024x1536\", \"1536x1024\", \"1024x1024\"}\n    allowed_motion = {\"push-in\", \"pull-out\", \"pan-left\", \"pan-right\", \"tilt-up\", \"reveal\", \"parallax\", \"hold\"}\n    allowed_zones = {\"top\", \"bottom\", \"left\", \"right\", \"center\"}\n\n    items = plan.get(\"images\") if isinstance(plan.get(\"images\"), list) else []\n    by_scene = {}\n    cleaned = []\n    used_ids = set()\n    for index, item in enumerate(items):\n        if not isinstance(item, dict):\n            continue\n        scene_id = str(item.get(\"scene_id\") or \"\").strip()\n        image_id = str(item.get(\"id\") or scene_id or \"img%02d\" % (index + 1)).strip()\n        image_id = re.sub(r\"[^A-Za-z0-9_-]\", \"\", image_id) or \"img%02d\" % (index + 1)\n        while image_id in used_ids:\n            image_id += \"_b\"\n        used_ids.add(image_id)\n        role = str(item.get(\"role\") or \"full\").strip().lower()\n        if role not in allowed_roles:\n            warnings.append(\"%s role=%s 已归一化为 full\" % (image_id, role))\n            role = \"full\"\n        size = str(item.get(\"size\") or \"\").strip().lower()\n        if size not in allowed_sizes:\n            size = \"1536x1024\" if role == \"inset\" else \"1024x1536\"\n        zone = str(item.get(\"text_safe_zone\") or \"\").strip().lower()\n        if zone not in allowed_zones:\n            zone = \"bottom\"\n        motion = str(item.get(\"motion_hint\") or \"\").strip().lower()\n        if motion not in allowed_motion:\n            motion = \"hold\"\n        prompt = str(item.get(\"prompt\") or \"\").strip()\n        subject = str(item.get(\"subject\") or \"\").strip()\n        if not prompt:\n            warnings.append(\"%s 没有 prompt，已用兜底镜头补上\" % image_id)\n            prompt = (\n                \"A quiet, empty interior consistent with the film's established look, \"\n                \"soft directional daylight from one side, shallow depth of field, \"\n                \"generous negative space, photographic, no people's faces.\"\n            )\n        entry = {\n            \"id\": image_id,\n            \"scene_id\": scene_id or image_id,\n            \"role\": role,\n            \"subject\": subject,\n            \"prompt\": prompt,\n            \"prompt_zh\": str(item.get(\"prompt_zh\") or \"\").strip(),\n            \"negative\": str(item.get(\"negative\") or \"\").strip(),\n            \"size\": size,\n            \"text_safe_zone\": zone,\n            \"motion_hint\": motion,\n        }\n        cleaned.append(entry)\n        if scene_id and scene_id not in by_scene:\n            by_scene[scene_id] = entry\n\n    prefix = str(plan.get(\"prompt_prefix\") or \"\").strip()\n    if not prefix:\n        warnings.append(\"图像计划没有 prompt_prefix：每张图的风格一致性没有统一来源\")\n\n    # 每个分镜必须有图：缺的按场景内容补一张兜底镜头，不让 HTML 出现空屏。\n    scene_ids = [str(scene.get(\"scene_id\") or \"\").strip() for scene in scenes]\n    missing = []\n    for index, scene in enumerate(scenes):\n        scene_id = str(scene.get(\"scene_id\") or \"\").strip()\n        if not scene_id or scene_id in by_scene:\n            continue\n        missing.append(scene_id)\n        brief = str(scene.get(\"visual_brief\") or scene.get(\"on_screen_text\") or \"\").strip()[:60]\n        entry = {\n            \"id\": scene_id,\n            \"scene_id\": scene_id,\n            \"role\": \"full\",\n            \"subject\": brief or \"按分镜补的兜底镜头\",\n            \"prompt\": (\n                \"A quiet photographic scene that supports this beat: %s. \"\n                \"Soft single-source daylight, shallow depth of field, generous negative space, \"\n                \"no text, no faces.\" % (brief or \"an empty room with light falling across it\")\n            ),\n            \"prompt_zh\": \"安静的现实场景，单一光源，浅景深，给文字留出空白。%s\" % (brief or \"\"),\n            \"negative\": \"\",\n            \"size\": \"1024x1536\",\n            \"text_safe_zone\": \"bottom\",\n            \"motion_hint\": \"push-in\",\n        }\n        cleaned.append(entry)\n        by_scene[scene_id] = entry\n    if missing:\n        warnings.append(\"这些分镜没有配图，已补兜底镜头：\" + \"、\".join(missing[:8]))\n\n    extra = [entry[\"scene_id\"] for entry in cleaned if entry[\"scene_id\"] and entry[\"scene_id\"] not in scene_ids]\n    if extra:\n        warnings.append(\"图像计划里有分镜之外的多余图片（下游不会用）：\" + \"、\".join(sorted(set(extra))[:8]))\n\n    style_bible = plan.get(\"style_bible\") if isinstance(plan.get(\"style_bible\"), dict) else {}\n    coverage = plan.get(\"coverage\") if isinstance(plan.get(\"coverage\"), dict) else {}\n    full_plan = {\n        \"image_plan_version\": plan.get(\"image_plan_version\") or \"1.0\",\n        \"prompt_prefix\": prefix,\n        \"style_bible\": style_bible,\n        \"images\": cleaned,\n        \"coverage\": {\n            \"scene_count\": len(scenes),\n            \"image_count\": len(cleaned),\n            \"notes\": str(coverage.get(\"notes\") or \"\"),\n        },\n    }\n    brief_items = [{\n        \"id\": entry[\"id\"],\n        \"scene_id\": entry[\"scene_id\"],\n        \"role\": entry[\"role\"],\n        \"size\": entry[\"size\"],\n        \"text_safe_zone\": entry[\"text_safe_zone\"],\n        \"motion_hint\": entry[\"motion_hint\"],\n        \"subject\": entry[\"subject\"][:60],\n    } for entry in cleaned]\n\n    return {\n        \"image_plan_json\": json.dumps(full_plan, ensure_ascii=False),\n        \"image_brief_json\": json.dumps({\n            \"prompt_prefix\": prefix,\n            \"style_bible\": {key: style_bible.get(key) for key in (\"medium\", \"optics\", \"lighting\", \"palette\", \"texture\", \"avoid\")},\n            \"images\": brief_items,\n        }, ensure_ascii=False),\n        \"image_count\": len(cleaned),\n        \"image_valid\": bool(cleaned) and len(missing) == 0,\n        \"image_warnings_json\": json.dumps(warnings, ensure_ascii=False),\n    }\n"
        variables:
