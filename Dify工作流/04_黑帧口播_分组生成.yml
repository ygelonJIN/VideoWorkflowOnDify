    - id: s2n
      type: custom
      data:
        type: code
        title: S2N_归一
        code_language: python3
        code: "def main(spec_text: str, package_json: str, catalog_json: str) -> dict:\n    \"\"\"S2 归一：把全片规格对齐到分镜、校验编号与槽位数、拆出本地要用的几份产物。\n\n    只做机械校验：屏必须对齐、编号必须在目录里、槽位条数必须对得上。\n    对不上就记 errors（S2 重写），不替模型编内容。\n    \"\"\"\n    import json\n    import re\n\n    def parse(raw):\n        text = str(raw or \"\").strip()\n        text = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", text, flags=re.I)\n        try:\n            return json.loads(text)\n        except Exception:\n            start, end = text.find(\"{\"), text.rfind(\"}\")\n            if 0 <= start < end:\n                try:\n                    return json.loads(text[start:end + 1])\n                except Exception:\n                    pass\n        return {}\n\n    def num(value, default=0.0):\n        try:\n            return float(value)\n        except Exception:\n            return default\n\n    package = parse(package_json)\n    catalog = parse(catalog_json)\n    data = parse(spec_text)\n    errors, warnings = [], []\n\n    storyboard = package.get(\"storyboard\") if isinstance(package.get(\"storyboard\"), dict) else {}\n    scenes = [s for s in (storyboard.get(\"scenes\") or []) if isinstance(s, dict)]\n    if not scenes:\n        return {\"specs_json\": \"[]\", \"image_plan_json\": \"{}\", \"s2_valid\": False,\n                \"s2_errors_json\": json.dumps([\"缺少分镜：S1 没有产出 scenes\"], ensure_ascii=False),\n                \"s2_warnings_json\": \"[]\", \"scene_count\": 0, \"ledger_json\": \"{}\"}\n\n    bg_cards = catalog.get(\"background\") if isinstance(catalog.get(\"background\"), dict) else {}\n    comp_cards = catalog.get(\"component\") if isinstance(catalog.get(\"component\"), dict) else {}\n    pt_cards = catalog.get(\"page_transition\") if isinstance(catalog.get(\"page_transition\"), dict) else {}\n    motion = catalog.get(\"motion\") if isinstance(catalog.get(\"motion\"), dict) else {}\n\n    specs = {}\n    for item in (data.get(\"scenes\") or []):\n        if isinstance(item, dict) and str(item.get(\"scene_id\") or \"\").strip():\n            specs[str(item[\"scene_id\"]).strip()] = item\n\n    ROLE_SIZES = {\"band\": \"1536x1024\", \"inset\": \"1536x1024\", \"portrait\": \"1536x1024\",\n                  \"thumb\": \"1536x1024\", \"texture\": \"1024x1536\", \"html\": \"\"}\n    TEXT_ROLES = {\"title\", \"lead\", \"body\", \"note\", \"num\", \"label\", \"accent\"}\n    ALLOWED_MOTION = {\"push-in\", \"pull-out\", \"pan-left\", \"pan-right\", \"tilt-up\", \"reveal\", \"parallax\", \"hold\"}\n    allowed_presets = set()\n    for group in motion.values():\n        if isinstance(group, list):\n            allowed_presets.update(str(x).upper() for x in group)\n\n    ordered, images = [], []\n    for index, scene in enumerate(scenes, 1):\n        sid = str(scene.get(\"scene_id\") or \"s%02d\" % index).strip()\n        spec = specs.get(sid)\n        if not isinstance(spec, dict):\n            errors.append(\"%s 没有分镜规格\" % sid)\n            continue\n        bg = str(spec.get(\"bg\") or \"\").strip().upper()\n        if bg not in bg_cards:\n            warnings.append(\"%s 的背景 %s 不在目录里，已丢弃\" % (sid, bg or \"?\"))\n            bg = next(iter(bg_cards), \"B26\")\n        copy_items = []\n        for item in (spec.get(\"copy\") or []):\n            if not isinstance(item, dict):\n                continue\n            role = str(item.get(\"role\") or \"\").strip()\n            text = str(item.get(\"text\") or \"\").strip()\n            if role not in TEXT_ROLES or not text:\n                continue\n            copy_items.append({\"role\": role, \"text\": text, \"beat\": str(item.get(\"beat\") or \"\").strip()})\n        if not any(item[\"role\"] == \"title\" for item in copy_items):\n            errors.append(\"%s 没有 title（漏写 title 视为不合格）\" % sid)\n        components = []\n        for item in (spec.get(\"components\") or [])[:2]:\n            if not isinstance(item, dict):\n                continue\n            cid = str(item.get(\"id\") or \"\").strip().upper()\n            card = comp_cards.get(cid)\n            if not card:\n                warnings.append(\"%s 的组件 %s 不在目录里，已丢弃\" % (sid, cid or \"?\"))\n                continue\n            texts = [str(x) for x in (item.get(\"texts\") or [])]\n            need = int(card.get(\"before\") or 0) + int(card.get(\"row\") or 0) * int(item.get(\"rows\") or card.get(\"rows_default\") or 1) + int(card.get(\"after\") or 0)\n            if len(texts) < need:\n                warnings.append(\"%s 的 %s 槽位不足（%d/%d），已补齐空串\" % (sid, cid, len(texts), need))\n                texts += [\"\"] * (need - len(texts))\n            components.append({\"id\": cid, \"anim\": str(item.get(\"anim\") or \"\").strip() or \"comp\", \"texts\": texts})\n        if len(components) < 1:\n            warnings.append(\"%s 没有可用组件（视觉锚缺失）\" % sid)\n        media = spec.get(\"media\") if isinstance(spec.get(\"media\"), dict) else None\n        role = str((media or {}).get(\"role\") or \"\").strip().lower()\n        visual = \"photo\" if media and role in ROLE_SIZES and role != \"html\" else \"html\"\n        media_out = None\n        if visual == \"photo\":\n            media_out = {\n                \"role\": role if role in (\"band\", \"inset\", \"portrait\", \"thumb\", \"texture\") else \"band\",\n                \"prompt\": str(media.get(\"prompt\") or \"\").strip(),\n                \"prompt_zh\": str(media.get(\"prompt_zh\") or \"\").strip(),\n                \"negative\": str(media.get(\"negative\") or \"\").strip(),\n                \"motion_hint\": str(media.get(\"motion_hint\") or \"reveal\").strip().lower(),\n            }\n            if media_out[\"motion_hint\"] not in ALLOWED_MOTION:\n                media_out[\"motion_hint\"] = \"reveal\"\n            if not media_out[\"prompt\"]:\n                warnings.append(\"%s 声明了照片但没有 prompt\" % sid)\n            images.append({\n                \"id\": sid, \"scene_id\": sid, \"role\": media_out[\"role\"],\n                \"subject\": str(media.get(\"subject\") or copy_items[0][\"text\"] if copy_items else \"\"),\n                \"why\": str(media.get(\"why\") or \"\"),\n                \"prompt\": media_out[\"prompt\"], \"prompt_zh\": media_out[\"prompt_zh\"],\n                \"negative\": media_out[\"negative\"], \"size\": ROLE_SIZES[media_out[\"role\"]],\n                \"text_safe_zone\": \"bottom\", \"motion_hint\": media_out[\"motion_hint\"],\n            })\n        motions = []\n        raw_motions = spec.get(\"motions\")\n        if not isinstance(raw_motions, list) or not raw_motions:\n            warnings.append(\"%s 没有任何动效：S2 必须给每个内容元素一条入场 + 至少一条状态\" % sid)\n        for item in (raw_motions or []):\n            if not isinstance(item, dict):\n                continue\n            preset = str(item.get(\"preset\") or \"\").strip().upper()\n            if preset not in allowed_presets:\n                warnings.append(\"%s 的动效 %s 不在目录里，已丢弃\" % (sid, preset or \"?\"))\n                continue\n            target = str(item.get(\"target\") or \"\").strip()\n            if target not in {c[\"role\"] for c in copy_items} and target not in {c[\"anim\"] for c in components} and target != \"media\":\n                warnings.append(\"%s 的动效目标 %s 不在本屏，已丢弃\" % (sid, target or \"?\"))\n                continue\n            motions.append({\"preset\": preset, \"target\": target,\n                            \"trigger\": str(item.get(\"trigger\") or \"sentence_start\").strip(),\n                            \"fallback\": num(item.get(\"fallback\"), 0.4),\n                            \"params\": item.get(\"params\") if isinstance(item.get(\"params\"), dict) else {}})\n        transition = spec.get(\"transition\") if isinstance(spec.get(\"transition\"), dict) else {}\n        pt = str(transition.get(\"pt\") or \"\").strip().upper()\n        if pt and pt not in pt_cards:\n            warnings.append(\"%s 的转场 %s 不在目录里，改用 PT02\" % (sid, pt))\n            pt = \"PT02\"\n        duration = max(0.3, min(0.65, num(transition.get(\"duration_ms\"), 450) / 1000.0)) if pt else 0.0\n        ordered.append({\n            \"scene_id\": sid, \"bg\": bg, \"visual\": visual, \"media\": media_out,\n            \"copy\": copy_items, \"components\": components, \"motions\": motions,\n            \"transition\": {\"pt\": pt, \"kind\": str(pt_cards.get(pt, {}).get(\"kind\") or \"\"), \"duration\": duration} if pt else None,\n        })\n\n    if len(ordered) != len(scenes):\n        errors.append(\"有效规格 %d 屏，分镜 %d 屏，对不上\" % (len(ordered), len(scenes)))\n\n    # 时长账本：给 S2 下一轮/诊断用\n    ledger = [{\"scene_id\": s.get(\"scene_id\"), \"duration\": round(float(s.get(\"estimated_end_seconds\") or 0) - float(s.get(\"estimated_start_seconds\") or 0), 2),\n               \"voiceover\": str(s.get(\"voiceover_text\") or \"\")} for s in scenes]\n    image_plan = {\n        \"image_plan_version\": \"2.0\",\n        \"prompt_prefix\": str(package.get(\"brief\", {}).get(\"visual_prefix\") or \"\"),\n        \"style_bible\": {},\n        \"images\": images,\n        \"coverage\": {\"scene_count\": len(ordered), \"photo_count\": len(images), \"html_count\": len(ordered) - len(images),\n                     \"role_mix\": {}},\n    }\n    coverage = {}\n    for item in images:\n        coverage[item[\"role\"]] = coverage.get(item[\"role\"], 0) + 1\n    image_plan[\"coverage\"][\"role_mix\"] = coverage\n    return {\n        \"specs_json\": json.dumps(ordered, ensure_ascii=False),\n        \"image_plan_json\": json.dumps(image_plan, ensure_ascii=False),\n        \"image_brief_json\": json.dumps({\"images\": [{\"id\": i[\"id\"], \"scene_id\": i[\"scene_id\"], \"role\": i[\"role\"], \"size\": i[\"size\"]} for i in images]}, ensure_ascii=False),\n        \"ledger_json\": json.dumps(ledger, ensure_ascii=False),\n        \"scene_count\": len(ordered),\n        \"s2_valid\": not errors,\n        \"s2_errors_json\": json.dumps(errors, ensure_ascii=False),\n        \"s2_warnings_json\": json.dumps(warnings, ensure_ascii=False),\n    }\n"
        variables:
        - variable: spec_text
          value_selector:
          - s2
          - text
          value_type: string
        - variable: package_json
          value_selector:
          - s1n
          - package_json
          value_type: string
        - variable: catalog_json
          value_selector:
          - h00
          - catalog_json
          value_type: string
        outputs:
          specs_json:
            type: string
            children: null
          image_plan_json:
            type: string
            children: null
          image_brief_json:
            type: string
            children: null
          ledger_json:
            type: string
            children: null
          scene_count:
            type: number
            children: null
          s2_valid:
            type: boolean
            children: null
          s2_errors_json:
            type: string
            children: null
          s2_warnings_json:
            type: string
            children: null
