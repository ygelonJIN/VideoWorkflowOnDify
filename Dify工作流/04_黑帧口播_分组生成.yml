    - id: rep
      type: custom
      data:
        type: code
        title: PC_生产资料报告
        code_language: python3
        code: "def main(package_json: str, s1_warnings_json: str = \"\", s2_warnings_json: str = \"\", merge_warnings_json: str = \"\", motion_report_json: str = \"\") -> dict:\n    \"\"\"人读的生产资料报告：主题、口播、分镜、图片计划、各段警告。\"\"\"\n    import json\n\n    def arr(raw):\n        try:\n            value = json.loads(raw or \"[]\")\n            return value if isinstance(value, list) else []\n        except Exception:\n            return []\n\n    package = json.loads(package_json or \"{}\")\n    brief = package.get(\"brief\") if isinstance(package.get(\"brief\"), dict) else {}\n    script = package.get(\"approved_script\") if isinstance(package.get(\"approved_script\"), dict) else {}\n    storyboard = package.get(\"storyboard\") if isinstance(package.get(\"storyboard\"), dict) else {}\n    lines = [\"# 视频内容生产资料\", \"\", \"- 主题：%s\" % brief.get(\"topic\", \"\"),\n             \"- 主张：%s\" % brief.get(\"thesis\", \"\"), \"\", \"## 口播全文\", str(script.get(\"voiceover_script\") or \"\"), \"\", \"## 分镜\"]\n    for index, scene in enumerate(storyboard.get(\"scenes\") or [], 1):\n        if isinstance(scene, dict):\n            lines.append(\"%d. %s｜%s\" % (index, scene.get(\"scene_id\", \"\"), scene.get(\"voiceover_text\", \"\")))\n    try:\n        motion = json.loads(motion_report_json or \"{}\")\n    except Exception:\n        motion = {}\n    used = sum(len(v) for v in (motion.get(\"used\") or {}).values())\n    skipped = sum(len(v) for v in (motion.get(\"skipped\") or {}).values())\n    lines.extend([\"\", \"## 动效\", \"- 展开成功 %d 条，跳过 %d 条\" % (used, skipped)])\n    for sid, items in (motion.get(\"skipped\") or {}).items():\n        if items:\n            lines.append(\"- %s 跳过：%s\" % (sid, \"、\".join(str(x) for x in items)))\n\n    for label, raw in ((\"S1\", s1_warnings_json), (\"S2\", s2_warnings_json), (\"合并\", merge_warnings_json)):\n        items = arr(raw)\n        if items:\n            lines.extend([\"\", \"## %s 警告\" % label])\n            lines.extend(\"- \" + str(item) for item in items)\n    return {\"result_summary\": \"\\n\".join(lines)}\n"
