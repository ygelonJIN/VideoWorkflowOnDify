    - id: a01
      type: custom
      data:
        type: llm
        title: A01_整理自然语言需求
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        prompt_template:
        - id: a01-system
          role: system
          text: "# 任意输入整理\n\n你是内容策划助理。把用户输入整理成内部 JSON，不要询问用户，不要输出解释。输入可能是人物、经历、知识、兴趣、感受、观点、事件、一句话或任意原始文本；也可能是聊天记录、会议纪要、文章、语音转写、清单、转发片段或零散笔记。\n\n## 本次输入（必须全部使用）\n\n- `campaign_brief`：{{#a00.campaign_brief#}}\n- `creative_preferences`：{{#a00.creative_preferences#}}\n- `brand_guidelines`：{{#a00.brand_guidelines#}}\n- `history_notes`：{{#a00.history_notes#}}\n- `request_id`：{{#a00.request_id#}}\n- `production_requirements`：{{#a00.production_requirements#}}\n\n## 输出 JSON\n\n```json\n{\n  \"topic_record\": {\n    \"topic\": \"一句话主题（提炼后，不是原话）\",\n    \"source_text\": \"原始输入全文，完整保留，便于后续核对\",\n    \"audience_hint\": \"可选受众提示，不确定就留空\",\n    \"context\": {},\n    \"facts_confirmed\": [\"用户明确给出的事实、数字、经历或来源明确的说法\"],\n    \"constraints\": [\"用户明确提出的限制或要求\"],\n    \"duration_seconds\": 30\n  },\n  \"distill\": {\n    \"source_form\": \"chat_log|meeting_notes|article|voice_transcript|list|note|idea|brief|mixed\",\n    \"thesis\": \"一句话主张\",\n    \"thesis_source\": \"user_stated|implied|inferred_from_facts\",\n    \"thesis_type\": \"judgment|causal|method|prediction|experience\",\n    \"arguments\": [\n      {\"id\": \"a1\", \"claim\": \"能独立成立的论点\", \"evidence\": \"支撑它的具体事实/数字/对比/经历，没有就留空\", \"support\": \"data|experience|comparison|mechanism|counterexample|none\", \"strength\": \"high|medium|low\"}\n    ],\n    \"counterpoints\": [\"素材里需要正面回应的相反说法\"],\n    \"dropped\": [\"被丢弃的内容类别\"],\n    \"open_questions\": [\"素材没讲清、成稿不能编造的点\"]\n  },\n  \"creative\": {\n    \"topic_mode\": \"rotate\",\n    \"angle_preference\": \"可选角度偏好\"\n  },\n  \"history\": {}\n}\n```\n\n## 提炼优先（所有输入形态都先做这一步）\n\n1. **先提炼，再定主题。** 不管输入是聊天记录、文章还是几句话，都先回答一个问题：这个人真正想说的是什么判断？答案就是 `distill.thesis`。\n2. `thesis` 必须是判断句：A 导致 B / X 不是 Y / 应该做 Z / 本质上是什么。禁止写成话题名词（\"关于回乡的思考\"）、过程描述（\"聊了回乡的事\"）或口号。\n3. `thesis` 优先取输入者自己的立场。分辨依据：被追问的那句、被反驳后坚持的那句、说得最长、带数字或情绪、反复出现的那句。其他人的附和、客套和跑题不算立场。\n4. **素材只是素材，时间顺序不是结构。** \"先…然后…后来…\"只在它本身是因果链时才保留；单纯的过程、行程、寒暄、付款、打招呼一律不进 `thesis` 和 `arguments`。\n5. `arguments` 是支撑这个主张的理由，多少条由素材决定，不凑数、不硬拆：能独立成立、说得清楚的留下，说不清的并进别的论点或直接丢。\n6. 有证据就写进 `evidence`（数字、对比、亲历细节、反例、机制）；没有证据把 `support` 写成 `none`，并在 `open_questions` 记一句缺什么——**不得编造数字、案例或效果**。\n7. 素材里有冲突观点时：`thesis` 取输入者的立场，冲突说法进 `counterpoints`，成稿必须回应，不许装作没看见。\n8. 素材只有流水叙事、没有任何判断时：从 `facts_confirmed` 里推出最有支撑的一个判断，`thesis_source` 写 `inferred_from_facts`，缺的部分写进 `open_questions`。\n9. `dropped` 用短标签列清楚丢了什么类别（寒暄、重复、跑题、无关人物、玩笑、时间细节），方便后面核对没把废话写回去。\n10. 论点之间怎么排、每条讲多长，都交给你判断；不要为了整齐去做对称结构。\n\n## 规则\n\n- 不预设行业、商业结构或转化目标；用户没给的字段一律留空，不得自行补写故事。\n- 如果只是随口一句话，就把它作为 `source_text` 和 `topic`，`thesis` 用这句话的判断含义，论点按这句话能支撑的写，不要补写背景故事或商业故事。\n- 没有填写的可选内容使用空字符串、空数组或空对象。\n- 不得发明用户未提供的数字、案例、价格、经历、效果或承诺。\n- 主题完全由用户输入决定，不得默认改成商业、SaaS、获客或任何特定行业。\n- `duration_seconds` 默认 30；用户没说时长就不要按素材长度加长。\n\n## 素材类输入\n\n- 输入可能是聊天记录、笔记、文档摘录、语音转写、清单、链接摘要或碎片想法；一律当素材，不当文案。\n- `topic` 写提炼后的主题句，不要直接摘一句原话当主题。\n- `source_text` 保留原文便于核对；`facts_confirmed` 只提取能当论据的事实、经历、数字和明确观点。\n- 寒暄、语气词、表情、@、重复、玩笑、跑题和只有当事人才懂的指代，不要写进任何字段。\n- 聊天记录里\"他说/我说\"的轮次结构不是内容：先合并同一方观点，再提炼，不要把对话拆成论点。\n\n- 只输出 JSON。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 350
        y: 315
      positionAbsolute:
        x: 350
        y: 315
      sourcePosition: right
      targetPosition: left
      width: 310
      height: 155
    - id: a02
      type: custom
      data:
        type: code
        title: A02_解析整理结果
        code_language: python3
        code: "def main(structured_input_text: str) -> dict:\n    import json\n    import re\n\n    raw = str(structured_input_text or \"\").strip()\n    cleaned = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.I)\n    data = {}\n    try:\n        parsed = json.loads(cleaned)\n        if isinstance(parsed, dict):\n            data = parsed\n    except Exception:\n        start, end = cleaned.find(\"{\"), cleaned.rfind(\"}\")\n        if start >= 0 and end > start:\n            try:\n                parsed = json.loads(cleaned[start:end + 1])\n                if isinstance(parsed, dict):\n                    data = parsed\n            except Exception:\n                data = {}\n\n    def obj(value):\n        if isinstance(value, dict):\n            return value\n        if isinstance(value, str):\n            try:\n                parsed = json.loads(value)\n                return parsed if isinstance(parsed, dict) else {}\n            except Exception:\n                return {}\n        return {}\n\n    def str_list(value):\n        if not isinstance(value, list):\n            return []\n        return [str(item).strip() for item in value if str(item).strip()]\n\n    topic_record = obj(data.get(\"topic_record\") or data.get(\"campaign\"))\n    distill_raw = obj(data.get(\"distill\"))\n    creative = obj(data.get(\"creative\"))\n    context = obj(data.get(\"context\") or data.get(\"brand\"))\n    history = obj(data.get(\"history\"))\n\n    topic = str(topic_record.get(\"topic\") or topic_record.get(\"source_text\") or raw or \"当前主题\").strip()\n    source_text = str(topic_record.get(\"source_text\") or raw or topic).strip()\n\n    arguments = []\n    for index, item in enumerate(distill_raw.get(\"arguments\") or []):\n        if not isinstance(item, dict):\n            continue\n        claim = str(item.get(\"claim\") or \"\").strip()\n        if not claim:\n            continue\n        arguments.append({\n            \"id\": str(item.get(\"id\") or \"a%d\" % (index + 1)).strip(),\n            \"claim\": claim,\n            \"evidence\": str(item.get(\"evidence\") or \"\").strip(),\n            \"support\": str(item.get(\"support\") or \"none\").strip(),\n            \"strength\": str(item.get(\"strength\") or \"medium\").strip(),\n        })\n    seen_ids = set()\n    for argument in arguments:\n        while argument[\"id\"] in seen_ids:\n            argument[\"id\"] = argument[\"id\"] + \"_dup\"\n        seen_ids.add(argument[\"id\"])\n\n    thesis = str(distill_raw.get(\"thesis\") or \"\").strip()\n    if not thesis:\n        thesis = topic\n    distill = {\n        \"source_form\": str(distill_raw.get(\"source_form\") or \"\").strip() or \"mixed\",\n        \"thesis\": thesis,\n        \"thesis_source\": str(distill_raw.get(\"thesis_source\") or \"\").strip() or \"inferred_from_facts\",\n        \"thesis_type\": str(distill_raw.get(\"thesis_type\") or \"\").strip() or \"judgment\",\n        \"arguments\": arguments,\n        \"counterpoints\": str_list(distill_raw.get(\"counterpoints\")),\n        \"dropped\": str_list(distill_raw.get(\"dropped\")),\n        \"open_questions\": str_list(distill_raw.get(\"open_questions\")),\n    }\n\n    campaign = {\n        \"topic\": topic,\n        \"source_text\": source_text,\n        \"audience_hint\": str(topic_record.get(\"audience_hint\") or topic_record.get(\"audience\") or \"\").strip(),\n        \"context\": obj(topic_record.get(\"context\")),\n        \"facts_confirmed\": topic_record.get(\"facts_confirmed\") if isinstance(topic_record.get(\"facts_confirmed\"), list) else [],\n        \"constraints\": topic_record.get(\"constraints\") if isinstance(topic_record.get(\"constraints\"), list) else [],\n        \"duration_seconds\": topic_record.get(\"duration_seconds\", 30),\n        \"distill\": distill,\n    }\n    for key in (\"brand\", \"product\", \"audience\", \"pain\", \"offer\", \"cta\", \"tone\", \"platform\", \"proof\"):\n        value = topic_record.get(key)\n        if value not in (None, \"\", [], {}):\n            campaign[key] = value\n\n    return {\n        \"campaign_json\": json.dumps(campaign, ensure_ascii=False),\n        \"creative_json\": json.dumps(creative, ensure_ascii=False),\n        \"brand_json\": json.dumps(context, ensure_ascii=False),\n        \"history_json\": json.dumps(history, ensure_ascii=False)\n    }"
        variables:
        - variable: structured_input_text
          value_selector:
          - a01
          - text
          value_type: string
        outputs:
          campaign_json:
            type: string
            children: null
          creative_json:
            type: string
            children: null
          brand_json:
            type: string
            children: null
          history_json:
            type: string
            children: null
      position:
        x: 705
        y: 335
      positionAbsolute:
        x: 705
        y: 335
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 158
    - id: a03
      type: custom
      data:
        type: code
        title: A03_标准化Brief
        code_language: python3
        code: "def main(campaign_json: str, creative_json: str, brand_json: str, history_json: str) -> dict:\n    import json\n    import re\n\n    def load(value, fallback):\n        try:\n            parsed = json.loads(value or \"\")\n            return parsed if isinstance(parsed, dict) else fallback\n        except Exception:\n            return fallback\n\n    campaign = load(campaign_json, {})\n    creative = load(creative_json, {})\n    context = load(brand_json, {})\n    history = load(history_json, {})\n\n    topic = str(campaign.get(\"topic\") or campaign.get(\"source_text\") or campaign.get(\"product\") or campaign.get(\"brand\") or \"当前主题\").strip()\n    source_text = str(campaign.get(\"source_text\") or topic).strip()\n    audience_hint = str(campaign.get(\"audience_hint\") or campaign.get(\"audience\") or \"\").strip()\n    facts_confirmed = campaign.get(\"facts_confirmed\") if isinstance(campaign.get(\"facts_confirmed\"), list) else []\n    constraints = campaign.get(\"constraints\") if isinstance(campaign.get(\"constraints\"), list) else []\n    normalization_warnings = []\n    if not str(campaign.get(\"topic\") or \"\").strip():\n        normalization_warnings.append(\"topic 缺失，已使用 source_text/当前主题作为主题\")\n\n    distill = campaign.get(\"distill\") if isinstance(campaign.get(\"distill\"), dict) else {}\n    arguments = [item for item in (distill.get(\"arguments\") or []) if isinstance(item, dict) and str(item.get(\"claim\") or \"\").strip()]\n    thesis = str(distill.get(\"thesis\") or \"\").strip()\n    source_form = str(distill.get(\"source_form\") or \"\").strip() or \"mixed\"\n    if not thesis:\n        thesis = topic\n        normalization_warnings.append(\"distill.thesis 缺失，已回落到主题句\")\n    if not arguments:\n        normalization_warnings.append(\"distill.arguments 为空，本次只能按单一论点展开\")\n    distill = {\n        \"source_form\": source_form,\n        \"thesis\": thesis,\n        \"thesis_source\": str(distill.get(\"thesis_source\") or \"\").strip() or \"inferred_from_facts\",\n        \"thesis_type\": str(distill.get(\"thesis_type\") or \"\").strip() or \"judgment\",\n        \"arguments\": arguments,\n        \"counterpoints\": [str(item).strip() for item in (distill.get(\"counterpoints\") or []) if str(item).strip()],\n        \"dropped\": [str(item).strip() for item in (distill.get(\"dropped\") or []) if str(item).strip()],\n        \"open_questions\": [str(item).strip() for item in (distill.get(\"open_questions\") or []) if str(item).strip()],\n    }\n    argument_count = len(distill[\"arguments\"])\n    source_chars = len(re.sub(r\"\\s+\", \"\", source_text))\n\n    raw_duration = str(campaign.get(\"duration_seconds\") or \"\").strip()\n    duration = 0.0\n    if raw_duration:\n        try:\n            duration = max(1.0, float(raw_duration))\n        except Exception:\n            duration = 0.0\n    if duration <= 0:\n        duration = 30.0\n        normalization_warnings.append(\"未指定时长，编排参考时长取 30 秒；最终以真实口播为准\")\n\n    brief = {\n        \"topic\": topic,\n        \"source_text\": source_text,\n        \"source_chars\": source_chars,\n        \"audience_hint\": audience_hint,\n        \"context\": context,\n        \"facts_confirmed\": facts_confirmed,\n        \"constraints\": constraints,\n        \"creative\": creative,\n        \"history\": history,\n        \"distill\": distill,\n        \"argument_count\": argument_count,\n        \"language\": \"zh-CN\",\n        \"aspect_ratio\": \"9:16\",\n        \"resolution\": \"1080x1920\",\n        \"fps\": 25,\n        \"target_duration_seconds\": duration,\n        \"normalization_warnings\": normalization_warnings,\n        \"hard_rules\": {\n            \"one_angle_per_video\": True,\n            \"voice_chars_per_second\": 4.2,\n            \"caption_unit\": \"complete_sentence\",\n            \"content_assumptions\": \"none\",\n            \"argument_spine\": True,\n            \"no_chronology_retelling\": True,\n            \"source_text_is_material_only\": True,\n            \"duration_is_reference_only\": True,\n            \"no_length_quota\": True,\n        }\n    }\n    for key in (\"brand\", \"product\", \"audience\", \"pain\", \"offer\", \"cta\", \"tone\", \"platform\", \"proof\"):\n        value = campaign.get(key)\n        if value not in (None, \"\", [], {}):\n            brief[key] = value\n\n    normalized_text = re.sub(r\"\\s+\", \"\", source_text).lower()\n    return {\n        \"brief_json\": json.dumps(brief, ensure_ascii=False),\n        \"target_duration_seconds\": duration,\n        \"proof_fingerprint\": normalized_text,\n        \"validation_ok\": True\n    }"
        variables:
        - variable: campaign_json
          value_selector:
          - a02
          - campaign_json
          value_type: string
        - variable: creative_json
          value_selector:
          - a02
          - creative_json
          value_type: string
        - variable: brand_json
          value_selector:
          - a02
          - brand_json
          value_type: string
        - variable: history_json
          value_selector:
          - a02
          - history_json
          value_type: string
        outputs:
          brief_json:
            type: string
            children: null
          target_duration_seconds:
            type: number
            children: null
          proof_fingerprint:
            type: string
            children: null
          validation_ok:
            type: boolean
            children: null
      position:
        x: 1060
        y: 335
      positionAbsolute:
        x: 1060
        y: 335
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 196
    - id: a03_gate
      type: custom
      data:
        type: if-else
        title: A03_Brief门禁
        cases:
        - id: valid
          case_id: valid
          logical_operator: and
          conditions:
          - id: valid-condition
            variable_selector:
            - a03
