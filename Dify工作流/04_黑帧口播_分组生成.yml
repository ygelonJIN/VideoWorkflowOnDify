    - id: h01b
      type: custom
      data:
        type: code
        title: H01b_净化HTML输出
        code_language: python3
        code: "def main(html_document: str) -> dict:\n    import json\n    import re\n\n    raw = str(html_document or \"\")\n    notes = []\n    text = raw.strip()\n    if text.startswith(\"```\"):\n        text = re.sub(r\"^```[a-zA-Z]*\\s*\", \"\", text)\n        text = re.sub(r\"\\s*```\\s*$\", \"\", text)\n        notes.append(\"已去除 Markdown 代码围栏\")\n    cleaned = re.sub(r\"<tool_call>[\\s\\S]*?</tool_call>\", \"\", text, flags=re.I)\n    if cleaned != text:\n        notes.append(\"已移除 tool_call 工具调用块\")\n        text = cleaned\n    low = text.lower()\n    if \"<html\" not in low and \"<!doctype\" not in low:\n        if text != raw.strip():\n            notes.append(\"未提取到 HTML，保留原始输出供校验定位\")\n            text = raw.strip()\n        low = text.lower()\n    start = low.find(\"<!doctype html>\")\n    if start < 0:\n        start = low.find(\"<html\")\n    end = low.rfind(\"</html>\")\n    if start > 0 and end > start:\n        notes.append(\"已丢弃 HTML 之前的 \" + str(start) + \" 字符\")\n        text = text[start:end + 7]\n    elif start > 0:\n        notes.append(\"已丢弃 HTML 之前的 \" + str(start) + \" 字符，但没有 </html> 收尾\")\n        text = text[start:]\n    elif end >= 0 and end + 7 < len(text):\n        notes.append(\"已丢弃 </html> 之后的 \" + str(len(text) - end - 7) + \" 字符\")\n        text = text[:end + 7]\n    html = text.strip()\n    if not html:\n        notes.append(\"没有从输出中提取到 HTML\")\n    return {\n        \"html_document\": html,\n        \"html_guard_json\": json.dumps({\n            \"applied\": notes,\n            \"input_chars\": len(raw),\n            \"output_chars\": len(html),\n            \"has_doctype\": \"<!doctype html>\" in html.lower(),\n            \"has_closing_html\": \"</html>\" in html.lower(),\n        }, ensure_ascii=False),\n    }\n"
        variables:
        - variable: html_document
          value_selector:
          - h03
          - html_document
          value_type: string
        outputs:
          html_document:
            type: string
            children: null
          html_guard_json:
            type: string
            children: null
