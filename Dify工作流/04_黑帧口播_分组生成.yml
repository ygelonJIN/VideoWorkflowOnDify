"use\": \"同屏既换内容又换列数\", \"avoid\": \"元素数量也变化时（要配合出现/消失）\"}, \"G17\": {\"name\": \"双列对开\", \"family\": \"版面\", \"use\": \"左右两块从中间对开到位；对比、双方案\", \"avoid\": \"三块以上（对不上）\"}, \"G18\": {\"name\": \"三方归位\", \"family\": \"版面\", \"use\": \"三栏内容先后落位；三角色、三档\", \"avoid\": \"两栏或四栏\"}, \"G19\": {\"name\": \"主次分区\", \"family\": \"版面\", \"use\": \"主角先亮，配角跟上；一屏讲一件事\", \"avoid\": \"格子数超过 4 个（主次就没了）\"}, \"G20\": {\"name\": \"网格卡位\", \"family\": \"版面\", \"use\": \"九宫格、卡片墙逐格落位\", \"avoid\": \"超过 12 格\"}, \"G23\": {\"name\": \"多行推近\", \"family\": \"版面\", \"use\": \"多行文案逐行推近；和 T36 不同的是只动子行\", \"avoid\": \"段落超过 4 行\"}, \"G25\": {\"name\": \"分隔线铺开\", \"family\": \"版面\", \"use\": \"几条细线把版面切开；分区、对照\", \"avoid\": \"超过 4 条\"}, \"G26\": {\"name\": \"三档并排\", \"family\": \"版面\", \"use\": \"三档价格/三套方案并排，中间那档被抬起\", \"avoid\": \"两档或四档（会不对称）\"}, \"G27\": {\"name\": \"公转轨道\", \"family\": \"版面\", \"use\": \"三颗球沿不同周期的椭圆轨道绕着中心转；围绕、生态、循环、谁离不开谁\", \"avoid\": \"和 UA47 圆点环绕同屏；目标上不要再放别的装饰\"}, \"K01\": {\"name\": \"超大字落版\", \"family\": \"字形\", \"use\": \"标题字号 ≥ 140px 时用；落定的那一下就是重量\", \"avoid\": \"小字号、多行正文\"}, \"K03\": {\"name\": \"逐字错位\", \"family\": \"字形\", \"use\": \"大标题、短句；一眼看出是排出来的\", \"avoid\": \"小字号（<40px）看不出错位\"}, \"K04\": {\"name\": \"字距收紧\", \"family\": \"字形\", \"use\": \"一行字的收束；配合超大字最明显\", \"avoid\": \"正文；em 单位不要换成 px\"}, \"K21\": {\"name\": \"逐词逐字\", \"family\": \"字形\", \"use\": \"标题要「先成句再落字」的层次\", \"avoid\": \"超过 24 字的整段（拆完 DOM 太碎）\"}, \"K22\": {\"name\": \"遮罩到字\", \"family\": \"字形\", \"use\": \"标题逐字升起、又不想整行一起动\", \"avoid\": \"超过 16 字（拆完 DOM 太碎）\"}, \"K25\": {\"name\": \"字距收紧\", \"family\": \"字形\", \"use\": \"大标题、一句话落版；比 T01 逐字更安静\", \"avoid\": \"小字号（收不收看不出）；已经用 K04 收紧过的同一句\"}, \"K26\": {\"name\": \"遮罩揭示\", \"family\": \"字形\", \"use\": \"整块内容被一条边揭开；照片、卡片、段落都能用\", \"avoid\": \"和 K23 重新拆分同时用（两层遮罩打架）\"}, \"K27\": {\"name\": \"反白底衬\", \"family\": \"字形\", \"use\": \"给关键词垫一块底色；讲到重点时用\", \"avoid\": \"满屏都在衬底（会变荧光笔刷）\"}, \"K28\": {\"name\": \"描边到填充\", \"family\": \"字形\", \"use\": \"空心字被墨填满；适合点名、定调\", \"avoid\": \"字号小于 30px 的脚注（描边再按比例也会把笔画吃掉）；和同屏第二种加字装饰叠加\", \"note\": \"字的描边先亮、再落到填充色；参数 w 是描边占字号的百分比\"}, \"K29\": {\"name\": \"逐字下压\", \"family\": \"字形\", \"use\": \"字被一个个按下来；有重量的标题\", \"avoid\": \"细体字（压不出形）\"}, \"K30\": {\"name\": \"逐字旋正\", \"family\": \"字形\", \"use\": \"字各自歪着落位再旋正；有手感的标题\", \"avoid\": \"角度超过 14 度（会散架）\"}, \"K33\": {\"name\": \"字影拖尾\", \"family\": \"字形\", \"use\": \"字的影子从远处收回来；强调、定音\", \"avoid\": \"和别的描边/阴影字卡同屏（同一块字上两层影会脏）\", \"note\": \"错位硬影从有到收干净；偏移用 em，字号一变影子跟着变，不会在小字上糊成一块\"}, \"K36\": {\"name\": \"行内底色扫过\", \"family\": \"字形\", \"use\": \"底色像被刷子从左推到右；和 K27 反白底衬不同，扫一条\", \"avoid\": \"多行文本（会横穿）\"}, \"K37\": {\"name\": \"逐字上色\", \"family\": \"字形\", \"use\": \"字从当前色逐个切到强调色；点名、确认\", \"avoid\": \"同屏两种强调色\"}, \"K40\": {\"name\": \"字面扫光\", \"family\": \"字形\", \"use\": \"一道白光从左往右刷过字面；焕新、提亮、新品、把旧话重说一遍\", \"avoid\": \"和 K37 逐字上色同屏（一个刷光一个换色，会乱）；两行以上正文不要用\"}, \"K43\": {\"name\": \"手绘旁注括号\", \"family\": \"字形\", \"use\": \"一句话的右侧挂一句旁注，正文不动\", \"avoid\": \"右侧已有内容（括号会压上去）；整段多行（只能包一块）\"}, \"K44\": {\"name\": \"手绘夹注双括号\", \"family\": \"字形\", \"use\": \"把一句结论夹出来，像引文或批注\", \"avoid\": \"已经用了 K67 左括号（同一侧重复）\"}, \"K45\": {\"name\": \"手绘粗笔高亮\", \"family\": \"字形\", \"use\": \"一个关键词被划上荧光笔，字压在上面\", \"avoid\": \"和 K48 下划线同一词；深色字上 op 超过 0.5 会糊\"}, \"K46\": {\"name\": \"手绘绕圈重点\", \"family\": \"字形\", \"use\": \"圈住一个数字或短词，讲占比、讲异常\", \"avoid\": \"整句（圈会拉到两行）；和 K59 紧圈同屏\"}, \"K47\": {\"name\": \"手绘方框\", \"family\": \"字形\", \"use\": \"圈住一个词组、一个结论；比加粗更像有人在这划了一下\", \"avoid\": \"整段文字（框会花）；和 K71 双框同屏\"}, \"K48\": {\"name\": \"手绘下划线\", \"family\": \"字形\", \"use\": \"单行词句被划上重点；比加粗自然\", \"avoid\": \"多行段落（逐行下划请用 K53）\"}, \"K49\": {\"name\": \"手绘删除线\", \"family\": \"字形\", \"use\": \"否定一个旧说法，下一屏再给新的\", \"avoid\": \"和 K50 打叉同屏（两个否定动作）\"}, \"K50\": {\"name\": \"手绘打叉\", \"family\": \"字形\", \"use\": \"划掉一个错误做法、一个旧方案\", \"avoid\": \"和 K49 删除线同屏；大段文字（叉会变成网格）\"}, \"K53\": {\"name\": \"手绘折行标注\", \"family\": \"字形\", \"use\": \"要标的那句折了行，每行各自画一笔\", \"avoid\": \"单行文案（用 K48 更省）；行数超过 3 行会很碎\"}, \"K54\": {\"name\": \"手绘三笔加重\", \"family\": \"字形\", \"use\": \"要压过整屏的结论；反复描出来的分量\", \"avoid\": \"正文小字（三笔会糊成一团）；和 K47 同屏\"}, \"K55\": {\"name\": \"手绘细线框\", \"family\": \"字形\", \"use\": \"不想太抢眼的圈重点；正文旁标注\", \"avoid\": \"要在满屏压住注意力时（太轻，用 K47）\"}, \"K57\": {\"name\": \"斜划删除\", \"family\": \"字形\", \"use\": \"否定一句旧说法\", \"avoid\": \"和 K58 双斜划同屏\"}, \"K58\": {\"name\": \"双斜划\", \"family\": \"字形\", \"use\": \"强烈否定；讲「别再这样」\", \"avoid\": \"和 K57 同屏；礼貌场合（太凶）\"}, \"K59\": {\"name\": \"手绘紧圈\", \"family\": \"字形\", \"use\": \"圈一个数字或两个字，注意力收得极紧\", \"avoid\": \"圈长词（会框不住）\"}, \"K60\": {\"name\": \"手绘大松圈\", \"family\": \"字形\", \"use\": \"把两三个元素一起圈进来\", \"avoid\": \"细字（松圈会显得飘）\"}, \"K62\": {\"name\": \"三笔叉\", \"family\": \"字形\", \"use\": \"彻底否掉；一个方案被毙\", \"avoid\": \"语气已经很强，一屏只放一次\"}, \"K63\": {\"name\": \"手绘细高亮\", \"family\": \"字形\", \"use\": \"在长句里点一个词，不遮住字身\", \"avoid\": \"要整体压满时（用 K45 粗笔）\"}, \"K64\": {\"name\": \"折行高亮\", \"family\": \"字形\", \"use\": \"要涂的那句折了行，每行各自涂一道\", \"avoid\": \"超过三行（涂满会闷）\"}, \"K65\": {\"name\": \"三处依次标注\", \"family\": \"字形\", \"use\": \"一句话里三个重点按口播顺序逐个划\", \"avoid\": \"超过三处（节奏会散）\"}, \"K66\": {\"name\": \"划掉再写\", \"family\": \"字形\", \"use\": \"推翻旧做法，同屏给替代方案\", \"avoid\": \"新词不出现时（只剩否定，没出口）\"}, \"K67\": {\"name\": \"手绘左括号\", \"family\": \"字形\", \"use\": \"正文左边挂一句来源或前提\", \"avoid\": \"已经用了 K44 双括号（左侧重复）\"}, \"K69\": {\"name\": \"逆向划线\", \"family\": \"字形\", \"use\": \"和上一屏的左起笔形成节奏差\", \"avoid\": \"观众会以为在倒放（超过 3 笔就别逆）\"}, \"K70\": {\"name\": \"三笔下划线\", \"family\": \"字形\", \"use\": \"要压过整屏的一句结论\", \"avoid\": \"正文小字（三笔会糊）；和 K48 同屏\"}, \"K71\": {\"name\": \"双框\", \"family\": \"字形\", \"use\": \"同一句里「既要」和「重点」两层意思\", \"avoid\": \"小字（两个框挤成一团）；和 K47 同屏\"}, \"K72\": {\"name\": \"圈加叉\", \"family\": \"字形\", \"use\": \"圈出来的东西恰好是错的，一屏说两层意思\", \"avoid\": \"已经很负面的画面（再加叉会过头）\"}, \"K73\": {\"name\": \"折行方框\", \"family\": \"字形\", \"use\": \"两行都得单独标出来时\", \"avoid\": \"超过两行（每行一个框会很吵）\"}, \"K75\": {\"name\": \"高亮加下划\", \"family\": \"字形\", \"use\": \"一个结论既要被涂亮又要被画住\", \"avoid\": \"两者颜色相同（会糊成一块）\"}, \"K76\": {\"name\": \"星光点缀\", \"family\": \"字形\", \"use\": \"文字四周撒一圈小星星，先亮后收；高光、亮点、点睛、值得被记住的一句\", \"avoid\": \"同屏别再叠第二种加字装饰（都在抢注意力）；字块要够大，小字上星星会挤成一团\", \"note\": \"文字四周撒一圈小星星，先亮后收；高光、亮点、点睛、值得被记住的一句（size 是占字号百分比）\"}, \"K77\": {\"name\": \"波峰扫字\", \"family\": \"字形\", \"use\": \"一道波从字面扫过：每个字按它离波峰的距离抬升+放大，其余字回位\", \"avoid\": \"字数少于 4 个时看不出波，改用 T01\", \"note\": \"范围权重型：位置由「字在波上的相位」决定，不是按顺序延迟\"}, \"K78\": {\"name\": \"范围点亮\", \"family\": \"字形\", \"use\": \"一道光窗扫过文字：窗口内的字放大并从字面透光，窗外保持原样\", \"avoid\": \"整行少于 3 个字（光斑铺不开）\", \"note\": \"一行字被一道光扫过、扫到的字亮起；两端强度归零，屏尾是干净的原标题（glow 是占字号百分比）\"}, \"K79\": {\"name\": \"字距呼吸\", \"family\": \"字形\", \"use\": \"字与字之间被一道波推松再收拢，像一口气吸进去又吐出来\", \"avoid\": \"已定宽的两端对齐版面（字距变化会推挤换行）\", \"note\": \"范围权重型：改的是字距（tracking），不是位移，卡片结束字距归零\"}, \"K80\": {\"name\": \"逐字斜切\", \"family\": \"字形\", \"use\": \"字被斜着推一下再立正：一道斜切波扫过整行，做“速度感”或“震撼”\", \"avoid\": \"书法体、手写体（斜切会破坏笔画重心）\", \"note\": \"范围权重型：改的是 skew 角度，字本身不移位\"}, \"K81\": {\"name\": \"透镜聚焦\", \"family\": \"字形\", \"use\": \"一个放大镜从行首扫到行尾：经过的字被放大抬起，其余字被压小后退，扫完自动收回原样\", \"avoid\": \"整行少于 3 个字（透镜铺不开，放大还会压到邻居）；它动的是字形本身，别再叠同屏第二种加字装饰\", \"note\": \"范围权重型：放大与缩小同时发生，中心字与两侧形成透镜；强度两端归零，屏尾是干净的原标题\"}, \"M24\": {\"name\": \"色带压过\", \"family\": \"材质\", \"use\": \"一条色带横扫过画面；换段、强调都行\", \"avoid\": \"一屏两条以上（会像故障）\"}, \"M28\": {\"name\": \"反相闪\", \"family\": \"材质\", \"use\": \"闪一下反相，表示系统出错、被入侵\", \"avoid\": \"连续两次以上；超过 0.2s 会刺眼\"}, \"M33\": {\"name\": \"边缘受光\", \"family\": \"材质\", \"use\": \"元素边缘亮起来；卡片在暗场里浮出来\", \"avoid\": \"亮底上（看不出）\"}, \"M34\": {\"name\": \"撒花庆祝\", \"family\": \"材质\", \"use\": \"达成、上线、发布的那一下：彩纸从下方两侧抛上来自己落下去\", \"avoid\": \"和 M05 辉光 / M36 边框流光同屏；别压在两行以上正文上\"}, \"M36\": {\"name\": \"边框流光\", \"family\": \"材质\", \"use\": \"一束光沿卡片边框跑一圈；卡片在等你点、新品待拆、悬而未决\", \"avoid\": \"和 M33 边缘受光同屏（一个亮整边一个亮一点，会看不出谁在动）；目标必须有圆角\"}, \"S02\": {\"name\": \"进度填充\", \"family\": \"状态\", \"use\": \"比例、完成度、加载\", \"avoid\": \"没有真实数值时（会变装饰）\"}, \"S04\": {\"name\": \"勾选\", \"family\": \"状态\", \"use\": \"清单项被确认\", \"avoid\": \"同一屏勾五个以上（会变成装饰）\"}, \"S06\": {\"name\": \"点击\", \"family\": \"状态\", \"use\": \"按钮、卡片被按下；证明界面在运行\", \"avoid\": \"一屏点三次以上\"}, \"S07\": {\"name\": \"悬停提亮\", \"family\": \"状态\", \"use\": \"被选中的那一行/那个词提亮；只改明暗不改位置\", \"avoid\": \"整段正文（会闪）；需要\\\"变大小\\\"时用别的卡\"}, \"S08\": {\"name\": \"展开\", \"family\": \"状态\", \"use\": \"面板、列表、卡片展开；transform-origin 在顶边\", \"avoid\": \"高度依赖内容的块（会压扁字）\"}, \"S10\": {\"name\": \"切换\", \"family\": \"状态\", \"use\": \"标签页下的指示条滑到新位置\", \"avoid\": \"没有同级标签时\"}, \"S11\": {\"name\": \"拖拽\", \"family\": \"状态\", \"use\": \"卡片被拖动后归位；表现“可操作”\", \"avoid\": \"一屏拖两次\"}, \"S12\": {\"name\": \"页面滚动\", \"family\": \"状态\", \"use\": \"长页面按 dist 滚过一段；页面里标 data-scroll-hl 的块在滚动过程中依次点亮\", \"avoid\": \"内容本身没有长度（滚了等于空转）；和镜头推拉同屏抢注意力\"}, \"S18\": {\"name\": \"数值映射条\", \"family\": \"状态\", \"use\": \"比例条、进度、达成度\", \"avoid\": \"没有真实数值时（要标场景演示）\"}, \"S19\": {\"name\": \"种子散布\", \"family\": \"入场\", \"use\": \"多元素错落入场\", \"avoid\": \"要求严格网格对齐时\"}, \"S20\": {\"name\": \"并发动画交叠\", \"family\": \"状态\", \"use\": \"一个元素要连着做几件事\", \"avoid\": \"需要严格顺序时\"}, \"S21\": {\"name\": \"中途打断\", \"family\": \"状态\", \"use\": \"撤回、取消、打脸式反转\", \"avoid\": \"只做单向运动\"}, \"S22\": {\"name\": \"有限重复\", \"family\": \"状态\", \"use\": \"呼吸、心跳、提示脉冲\", \"avoid\": \"需要持续循环（视频里禁止）\"}, \"S23\": {\"name\": \"节点综合变换\", \"family\": \"入场\", \"use\": \"徽标、图标、小块卡片入场；参数只有一个缩放起点要调\", \"avoid\": \"整段文字；同屏已用 T23 弹簧\"}, \"S24\": {\"name\": \"数字步进\", \"family\": \"状态\", \"use\": \"关键数字一格一格跳上去；要仪表感、不要平滑长跑时用它\", \"avoid\": \"和 T06 平滑递增同屏；要小数就用 T06\"}, \"S25\": {\"name\": \"逐词点亮\", \"family\": \"状态\", \"use\": \"字幕按词跟着口播亮起来；整句话不变位置\", \"avoid\": \"每词间隔超过 0.3s（会像卡顿）\"}, \"S26\": {\"name\": \"文案替换\", \"family\": \"状态\", \"use\": \"同一位置一句话换成另一句；适合纠正、翻案\", \"avoid\": \"替换文本长度差太多（会露馅）\"}, \"S27\": {\"name\": \"数位滚动\", \"family\": \"状态\", \"use\": \"每一位数字各自滚动后停住；适合大数字、榜单\", \"avoid\": \"位数超过 4 位（读不过来）\"}, \"S28\": {\"name\": \"数字归零\", \"family\": \"状态\", \"use\": \"把数字压到 0；讲清零、失效、归零\", \"avoid\": \"和 S24 步进同屏\"}, \"S30\": {\"name\": \"逐项划掉\", \"family\": \"状态\", \"use\": \"清单一条条被否掉；排雷、旧做法\", \"avoid\": \"超过 4 条；只划不解释\"}, \"S31\": {\"name\": \"折叠展开\", \"family\": \"入场\", \"use\": \"一块内容从一条线展开成卡片；弹层、详情\", \"avoid\": \"内容里有照片（会被压扁）\"}, \"S33\": {\"name\": \"状态灯切换\", \"family\": \"状态\", \"use\": \"标签从灰变绿/变红；状态推进\", \"avoid\": \"同屏超过 6 个\"}, \"S34\": {\"name\": \"逐条追加\", \"family\": \"状态\", \"use\": \"列表一条条追加；像在实时写记录\", \"avoid\": \"超过 5 条\"}, \"S35\": {\"name\": \"排序变动\", \"family\": \"状态\", \"use\": \"排名互换位置；'它被挤下去了'\", \"avoid\": \"超过 3 行（会绕晕）\"}, \"S36\": {\"name\": \"数字拆开\", \"family\": \"状态\", \"use\": \"把总数拆成两部分讲；128 → 100+28。必须落在组件声明的 num 锚点上（U05/U54/U58/U67）\", \"avoid\": \"总和与实际不符（会穿帮）\"}, \"S37\": {\"name\": \"折叠收起\", \"family\": \"状态\", \"use\": \"一块内容收成一条；讲关闭、收起\", \"avoid\": \"内容里有照片\"}, \"T01\": {\"name\": \"逐字上浮\", \"family\": \"入场\", \"use\": \"标题、一句话强调；字数 ≤ 14\", \"avoid\": \"长段落（超过 20 字会拖尾）\"}, \"T02\": {\"name\": \"模糊聚焦\", \"family\": \"入场\", \"use\": \"副标题、解释性文字；有照片底时更明显\", \"avoid\": \"全片连用；低端机渲染成本高\"}, \"T03\": {\"name\": \"折页落字\", \"family\": \"入场\", \"use\": \"标题、引句；垂直节奏强的版面\", \"avoid\": \"小字号（< 40px 看不出折叠）\"}, \"T05\": {\"name\": \"打字机（裁剪揭示）\", \"family\": \"入场\", \"use\": \"代码、命令行；逐字揭示但不改动文本节点\", \"avoid\": \"超过 30 字；同屏再叠加入场\"}, \"T09\": {\"name\": \"翻牌落字\", \"family\": \"入场\", \"use\": \"短词、价格、倒计时类信息\", \"avoid\": \"长句；每字 8 次翻转很吃帧\"}, \"T12\": {\"name\": \"手绘落位\", \"family\": \"入场\", \"use\": \"从侧向落位；不依赖 RoughEase（EasePack 的 RoughEase 在 seek 时会抛 e.match）\", \"avoid\": \"数据、金额（会显得不准）\"}, \"T13\": {\"name\": \"弹跳落位\", \"family\": \"入场\", \"use\": \"单个物件落下（图标、按钮、价格牌）\", \"avoid\": \"整段文字（整块落下会把多行文字糊在一起）\"}, \"T14\": {\"name\": \"手绘抖动参数\", \"family\": \"入场\", \"use\": \"粗粝、手推感\", \"avoid\": \"数据、金额\"}, \"T15\": {\"name\": \"慢动作收尾\", \"family\": \"入场\", \"use\": \"横向滑入、镜头感推进\", \"avoid\": \"需要强回弹时\"}, \"T16\": {\"name\": \"缩放匀速\", \"family\": \"入场\", \"use\": \"1→10 的放大、聚焦\", \"avoid\": \"小倍率（1.1 以内）没差别\"}, \"T17\": {\"name\": \"两次冲过\", \"family\": \"入场\", \"use\": \"标签、按钮、角标入库：从左侧画外冲入落位\", \"avoid\": \"整块面板（780px 位移对宽块等于半屏扫过，优先给窄元素）\"}, \"T19\": {\"name\": \"弹跳落地\", \"family\": \"入场\", \"use\": \"物件落地、价格牌砸下\", \"avoid\": \"整段文字（整块砸落会把多行文字糊在一起）\"}, \"T20\": {\"name\": \"物理落点\", \"family\": \"入场\", \"use\": \"布局里位置固定的元素要飞一下\", \"avoid\": \"需要精确落点（物理不可控）\"}, \"T21\": {\"name\": \"正负加速度\", \"family\": \"入场\", \"use\": \"加速冲出 / 减速停住\", \"avoid\": \"要缓动曲线时（物理没有 ease）\"}, \"T23\": {\"name\": \"整块滑入\", \"family\": \"入场\", \"use\": \"图标、按钮、单块卡片从画面外滑进来\", \"avoid\": \"长段落（整块滑会糊）；已有 C01 缓推同屏\"}, \"T24\": {\"name\": \"弹簧落位\", \"family\": \"入场\", \"use\": \"卡片、面板、价格牌落位；比 power 系更有重量\", \"avoid\": \"整段文字（缩放会晃字）；同屏已用 T13 弹跳\"}, \"T25\": {\"name\": \"摇摆归位\", \"family\": \"入场\", \"use\": \"角标、印章、小图标、贴纸类小元素归位\", \"avoid\": \"大块面板（摆起来像没放稳）；已经用了 T03 折页\"}, \"T26\": {\"name\": \"公式落位\", \"family\": \"入场\", \"use\": \"公式、单行结论、编号大字\", \"avoid\": \"多行段落（整块缩放会让行距跳）\"}, \"T27\": {\"name\": \"逐字擦出\", \"family\": \"入场\", \"use\": \"标题、关键词逐字揭开；像被擦出来，不是浮上来\", \"avoid\": \"超过 14 字会拖尾；要保持字距不变用 K04\"}, \"T28\": {\"name\": \"逐词斜切\", \"family\": \"入场\", \"use\": \"副标题、短句按词揭开；带斜切，比逐字更有语气\", \"avoid\": \"长段落；词数超过 6 个\"}, \"T29\": {\"name\": \"横拉入场\", \"family\": \"入场\", \"use\": \"一行字从左侧拉伸归位；适合口号、栏目标题\", \"avoid\": \"和 T16 缩放匀速同屏（看不出区别）\"}, \"T30\": {\"name\": \"压缩落位\", \"family\": \"入场\", \"use\": \"从下往上压扁再回弹；适合数字、短标签\", \"avoid\": \"多行文字（行高会被压变形）\"}, \"T31\": {\"name\": \"亮度解除\", \"family\": \"入场\", \"use\": \"字从过曝/欠曝里显影；适合揭穿、反转\", \"avoid\": \"低端机连用（滤镜叠加）\"}, \"T32\": {\"name\": \"沿线落字\", \"family\": \"入场\", \"use\": \"逐字带角度落位；适合有手感的标题\", \"avoid\": \"正文长句；角度超过 10 度会乱\"}, \"T33\": {\"name\": \"双层错位\", \"family\": \"入场\", \"use\": \"标题先错位再合拢；适合有冲击力的开场\", \"avoid\": \"正文；每屏只用一次\"}, \"T34\": {\"name\": \"逐字翻入\", \"family\": \"入场\", \"use\": \"逐字像翻牌一样立起来；技术感标题\", \"avoid\": \"字号小于 48px（翻不出形）\"}, \"T35\": {\"name\": \"上浮收束\", \"family\": \"入场\", \"use\": \"整句从下方浮上来；最稳的一档，适合正文标题\", \"avoid\": \"和 T01 同屏（看不出差别）\"}, \"T36\": {\"name\": \"逐行推开\", \"family\": \"入场\", \"use\": \"多行内容逐行推入；适合要点列表、两行标题\", \"avoid\": \"超过 5 行\"}, \"T37\": {\"name\": \"弹入定格\", \"family\": \"入场\", \"use\": \"标签、短词弹一下落定；轻松语气\", \"avoid\": \"严肃主题；连续两屏\"}, \"T38\": {\"name\": \"字序错落\", \"family\": \"入场\", \"use\": \"字像波浪一样依次到位；有节奏的短句\", \"avoid\": \"超过 12 字（会拖成两拍）\"}, \"T39\": {\"name\": \"右侧滑入\", \"family\": \"入场\", \"use\": \"一句话从右侧推进；栏目、结论条\", \"avoid\": \"和 X41 同时用（同一动作）\"}, \"T40\": {\"name\": \"左侧滑入\", \"family\": \"入场\", \"use\": \"一句话从左侧推进；和 T39 构成左右两档\", \"avoid\": \"和 X41 同时用\"}, \"T41\": {\"name\": \"整块淡入\", \"family\": \"入场\", \"use\": \"最稳的一档：整块淡入微浮；任何内容都能用\", \"avoid\": \"单独一屏全靠它（会像 PPT）\"}, \"T42\": {\"name\": \"上下揭开\", \"family\": \"入场\", \"use\": \"内容从上往下揭开；和 K26 横揭配一对\", \"avoid\": \"短文本（看不出遮罩）\"}, \"T43\": {\"name\": \"逐字下坠\", \"family\": \"入场\", \"use\": \"字一个个砸下来；比 T35 更硬\", \"avoid\": \"正文；超过 12 字\"}, \"T44\": {\"name\": \"逐词上浮\", \"family\": \"入场\", \"use\": \"按词浮入；比逐字更稳重，适合副标题\", \"avoid\": \"单词超过 8 个\"}, \"T45\": {\"name\": \"扫描线揭示\", \"family\": \"入场\", \"use\": \"内容被一条扫描线一道道读出来；档案、识别、核验\", \"avoid\": \"和 M30 扫描线下移同屏（会花）\"}, \"T46\": {\"name\": \"线框描出\", \"family\": \"入场\", \"use\": \"四条边依次画出来，像蓝图定稿\", \"avoid\": \"和 X50 边缘收边同时用\"}, \"T47\": {\"name\": \"逐字旋入\", \"family\": \"入场\", \"use\": \"每个字绕自己左下角转回正位再落定，标题、人名、关键词\", \"avoid\": \"超过 14 个字（拖尾太长）\", \"note\": \"逐字入场：锚点在字底，rotation 由负回零，和 T01 的纯位移不同\"}, \"T48\": {\"name\": \"逐字弹缩\", \"family\": \"入场\", \"use\": \"字从很小弹到原大，每个错开一点，适合数字、口号\", \"avoid\": \"正文段落（弹缩会让人读不下去）\", \"note\": \"逐字入场：scale 从 from 弹到 1，锚点居中\"}, \"UA01\": {\"name\": \"卡片入场\", \"family\": \"UI\", \"use\": \"ui-card / ui-bento 这类块\", \"avoid\": \"纯文字屏\"}, \"UA02\": {\"name\": \"数据行逐条\", \"family\": \"UI\", \"use\": \"ui-row / ui-masonry-item 这类列表\", \"avoid\": \"超过 8 行（会拖）\"}, \"UA03\": {\"name\": \"标签点亮\", \"family\": \"UI\", \"use\": \"标签从不可见点亮到实心；作组件根入场时必须从 0 起\", \"avoid\": \"和 S02 同时抢焦点\"}, \"UA04\": {\"name\": \"柱状增长\", \"family\": \"UI\", \"use\": \"U13 柱状图：柱子从基线长上来\", \"avoid\": \"柱子超过 10 根\"}, \"UA06\": {\"name\": \"时间轴点亮\", \"family\": \"UI\", \"use\": \"U20 时间轴、步骤条：节点依次亮\", \"avoid\": \"超过 6 个节点\"}, \"UA08\": {\"name\": \"注册成预设\", \"family\": \"UI\", \"use\": \"一类组件反复出现、想统一手感\", \"avoid\": \"只出现一次的元素（没必要注册）\"}, \"UA17\": {\"name\": \"折线描边\", \"family\": \"UI\", \"use\": \"U14 折线：一笔一笔画出来，趋势自己走出来\", \"avoid\": \"不是 path 的图形（矩形/圆形走 U40/U39）；同屏两条以上要错开起始\"}, \"UA18\": {\"name\": \"行逐条推进\", \"family\": \"UI\", \"use\": \"U05 数据行、U20 时间轴：一条一条推上来\", \"avoid\": \"超过 8 行；和 UA02 同屏\"}, \"UA19\": {\"name\": \"表头先落\", \"family\": \"UI\", \"use\": \"U12 表格、U05 数据行：先把表头压住，行再跟上\", \"avoid\": \"没有表头的布局\"}, \"UA20\": {\"name\": \"徽标点亮\", \"family\": \"UI\", \"use\": \"U04 状态标签：一个一个亮起来\", \"avoid\": \"同屏超过 6 个标签\"}, \"UA22\": {\"name\": \"矩阵点亮\", \"family\": \"UI\", \"use\": \"热力矩阵、权限网格：格子按顺序亮起来\", \"avoid\": \"超过 24 格（时长会撑爆）\"}, \"UA23\": {\"name\": \"点阵计数\", \"family\": \"UI\", \"use\": \"一个点代表一个单位；数量翻倍、覆盖范围\", \"avoid\": \"单位数低于 8（看不出密度）\"}, \"UA26\": {\"name\": \"列表重排\", \"family\": \"UI\", \"use\": \"排名里某一条换位；讲'它被顶上去了'\", \"avoid\": \"超过 5 行；行高不一致\"}, \"UA27\": {\"name\": \"逐格高亮\", \"family\": \"UI\", \"use\": \"U12 表格：扫过一行又一行，像在核对\", \"avoid\": \"行数超过 8 行\"}, \"UA28\": {\"name\": \"图标切换\", \"family\": \"UI\", \"use\": \"状态图标从一种变成另一种；已发送→已读\", \"avoid\": \"同屏超过 6 个图标同时换\"}, \"UA29\": {\"name\": \"数值滑条\", \"family\": \"UI\", \"use\": \"U13 柱状图、进度条：从当前值滑到新值\", \"avoid\": \"柱数超过 10 根\"}, \"UA30\": {\"name\": \"合计行压尾\", \"family\": \"UI\", \"use\": \"U12 表格最后一行落定强调；算总账\", \"avoid\": \"没有合计行的表\"}, \"UA31\": {\"name\": \"卡片堆叠\", \"family\": \"UI\", \"use\": \"U06 便当网格、多卡片：一张压一张进来\", \"avoid\": \"超过 6 张\"}, \"UA32\": {\"name\": \"徽标计数\", \"family\": \"UI\", \"use\": \"角标数字跳上去；未读数、条数\", \"avoid\": \"超过 3 位数字\"}, \"UA33\": {\"name\": \"新行闪入\", \"family\": \"UI\", \"use\": \"列表里新插进来一条；有新记录\", \"avoid\": \"一次插多条（会看成重排）\"}, \"UA34\": {\"name\": \"图标两拍\", \"family\": \"UI\", \"use\": \"图标敲两下；提醒、待办\", \"avoid\": \"次数超过两下（会像循环）\"}, \"UA35\": {\"name\": \"勾选推进\", \"family\": \"UI\", \"use\": \"清单一条条被勾上；验收、进度\", \"avoid\": \"超过 5 条\"}, \"UA36\": {\"name\": \"隔行亮起\", \"family\": \"UI\", \"use\": \"表格隔行亮一下，帮眼睛对齐\", \"avoid\": \"行数超过 10\"}, \"UA37\": {\"name\": \"卡片对齐\", \"family\": \"UI\", \"use\": \"卡片各自从错位对齐到网格；讲秩序\", \"avoid\": \"超过 9 张\"}, \"UA38\": {\"name\": \"柱赛跑\", \"family\": \"UI\", \"use\": \"U13 柱状图：柱子一根根往上追，像在比\", \"avoid\": \"超过 8 根柱子\"}, \"UA39\": {\"name\": \"排名条卷动\", \"family\": \"UI\", \"use\": \"横向排名条从短到长卷出来；讲差距\", \"avoid\": \"和 UA26 列表重排同屏\"}, \"UA40\": {\"name\": \"代码行落位\", \"family\": \"UI\", \"use\": \"U23 代码块：一行一行落下来\", \"avoid\": \"和 UA09–UA16 的 diff 卡同屏\"}, \"UA41\": {\"name\": \"频谱推进\", \"family\": \"UI\", \"use\": \"U05 频谱、音量条：柱子按索引起伏\", \"avoid\": \"柱数超过 24（时长会散）\"}, \"W02\": {\"name\": \"画框变形\", \"family\": \"照片\", \"use\": \"照片框从当前比例长到 data-frame-to 给的框（left,top,w,h），图片用 cover 裁切，主体不变形\", \"avoid\": \"照片本身已满幅；框变形后压住正文\"}, \"W27\": {\"name\": \"照片推近\", \"family\": \"照片\", \"use\": \"照片缓慢推近；一个镜头撑住 2–3 秒\", \"avoid\": \"和 C01 缓推同时用（同一动作）\"}, \"W28\": {\"name\": \"照片开框\", \"family\": \"照片\", \"use\": \"照片从全幅收到相框里；进版式\", \"avoid\": \"和 W02 画框变形同时用\"}, \"W30\": {\"name\": \"照片压字\", \"family\": \"照片\", \"use\": \"字从下方压到照片上；图上的结论条\", \"avoid\": \"照片主体在下方（会挡脸）\"}, \"W31\": {\"name\": \"照片叠层\", \"family\": \"照片\", \"use\": \"照片后面垫一层偏移色块；有层次\", \"avoid\": \"和 W28 开框同时用\"}, \"W32\": {\"name\": \"像素化照片\", \"family\": \"照片\", \"use\": \"真实照片被切成格子，从灰度像素一块块落定为彩色；回到像素、老照片、马赛克、看得见的细节\", \"avoid\": \"格数超过 8×12 会变慢且看不出格子；目标里必须有 img\"}, \"X01\": {\"name\": \"擦除切换\", \"family\": \"结构\", \"use\": \"同屏内容替换：一版换成另一版\", \"avoid\": \"跨场景（那是转场节点的事）\"}, \"X03\": {\"name\": \"逐项离场\", \"family\": \"离场\", \"use\": \"一切屏的收尾；切点前 0.35–0.5s 走完\", \"avoid\": \"和进入同一时刻（会互相打断）\"}, \"X05\": {\"name\": \"反向飞出\", \"family\": \"离场\", \"use\": \"横向切镜前的收尾\", \"avoid\": \"竖向版面里横向飞出会撞边\"}, \"X11\": {\"name\": \"左擦除\", \"family\": \"离场\", \"use\": \"从左边揭开这一屏\", \"avoid\": \"同屏再叠一个方向擦\"}, \"X14\": {\"name\": \"下擦除\", \"family\": \"离场\", \"use\": \"从下往上揭开\", \"avoid\": \"字幕区会被切\"}, \"X21\": {\"name\": \"甩镜\", \"family\": \"离场\", \"use\": \"加速切镜；配合运动模糊最像\", \"avoid\": \"一屏甩两次\"}, \"X30\": {\"name\": \"圆形裁切错落\", \"family\": \"入场\", \"use\": \"一屏内容整体进入/离场\", \"avoid\": \"单元素（没有错落可言）\"}, \"X31\": {\"name\": \"逃逸飞出\", \"family\": \"结构\", \"use\": \"卡片/面板里的标签、徽章要飞出来\", \"avoid\": \"父级本来就不裁剪（直接动原元素即可）\"}, \"X39\": {\"name\": \"推挤换屏\", \"family\": \"结构\", \"use\": \"两屏之间的硬切；场景里要同时有入屏层与出屏层\", \"avoid\": \"只有一层可动时（那就退化成位移）；与 GT 转场同屏\"}, \"X41\": {\"name\": \"整块推移\", \"family\": \"结构\", \"use\": \"整块从侧向推进到位；换版式时的收束\", \"avoid\": \"和 T23 整块滑入同屏（同一动作）\"}, \"X42\": {\"name\": \"双列合拢\", \"family\": \"结构\", \"use\": \"两组元素从两侧合拢；对照、合并、对齐\", \"avoid\": \"单元素（没东西可合）\"}, \"X43\": {\"name\": \"散点归位\", \"family\": \"结构\", \"use\": \"元素从四周散开处归位；'汇总到一处'\", \"avoid\": \"超过 8 个元素（会乱）\"}, \"X44\": {\"name\": \"上下错位归位\", \"family\": \"结构\", \"use\": \"一列元素交替从上下落位；清单、榜单\", \"avoid\": \"超过 6 项；行高差太大\"}, \"X45\": {\"name\": \"撑满留白\", \"family\": \"结构\", \"use\": \"小元素长成主视觉；从卡片到整页\", \"avoid\": \"和 G03 共享元素放大同时用\"}, \"X46\": {\"name\": \"挤压收拢\", \"family\": \"结构\", \"use\": \"元素被挤到一侧再回位；表示让步、让出空间\", \"avoid\": \"照片满屏（会被切）\"}, \"X50\": {\"name\": \"边缘收边\", \"family\": \"结构\", \"use\": \"给一块内容画出边框；圈定范围\", \"avoid\": \"和 K13 手绘方框同时用\"}, \"X52\": {\"name\": \"层叠先后\", \"family\": \"结构\", \"use\": \"卡片一层层叠上来，后进的在上\", \"avoid\": \"超过 5 层\"}, \"X53\": {\"name\": \"双面对折\", \"family\": \"结构\", \"use\": \"一块内容像对折一下再展开；讲折叠、收放\", \"avoid\": \"带照片（会切）\"}, \"X54\": {\"name\": \"清单列缩进\", \"family\": \"结构\", \"use\": \"条目逐行缩进到位，像在归档；清单、检查项\", \"avoid\": \"超过 6 条\"}, \"X56\": {\"name\": \"阵列累乘\", \"family\": \"结构\", \"use\": \"同一元素复制成一串：每个副本在前一个基础上位移+旋转+缩放，逐个甩出\", \"avoid\": \"需要精确等距排布时（累乘会越走越密）\", \"note\": \"几何生成卡：副本变换逐级累乘（Repeater 的 tr 累加），不是 stagger 补间\"}, \"X57\": {\"name\": \"环形扇开\", \"family\": \"结构\", \"use\": \"沿圆周复制一圈元素并逐个亮起，做刻度盘、环阵、放射状结构\", \"avoid\": \"元素要压文字的地方（环会围住正文）\", \"note\": \"几何生成卡：极坐标复制，副本自转对齐半径方向\"}, \"X60\": {\"name\": \"内凹外扩\", \"family\": \"结构\", \"use\": \"同一条轮廓在「圆胖」和「内凹成星」之间连续变形，一个参数控方向\", \"avoid\": \"amt 接近 1 时轮廓会自交（视觉打结）\", \"note\": \"几何生成卡：边中点沿外法线偏移，amt>0 内凹成星、amt<0 外扩\"}, \"X61\": {\"name\": \"等距多环\", \"family\": \"结构\", \"use\": \"一个轮廓按固定间距外推出多层同心环，由内到外逐层浮现\", \"avoid\": \"ring 数超过 6 时外环会顶出安全区\", \"note\": \"几何生成卡：正多边形等距偏移 = 半径加 gap/cos(π/N)，不是缩放复制\"}, \"X62\": {\"name\": \"形状互变\", \"family\": \"结构\", \"use\": \"两个轮廓互变：圆/方/三角/星之间按弧长等分重采样后逐点插值，尖角保留\", \"avoid\": \"from 与 to 尖角数差太多时会有一点「揉」的过程（那是形变本身，不是坏帧）\", \"note\": \"几何生成卡：顶点→等弧长重采样 N 点→顶点朝上对齐→线a插值，不靠极坐标半径函数\"}, \"X63\": {\"name\": \"双端描线\", \"family\": \"结构\", \"use\": \"一条线从中段同时向两头生长，或从两头向中间收拢\", \"avoid\": \"闭合轮廓（首尾相接时长不满整圈）\", \"note\": \"作用在已有 svg 路径上：可见段居中，dashoffset 负偏移实现两端同时推进\"}, \"X64\": {\"name\": \"蚂蚁线\", \"family\": \"结构\", \"use\": \"虚线沿路径持续向前爬，做流转、进行中、传输中的状态\", \"avoid\": \"需要静下来读的图（动线会分心）\", \"note\": \"作用在已有 svg 路径上：dasharray 固定、dashoffset 匀速推，周期数有限不循环\"}, \"X65\": {\"name\": \"渐变描边\", \"family\": \"结构\", \"use\": \"一条光带沿着线条从头流到尾，线条本身是亮暗渐变\", \"avoid\": \"线条短于 300px（光带看不出移动）\", \"note\": \"自建 svg + linearGradient：动 stop 的 offset，不是动路径\"}, \"X66\": {\"name\": \"圆环挖洞\", \"family\": \"结构\", \"use\": \"实心圆中间开出一个洞并越开越大，做“进入下一层”、“镜头孔”\", \"avoid\": \"要把文字压在洞中间（洞会吃掉字）\", \"note\": \"fill-rule=evenodd 双圆一正一反，洞半径单独一个参数\"}, \"X68\": {\"name\": \"阵列多边形\", \"family\": \"结构\", \"use\": \"一圈正多边形沿圆周排开并各自转动，做“系统图”、“节点阵”\", \"avoid\": \"多边形数超过 16 个（互相压边）\", \"note\": \"组合机制：polystar 的 pt 模式一个做形，repeater 的极坐标做阵\"}, \"X69\": {\"name\": \"星阵散布\", \"family\": \"结构\", \"use\": \"一片小星星按固定布局散开并逐个亮起，做“评分”、“精选”、“夜空”\", \"avoid\": \"需要严格对齐的版式（散布是故意不齐的）\", \"note\": \"确定性散布：用 kit.seeded 的 LCG，同参数每次位置完全一致，可 seek\"}, \"X71\": {\"name\": \"拖尾点链\", \"family\": \"结构\", \"use\": \"一串圆点从一点甩出并逐渐变小变淡，做“拖尾”、“速度线”、“数据流”\", \"avoid\": \"要看清每个点的位置（拖尾本身就糊）\", \"note\": \"Repeater 的 so/eo 段：透明度按副本序号指数衰减，不是统一淡出\"}, \"X72\": {\"name\": \"斜切挤压\", \"family\": \"结构\", \"use\": \"元素被斜着压扁再弹回原状，做“被推了一下”的受力反馈\", \"avoid\": \"元素里正在读的小字（挤压会短暂变形）\", \"note\": \"作用于宿主本身：transform-origin 落在底边，skew 与 scaleY 同时压\"}, \"X73\": {