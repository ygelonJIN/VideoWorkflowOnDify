version: 0.7.0
kind: app
app:
  name: 通用｜02_黑帧口播无数字人视频
  description: 无数字人、无头像窗口、无黑帧占位的口播视频；生成 HTML 和已批准口播，由 MiMo TTS 生成语音，并以真实口播时钟同步场景、字幕和元素动效。
  icon: 📝
  icon_type: emoji
  icon_background: '#E4FBCC'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/opencode_go:0.5.2@31f6a79969e7c240fb2fa8c9331d89079ccb048283aeba032634c5f0b831658e
    version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: a00
      type: custom
      data:
        type: start
        title: A00_输入活动需求
        variables:
        - label: 主题、原始文本或随口一句话
          variable: campaign_brief
          type: paragraph
          required: true
          max_length: 30000
        - label: 可选创作偏好
          variable: creative_preferences
          type: paragraph
          required: false
          max_length: 12000
        - label: 可选背景/规范
          variable: brand_guidelines
          type: paragraph
          required: false
          max_length: 12000
        - label: 可选历史/补充
          variable: history_notes
          type: paragraph
          required: false
          max_length: 20000
        - label: 请求编号
          variable: request_id
          type: text-input
          required: true
          max_length: 128
        - label: 生产要求
          variable: production_requirements
          type: paragraph
          required: false
          max_length: 12000
        - label: TTS 供应商
          variable: tts_provider
          type: select
          required: false
          options:
          - mimo
          - macos
          - openai-compatible
        - label: TTS 模型名（留空使用 mimo-v2.5-tts）
          variable: tts_model
          type: text-input
          required: false
          max_length: 120
        - label: TTS Base 地址
          variable: tts_base_url
          type: select
          required: false
          options:
          - 默认（按量付费）
          - Token Plan - 中国
          - Token Plan - 新加坡
          - Token Plan - 欧洲
        - label: TTS 声音
          variable: tts_voice
          type: select
          required: false
          options:
          - mimo_default
          - 冰糖
          - 茉莉
          - 苏打
          - 白桦
          - Mia
          - Chloe
          - Milo
          - Dean
      position:
        x: 30
        y: 340
      positionAbsolute:
        x: 30
        y: 340
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 260
    - id: s1
      type: custom
      data:
        type: llm
        title: S1_编剧
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params: &id001
            max_tokens: 128000
        prompt_template:
        - id: s1-system
          role: system
          text: "# 编剧\n\n你是这支竖屏短视频的编剧。只输出一份 JSON：口播全文、分镜、合规自检。**不写画面、不写组件、不写 HTML。**\n\n## 输入\n\n- 需求：{{#a00.campaign_brief#}}\n- 创作偏好：{{#a00.creative_preferences#}}\n- 背景/规范：{{#a00.brand_guidelines#}}\n- 历史/补充：{{#a00.history_notes#}}\n- 生产要求：{{#a00.production_requirements#}}\n\n## 规则\n\n1. 全片只讲一个主张（`thesis`）。第一句就给出判断，最后一句能单独截出来当金句。\n2. 3–8 屏。每屏 1–2 个完整句子；`voiceover_text` **逐字取自口播原文**，按顺序拼起来必须等于全文（不改写、不概括、不漏句）。\n3. 一屏最多两个信息点：一句里出现第三个判断就拆屏。不用\"然后/接着/后来\"按过程复述。\n4. 不编事实、数字、案例、资质；素材里的原话只在关键句上短引用。\n5. 中文口播约 4.3 字/秒，一屏 4–8 秒；字数写多长就多长，不设目标时长。\n6. 合规自查：承诺收益、绝对化、伪造资质一律写进 `compliance.risks`；有问题就 `decision=rejected`。\n\n## 输出（只输出 JSON，第一个字符 `{`）\n\n```json\n{\"title\":\"钩子化的短标题\",\"thesis\":\"一句话主张\",\"voiceover_script\":\"口播全文\",\n \"scenes\":[{\"voiceover_text\":\"逐字取自原文的这段话\",\"purpose\":\"hook|insight|example|ending\",\"argument_id\":\"\"}],\n \"compliance\":{\"decision\":\"approved\",\"risks\":[],\"notes\":\"\"}}\n```\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 140
        y: 100
      positionAbsolute:
        x: 140
        y: 100
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 160
    - id: s1n
      type: custom
      data:
        type: code
        title: S1N_归一与打包
        code_language: python3
        code: "def main(copy_text: str, campaign_brief: str, creative_preferences: str = \"\", brand_guidelines: str = \"\",\n         history_notes: str = \"\", production_requirements: str = \"\", request_id: str = \"\",\n         tts_provider: str = \"\", tts_base_url: str = \"\", tts_model: str = \"\", tts_voice: str = \"\") -> dict:\n    \"\"\"S1 归一：把编剧节点的一次输出变成下游唯一事实源（approved_package_json）。\n\n    只做四件事：解析、按完整句子重建字幕、把分镜对齐到口播原文、算作者期时长。\n    不做内容判断——不合规就报 errors 让 S1 重写，不替它改文案。\n    \"\"\"\n    import hashlib\n    import json\n    import re\n\n    def parse(raw):\n        text = str(raw or \"\").strip()\n        text = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", text, flags=re.I)\n        try:\n            return json.loads(text)\n        except Exception:\n            start, end = text.find(\"{\"), text.rfind(\"}\")\n            if 0 <= start < end:\n                try:\n                    return json.loads(text[start:end + 1])\n                except Exception:\n                    pass\n        return {}\n\n    def compact(value):\n        return re.sub(r\"\\s+\", \"\", str(value or \"\"))\n\n    data = parse(copy_text)\n    errors = []\n    warnings = []\n\n    if not isinstance(data, dict) or not data:\n        return {\n            \"package_json\": \"{}\",\n            \"approved_voiceover_script\": \"\",\n            \"storyboard_json\": \"{}\",\n            \"scene_count\": 0,\n            \"estimated_duration_seconds\": 0.0,\n            \"s1_valid\": False,\n            \"s1_errors_json\": json.dumps([\"S1 输出不是合法 JSON：第一个字符必须是 {，最后一个 }\"], ensure_ascii=False),\n            \"s1_warnings_json\": \"[]\",\n        }\n\n    script = str(data.get(\"voiceover_script\") or \"\").strip()\n    if not script:\n        errors.append(\"S1 没有输出 voiceover_script\")\n\n    # 字幕只按完整句子切，永远不用模型给的切法\n    sentences = []\n    for match in re.finditer(r\".*?(?:[。！？!?]+|$)\", script, flags=re.S):\n        text = match.group(0).strip()\n        if text:\n            sentences.append({\"id\": \"s%02d\" % (len(sentences) + 1), \"text\": text})\n    if not sentences:\n        errors.append(\"口播里没有完整句子\")\n\n    script_compact = compact(script)\n    raw_scenes = data.get(\"scenes\") if isinstance(data.get(\"scenes\"), list) else []\n    scenes = []\n    cursor = 0\n    for index, item in enumerate(raw_scenes, 1):\n        if not isinstance(item, dict):\n            continue\n        voice = str(item.get(\"voiceover_text\") or \"\").strip()\n        if not voice:\n            warnings.append(\"第 %d 屏没有 voiceover_text，已丢弃\" % index)\n            continue\n        target = compact(voice)\n        hit = script_compact.find(target, cursor)\n        if hit < 0:\n            warnings.append(\"第 %d 屏的 voiceover_text 不在口播原文里（或顺序错），已丢弃\" % index)\n            continue\n        cursor = hit + len(target)\n        scenes.append({\n            \"scene_id\": \"s%02d\" % (len(scenes) + 1),\n            \"sentence_ids\": [],\n            \"voiceover_text\": voice,\n            \"purpose\": str(item.get(\"purpose\") or \"\").strip() or \"insight\",\n            \"argument_id\": str(item.get(\"argument_id\") or \"\").strip(),\n        })\n\n    # 句子数对齐：每屏能覆盖几个完整句子就绑几个\n    if scenes and sentences:\n        sentence_texts = [compact(item[\"text\"]) for item in sentences]\n        for scene in scenes:\n            target = compact(scene[\"voiceover_text\"])\n            picked = []\n            covered = \"\"\n            for idx, text in enumerate(sentence_texts):\n                if not text:\n                    continue\n                start = target.find(covered + text)\n                if start >= 0 or (covered and target.find(covered + text) >= 0):\n                    picked.append(sentences[idx][\"id\"])\n                    covered += text\n                    continue\n                if text in target and sentences[idx][\"id\"] not in picked:\n                    picked.append(sentences[idx][\"id\"])\n                    covered += text\n            scene[\"sentence_ids\"] = picked or [sentences[min(len(sentences) - 1, len(scenes))][\"id\"]]\n\n    if len(scenes) < 2:\n        errors.append(\"有效分镜少于 2 屏：S1 必须把口播切成 3–8 屏，且每屏 voiceover_text 逐字取自原文\")\n\n    covered_chars = sum(len(compact(scene[\"voiceover_text\"])) for scene in scenes)\n    coverage = covered_chars / max(1, len(script_compact))\n    if scenes and coverage < 0.9:\n        errors.append(\"分镜只覆盖口播的 %.0f%%，必须逐字覆盖全文（漏句或改写都不行）\" % (coverage * 100))\n\n    cursor = 0.0\n    for scene in scenes:\n        raw = len(compact(scene[\"voiceover_text\"]))\n        scene[\"estimated_start_seconds\"] = round(cursor, 2)\n        scene[\"estimated_end_seconds\"] = round(cursor + max(1.2, raw / 4.35), 2)\n        cursor = scene[\"estimated_end_seconds\"]\n\n    estimated = round(cursor, 2)\n    script_data = {\n        \"voiceover_script\": script,\n        \"sentences\": sentences,\n        \"burned_in_caption_lines\": [item[\"text\"] for item in sentences],\n        \"estimated_duration_seconds\": estimated,\n        \"content_diagnostics\": {\n            \"characters\": len(script_compact),\n            \"sentences\": len(sentences),\n            \"scenes\": len(scenes),\n            \"coverage\": round(coverage, 3),\n        },\n    }\n    storyboard = {\n        \"creative_strategy\": {\n            \"title\": str(data.get(\"title\") or \"\").strip(),\n            \"core_message\": str(data.get(\"thesis\") or \"\").strip(),\n        },\n        \"scenes\": scenes,\n    }\n    compliance = data.get(\"compliance\") if isinstance(data.get(\"compliance\"), dict) else {}\n    if str(compliance.get(\"decision\") or \"\").strip().lower() in (\"rejected\", \"reject\", \"block\"):\n        errors.append(\"S1 自检合规未通过：\" + str(compliance.get(\"notes\") or \"按 revision 改写后重跑\"))\n\n    # 开始节点的 Base 地址是选项标签，不是 URL；在这里换成真实地址。\n    base_url_options = {\n        \"默认（按量付费）\": \"https://api.xiaomimimo.com/v1\",\n        \"Token Plan - 中国\": \"https://token-plan-cn.xiaomimimo.com/v1\",\n        \"Token Plan - 新加坡\": \"https://token-plan-sgp.xiaomimimo.com/v1\",\n        \"Token Plan - 欧洲\": \"https://token-plan-ams.xiaomimimo.com/v1\",\n    }\n    raw_base_url = str(tts_base_url or \"\").strip()\n    tts_config = {\n        \"provider\": str(tts_provider or \"\").strip() or \"mimo\",\n        \"base_url\": base_url_options.get(raw_base_url, raw_base_url),\n        \"model\": str(tts_model or \"\").strip(),\n        \"voice\": str(tts_voice or \"\").strip() or \"mimo_default\",\n    }\n    package = {\n        \"approval\": {\"status\": \"approved\" if not errors else \"blocked\", \"request_id\": str(request_id or \"\")},\n        \"brief\": {\n            \"topic\": str(data.get(\"title\") or campaign_brief or \"\").strip()[:200],\n            \"thesis\": str(data.get(\"thesis\") or \"\").strip(),\n            \"source_text\": str(campaign_brief or \"\"),\n            \"creative_preferences\": str(creative_preferences or \"\"),\n            \"brand_guidelines\": str(brand_guidelines or \"\"),\n            \"history_notes\": str(history_notes or \"\"),\n            \"production_requirements\": str(production_requirements or \"\"),\n            \"language\": \"zh\",\n            \"aspect_ratio\": \"9:16\",\n        },\n        \"approved_script\": script_data,\n        \"storyboard\": storyboard,\n        \"compliance\": compliance,\n        \"tts_config\": tts_config,\n    }\n    return {\n        \"package_json\": json.dumps(package, ensure_ascii=False),\n        \"approved_voiceover_script\": script,\n        \"storyboard_json\": json.dumps(storyboard, ensure_ascii=False),\n        \"scene_count\": len(scenes),\n        \"estimated_duration_seconds\": estimated,\n        \"script_hash\": hashlib.sha256(script_compact.encode(\"utf-8\")).hexdigest(),\n        \"s1_valid\": not errors,\n        \"s1_errors_json\": json.dumps(errors, ensure_ascii=False),\n        \"s1_warnings_json\": json.dumps(warnings, ensure_ascii=False),\n    }\n"
        variables:
        - variable: copy_text
          value_selector:
          - s1
          - text
          value_type: string
        - variable: campaign_brief
          value_selector:
          - a00
          - campaign_brief
          value_type: string
        - variable: creative_preferences
          value_selector:
          - a00
          - creative_preferences
          value_type: string
        - variable: brand_guidelines
          value_selector:
          - a00
          - brand_guidelines
          value_type: string
        - variable: history_notes
          value_selector:
          - a00
          - history_notes
          value_type: string
        - variable: production_requirements
          value_selector:
          - a00
          - production_requirements
          value_type: string
        - variable: request_id
          value_selector:
          - a00
          - request_id
          value_type: string
        - variable: tts_provider
          value_selector:
          - a00
          - tts_provider
          value_type: string
        - variable: tts_base_url
          value_selector:
          - a00
          - tts_base_url
          value_type: string
        - variable: tts_model
          value_selector:
          - a00
          - tts_model
          value_type: string
        - variable: tts_voice
          value_selector:
          - a00
          - tts_voice
          value_type: string
        outputs:
          package_json:
            type: string
            children: null
          approved_voiceover_script:
            type: string
            children: null
          storyboard_json:
            type: string
            children: null
          scene_count:
            type: number
            children: null
          estimated_duration_seconds:
            type: number
            children: null
          script_hash:
            type: string
            children: null
          s1_valid:
            type: boolean
            children: null
          s1_errors_json:
            type: string
            children: null
          s1_warnings_json:
            type: string
            children: null
      position:
        x: 480
        y: 100
      positionAbsolute:
        x: 480
        y: 100
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 220
    - id: g1
      type: custom
      data:
        type: if-else
        title: S1_门禁
        cases:
        - id: valid
          case_id: valid
          logical_operator: and
          conditions:
          - id: valid-condition
            variable_selector:
            - s1n
            - s1_valid
            comparison_operator: is
            value: 'true'
            varType: boolean
      position:
        x: 820
        y: 100
      positionAbsolute:
        x: 820
        y: 100
      sourcePosition: right
      targetPosition: left
      width: 240
      height: 140
    - id: s1r
      type: custom
      data:
        type: llm
        title: S1R_按错误重写
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params: *id001
        prompt_template:
        - id: s1r-system
          role: system
          text: "# 编剧\n\n你是这支竖屏短视频的编剧。只输出一份 JSON：口播全文、分镜、合规自检。**不写画面、不写组件、不写 HTML。**\n\n## 输入\n\n- 需求：{{#a00.campaign_brief#}}\n- 创作偏好：{{#a00.creative_preferences#}}\n- 背景/规范：{{#a00.brand_guidelines#}}\n- 历史/补充：{{#a00.history_notes#}}\n- 生产要求：{{#a00.production_requirements#}}\n\n## 规则\n\n1. 全片只讲一个主张（`thesis`）。第一句就给出判断，最后一句能单独截出来当金句。\n2. 3–8 屏。每屏 1–2 个完整句子；`voiceover_text` **逐字取自口播原文**，按顺序拼起来必须等于全文（不改写、不概括、不漏句）。\n3. 一屏最多两个信息点：一句里出现第三个判断就拆屏。不用\"然后/接着/后来\"按过程复述。\n4. 不编事实、数字、案例、资质；素材里的原话只在关键句上短引用。\n5. 中文口播约 4.3 字/秒，一屏 4–8 秒；字数写多长就多长，不设目标时长。\n6. 合规自查：承诺收益、绝对化、伪造资质一律写进 `compliance.risks`；有问题就 `decision=rejected`。\n\n## 输出（只输出 JSON，第一个字符 `{`）\n\n```json\n{\"title\":\"钩子化的短标题\",\"thesis\":\"一句话主张\",\"voiceover_script\":\"口播全文\",\n \"scenes\":[{\"voiceover_text\":\"逐字取自原文的这段话\",\"purpose\":\"hook|insight|example|ending\",\"argument_id\":\"\"}],\n \"compliance\":{\"decision\":\"approved\",\"risks\":[],\"notes\":\"\"}}\n```\n\n\n你上一版被退回，原因是：{{#s1n.s1_errors_json#}}。按原因重写，不要解释。"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 1100
        y: 260
      positionAbsolute:
        x: 1100
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 160
    - id: s1rn
      type: custom
      data:
        type: code
        title: S1RN_复查
        code_language: python3
        code: "def main(copy_text: str, campaign_brief: str, creative_preferences: str = \"\", brand_guidelines: str = \"\",\n         history_notes: str = \"\", production_requirements: str = \"\", request_id: str = \"\",\n         tts_provider: str = \"\", tts_base_url: str = \"\", tts_model: str = \"\", tts_voice: str = \"\") -> dict:\n    \"\"\"S1 归一：把编剧节点的一次输出变成下游唯一事实源（approved_package_json）。\n\n    只做四件事：解析、按完整句子重建字幕、把分镜对齐到口播原文、算作者期时长。\n    不做内容判断——不合规就报 errors 让 S1 重写，不替它改文案。\n    \"\"\"\n    import hashlib\n    import json\n    import re\n\n    def parse(raw):\n        text = str(raw or \"\").strip()\n        text = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", text, flags=re.I)\n        try:\n            return json.loads(text)\n        except Exception:\n            start, end = text.find(\"{\"), text.rfind(\"}\")\n            if 0 <= start < end:\n                try:\n                    return json.loads(text[start:end + 1])\n                except Exception:\n                    pass\n        return {}\n\n    def compact(value):\n        return re.sub(r\"\\s+\", \"\", str(value or \"\"))\n\n    data = parse(copy_text)\n    errors = []\n    warnings = []\n\n    if not isinstance(data, dict) or not data:\n        return {\n            \"package_json\": \"{}\",\n            \"approved_voiceover_script\": \"\",\n            \"storyboard_json\": \"{}\",\n            \"scene_count\": 0,\n            \"estimated_duration_seconds\": 0.0,\n            \"s1_valid\": False,\n            \"s1_errors_json\": json.dumps([\"S1 输出不是合法 JSON：第一个字符必须是 {，最后一个 }\"], ensure_ascii=False),\n            \"s1_warnings_json\": \"[]\",\n        }\n\n    script = str(data.get(\"voiceover_script\") or \"\").strip()\n    if not script:\n        errors.append(\"S1 没有输出 voiceover_script\")\n\n    # 字幕只按完整句子切，永远不用模型给的切法\n    sentences = []\n    for match in re.finditer(r\".*?(?:[。！？!?]+|$)\", script, flags=re.S):\n        text = match.group(0).strip()\n        if text:\n            sentences.append({\"id\": \"s%02d\" % (len(sentences) + 1), \"text\": text})\n    if not sentences:\n        errors.append(\"口播里没有完整句子\")\n\n    script_compact = compact(script)\n    raw_scenes = data.get(\"scenes\") if isinstance(data.get(\"scenes\"), list) else []\n    scenes = []\n    cursor = 0\n    for index, item in enumerate(raw_scenes, 1):\n        if not isinstance(item, dict):\n            continue\n        voice = str(item.get(\"voiceover_text\") or \"\").strip()\n        if not voice:\n            warnings.append(\"第 %d 屏没有 voiceover_text，已丢弃\" % index)\n            continue\n        target = compact(voice)\n        hit = script_compact.find(target, cursor)\n        if hit < 0:\n            warnings.append(\"第 %d 屏的 voiceover_text 不在口播原文里（或顺序错），已丢弃\" % index)\n            continue\n        cursor = hit + len(target)\n        scenes.append({\n            \"scene_id\": \"s%02d\" % (len(scenes) + 1),\n            \"sentence_ids\": [],\n            \"voiceover_text\": voice,\n            \"purpose\": str(item.get(\"purpose\") or \"\").strip() or \"insight\",\n            \"argument_id\": str(item.get(\"argument_id\") or \"\").strip(),\n        })\n\n    # 句子数对齐：每屏能覆盖几个完整句子就绑几个\n    if scenes and sentences:\n        sentence_texts = [compact(item[\"text\"]) for item in sentences]\n        for scene in scenes:\n            target = compact(scene[\"voiceover_text\"])\n            picked = []\n            covered = \"\"\n            for idx, text in enumerate(sentence_texts):\n                if not text:\n                    continue\n                start = target.find(covered + text)\n                if start >= 0 or (covered and target.find(covered + text) >= 0):\n                    picked.append(sentences[idx][\"id\"])\n                    covered += text\n                    continue\n                if text in target and sentences[idx][\"id\"] not in picked:\n                    picked.append(sentences[idx][\"id\"])\n                    covered += text\n            scene[\"sentence_ids\"] = picked or [sentences[min(len(sentences) - 1, len(scenes))][\"id\"]]\n\n    if len(scenes) < 2:\n        errors.append(\"有效分镜少于 2 屏：S1 必须把口播切成 3–8 屏，且每屏 voiceover_text 逐字取自原文\")\n\n    covered_chars = sum(len(compact(scene[\"voiceover_text\"])) for scene in scenes)\n    coverage = covered_chars / max(1, len(script_compact))\n    if scenes and coverage < 0.9:\n        errors.append(\"分镜只覆盖口播的 %.0f%%，必须逐字覆盖全文（漏句或改写都不行）\" % (coverage * 100))\n\n    cursor = 0.0\n    for scene in scenes:\n        raw = len(compact(scene[\"voiceover_text\"]))\n        scene[\"estimated_start_seconds\"] = round(cursor, 2)\n        scene[\"estimated_end_seconds\"] = round(cursor + max(1.2, raw / 4.35), 2)\n        cursor = scene[\"estimated_end_seconds\"]\n\n    estimated = round(cursor, 2)\n    script_data = {\n        \"voiceover_script\": script,\n        \"sentences\": sentences,\n        \"burned_in_caption_lines\": [item[\"text\"] for item in sentences],\n        \"estimated_duration_seconds\": estimated,\n        \"content_diagnostics\": {\n            \"characters\": len(script_compact),\n            \"sentences\": len(sentences),\n            \"scenes\": len(scenes),\n            \"coverage\": round(coverage, 3),\n        },\n    }\n    storyboard = {\n        \"creative_strategy\": {\n            \"title\": str(data.get(\"title\") or \"\").strip(),\n            \"core_message\": str(data.get(\"thesis\") or \"\").strip(),\n        },\n        \"scenes\": scenes,\n    }\n    compliance = data.get(\"compliance\") if isinstance(data.get(\"compliance\"), dict) else {}\n    if str(compliance.get(\"decision\") or \"\").strip().lower() in (\"rejected\", \"reject\", \"block\"):\n        errors.append(\"S1 自检合规未通过：\" + str(compliance.get(\"notes\") or \"按 revision 改写后重跑\"))\n\n    # 开始节点的 Base 地址是选项标签，不是 URL；在这里换成真实地址。\n    base_url_options = {\n        \"默认（按量付费）\": \"https://api.xiaomimimo.com/v1\",\n        \"Token Plan - 中国\": \"https://token-plan-cn.xiaomimimo.com/v1\",\n        \"Token Plan - 新加坡\": \"https://token-plan-sgp.xiaomimimo.com/v1\",\n        \"Token Plan - 欧洲\": \"https://token-plan-ams.xiaomimimo.com/v1\",\n    }\n    raw_base_url = str(tts_base_url or \"\").strip()\n    tts_config = {\n        \"provider\": str(tts_provider or \"\").strip() or \"mimo\",\n        \"base_url\": base_url_options.get(raw_base_url, raw_base_url),\n        \"model\": str(tts_model or \"\").strip(),\n        \"voice\": str(tts_voice or \"\").strip() or \"mimo_default\",\n    }\n    package = {\n        \"approval\": {\"status\": \"approved\" if not errors else \"blocked\", \"request_id\": str(request_id or \"\")},\n        \"brief\": {\n            \"topic\": str(data.get(\"title\") or campaign_brief or \"\").strip()[:200],\n            \"thesis\": str(data.get(\"thesis\") or \"\").strip(),\n            \"source_text\": str(campaign_brief or \"\"),\n            \"creative_preferences\": str(creative_preferences or \"\"),\n            \"brand_guidelines\": str(brand_guidelines or \"\"),\n            \"history_notes\": str(history_notes or \"\"),\n            \"production_requirements\": str(production_requirements or \"\"),\n            \"language\": \"zh\",\n            \"aspect_ratio\": \"9:16\",\n        },\n        \"approved_script\": script_data,\n        \"storyboard\": storyboard,\n        \"compliance\": compliance,\n        \"tts_config\": tts_config,\n    }\n    return {\n        \"package_json\": json.dumps(package, ensure_ascii=False),\n        \"approved_voiceover_script\": script,\n        \"storyboard_json\": json.dumps(storyboard, ensure_ascii=False),\n        \"scene_count\": len(scenes),\n        \"estimated_duration_seconds\": estimated,\n        \"script_hash\": hashlib.sha256(script_compact.encode(\"utf-8\")).hexdigest(),\n        \"s1_valid\": not errors,\n        \"s1_errors_json\": json.dumps(errors, ensure_ascii=False),\n        \"s1_warnings_json\": json.dumps(warnings, ensure_ascii=False),\n    }\n"
