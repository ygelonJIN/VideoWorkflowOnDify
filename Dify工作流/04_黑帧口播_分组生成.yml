    - id: h00
      type: custom
      data:
        type: code
        title: H00_选择层
        code_language: python3
        code: "def main(package_json: str = \"\") -> dict:\n    \"\"\"选择层：目录（含槽位元数据）与组件模板。由 gen_catalog.py 生成，不要手改。\"\"\"\n    import json\n    CATALOG = json.loads(r\"\"\"{\"background\": {\"B23\": {\"name\": \"半调网点\", \"note\": \"报纸印刷式网点，密度随位置变化；偏社会、舆论、被评价\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B24\": {\"name\": \"扫描线\", \"note\": \"细横线加一条扫描带，像仪表在读数据；偏检测、审核\", \"family\": \"line\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B25\": {\"name\": \"点阵辉光\", \"note\": \"密集亮点向中心聚，有指标感；偏数字、成绩、金额\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B26\": {\"name\": \"同心环\", \"note\": \"一圈一圈扩散，把注意力收到一个点；偏聚焦、回到自身\", \"family\": \"ring\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B27\": {\"name\": \"等高线\", \"note\": \"一层层波动的线场，像把标准画成地形；偏尺度、门槛、审判\", \"family\": \"line\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B28\": {\"name\": \"横向拉丝\", \"note\": \"细横线快速掠过，有速度和迭代感\", \"family\": \"line\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B29\": {\"name\": \"雪点\", \"note\": \"小点慢慢飘，安静；偏时间、回忆、等待\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B30\": {\"name\": \"雨丝\", \"note\": \"斜斜的细线，压着情绪；偏低落、压力、怕\", \"family\": \"line\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B31\": {\"name\": \"像素溶解\", \"note\": \"块状像素聚散，东西在重组；偏推翻、重塑、转折\", \"family\": \"block\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B32\": {\"name\": \"棋盘\", \"note\": \"明暗方格，天生的对照与秩序；偏两种选择、取舍、规则\", \"family\": \"block\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B34\": {\"name\": \"光束\", \"note\": \"一束锥形光打下来，给出路和方向\", \"family\": \"light\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B35\": {\"name\": \"浮尘\", \"note\": \"细颗粒浮在光里，安静的资料感；偏日常、痕迹\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B36\": {\"name\": \"渐变网格\", \"note\": \"四团色光慢慢游，柔和有空气；偏温和、包容、自由\", \"family\": \"light\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B37\": {\"name\": \"云纹噪声\", \"note\": \"雾一样的云纹，适合抽象概念\", \"family\": \"noise\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B38\": {\"name\": \"扰动噪声\", \"note\": \"两层噪声互相扭曲，流体感强；偏混乱、纠缠、复杂\", \"family\": \"noise\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B39\": {\"name\": \"有机漂移\", \"note\": \"点群随噪声场起伏，像星空也像人群\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf1ff\"}, \"B49\": {\"name\": \"抖动网点\", \"note\": \"方点按明度疏密排开，暗处留黑；像老印刷或监控回放\", \"family\": \"dot\", \"base\": \"#07090f\", \"ink_primary\": \"#eaf7f1\"}, \"B50\": {\"name\": \"透视网格\", \"note\": \"带透视的网格从地平线往画面外推，中间一条暖光\", \"family\": \"line\", \"base\": \"#0a0710\", \"ink_primary\": \"#eaf7f1\"}, \"B51\": {\"name\": \"流星\", \"note\": \"十几颗流星错峰斜下，配一层会呼吸的星点；暗底最适合压亮字\", \"family\": \"line\", \"base\": \"#05070c\", \"ink_primary\": \"#eef6ff\"}, \"B53\": {\"name\": \"蜂巢网格\", \"note\": \"六边形网格从中心向外一波波亮起，冷青线；科技、结构类话题\", \"family\": \"line\", \"base\": \"#070a0a\", \"ink_primary\": \"#eaf7f1\"}, \"B54\": {\"name\": \"纵深粒子\", \"note\": \"伪 3D 点云往镜头漂，近的点更大更亮；适合讲纵深与进入\", \"family\": \"dot\", \"base\": \"#05070a\", \"ink_primary\": \"#eef6ff\"}}, \"component\": {\"U01\": {\"id\": \"U01\", \"name\": \"信息卡片\", \"note\": \"标题 + 2–3 行正文；一屏一个主张，最通用\", \"repeat\": false, \"before\": 2, \"row\": 0, \"after\": 0, \"rows_default\": 1}, \"U02\": {\"id\": \"U02\", \"name\": \"步骤条\", \"note\": \"横向 3–4 步带完成态；讲流程、先后\", \"repeat\": false, \"before\": 6, \"row\": 0, \"after\": 0, \"rows_default\": 1}, \"U03\": {\"id\": \"U03\", \"name\": \"网格面板\", \"note\": \"2×2 / 3×2 标签格；并列概念、清单\", \"repeat\": true, \"before\": 0, \"row\": 1, \"after\": 0, \"rows_default\": 2}, \"U04\": {\"id\": \"U04\", \"name\": \"状态标签\", \"note\": \"一排 pill 标签；状态、等级、分类\", \"repeat\": false, \"before\": 2, \"row\": 0, \"after\": 0, \"rows_default\": 1}, \"U05\": {\"id\": \"U05\", \"name\": \"数据行\", \"note\": \"标签与数值对齐成行；有数字指标\", \"repeat\": true, \"before\": 0, \"row\": 2, 