    - id: h12_build_package
      type: custom
      data:
        type: code
        title: H12_打包单一构建输出
        code_language: python3
        code: "def main(request_id: str, html_document: str, voiceover_script: str,\
          \ heygen_response_json: str) -> dict:\n    import json\n\n    html = str(html_document\
          \ or \"\").strip()\n    voiceover = str(voiceover_script or \"\").strip()\n\
          \    if \"<!doctype html>\" not in html.lower():\n        raise ValueError(\"\
          html_document 不是完整 HTML\")\n    if not voiceover:\n        raise ValueError(\"\
          voiceover_script 已批准口播不能为空；字幕必须以它为文字真值\")\n    try:\n        response =\
          \ json.loads(heygen_response_json or \"{}\")\n    except Exception as exc:\n\
          \        raise ValueError(\"heygen_response_json 不是合法 JSON\") from exc\n\
          \    if not isinstance(response, dict):\n        raise ValueError(\"heygen_response_json\
          \ 必须是对象\")\n\n    data = response.get(\"data\") if isinstance(response.get(\"\
          data\"), dict) else {}\n    video_id = str(data.get(\"id\") or data.get(\"\
          video_id\") or data.get(\"videoId\") or response.get(\"video_id\") or \"\
          \").strip()\n    status = str(data.get(\"status\") or data.get(\"state\"\
          ) or response.get(\"status\") or response.get(\"state\") or \"\").strip().lower()\n\
          \    video_url = str(data.get(\"video_url\") or data.get(\"videoUrl\") or\
          \ response.get(\"video_url\") or response.get(\"videoUrl\") or \"\").strip()\n\
          \    if status != \"completed\":\n        raise ValueError(\"HeyGen 未完成，禁止输出\
          \ processing/failed 的最终构建包：status=\" + status)\n    if not video_url:\n\
          \        raise ValueError(\"HeyGen completed 响应缺少明确 video_url\")\n    if\
          \ video_id and video_id not in video_url:\n        raise ValueError(\"video_url\
          \ 与 video_id 不一致，拒绝输出可能串片的构建包\")\n\n    package = {\n        \"request_id\"\
          : str(request_id or \"\").strip(),\n        \"html_document\": html,\n \
          \       \"voiceover_script\": voiceover,\n        \"heygen_response_json\"\
          : response,\n        \"heygen_video_id\": video_id,\n        \"heygen_status\"\
          : status,\n        \"heygen_video_url\": video_url,\n    }\n    return {\n\
          \        \"build_package_json\": json.dumps(package, ensure_ascii=False),\n\
          \        \"voiceover_script\": voiceover,\n    }\n"
        variables:
        - variable: request_id
          value_selector:
          - a00
          - request_id
          value_type: string
        - variable: html_document
          value_selector:
          - h01
          - text
          value_type: string
        - variable: voiceover_script
          value_selector:
          - a16
          - approved_voiceover_script
          value_type: string
        - variable: heygen_response_json
          value_selector:
          - h11_final_response
          - heygen_response_json
          value_type: string
        outputs:
          build_package_json:
            type: string
            children: null
          voiceover_script:
            type: string
            children: null
