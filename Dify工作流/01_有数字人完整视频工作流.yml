    - id: a04
      type: custom
      data:
        type: llm
        title: A04_选择内容角度
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen3.8-flash
          mode: chat
          completion_params:
            temperature: 0.2
            max_tokens: 1200
        prompt_template:
        - id: a04-system
          role: system
          text: "# 内容策略师\n\n你是任意主题的中文短视频内容策略师。只能从已确认 brief 和审核主题池中选择一个角度，不得自行发明事实，也不得把主题强行解释成某个固定行业。\n\
            \n## 输入\n\n- `brief`：主题、发布主体、目标观众、问题/需求、证据、价值、CTA、平台、目标时长\n- `approved_topics`：已审核主题池\n\
            - `history`：已使用主题和效果反馈\n\n## 目标\n\n一条视频只解决一个用户认知任务：提出问题、解释概念、展示步骤、分享经历、验证方法、给出启发，或引导一个\
            \ CTA。\n\n## 约束\n\n1. 主题可以是产品、知识、运动、赚钱、成长、生活、观点或任意用户需求。\n2. 不选择无法由 brief\
            \ 和用户事实支持的案例角度。\n3. 一条视频只讲一个核心角度，不堆砌全部知识点。\n4. Hook 必须具体，避免“大家好”“今天介绍”。\n\
            5. 数字、价格、经历和结果只能来自 `facts_confirmed`。\n6. 输出 JSON，不输出 Markdown。\n\n##\
            \ 输出 JSON\n\n```json\n{\n  \"angle_id\": \"string\",\n  \"angle_type\"\
            : \"问题型|经历型|方法型|结果型|场景型|行动型\",\n  \"core_message\": \"一句话核心结论\",\n  \"\
            audience_tension\": \"目标观众当前在意的问题\",\n  \"hook_candidates\": [\"候选 Hook\
            \ 1\", \"候选 Hook 2\", \"候选 Hook 3\"],\n  \"proof_priority\": [\"本条优先使用的已确认事实或经验\"\
            ],\n  \"claims_to_verify\": [\"无法确认、需要人工核验的内容\"],\n  \"selection_reason\"\
            : \"选择该角度的原因\",\n  \"excluded_topics\": [\"本次明确不讲的内容\"]\n}\n```\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 1710
        y: 295
      positionAbsolute:
        x: 1710
        y: 295
      sourcePosition: right
      targetPosition: left
      width: 310
      height: 155
    - id: a05
      type: custom
      data:
        type: code
        title: A05_解析内容角度
        code_language: python3
        code: "def main(strategy_text: str) -> dict:\n    import json\n    import\
          \ re\n\n    raw = str(strategy_text or \"\").strip()\n    raw = re.sub(r\"\
          ^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.I)\n    try:\n       \
          \ data = json.loads(raw)\n    except Exception:\n        start, end = raw.find(\"\
          {\"), raw.rfind(\"}\")\n        data = {}\n        if start >= 0 and end\
          \ > start:\n            try:\n                data = json.loads(raw[start:end\
          \ + 1])\n            except Exception:\n                data = {}\n    if\
          \ not isinstance(data, dict):\n        data = {}\n    fallback_warning =\
          \ \"\"\n    if not data:\n        fallback_warning = \"内容策略 JSON 无法解析，已生成基础角度继续\"\
          \n        data = {\"core_message\": raw[:200] or \"聚焦一个具体业务问题\", \"angle_id\"\
          : \"angle_generated\"}\n\n    warnings = [fallback_warning] if fallback_warning\
          \ else []\n    core_message = str(data.get(\"core_message\", \"\")).strip()\n\
          \    hook = str(data.get(\"hook\", \"\")).strip()\n    hooks = data.get(\"\
          hook_candidates\")\n    if not isinstance(hooks, list):\n        hooks =\
          \ []\n    hooks = [str(item).strip() for item in hooks if str(item).strip()]\n\
          \    if not hooks:\n        hooks = [hook or core_message or \"聚焦一个具体业务问题\"\
          ]\n        warnings.append(\"hook_candidates 缺失，已使用 hook/core_message 生成\"\
          )\n    data[\"hook_candidates\"] = hooks\n    data[\"hook\"] = hooks[0]\n\
          \n    if not core_message:\n        core_message = data[\"hook\"]\n    \
          \    data[\"core_message\"] = core_message\n        warnings.append(\"core_message\
          \ 缺失，已使用 hook 生成\")\n    if not str(data.get(\"angle_id\", \"\")).strip():\n\
          \        data[\"angle_id\"] = \"angle_generated\"\n        warnings.append(\"\
          angle_id 缺失，已生成 angle_generated\")\n    data[\"normalization_warnings\"\
          ] = warnings\n\n    return {\n        \"strategy_json\": json.dumps(data,\
          \ ensure_ascii=False),\n        \"angle_id\": str(data[\"angle_id\"]),\n\
          \        \"hook\": str(data[\"hook\"]),\n        \"core_message\": core_message,\n\
          \        \"parse_ok\": True\n    }\n"
        variables:
        - variable: strategy_text
          value_selector:
          - a04
          - text
          value_type: string
        outputs:
          strategy_json:
            type: string
            children: null
          angle_id:
            type: string
            children: null
          hook:
            type: string
            children: null
          core_message:
            type: string
            children: null
          parse_ok:
            type: boolean
            children: null
      position:
        x: 2065
        y: 315
      positionAbsolute:
        x: 2065
        y: 315
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 177
    - id: a06
      type: custom
      data:
        type: llm
        title: A06_生成口播文案
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen3.8-flash
          mode: chat
          completion_params:
            temperature: 0.2
            max_tokens: 2200
        prompt_template:
        - id: a06-system
          role: system
          text: "# 任意主题口播文案\n\n你是自然、有信息量的中文短视频口播文案。活动需求只是内容种子，不是完整口播。请根据用户给定主题扩写成完整视频叙事；主题可以是产品、知识、运动、赚钱、成长、经历、观点或任何其他需求。\n\
            \n## 生成策略\n\n- 以成功生成视频为第一目标，内容宁可写充分，也不要输出过短口播。\n- 30 秒方案优先写到 320–420 个字符、12–18\
            \ 个完整句子。\n- 最终门禁保持宽：80–500 个字符、至少 3 个完整句子都通过。\n- 根据主题合理扩写问题背景、关键概念、步骤方法、适用场景、经验提醒、可执行动作和\
            \ CTA。\n- 只能使用已确认数字、经历、案例、价格和效果；通用解释可以合理扩写，但不得编造数据、经历或承诺。\n\n## 字幕规则\n\
            \n- 每个完整句子就是一条字幕，一条字幕不得被截断。\n- 不设置字幕字数上限，不因为字数把两个半句拼在一起。\n- 只有 `。！？!?`\
            \ 表示完整句子结束；逗号、顿号、冒号、分号不能切开字幕。\n- `burned_in_caption_lines` 必须逐字等于 `sentences[].text`，包含完整句末标点。\n\
            \n## 硬性规则\n\n1. 首句在 2 秒内提出问题、冲突、结果或鲜明观点。\n2. 一条视频只讲一个核心角度，但可以把这个角度讲完整。\n\
            3. 不确定内容进入 `claims_to_verify`。\n4. 禁止绝对化承诺、保证结果、制造恐慌或贬低他人。\n5. 口播不得包含镜头指令、括号、Markdown\
            \ 或舞台说明。\n6. 英文品牌词和数字必须适合朗读。\n7. 只输出严格合法 JSON，不输出解释。\n\n## 输出 JSON\n\n\
            ```json\n{\n  \"voiceover_script\": \"完整口播全文，使用完整句末标点。\",\n  \"sentences\"\
            : [\n    {\"id\": \"s01\", \"text\": \"第一条完整句子。\", \"purpose\": \"hook\"\
            }\n  ],\n  \"burned_in_caption_lines\": [\n    \"第一条完整句子。\"\n  ],\n  \"\
            claims_to_verify\": []\n}\n```\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 2420
