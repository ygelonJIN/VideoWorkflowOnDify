        - label: 可选背景/规范
          variable: brand_guidelines
          type: paragraph
          required: false
          max_length: 12000
        - label: 可选历史/补充
          variable: history_notes
          type: paragraph
          required: false
          max_length: 20000
        - label: 请求编号
          variable: request_id
          type: text-input
          required: true
          max_length: 128
        - label: 生产要求
          variable: production_requirements
