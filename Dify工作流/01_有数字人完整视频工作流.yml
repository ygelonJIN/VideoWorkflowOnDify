    - id: h01p
      type: custom
      data:
        type: llm
        title: H01P_图像计划
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        prompt_template:
        - id: h01p-system
          role: system
          text: "# 图像计划\n\n你是这支视频的**摄影指导，也是每一屏画面用法的决策者**。视觉定调已经定了隐喻、色彩、材质和光；你决定两件事：这一屏的画面由什么承担（真实照片 / 设计过的 HTML 背景），以及照片具体拍什么。下游会用 GPT Image API 按你的 prompt 逐张生成照片，场景组按你给的 `role` 落版。\n\n你**不写 HTML、不写 CSS、不写 GSAP**，只输出图像计划 JSON。\n\n## 输入\n\n- `approved_package_json`：{{#a16.approved_package_json#}}\n- `art_direction_json`：{{#h01d.text#}}\n- `design_brief`：{{#h00.design_brief#}}\n\n## 先定死一件事：这支片子用什么镜头语言\n\n在写任何单张之前，先给出**全片统一的摄影设定**，写进 `prompt_prefix`。它会被逐字拼到每张 prompt 前面，是画面一致性的唯一来源。必须包含：\n\n1. **介质**：数字电影 / 35mm 胶片 / 大画幅 / 手机纪实 / 监控感 / 显微。选一种，全片不许换。\n2. **光学**：焦段倾向（如 35mm 环境人像、85mm 压缩、100mm 微距）、光圈与景深（f/1.4 极浅景深 / f/8 全清晰）、是否有眩光与畸变。\n3. **光**：单一主光源方向与色温、补光比例、对比强度、有没有实用光源（窗、台灯、屏幕）。\n4. **色彩**：与 `art_direction_json.palette` 一致的色相与饱和倾向，暗部偏什么色。\n5. **质感**：颗粒、雾、灰尘、湿度、织物纹理，出现强度。\n6. **纪律句**：每张都必须遵守的两三条硬约束（主体不贴边、画面里不出现任何文字、单一光源、无拼贴）。\n\n`prompt_prefix` 用**英文**写，40–80 词。它只写全片通用的摄影设定，不写任何一屏的具体内容，也不要用大段抽象形容词淹没主体。\n\n## 每一屏先决定：这一屏的画面由谁承担\n\n**不是每一屏都要照片。** 逐屏读 `storyboard.scenes[].purpose`、`voiceover_text`、`argument_id`、`on_screen_text`、`visual_brief`，判断这一句需要什么：\n\n- 具体的人、物、地点、动作、关系、情绪、证据 → 用照片。\n- 抽象判断、对比、清单、数字、流程、结论、口号 → 用纯文字屏（只靠字号/断行/留白排），**不画图形**。\n- 一句话里同时有具体场景和抽象结论 → 照片做内容块，文字在另一半。\n- 全片不能每屏同一种用法；**相邻两屏的 `role` 不能相同**。\n\n`role` **只能取这五个值之一**：`band` / `inset` / `portrait` / `thumb` / `html`（另有 `texture` 做底纹）。**没有 `full`、`cover`、`background`、`large` 这些写法**，写了下游会当成满屏照片铺上去，文字就得压在画面上（2026-11-15 实测：`full` 让一整屏变成全屏图背景）。**照片永远不铺满整屏**：每一屏的底色都由背景卡（B 系列）承担，照片永远是内容块，**占屏最多四分之一**。\n\n**`role` 决定照片的形状，不只是一个名字**（2026-11-17 落版实测值，照这个写 prompt 的构图，别按别的比例想）：\n\n- `band`：通栏横带 900×560（1.6:1，占屏约 24%），放上带或下带，文字整块让到另一带。适合「这一屏就该看这个画面，但字仍然是主角」。\n- `inset`：一侧横块 620×760（0.82:1，占屏约 23%），文字在另一侧成栏。适合「画面讲一个事实，文字讲它意味着什么」。\n- `portrait`：一侧细竖 460×1100（0.42:1，占屏约 24%），是一个视觉锚，文字绕在另一侧。适合人物、手、局部物件。\n- `thumb`：一侧小图 360×450（0.8:1，占屏约 8%），只做证据/注脚，文字是绝对主角。适合「一句判词 + 一张佐证」。\n- `texture`：照片降对比做底纹，文字是主体。\n\n因为 `band` 是横带、`inset`/`portrait`/`thumb` 是竖块或方图，写 prompt 时要按形状想构图：横带里的主体横向铺开、别把人竖着摆在正中；竖块里的主体是纵向的、上下有余量。写反了，落版裁切会把主体切掉。\n\n**`size` 不由你决定**：生图尺寸由 `role` 自动推导（`band` → 横 3:2、`inset` / `thumb` → 方 1:1、`portrait` → 2:3 竖、`texture` → 2:3 竖），计划里不用写 `size`，写了也不生效。你只按 role 的形状写 prompt 和构图。\n- `html`：这一屏不生成照片，是**纯文字屏**：画面由文字排版本体承担（超大标题、竖排、留白节奏），背景只有底色和光。`html_brief` 写这一屏的字怎么排、哪几个字最重，不写形状。**这一版 HTML 不画任何图形**，所以不要把 `html` 当作\"用代码画画面\"的挡箭牌；能用照片讲的就用照片。\n- `html`：这一屏不生成照片，是**纯文字屏**：画面由文字排版本体承担（超大标题、竖排、留白节奏），背景只有底色和光。`html_brief` 写这一屏的字怎么排、哪几个字最重，不写形状。**这一版 HTML 不画任何图形**，所以不要把 `html` 当作\"用代码画画面\"的挡箭牌；能用照片讲的就用照片。\n\n硬底线：整片至少一张照片，避免退化成纯文字 PPT；除此之外不设照片数量配额。`role` 的分布由内容决定，不按顺序轮转。`html` 屏必须能说出\"为什么这一句用代码比用照片更准\"。\n\n## 每张照片必须只属于这一句\n\n这是最重要的一条：**换掉这一句的标题，这张图就应该不成立**。\n\n- 从 `voiceover_text` 里抓具体名词、动作、关系、场景；`visual_brief` 只作参考，两者冲突时以口播原句为准。\n- prompt 的第一句就写主体和动作，不要先铺风格。\n- 每张图至少有一个\"只属于这句话\"的细节：具体物件、数量、磨损、时间、天气、人的动作、空间关系。\n- 禁止万能镜头：空房间、空盘子、抽象纹理、无人桌面、纯光影墙、通用城市远景、通用咖啡杯。除非这一句讲的就是\"空 / 缺席 / 等待\"，否则不要用。\n- 允许人物：手、背影、侧脸、自然表情、群体都可以。生活、职场、消费、家庭类可以自然露脸；纪念、医疗、未成年人、隐私题材避免可识别正脸。不要摆拍看镜头，不要塑料 AI 脸。\n- 是**同一个世界**，不是同一个房间：光、色、介质、质感要连续，空间可以随论点换，不要把所有句子都按在同一张桌子上。\n- 一张图只讲一个视觉事实。要讲两个信息就拆成两张，不要塞进一张。\n- 画面里不出现文字、字母、数字、logo、水印、UI 元素。需要出现纸、书、屏幕时，写空白纸、虚焦屏幕、背面。\n- 具体到可以被拍出来：物件、材质、位置、光的方向、景深、天气、时间。\n- `prompt` 用**英文**写，70–120 词，描述\"画面里有什么 + 动作 + 光怎么打 + 相机在哪 + 什么质感\"。\n- 同一张给一条**中文版** `prompt_zh`，50–100 字，是英文那条的等价说法，不是另写一个画面。\n- `negative` 写这张图具体不要出现什么（例如\"no extra plates, no smiling posed family\"），不要只写 no text。\n\n## 镜头怎么动：`motion_hint` 是摄影机决定，不是标签\n\n`motion_hint` 决定这一屏照片在片子里怎么运动，动效节点会照着它做。它不是随便填一个词：\n\n- 可选意图：`push-in`（慢慢靠近主体）、`pull-out`（从近退到环境）、`pan-left` / `pan-right`（横移扫过）、`tilt-up` / `tilt-down`（纵向摇）、`parallax`（前后景差速）、`reveal`（从遮罩/边缘揭示）、`hold`（真正需要静止）。\n- 按这张照片的内容选：手部动作适合 `push-in` 或 `parallax`；空间关系适合 `pan`；证据/物件适合 `reveal`；情绪收束才用 `hold`。\n- **不要默认 `hold`**。相邻照片屏不要用同一个 `motion_hint`；同一支片子里 `hold` 只留给真正需要静止的那一两屏。\n- 如果用了 `hold`，在 `why` 里写清为什么这一屏必须静止；写不出来就换一种运动。\n\n## html 屏怎么写\n\n- `html_brief` 用中文写清这一屏的文字怎么排：字级、断行、对齐、留白，哪一句最大；主色、光从 `art_direction_json` 来。不要写形状、线条、色块、刻度。\n- `subject` 写这一屏的 HTML 画面一句话。\n- `prompt`、`prompt_zh`、`negative`、`text_safe_zone` 可以留空。\n- `motion_hint` 写这一屏背景层想要的运动意图（例如 `reveal`、`parallax`、`hold`）。\n- `html` 屏不是\"空白页\"，但也不许画图形：它靠字够大、够狠、断行够准来成立。说不出这一屏的字怎么排，就改用照片。\n\n## 照片必须和这一句有关系（2026-11-14 加）\n\n现在的照片全片是同一个调子的\"手、纸、窗、走廊\"——安静但没有信息，跟文案没有对应关系。每一张照片的 prompt 里必须写清**它拍的是什么具体物件/动作/场景**，以及**为什么这句话配这个画面**。\n\n- 禁止用通用意象兜底：一只手、一张纸、一扇窗、一条空走廊、一团光。除非文案本身讲的就是\"手/纸/窗\"。\n- 每条 prompt 要能回答：\"这句话讲的是什么具体东西，照片里那个东西在哪里。\"\n- 同一个物件可以反复出现，但每次的状态要不同（握住/松开、写完/空白、亮着/灭了）。\n- **一个物件全片最多两次，且必须服务两个不同的论点；相邻两屏不许用同一个物件。** 第三次就该换意象，否则观众只记得那个衬托物，记不住你说的话（2026-11-17 实测：钥匙在相邻两屏各出现一次，成片像房产广告，跟「成功考试」这个论点没关系）。\n- **先查比喻本身有没有被拍出来。** 文案反复用的那个比喻（考试、称重、赛道、过闸机、排队……），如果全片一张图都没拍它，说明意象整体偏了：先补那张比喻本体，再谈别的。抽象判断不是不要意象的理由，用比喻的实物去拍。\n\n## 输出（硬性）\n\n只输出 JSON 对象：第一个字符 `{`，最后一个 `}`，不要代码围栏、不要解释。\n\n```json\n{\n  \"image_plan_version\": \"1.1\",\n  \"prompt_prefix\": \"English style prefix, 40-80 words, identical for every image\",\n  \"style_bible\": {\n    \"medium\": \"介质与理由\",\n    \"optics\": \"焦段、光圈、景深\",\n    \"lighting\": \"主光方向、色温、对比\",\n    \"palette\": \"色彩倾向，与 art_direction 对齐\",\n    \"texture\": \"颗粒、雾、湿度、材质\",\n    \"consistency_rules\": [\"画面之间要延续的锚点\"],\n    \"avoid\": [\"全片禁止出现的东西\"]\n  },\n  \"images\": [\n    {\n      \"id\": \"s01\",\n      \"scene_id\": \"s01\",\n      \"role\": \"band\",\n      \"subject\": \"中文一句话：这张画面里是什么\",\n      \"why\": \"中文一句话：为什么这张图只服务这一句\",\n      \"prompt\": \"English prompt for this single frame, 70-120 words\",\n      \"prompt_zh\": \"同一张画面的中文提示词，可直接粘进即梦/豆包\",\n      \"negative\": \"English, what must not appear in this frame\",\n      \"text_safe_zone\": \"bottom\",\n      \"motion_hint\": \"push-in\"\n    },\n    {\n      \"id\": \"s02\",\n      \"scene_id\": \"s02\",\n      \"role\": \"html\",\n      \"subject\": \"这一屏由 HTML 背景承担的画面\",\n      \"why\": \"为什么这一句用代码比用照片更准\",\n      \"html_brief\": \"背景由哪些形状、线条、色块、刻度、文字层级组成\",\n      \"motion_hint\": \"reveal\"\n    }\n  ],\n  \"coverage\": {\n    \"scene_count\": 0,\n    \"photo_count\": 0,\n    \"html_count\": 0,\n    \"role_mix\": {\"band\": 0, \"inset\": 0, \"portrait\": 0, \"thumb\": 0, \"texture\": 0, \"html\": 0},\n    \"notes\": \"如果有哪一屏确实只能用同构延续，写在这里\"\n  }\n}\n```\n\n## 纪律\n\n- `images` 的 `scene_id` 集合必须**等于** `storyboard.scenes` 的 `scene_id` 集合，顺序一致，不多不少；`html` 屏也要出现，不能省略。\n- 每张 `prompt` 都必须能独立使用：不要把\"同上\"\"延续上一张\"写进 prompt。\n- `prompt_zh` 与 `prompt` 必须描述同一张画面：主体、光、景别、构图一致。\n- 相邻两屏 `role` 不同；全片至少出现三种 `role`（场景数不足三种时除外）。\n- `prompt_prefix` 里不要出现具体某一张的内容。\n- 不写 HTML、CSS、GSAP、组件、字幕。\n- 不承诺画面里会出现文字：所有文字由 HTML 叠上去。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 8060
        y: 640
      positionAbsolute:
        x: 8060
        y: 640
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 168
    - id: h01pv
      type: custom
      data:
        type: code
        title: H01PV_整理图像计划
        code_language: python3
        code: "def main(image_plan_text: str, approved_package_json: str) -> dict:\n    \"\"\"归一化图像计划：保证每个分镜都有画面承担者，字段合法，并拆出给 HTML 节点用的精简版。\"\"\"\n    import json\n    import re\n\n    warnings = []\n    raw = str(image_plan_text or \"\").strip()\n    raw = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.I)\n    plan = None\n    if raw:\n        try:\n            plan = json.loads(raw)\n        except Exception as error:\n            start = raw.find(\"{\")\n            if start >= 0:\n                for index in range(len(raw) - 1, start, -1):\n                    if raw[index] != \"}\":\n                        continue\n                    candidate = re.sub(r\",\\s*([}\\]])\", r\"\\1\", raw[start:index + 1])\n                    try:\n                        plan = json.loads(candidate)\n                        break\n                    except Exception:\n                        continue\n            if plan is None:\n                warnings.append(\"图像计划 JSON 无法解析（%s）\" % str(error)[:60])\n    if not isinstance(plan, dict):\n        plan = {}\n\n    try:\n        package = json.loads(approved_package_json or \"{}\")\n    except Exception:\n        package = {}\n    storyboard = package.get(\"storyboard\") if isinstance(package.get(\"storyboard\"), dict) else {}\n    scenes = [item for item in (storyboard.get(\"scenes\") or []) if isinstance(item, dict)]\n\n    # html = 这一屏不生成照片，由场景组用 CSS 背景承担画面。\n    # 2026-11-15：prompt 里没有 full 这一档（照片永远不铺满整屏），\n    # 这里却把 full 当合法值、还把未知值归一化成 full——模型写 full 就整屏铺满、\n    # 文字只好压在画面上。合法档位与 prompt 完全对齐：large / inset / portrait / texture / html。\n    # 2026-11-17：档位收成小图。large 保留为 band 的别名（旧稿/旧提示词还能跑），\n    # 但落版尺寸由下游 H02SK 的 RECTS 统一，这里只做合法性归一化。\n    allowed_roles = {\"band\", \"inset\", \"portrait\", \"thumb\", \"texture\", \"html\"}\n    # 生图尺寸不归模型管：role 已经决定形状，size 是派生值。\n    # 以前模型在计划里自选 size，出现过\"1.6:1 的横带配竖图、0.82:1 的竖块配横图\"，\n    # object-fit:cover 硬裁 46–58%。现在按 role 定死，非 html 屏不接受外部值。\n    ROLE_SIZE = {\n        \"band\":     \"1536x1024\",   # 1.50   vs 落版 1.61（横带）\n        \"inset\":    \"1024x1024\",   # 1.00   vs 落版 0.82（一侧竖块）\n        \"portrait\": \"1024x1536\",   # 0.667  vs 落版 0.42（细竖，OpenAI 能出最竖的一档）\n        \"thumb\":    \"1024x1024\",   # 1.00   vs 落版 0.80（小图）\n        \"texture\":  \"1024x1536\",   # 0.667  vs 落版 0.5625（底纹）\n        \"html\":     \"\",\n    }\n    # 只留 gpt-image-1 认的三种。1080x1920 只有火山方舟收，混进来会让 OpenAI 直接 400。\n    allowed_sizes = {\"1024x1536\", \"1536x1024\", \"1024x1024\"}\n    allowed_motion = {\"push-in\", \"pull-out\", \"pan-left\", \"pan-right\", \"tilt-up\", \"reveal\", \"parallax\", \"hold\"}\n    allowed_zones = {\"top\", \"bottom\", \"left\", \"right\", \"center\"}\n\n    items = plan.get(\"images\") if isinstance(plan.get(\"images\"), list) else []\n    by_scene = {}\n    cleaned = []\n    used_ids = set()\n    for index, item in enumerate(items):\n        if not isinstance(item, dict):\n            continue\n        scene_id = str(item.get(\"scene_id\") or \"\").strip()\n        image_id = str(item.get(\"id\") or scene_id or \"img%02d\" % (index + 1)).strip()\n        image_id = re.sub(r\"[^A-Za-z0-9_-]\", \"\", image_id) or \"img%02d\" % (index + 1)\n        while image_id in used_ids:\n            image_id += \"_b\"\n        used_ids.add(image_id)\n        role = str(item.get(\"role\") or \"band\").strip().lower()\n        if role == \"large\":\n            # large 是旧档位名，现在等同 band（900×560 横带），不是错，不报 warning。\n            role = \"band\"\n        if role in (\"full\", \"cover\", \"background\", \"photo\"):\n            warnings.append(\"%s role=%s 是满屏写法，已降级为 band（照片不铺满整屏）\" % (image_id, role))\n            role = \"band\"\n        elif role not in allowed_roles:\n            warnings.append(\"%s role=%s 已归一化为 band\" % (image_id, role))\n            role = \"band\"\n        # size 只从 role 推导，模型写什么都不生效（和 x/y/w/h 同一条规矩）。\n        size = ROLE_SIZE.get(role, \"1024x1536\")\n        zone = str(item.get(\"text_safe_zone\") or \"\").strip().lower()\n        if zone not in allowed_zones:\n            zone = \"center\" if role == \"html\" else \"bottom\"\n        motion = str(item.get(\"motion_hint\") or \"\").strip().lower()\n        if motion not in allowed_motion:\n            motion = \"reveal\" if role == \"html\" else \"hold\"\n        prompt = str(item.get(\"prompt\") or \"\").strip()\n        subject = str(item.get(\"subject\") or \"\").strip()\n        html_brief = str(item.get(\"html_brief\") or \"\").strip()\n        why = str(item.get(\"why\") or \"\").strip()\n        if role == \"html\":\n            if not html_brief and subject:\n                html_brief = subject\n            if not html_brief:\n                warnings.append(\"%s 是 html 屏但没有 html_brief：场景组只能按背景语言兜底\" % image_id)\n        else:\n            if not prompt:\n                warnings.append(\"%s 没有 prompt，已用兜底镜头补上\" % image_id)\n                prompt = (\n                    \"A quiet photographic scene consistent with the film's established look, \"\n                    \"soft directional daylight from one side, shallow depth of field, \"\n                    \"generous negative space, photographic, no text, no logos.\"\n                )\n        entry = {\n            \"id\": image_id,\n            \"scene_id\": scene_id or image_id,\n            \"role\": role,\n            \"subject\": subject,\n            \"why\": why,\n            \"html_brief\": html_brief,\n            \"prompt\": prompt,\n            \"prompt_zh\": str(item.get(\"prompt_zh\") or \"\").strip(),\n            \"negative\": str(item.get(\"negative\") or \"\").strip(),\n            \"size\": size,\n            \"text_safe_zone\": zone,\n            \"motion_hint\": motion,\n        }\n        cleaned.append(entry)\n        if scene_id and scene_id not in by_scene:\n            by_scene[scene_id] = entry\n\n    prefix = str(plan.get(\"prompt_prefix\") or \"\").strip()\n    if not prefix:\n        warnings.append(\"图像计划没有 prompt_prefix：每张图的风格一致性没有统一来源\")\n\n    # 每个分镜都必须有画面承担者。漏掉的屏不再补通用照片（那样只会生成无关画面），\n    # 改为补一屏 HTML 背景，交给场景组按本片背景语言做。\n    scene_ids = [str(scene.get(\"scene_id\") or \"\").strip() for scene in scenes]\n    missing = []\n    for scene in scenes:\n        scene_id = str(scene.get(\"scene_id\") or \"\").strip()\n        if not scene_id or scene_id in by_scene:\n            continue\n        missing.append(scene_id)\n        brief = str(scene.get(\"visual_brief\") or scene.get(\"on_screen_text\") or \"\").strip()[:80]\n        entry = {\n            \"id\": scene_id,\n            \"scene_id\": scene_id,\n            \"role\": \"html\",\n            \"subject\": brief or \"按分镜补的无图屏\",\n            \"why\": \"图像计划漏了这一屏，先用 HTML 背景兜底，避免出现无关照片\",\n            \"html_brief\": \"按本片 art_direction 的底色、材质和线条做一屏抽象背景，文字为主；不画具象物体。%s\" % (brief or \"\"),\n            \"prompt\": \"\",\n            \"prompt_zh\": \"\",\n            \"negative\": \"\",\n            \"size\": \"\",\n            \"text_safe_zone\": \"center\",\n            \"motion_hint\": \"reveal\",\n        }\n        cleaned.append(entry)\n        by_scene[scene_id] = entry\n    if missing:\n        warnings.append(\"这些分镜没有配图，已补 HTML 背景兜底：\" + \"、\".join(missing[:8]))\n\n    extra = [entry[\"scene_id\"] for entry in cleaned if entry[\"scene_id\"] and entry[\"scene_id\"] not in scene_ids]\n    if extra:\n        warnings.append(\"图像计划里有分镜之外的多余图片（下游不会用）：\" + \"、\".join(sorted(set(extra))[:8]))\n\n    photo_count = sum(1 for entry in cleaned if entry[\"role\"] != \"html\")\n    html_count = sum(1 for entry in cleaned if entry[\"role\"] == \"html\")\n    if photo_count == 0:\n        warnings.append(\"全片没有任何真实照片：至少需要一张，否则会退化成纯文字 PPT\")\n\n    ordered = [entry for entry in cleaned if entry[\"scene_id\"] in scene_ids]\n    for left, right in zip(ordered, ordered[1:]):\n        if left[\"role\"] == right[\"role\"]:\n            warnings.append(\"%s 与 %s 的 role 都是 %s：相邻两屏画面用法重复\" % (\n                left[\"scene_id\"], right[\"scene_id\"], left[\"role\"]))\n\n    style_bible = plan.get(\"style_bible\") if isinstance(plan.get(\"style_bible\"), dict) else {}\n    coverage = plan.get(\"coverage\") if isinstance(plan.get(\"coverage\"), dict) else {}\n    role_mix = {}\n    for entry in cleaned:\n        role_mix[entry[\"role\"]] = role_mix.get(entry[\"role\"], 0) + 1\n    full_plan = {\n        \"image_plan_version\": plan.get(\"image_plan_version\") or \"1.1\",\n        \"prompt_prefix\": prefix,\n        \"style_bible\": style_bible,\n        \"images\": cleaned,\n        \"coverage\": {\n            \"scene_count\": len(scenes),\n            \"photo_count\": photo_count,\n            \"html_count\": html_count,\n            \"role_mix\": role_mix,\n            \"notes\": str(coverage.get(\"notes\") or \"\"),\n        },\n    }\n    brief_items = [{\n        \"id\": entry[\"id\"],\n        \"scene_id\": entry[\"scene_id\"],\n        \"role\": entry[\"role\"],\n        \"why\": entry[\"why\"],\n        \"html_brief\": entry[\"html_brief\"],\n        \"size\": entry[\"size\"],\n        \"text_safe_zone\": entry[\"text_safe_zone\"],\n        \"motion_hint\": entry[\"motion_hint\"],\n        \"subject\": entry[\"subject\"][:80],\n    } for entry in cleaned]\n\n    return {\n        \"image_plan_json\": json.dumps(full_plan, ensure_ascii=False),\n        \"image_brief_json\": json.dumps({\n            \"prompt_prefix\": prefix,\n            \"style_bible\": {key: style_bible.get(key) for key in (\"medium\", \"optics\", \"lighting\", \"palette\", \"texture\", \"avoid\")},\n            \"images\": brief_items,\n        }, ensure_ascii=False),\n        \"image_count\": photo_count,\n        \"image_valid\": photo_count >= 1 and len(missing) == 0,\n        \"image_warnings_json\": json.dumps(warnings, ensure_ascii=False),\n    }\n"
        variables:
        - variable: image_plan_text
          value_selector:
          - h01p
          - text
          value_type: string
        - variable: approved_package_json
          value_selector:
          - a16
          - approved_package_json
          value_type: string
        outputs:
          image_plan_json:
            type: string
            children: null
          image_brief_json:
            type: string
            children: null
          image_count:
            type: number
            children: null
          image_valid:
            type: boolean
            children: null
          image_warnings_json:
            type: string
            children: null
