            max_tokens: 128000
        prompt_template:
        - id: h02sm-system
          role: system
          text: "# 单屏动效判断（只做选择，不写代码）\n\n你只判断**这一屏用什么动效**，输出一个 JSON。代码本地按编号展开，**你一个字 JS 都不要写**。\n\n## 输入\n\n- `scene_json`：{{#h02i.item#}}（本屏分镜：`scene_id`、`motion` 节拍、`prev_scene`、`next_scene`、`motion_budget`）\n- `scene_spec`：{{#h02s.text#}}（本屏规格 JSON：`copy` 里每条 `role`、`components` 里每个 `anim`、以及 `media`，就是这一屏能动的目标）\n\n## 输出前自检（不过就重写）\n\n1. `preset` 只有三个可能值：`motion_budget.entrance` / `.state` / `.component`，一个字都不能改。\n2. 2 条：入场 + 状态变化；有组件时再加 1 条组件动效。**`motion_budget.state` 为空时**只输出入场那条，并在 JSON 顶层写 `\"budget_gap\": \"state\"`——不要自己编一个编号顶上，也不要因为少一条就把入场也省掉。\n3. 每条 `target` 都在规格里出现过（`copy[].role`、`components[].anim`、`media` 三选一）。动手前先把本屏 `copy[].role` 抄成一行（例如 `lead, body`），再逐个 target 与这一行**逐字**比对；不在这一行里的 target 一律不写。\n4. 两个 `target` 不重复；`fallback` 在 0.2–1.2；没有 `Math.random` / `repeat` / `yoyo`。\n\n## 输出（只输出 JSON，第一个字符 `{`）\n\n```json\n{\"scene_id\":\"s03\",\"motions\":[\n  {\"preset\":\"T01\",\"target\":\"title\",\"trigger\":\"word:答案\",\"fallback\":1.2,\"params\":{\"stagger\":0.06},\"reason\":\"口播说到答案时文字逐字落下\"},\n  {\"preset\":\"T06\",\"target\":\"num\",\"trigger\":\"sentence_start\",\"fallback\":0.3,\"params\":{\"to\":128},\"reason\":\"这一屏的核心数字从 0 涨到 128\"}\n]}\n```\n\n- `target`：只能取规格里出现过的 `data-anim` 名——`copy` 的 role（`title`/`lead`/`body`/`note`/`num`/`label`/`accent`）、`components[].anim`、以及 `media`。只写名字，不要写选择器。\n- `trigger`：`word:关键词`（口播里的词）或 `sentence_start`。\n- `fallback`：兜底秒数（本屏内相对秒）。**写 0.2–1.2，不要超过 1.5**：写大了动作会拖到这一屏后半段，前几秒是死画面。\n- `params`：只覆盖需要改的参数，其余用默认。\n- `reason`：一句话，说明对应口播哪一部分。\n\n## 编号说明\n\n本屏能用的编号只有 `scene_json.motion_budget` 里那三个：`entrance`、`state`、`component`。\n**不要用别的编号，也不要改这三个值**——它们由 `H01X` 看全片内容选过，改了就和你这一屏的文案脱节。\n参数默认值与适用边界查 `能力库/动效库/能力卡.md` 对应编号那行，只在需要覆盖时写 `params`。\n\n## 规则\n\n- `K07 手绘下划线` / `K08 圈重点` 只能指 `accent` / `num` / `label` 这类**单行**目标；指 `title` / `body` 会在换行处错位。\n\n\n0. 编号只取 `motion_budget`；不要引用清单外的卡，也不要凭记忆写编号。\n1. 本屏编号已经由全片统一分配：入场用 `scene_json.motion_budget.entrance`，状态变化用 `scene_json.motion_budget.state`，**这屏有组件时再加一条组件动效用 `scene_json.motion_budget.component`**（值为空说明没有组件槽位）。`preset` 必须原样抄这三个编号，不得更换；你只决定 `target`、`trigger`、`fallback`、`params`、`reason`。\n2. 每屏输出 **2 条**，顺序固定：先入场，再状态变化。唯一例外是 `motion_budget.state` 为空：这时只输出入场，并写 `\"budget_gap\": \"state\"`，让本地点名 H01X 补编号——静默只给一条是错的，编一个编号顶上也是错的。\n3. `target` 必须**逐字**出现在本屏 `scene_spec` 里：先把 `copy[].role` 抄下来（这屏写了几条就只有这几个名字），再从里面挑一个；`components[].anim` 与 `media` 同理。分镜的 `on_screen_text` 不是 target，照它的意思编一个 `body` / `label` 出来不行。反例：这一屏 `copy` 只有 `title` 和 `lead`，你写 `body` —— 那个元素不存在，卡在浏览器里 `querySelector` 拿到 null 直接 return，这屏等于没做动效，而且检查器只数 preset 条数，照样显示达标。\n4. **所有东西都要有入场**：本屏每个 `data-anim` 内容层（除 `bg` / `scrim`）都必须从不可见走到可见，不能停在最终态直接出现；`bg` 和后层底色是唯一的例外，它们在屏起点就在。\n5. 入场那条的 `fallback` 就是入场时刻：写 0.2–0.6，最多 2.2（长屏可以放到中段，别全挤在开头）。`target` 选本屏的视觉承担者（有照片就用 `media`，无图屏用主文字节点或组件），不要选 `bg`。\n6. **不能落在常驻文字上的编号，看 `presets.json` 的 `text_safe`**，现在有 11 张：\n   - 离开画面：`T20` 物理落点、`T21` 正负加速度（1.8s 冲出 1296px）、`S12` 页面滚动（正文整体上滚 780px）、`X39` 推挤换屏（整块横移出画）；\n   - 结束时消失：`X31` 逃逸飞出（原元素 opacity→0、克隆飞走）、`S37` 折叠收起（scaleY→0.06 且 opacity→0）；\n   - 结束时不在原位：`S21` 中途打断（甩到 x=840 只回到 120）、`S20` 并发交叠（甩 600 转 90°）、`T17` 两次冲过（冲 780 不回落）、`S35` 排序变动（行位移 ±72px）；\n   - 放大不回落：`T16` 缩放匀速（从 1 倍放到 4 倍，9 个字 97px 放大后宽 3492px，整屏只剩笔画）。\n   这 11 张只能指装饰块或组件根。一旦指向 `title` / `lead` / `body` / `note` / `label` / `accent` / `num`，本地会换成同槽位替身卡（T21→T01、T20→T13、S12→S05、X39→X01、T16→T02、T17→T01、S20→X01、S21→S05、X31→X01、S37→X01、S35→X01），并在这一屏留一条 `data-motion-skipped`，那屏的动效就不再是你写的那条了。\n   **`target` 写成本屏不存在的元素时，这条会被整条丢弃**（2026-11-17 起），不会再有\"改拍到主文字上\"的兜底——那种改法会把一条状态卡效果拍在标题上，成片里就是标题被横向拍开。\n\n## 背景卡也能调参数\n\n本屏背景卡是 canvas 卡（`B23–B39`，编号由 H00 分配，`visual_budget.background_note` 写明这张卡画的是什么），它有默认参数，也允许你覆盖。在输出 JSON 里加一个顶层字段：\n\n```json\n{\n  \"background_params\": { \"step\": 18, \"speed\": 30 },\n  \"motions\": [ ... ]\n}\n```\n\n规则的只有两条：\n\n1. **只在 `presets.json` 里该卡的 `tunable` 列表里选**。清单外的键会被忽略。\n2. 值写数字或字符串，不要写表达式。范围参考卡上的默认值，别超过默认值的 2–3 倍，否则画面会糊成一片或完全看不见。\n\n常用可调项（各卡不同，以 `tunable` 为准）：`count` 数量、`step` 间距、`size` 尺寸、`speed` 速度、`seed` 种子（换一个就是另一种分布）、`color` 线/点的颜色、`cx`/`cy` 光心位置。\n\n不给 `background_params` 就用卡上的默认值——不给是对的，只有\"这一屏太密/太稀/光心位置不对\"时才调。\n\n### 颜色一定要跟着 `--bg` 走\n\n背景卡画的是白色点线，**只适配深底**。先看 `art_direction_json.tokens[\"--bg\"]`：\n\n| 底色 | 必须加 |\n|---|---|\n| 深场（`#0b0f18` 这类） | 什么都不用加 |\n| 浅纸（`#E8ECEB` 这类） | `\"invert\": 1` —— 白点变黑点，否则整层看不见 |\n| 想换色相 | `\"hue\": 数值`（度），深底可以往暖橙、冷紫偏 |\n| 想压淡 | `\"brightness\": 0.8` 或 `\"saturate\": 0.6` |\n\n浅底不加 `invert` 是最常见的废片原因：背景看起来\"一片纯白\"，其实点线都在，只是白色画在白色上。\n\n## target 怎么选：按编号族定，不是随便挑\n\n页面里能动的只有这几类元素：\n\n| 类别 | 是什么 | 例 |\n|---|---|---|\n| 文字角色 | 场景里带 `data-role` 的文字节点 | `title` `lead` `body` `note` `num` `label` `accent` |\n| 组件根 | 一个组件的最外层 | `card-1` `steps` `grid` `row-1` `bento` |\n| 画面层 | 照片 / 背景 | `media` |\n\n规则（按 preset 的族来）：\n\n- **拆字/拆词类（T01 / T02 / T03 / T09 / K21 / K22 / K23）**：只能指 `data-role` 文字节点。指到 `media`（没有文本）或 `card-1`（容器，里面混排标题和正文）都会把整块拆烂，成片里就是文字一起糊、一起浮。\n- **状态类（S02 / S04 / X01 / S05）**：指**被强调的那一个** `data-role` 节点；下划线、勾号、擦除都画在它身上，不要画在容器边。\n- **组件入场（UA01 / UA02 / UA03 / UA04 / UA06）**：指组件根。\n- **画面层（W 系列照片卡）**：指 `media`。\n\n**除了照片卡，任何动效都不要指 `media`**：照片的进出由转场节点负责，屏内动效再碰它就会和转场抢同一个属性，整屏照片会停在透明。\n\n**不要指 `copy`**：它是版面定位壳，动它等于把整屏文字搬走。\n\n**一屏两条动效不要指同一个元素**：入场指 `title`，状态就指 `accent` 或 `num`。同一元素上叠两个动效，后一个会把前一个盖掉。\n6. 不要输出代码、注释、解释，只输出 JSON。\n- **页间转场不归你**：两屏之间怎么换由转场脚本节点按 PT 编号实现（PT01–PT08）；屏内动效不要自己写转场，也不要动 `[data-anim=\"media\"]` 的覆盖属性。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        isInIteration: true
        iteration_id: h02i
      position:
        x: 8960
        y: 1450
      positionAbsolute:
        x: 8960
        y: 1450
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 160
      zIndex: 1002
    - id: h02sk
      parentId: h02i
      type: custom
      data:
        type: code
        title: H02SK_合并单屏HTML与动效
        code_language: python3
        code: "def main(html: str, script: str, scene_json: str = \"\") -> dict:\n    \"\"\"把单屏规格 JSON 渲染成唯一合法的 <section>，再合并动效脚本。\n\n    这一层负责\"结构正确\"：标签闭合、属性齐全、槽位不缺，全部由代码保证。\n    模型只交内容与判断，交回来的东西再怪也拼不出一份坏 HTML。\n    \"\"\"\n    import html as html_lib\n    import json\n    import re\n\n    # 数字人版（01）：右上角常驻真人小窗（x 766–1036 / y 120–600），照片与文字都要让开它。\n    # 小窗矩形由 H01Z 写进 #stage 的 --pip-* 变量，这里用同一组数字：\n    #   落版只做两件事：横带一律放**下带**；侧边块整体下移到小窗底边之下。\n    ROLES = (\"title\", \"lead\", \"body\", \"note\", \"num\", \"label\", \"accent\")\n    VOID = {\"img\", \"br\", \"hr\", \"input\", \"meta\", \"link\", \"source\", \"path\", \"circle\",\n            \"rect\", \"line\", \"polygon\", \"polyline\", \"ellipse\", \"use\", \"stop\"}\n\n    def parse_json(raw):\n        value = str(raw or \"\").strip()\n        value = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", value, flags=re.I)\n        try:\n            return json.loads(value)\n        except Exception:\n            start, end = value.find(\"{\"), value.rfind(\"}\")\n            if 0 <= start < end:\n                chunk = re.sub(r\",\\s*([}\\]])\", r\"\\1\", value[start:end + 1])\n                try:\n                    return json.loads(chunk)\n                except Exception:\n                    return {}\n        return {}\n\n    spec = parse_json(html)\n    scene = parse_json(scene_json)\n    if not isinstance(spec, dict):\n        spec = {}\n    if not isinstance(scene, dict):\n        scene = {}\n\n    sid = str(spec.get(\"scene_id\") or scene.get(\"scene_id\") or \"s01\").strip()\n    if not re.fullmatch(r\"[A-Za-z0-9_-]+\", sid):\n        sid = \"s01\"\n    comp = scene.get(\"composition\") if isinstance(scene.get(\"composition\"), dict) else {}\n    layout = spec.get(\"layout\") if isinstance(spec.get(\"layout\"), dict) else {}\n    zone = str(layout.get(\"zone\") or comp.get(\"text_zone\") or \"center-middle\")\n    align = str(layout.get(\"align\") or comp.get(\"align\") or \"center\").lower()\n    if align not in (\"left\", \"center\", \"right\"):\n        align = \"center\"\n    scale = str(layout.get(\"scale\") or comp.get(\"scale\") or \"两行块\")\n\n    visual = str(spec.get(\"visual\") or (\"photo\" if spec.get(\"media\") else \"html\")).lower()\n    if visual not in (\"photo\", \"html\"):\n        visual = \"html\"\n\n    bg = str(spec.get(\"bg\") or \"\").strip().upper()\n    budget = scene.get(\"visual_budget\") if isinstance(scene.get(\"visual_budget\"), dict) else {}\n    if not re.fullmatch(r\"B\\d{2}\", bg):\n        bg = str(budget.get(\"background\") or \"\").strip().upper()\n    if not re.fullmatch(r\"B\\d{2}\", bg):\n        bg = \"B23\"\n    # 背景卡的视觉族要落到 section 上：棋盘/扫描线/网点这类高密度底纹和文字同屏时，\n    # 版面层要靠它给文字垫一层柔光，否则 76px 的标题直接坐在格子上（2026-11-16 s03）。\n    bg_family = str(budget.get(\"background_family\") or \"\").strip().lower()\n    if bg_family not in (\"dot\", \"line\", \"ring\", \"block\", \"light\", \"noise\"):\n        bg_family = \"\"\n\n\n    def esc(text):\n        return html_lib.escape(str(text or \"\").strip(), quote=True).replace(\"\\n\", \"<br>\")\n\n    # ---- copy：纯文本 → 带角色的元素，标签只能是我们的 ----\n    copy_rows = []\n    seen = set()\n    for item in (spec.get(\"copy\") or []):\n        if not isinstance(item, dict):\n            continue\n        role = str(item.get(\"role\") or \"\").strip().lower()\n        text = str(item.get(\"text\") or \"\").strip()\n        if role not in ROLES or not text or role in seen:\n            continue\n        seen.add(role)\n        tag = \"h1\" if role == \"title\" else (\"span\" if role in (\"num\", \"label\", \"accent\") else \"p\")\n        copy_rows.append('    <%s data-role=\"%s\" data-anim=\"%s\">%s</%s>' % (tag, role, role, esc(text), tag))\n        if sum(1 for r in copy_rows if 'data-role=\"body\"') >= 2:\n            break\n    # 不再用分镜原文顶替缺失的 copy：规格里没写就是没写，交给 H02S 重出，\n    # 渲染层只负责把给的字段摆正（2026-11-16 定）。\n\n    # ---- 组件：只收标签平衡的片段；根节点补 data-anim ----\n    def balanced(fragment):\n        stack = []\n        for match in re.finditer(r\"<(/?)([A-Za-z][\\w-]*)([^>]*?)(/?)>\", fragment):\n            closing, name, _, selfclose = match.groups()\n            name = name.lower()\n            if closing:\n                if not stack or stack[-1] != name:\n                    return False\n                stack.pop()\n            elif not selfclose and name not in VOID:\n                stack.append(name)\n        return not stack\n\n    comp_rows = []\n    for item in (spec.get(\"components\") or [])[:2]:\n        if not isinstance(item, dict):\n            continue\n        fragment = str(item.get(\"html\") or \"\").strip()\n        if not fragment.startswith(\"<\") or not balanced(fragment):\n            continue\n        anim = re.sub(r\"[^\\w-]\", \"\", str(item.get(\"anim\") or \"comp\")) or \"comp\"\n        if 'data-anim=' not in fragment.split(\">\", 1)[0]:\n            fragment = re.sub(r\"^<([A-Za-z][\\w-]*)\", r'<\\1 data-anim=\"%s\"' % anim, fragment, count=1)\n        comp_rows.append(\"    \" + fragment)\n\n    # ---- css：所有选择器必须以本屏作用域开头，否则整段丢弃 ----\n    css = str(spec.get(\"css\") or \"\").strip()\n    if css:\n        selectors = re.findall(r\"([^{}]+)\\{\", css)\n        scoped = '[data-scene=\"%s\"]' % sid\n        if not selectors or any(scoped not in sel for sel in selectors):\n            css = \"\"\n\n    media_html = \"\"\n    media = spec.get(\"media\") if isinstance(spec.get(\"media\"), dict) else {}\n    if visual == \"photo\" and media:\n        # 照片框不采用模型随手给的坐标：按 role + 文字构图算出唯一槽位，\n        # 文字区自动落到另一半。模型写什么 x/y 都不影响\"字不压图\"。\n        role = str(media.get(\"role\") or \"band\").lower()\n        # 2026-11-17：role 决定照片**形态**，zone 只决定放哪一侧。\n        # 同一版又收了一次尺寸：照片是内容块，不是背景。大图吃掉半屏，\n        # 文字只能挤到窄栏里自己折行——\"图太大 + 字太小\"是同一个版面问题。\n        # 现在每一档都是小图，且保证另一侧/另一带留给文字 ≥480px（文字栏地板）：\n        #   band     通栏横带 900×520（1.7:1，占屏 23%），只在**下带**（y 1120–1640），文字占用上方整块\n        #   inset    一侧横块 620×700（0.89:1，占屏 21%），y 660 起，文字在另一侧成栏\n        #   portrait 一侧细竖 460×1000（0.46:1，占屏 22%），y 660 起，文字绕在另一侧\n        #   thumb    一侧小图 360×450（0.8:1，占屏 8%），y 700 起，文字是主角\n        #   texture  满屏降对比；large/full 只兼容旧写法（large 现在等同 band）\n        # 取位要和 layout_composer 的分带判据对得上：band 是 900 宽（83% 画幅），\n        # 那里按 80% 判\"通栏\"，文字走另一条带；侧边照片靠 480 地板让位。\n        # 数字人版：横带没有\"上带\"（y 120–600 被小窗压着），侧边块整体下移到小窗底边之下。\n        RECTS = {\n            \"band\":     {\"top\": (90, 660, 900, 520), \"bottom\": (90, 1120, 900, 520)},\n            \"inset\":    {\"right\": (460, 660, 620, 700), \"left\": (0, 660, 620, 700)},\n            \"portrait\": {\"right\": (620, 660, 460, 1000), \"left\": (0, 660, 460, 1000)},\n            \"thumb\":    {\"right\": (720, 700, 360, 450), \"left\": (0, 700, 360, 450)},\n            \"texture\":  {\"full\": (0, 0, 1080, 1920)},\n            \"large\":    {\"top\": (90, 660, 900, 520), \"bottom\": (90, 1120, 900, 520)},\n            \"full\":     {\"full\": (0, 0, 1080, 1920)},\n        }\n        if role not in RECTS:\n            role = \"band\"\n        zone_word = zone.lower()\n        if role in (\"texture\", \"full\"):\n            slot = \"full\"\n        elif role in (\"band\", \"large\"):\n            # 数字人版：上带正对小窗，横带只能下带，文字回到上带。\n            slot = \"bottom\"\n        else:\n            # 竖块放哪一侧：看文字在哪一侧，照片放对面。\n            # zone 是文字区，所以 zone 以 left/right 开头时直接用它；zone 只说上下\n            # （upper-right / bottom-band）时退回 align，否则相邻两屏会都落在同一侧。\n            side = \"\"\n            if zone_word.startswith(\"left\"):\n                side = \"left\"\n            elif zone_word.startswith(\"right\"):\n                side = \"right\"\n            elif align in (\"left\", \"right\"):\n                side = align\n            slot = \"left\" if side == \"right\" else \"right\"\n        if slot == \"bottom\":\n            zone = {\"left\": \"upper-left\", \"center\": \"top\", \"right\": \"upper-right\"}[align]\n        elif slot == \"top\":\n            zone = {\"left\": \"lower-left\", \"center\": \"bottom-band\", \"right\": \"lower-right\"}[align]\n        elif slot == \"left\":\n            zone, align = \"right-middle\", \"right\"\n        elif slot == \"right\":\n            zone, align = \"left-middle\", \"left\"\n        # 一栏式（2026-11-18 定）：照片永远落在安全区之内，上面那 12 条写死坐标不再使用。\n        #   band / large → 840 宽（左 120 到右 960），上带或下带，高度按标题字数三档\n        #   其它（inset / portrait / thumb）→ 左右并排，全高 1383、宽 320\n        #   texture / full → 满屏底纹，不算内容，不参与安全区\n        _copy_rows = spec.get(\"copy\") if isinstance(spec.get(\"copy\"), list) else []\n        _title_text = \"\"\n        for _row in _copy_rows:\n            if isinstance(_row, dict) and str(_row.get(\"role\")) == \"title\":\n                _title_text = str(_row.get(\"text\") or \"\")\n                break\n        _n_title = len(_title_text)\n        _band_h = 600 if _n_title <= 8 else (420 if _n_title <= 16 else 300)\n        if role in (\"texture\", \"full\"):\n            x, y, w, h = 0, 0, 1080, 1920\n        elif role in (\"band\", \"large\"):\n            w, h = 840, _band_h\n            x = 120\n            y = 150 if slot == \"top\" else 1533 - h\n        else:\n            w, h = 320, 1383\n            x = 120 if slot == \"left\" else 960 - 320\n            y = 150\n        media_class = \" media--inset\" if slot in (\"left\", \"right\") else \"\"\n        media_html = ('  <div class=\"%s media%s\" data-anim=\"media\" data-media-slot=\"%s\" data-media-role=\"%s\" '\n                      'style=\"left:%dpx;top:%dpx;width:%dpx;height:%dpx\">\\n'\n                      '    <img src=\"{{IMG:%s}}\" alt=\"\" />\\n  </div>'\n                      % (sid, media_class, slot, role, x, y, w, h, sid))\n\n    # ---- 动效目标自检：点不到元素的卡在浏览器里就是 `if (!_t) return;`，整张静默空转 ----\n    # H02SM 写 target 用的是语义名（dilemma-label / body），不一定和这一屏实际产出的\n    # data-anim 对得上；空转之后检查器只数 preset 条数，照样报\"达标\"（2026-11-16 实测：\n    # s03 的 S23 找 body、s06 的 S25 找 body，两屏只有 lead，两张卡一条都没跑）。\n    # 这里把点不到的目标拉到本屏主文字上，并把原编号写进 data-motion-skipped，\n    # 让检查器点名 H02SM 重出——不是替它补一条，是把\"这条没生效\"变成看得见的记录。\n    comp_anims = set()\n    for item in (spec.get(\"components\") or [])[:2]:\n        if isinstance(item, dict):\n            comp_anims.add(re.sub(r\"[^\\w-]\", \"\", str(item.get(\"anim\") or \"comp\")) or \"comp\")\n    available = set(seen) | {\"bg\"} | comp_anims\n    if media_html:\n        available.add(\"media\")\n    TEXT_ORDER = (\"title\", \"lead\", \"body\", \"note\", \"label\", \"accent\", \"num\")\n    text_hit = next((role for role in TEXT_ORDER if role in seen), \"\")\n    motion_fixes = []\n\n    def _fix_block(match):\n        block = match.group(0)\n        dead = [a for a in sorted(set(re.findall(r'\\[data-scene=\"[^\"]*\"\\]\\s*\\[data-anim=\"([^\"]+)\"\\]', block)))\n                if a not in available]\n        if not dead:\n            return block\n        motion_fixes.append(\"%s:%s→丢弃\" % (match.group(1), \"、\".join(dead)))\n        return \"\"      # 目标不在本屏 = 这条卡没有落点，直接丢掉；不再改拍到主文字上\n\n    s = str(script or \"\").strip()\n    s = re.sub(r\"/\\* preset: ([A-Z]\\d+) \\*/.*?(?=/\\* preset: |\\Z)\", _fix_block, s, flags=re.S)\n    skip_attr = \"\"\n    if motion_fixes:\n        skip_attr = ' data-motion-skipped=\"%s\"' % html_lib.escape(\"；\".join(motion_fixes), quote=True)\n\n    style_block = (\"<style>\\n%s\\n</style>\" % css) if css else \"\"\n    section = (\n        '<section class=\"scene clip\" id=\"scene-%s\" data-scene=\"%s\" data-sentence-ids=\"%s\" '\n        'data-start=\"0\" data-duration=\"4.200\" data-visual=\"%s\" '\n        'data-composition-zone=\"%s\" data-composition-align=\"%s\" data-composition-scale=\"%s\" data-bg-family=\"%s\"%s>\\n'\n        '  <div class=\"scene-bg\" data-bg=\"%s\" data-anim=\"bg\"></div>\\n'\n        '%s\\n  <div class=\"scene-copy\">\\n%s\\n%s\\n  </div>\\n'\n        '</section>'\n    ) % (sid, sid, \" \".join(str(x) for x in (scene.get(\"sentence_ids\") or [sid])), visual,\n         zone, align, scale, bg_family, skip_attr, bg, media_html, \"\\n\".join(copy_rows), \"\\n\".join(comp_rows))\n\n    # 动效脚本原样合并：这一屏有没有入场由 H02SM 决定，渲染层不替它补。\n    m = re.search(r\"<script[^>]*>[\\s\\S]*?</script>\", s, re.I)\n    block = m.group(0) if m else ((\"<script>\\n\" + s + \"\\n</script>\") if s else \"\")\n\n    return {\"output\": (style_block + \"\\n\" + section + \"\\n\" + block).strip()}\n"
        variables:
        - variable: html
          value_selector:
          - h02s
