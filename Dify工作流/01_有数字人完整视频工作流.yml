    - id: a07_retry
      type: custom
      data:
        type: code
        title: A07R_复查自动改写口播
        code_language: python3
        code: "def main(copy_text: str, brief_json: str) -> dict:\n    import hashlib\n\
          \    import json\n    import math\n    import re\n\n    def parse(raw, label):\n\
          \        value = str(raw or \"\").strip()\n        value = re.sub(r\"^```(?:json)?\\\
          s*|\\s*```$\", \"\", value, flags=re.I)\n        try:\n            return\
          \ json.loads(value)\n        except Exception:\n            start, end =\
          \ value.find(\"{\"), value.rfind(\"}\")\n            if start >= 0 and end\
          \ > start:\n                try:\n                    return json.loads(value[start:end\
          \ + 1])\n                except Exception:\n                    pass\n \
          \           return {\"__invalid_json__\": True, \"__label__\": label, \"\
          __excerpt__\": value[:1000]}\n\n    brief = parse(brief_json, \"brief\"\
          )\n    data = parse(copy_text, \"文案\")\n    if not isinstance(data, dict):\n\
          \        data = {\"__invalid_json__\": True, \"__label__\": \"文案\", \"__excerpt__\"\
          : str(copy_text)[:1000]}\n    if data.get(\"__invalid_json__\"):\n     \
          \   excerpt = str(data.get(\"__excerpt__\") or \"\")\n        return {\n\
          \            \"script_json\": json.dumps({\"voiceover_script\": excerpt,\
          \ \"sentences\": [], \"validation\": {\"errors\": [\"JSON 无法解析\"]}}, ensure_ascii=False),\n\
          \            \"voiceover_script\": excerpt,\n            \"estimated_duration_seconds\"\
          : 0.0,\n            \"script_hash\": hashlib.sha256(excerpt.encode(\"utf-8\"\
          )).hexdigest(),\n            \"copy_valid\": False,\n            \"copy_errors_json\"\
          : json.dumps([\"口播 JSON 无法解析，请自动改写为严格 JSON\"], ensure_ascii=False),\n  \
          \          \"copy_warnings_json\": \"[]\",\n            \"recommended_motion_count_min\"\
          : 6\n        }\n    warnings = []\n    errors = []\n\n    supplied_sentences\
          \ = data.get(\"sentences\")\n    if not isinstance(supplied_sentences, list):\n\
          \        supplied_sentences = []\n    script = str(data.get(\"voiceover_script\"\
          , \"\")).strip()\n    if not script and supplied_sentences:\n        script\
          \ = \" \".join(str(item.get(\"text\", \"\") if isinstance(item, dict) else\
          \ item).strip() for item in supplied_sentences).strip()\n    if not script:\n\
          \        raise ValueError(\"voiceover_script 和 sentences 不能同时为空\")\n   \
          \ data[\"voiceover_script\"] = script\n\n    # The final script is the text\
          \ truth. Rebuild captions by complete sentences,\n    # preserving terminal\
          \ punctuation and never splitting or joining fragments.\n    sentence_texts\
          \ = [match.group(0).strip() for match in re.finditer(r\".*?(?:[。！？!?]+|$)\"\
          , script, flags=re.S) if match.group(0).strip()]\n    sentences = [{\"id\"\
          : \"s%02d\" % (i + 1), \"text\": text} for i, text in enumerate(sentence_texts)]\n\
          \    if not sentences:\n        raise ValueError(\"口播中没有完整句子\")\n\n    compact\
          \ = re.sub(r\"\\s+\", \"\", script)\n    target_duration = float(brief.get(\"\
          target_duration_seconds\", 30))\n    min_voice_chars = int(target_duration\
          \ * 2.67)\n    max_voice_chars = int(target_duration * 16.67)\n    if len(compact)\
          \ < min_voice_chars:\n        errors.append(\"口播偏短（%d 字，放行范围 %d-%d 字）\"\
          \ % (\n            len(compact), min_voice_chars, max_voice_chars))\n  \
          \  if len(compact) > max_voice_chars:\n        errors.append(\"口播偏长（%d 字，放行范围\
          \ %d-%d 字），请删减而不是加速\" % (\n            len(compact), min_voice_chars, max_voice_chars))\n\
          \n    banned = [\"保证出单\", \"百分百\", \"马上爆单\", \"行业第一\", \"绝对第一\", \"最强\"\
          , \"最先进\"]\n    for word in banned:\n        if word in script:\n      \
          \      warnings.append(\"口播包含待合规复核表达: \" + word)\n\n    allowed_purposes\
          \ = {\"hook\", \"pain\", \"solution\", \"proof\", \"cta\"}\n    normalized_sentences\
          \ = []\n    seen_ids = set()\n    cursor = 0.0\n    for index, item in enumerate(sentences,\
          \ 1):\n        if not isinstance(item, dict):\n            item = {\"text\"\
          : str(item)}\n        text = str(item.get(\"text\", \"\")).strip()\n   \
          \     if not text:\n            continue\n        sentence_id = str(item.get(\"\
          id\") or \"s%02d\" % index)\n        while sentence_id in seen_ids:\n  \
          \          sentence_id = sentence_id + \"_dup\"\n        seen_ids.add(sentence_id)\n\
          \        purpose = str(item.get(\"purpose\") or \"\").strip()\n        if\
          \ purpose not in allowed_purposes:\n            old = purpose or \"empty\"\
          \n            purpose = \"hook\" if index == 1 else (\"cta\" if index ==\
          \ len(sentences) else \"solution\")\n            warnings.append(\"%s purpose=%s\
          \ 已归一化为 %s\" % (sentence_id, old, purpose))\n        estimated = max(1.2,\
          \ len(re.sub(r\"\\s+\", \"\", text)) / 4.35)\n        normalized_sentences.append({\n\
          \            \"id\": sentence_id,\n            \"text\": text,\n       \
          \     \"purpose\": purpose,\n            \"estimated_start_seconds\": round(cursor,\
          \ 2),\n            \"estimated_end_seconds\": round(cursor + estimated,\
          \ 2)\n        })\n        cursor += estimated\n\n    if not normalized_sentences:\n\
          \        raise ValueError(\"sentences 中没有有效文本\")\n    if len(normalized_sentences)\
          \ < 3:\n        errors.append(\"口播至少需要 3 个完整句子\")\n    normalized_sentences[0][\"\
          purpose\"] = \"hook\"\n    normalized_sentences[-1][\"purpose\"] = \"cta\"\
          \n    if not any(item[\"purpose\"] == \"solution\" for item in normalized_sentences):\n\
          \        normalized_sentences[min(1, len(normalized_sentences) - 1)][\"\
          purpose\"] = \"solution\"\n\n    normalized_captions = [item[\"text\"] for\
          \ item in normalized_sentences]\n    supplied_captions = data.get(\"burned_in_caption_lines\"\
          )\n    if isinstance(supplied_captions, list) and supplied_captions:\n \
          \       supplied_clean = [re.sub(r\"\\s+\", \"\", str(line)) for line in\
          \ supplied_captions]\n        expected_clean = [re.sub(r\"\\s+\", \"\",\
          \ line) for line in normalized_captions]\n        if supplied_clean != expected_clean:\n\
          \            warnings.append(\"burned_in_caption_lines 与完整句子不一致，已强制改为逐句完整字幕\"\
          )\n    data[\"burned_in_caption_lines\"] = normalized_captions\n\n    estimated_duration\
          \ = round(cursor, 2)\n    if estimated_duration > target_duration * 1.10:\n\
          \        warnings.append(\"估算口播时长超过目标 10%，已继续输出供人工删减\")\n    elif estimated_duration\
          \ > target_duration:\n        warnings.append(\"估算口播略超目标，应在真实时间码阶段删减而非加速\"\
          )\n\n    data[\"sentences\"] = normalized_sentences\n    data[\"estimated_duration_seconds\"\
          ] = estimated_duration\n    data[\"validation\"] = {\"errors\": errors,\
          \ \"warnings\": warnings}\n    script_hash = hashlib.sha256(re.sub(r\"\\\
          s+\", \"\", script).encode(\"utf-8\")).hexdigest()\n    return {\n     \
          \   \"script_json\": json.dumps(data, ensure_ascii=False),\n        \"voiceover_script\"\
          : script,\n        \"estimated_duration_seconds\": estimated_duration,\n\
          \        \"script_hash\": script_hash,\n        \"copy_valid\": not errors,\n\
          \        \"copy_errors_json\": json.dumps(errors, ensure_ascii=False),\n\
          \        \"copy_warnings_json\": json.dumps(warnings, ensure_ascii=False),\n\
          \        \"recommended_motion_count_min\": max(6, int(math.ceil(target_duration\
          \ / 2.5)))\n    }\n"
        variables:
        - variable: copy_text
          value_selector:
          - a06_retry
          - text
          value_type: string
        - variable: brief_json
          value_selector:
          - a03
          - brief_json
          value_type: string
        outputs:
          script_json:
            type: string
            children: null
          voiceover_script:
            type: string
            children: null
          estimated_duration_seconds:
            type: number
            children: null
          script_hash:
            type: string
            children: null
          copy_valid:
            type: boolean
            children: null
          copy_errors_json:
            type: string
            children: null
          copy_warnings_json:
            type: string
            children: null
          recommended_motion_count_min:
            type: number
            children: null
      position:
        x: 2775
        y: 650
      positionAbsolute:
        x: 2775
        y: 650
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 234
