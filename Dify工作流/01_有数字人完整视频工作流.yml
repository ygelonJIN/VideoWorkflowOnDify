    - id: a16
      type: custom
      data:
        type: code
        title: A16_打包批准内容
        code_language: python3
        code: "def main(brief_json: str, draft_script_json: str, storyboard_json: str, motion_plan_json: str, compliance_json: str, review_action: str, tts_provider: str, tts_base_url: str, tts_model: str, tts_voice: str) -> dict:\n    import hashlib\n    import json\n    import re\n\n    def fail(message):\n        return {\n            \"approved_package_json\": \"{}\",\n            \"approved_voiceover_script\": \"\",\n            \"approval_status\": \"failed\",\n            \"package_error\": message,\n        }\n\n\n    parse_notes = []\n\n    def parse(raw, label):\n        value = str(raw or \"\").strip()\n        value = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", value, flags=re.I)\n        if not value:\n            raise ValueError(\"输出为空\")\n        try:\n            data = json.loads(value)\n        except Exception:\n            start, end = value.find(\"{\"), value.rfind(\"}\")\n            if start < 0 or end <= start:\n                raise ValueError(\"不是 JSON 对象\")\n            try:\n                data = json.loads(value[start:end + 1])\n            except Exception as exc:\n                raise ValueError(str(exc)[:80])\n        if not isinstance(data, dict):\n            raise ValueError(\"不是 JSON 对象\")\n        if data.get(\"__invalid_json__\"):\n            raise ValueError(\"上游已标记为无法解析\")\n        return data\n\n    def parse_or_empty(raw, label):\n        try:\n            return parse(raw, label)\n        except ValueError as exc:\n            parse_notes.append(\"%s 不合法，已按空对象继续：%s\" % (label, str(exc)[:80]))\n            return {}\n\n    brief = parse_or_empty(brief_json, \"brief\")\n    script = parse_or_empty(draft_script_json, \"原始脚本\")\n    storyboard = parse_or_empty(storyboard_json, \"storyboard\")\n    motion = parse_or_empty(motion_plan_json, \"motion_plan\")\n\n    try:\n        compliance = parse(compliance_json, \"合规审核\")\n    except ValueError:\n        compliance = {}\n    repair_notes = list(parse_notes)\n    # 合规只做判定，不改写：rejected 就退回重写，不替模型软化措辞（2026-11-16 定）。\n    rejected = str(compliance.get(\"decision\", \"\")).strip().lower() == \"rejected\"\n    reasons = []\n    for item in compliance.get(\"violations\") or []:\n        if isinstance(item, dict) and str(item.get(\"text\") or \"\").strip():\n            reasons.append(str(item.get(\"text\")).strip())\n    for item in compliance.get(\"unverified_claims\") or []:\n        if isinstance(item, dict) and str(item.get(\"text\") or \"\").strip():\n            reasons.append(str(item.get(\"text\")).strip())\n    for item in compliance.get(\"revision_instructions\") or []:\n        reasons.append(str(item))\n\n    voiceover = str(script.get(\"voiceover_script\", \"\")).strip()\n    if not voiceover:\n        detail = (\"；解析提示：\" + \"；\".join(parse_notes)) if parse_notes else \"\"\n        return fail(\"口播为空：A06/A07 没有产出可用文案\" + detail)\n    if rejected:\n        return fail(\"合规审核 rejected，必须按 revision_instructions 重写口播\" + (\"：\" + \"；\".join(reasons[:5]) if reasons else \"\"))\n    base_url_options = {\n        \"默认（按量付费）\": \"https://api.xiaomimimo.com/v1\",\n        \"Token Plan - 中国\": \"https://token-plan-cn.xiaomimimo.com/v1\",\n        \"Token Plan - 新加坡\": \"https://token-plan-sgp.xiaomimimo.com/v1\",\n        \"Token Plan - 欧洲\": \"https://token-plan-ams.xiaomimimo.com/v1\",\n    }\n    raw_base_url = str(tts_base_url or \"\").strip()\n    tts_config = {\n        \"provider\": str(tts_provider or \"mimo\").strip() or \"mimo\",\n        \"base_url\": base_url_options.get(raw_base_url, raw_base_url),\n        \"model\": str(tts_model or \"\").strip(),\n        \"voice\": str(tts_voice or \"\").strip(),\n    }\n    scenes = storyboard.get(\"scenes\") if isinstance(storyboard.get(\"scenes\"), list) else []\n# 数字人版这张片子是出图的（H01P 图像计划 → 本地生图）：storyboard.visual_source 不再是画面承担者的真值，\n# 不做 generated_image → reusable_ui_template 的归一。\n    package = {\n        \"approval\": {\n            \"status\": \"approved\",\n            \"feedback\": \"人工审核动作：\" + str(review_action or \"approve\"),\n            \"approved_script_hash\": hashlib.sha256(voiceover.encode(\"utf-8\")).hexdigest()\n        },\n        \"brief\": brief,\n        \"approved_script\": script,\n        \"storyboard\": storyboard,\n        \"motion_plan\": motion,\n        \"compliance\": {\n            \"decision\": str(compliance.get(\"decision\") or \"\"),\n            \"repaired\": bool(repair_notes),\n            \"reasons\": reasons[:5],\n            \"repair_notes\": repair_notes,\n            \"risk_level\": str(compliance.get(\"risk_level\") or \"\"),\n            \"violations\": compliance.get(\"violations\") or [],\n            \"unverified_claims\": compliance.get(\"unverified_claims\") or [],\n        },\n        \"tts_config\": tts_config,\n    }\n    return {\n        \"approved_package_json\": json.dumps(package, ensure_ascii=False),\n        \"approved_voiceover_script\": voiceover,\n        \"approval_status\": \"approved\",\n        \"package_error\": \"\",\n    }\n"
