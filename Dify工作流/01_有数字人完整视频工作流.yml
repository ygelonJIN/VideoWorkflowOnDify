    - id: h02sk
      parentId: h02i
      type: custom
      data:
        type: code
        title: H02SK_合并单屏HTML与动效
        code_language: python3
        code: "def main(html: str, script: str, scene_json: str = \"\") -> dict:\n    \"\"\"把单屏规格 JSON 渲染成唯一合法的 <section>，再合并动效脚本。\n\n    这一层负责\"结构正确\"：标签闭合、属性齐全、槽位不缺，全部由代码保证。\n    模型只交内容与判断，交回来的东西再怪也拼不出一份坏 HTML。\n    \"\"\"\n    import html as html_lib\n    import json\n    import re\n\n    # 数字人版（01）：右上角常驻真人小窗（x 766–1036 / y 120–600），照片与文字都要让开它。\n    # 小窗矩形由 H01Z 写进 #stage 的 --pip-* 变量，这里用同一组数字：\n    #   落版只做两件事：横带一律放**下带**；侧边块整体下移到小窗底边之下。\n    ROLES = (\"title\", \"lead\", \"body\", \"note\", \"num\", \"label\", \"accent\")\n    VOID = {\"img\", \"br\", \"hr\", \"input\", \"meta\", \"link\", \"source\", \"path\", \"circle\",\n            \"rect\", \"line\", \"polygon\", \"polyline\", \"ellipse\", \"use\", \"stop\"}\n\n    def parse_json(raw):\n        value = str(raw or \"\").strip()\n        value = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", value, flags=re.I)\n        try:\n            return json.loads(value)\n        except Exception:\n            start, end = value.find(\"{\"), value.rfind(\"}\")\n            if 0 <= start < end:\n                chunk = re.sub(r\",\\s*([}\\]])\", r\"\\1\", value[start:end + 1])\n                try:\n                    return json.loads(chunk)\n                except Exception:\n                    return {}\n        return {}\n\n    spec = parse_json(html)\n    scene = parse_json(scene_json)\n    if not isinstance(spec, dict):\n        spec = {}\n    if not isinstance(scene, dict):\n        scene = {}\n\n    sid = str(spec.get(\"scene_id\") or scene.get(\"scene_id\") or \"s01\").strip()\n    if not re.fullmatch(r\"[A-Za-z0-9_-]+\", sid):\n        sid = \"s01\"\n    comp = scene.get(\"composition\") if isinstance(scene.get(\"composition\"), dict) else {}\n    layout = spec.get(\"layout\") if isinstance(spec.get(\"layout\"), dict) else {}\n    zone = str(layout.get(\"zone\") or comp.get(\"text_zone\") or \"center-middle\")\n    align = str(layout.get(\"align\") or comp.get(\"align\") or \"center\").lower()\n    if align not in (\"left\", \"center\", \"right\"):\n        align = \"center\"\n    scale = str(layout.get(\"scale\") or comp.get(\"scale\") or \"两行块\")\n\n    visual = str(spec.get(\"visual\") or (\"photo\" if spec.get(\"media\") else \"html\")).lower()\n    if visual not in (\"photo\", \"html\"):\n        visual = \"html\"\n\n    bg = str(spec.get(\"bg\") or \"\").strip().upper()\n    budget = scene.get(\"visual_budget\") if isinstance(scene.get(\"visual_budget\"), dict) else {}\n    if not re.fullmatch(r\"B\\d{2}\", bg):\n        bg = str(budget.get(\"background\") or \"\").strip().upper()\n    if not re.fullmatch(r\"B\\d{2}\", bg):\n        bg = \"B23\"\n    # 背景卡的视觉族要落到 section 上：棋盘/扫描线/网点这类高密度底纹和文字同屏时，\n    # 版面层要靠它给文字垫一层柔光，否则 76px 的标题直接坐在格子上（2026-11-16 s03）。\n    bg_family = str(budget.get(\"background_family\") or \"\").strip().lower()\n    if bg_family not in (\"dot\", \"line\", \"ring\", \"block\", \"light\", \"noise\"):\n        bg_family = \"\"\n\n\n    def esc(text):\n        return html_lib.escape(str(text or \"\").strip(), quote=True).replace(\"\\n\", \"<br>\")\n\n    # ---- 标题切行：换行点由代码定，不交给 text-wrap:balance（2026-11-19）----\n    # 14 个字的标题 @110px 在 840 栏里只放得下 7 个字；balance 为了防止孤行会把它拉成\n    # 5/5/4，「取消的是强制性，不是反对努力」于是折成「取消的是强 / 制性，不是 / 反对努力」，\n    # 词被劈开、逗号夹在中间。这里按标点把标题切成确定的几行、用 <br> 写死，\n    # layout_composer 再按「最长那一行」反算字号（840/8=105 → 100 档），换行点就完全可控。\n    # 阈值 12 = 840 栏在最小档 70px 时一行能放的字数：装得下就交给字号求解，装不下才切。\n    PUNCT = '，。；：、！？—…'\n    NL = chr(10)\n    def _unit(ch):\n        if ch.isspace():\n            return 0.5\n        if ord(ch) > 0x2E7F:\n            return 1.0\n        if ch.isdigit():\n            return 0.58\n        return 0.56\n    def _units(s):\n        return sum(_unit(c) for c in s)\n    def _split_long(s, limit=12):\n        out = []\n        while _units(s) > limit and len(s) > 1:\n            cut = max(1, len(s) // 2)\n            out.append(s[:cut])\n            s = s[cut:]\n        out.append(s)\n        return out\n    def split_title(text, role):\n        if role not in ('title', 'lead'):\n            return text\n        raw = str(text or '').strip()\n        if not raw or '<br' in raw or _units(raw) <= 12:\n            return raw\n        chunks = re.findall('[^%s]+[%s]?' % (PUNCT, PUNCT), raw) or [raw]\n        if len(chunks) >= 2:\n            best = None\n            for i in range(1, len(chunks)):\n                a = ''.join(chunks[:i])\n                b = ''.join(chunks[i:])\n                score = abs(_units(a) - _units(b))\n                if best is None or score < best[0]:\n                    best = (score, a, b)\n            left, right = best[1], best[2]\n        else:\n            half = (len(raw) + 1) // 2\n            left, right = raw[:half], raw[half:]\n        return NL.join(_split_long(left) + _split_long(right))\n\n    # ---- copy：纯文本 → 带角色的元素，标签只能是我们的 ----\n    copy_rows = []\n    seen = set()\n    for item in (spec.get(\"copy\") or []):\n        if not isinstance(item, dict):\n            continue\n        role = str(item.get(\"role\") or \"\").strip().lower()\n        text = str(item.get(\"text\") or \"\").strip()\n        if role not in ROLES or not text or role in seen:\n            continue\n        seen.add(role)\n        tag = \"h1\" if role == \"title\" else (\"span\" if role in (\"num\", \"label\", \"accent\") else \"p\")\n        copy_rows.append('    <%s data-role=\"%s\" data-anim=\"%s\">%s</%s>' % (tag, role, role, esc(split_title(text, role)), tag))\n        if sum(1 for r in copy_rows if 'data-role=\"body\"') >= 2:\n            break\n    # 不再用分镜原文顶替缺失的 copy：规格里没写就是没写，交给 H02S 重出，\n    # 渲染层只负责把给的字段摆正（2026-11-16 定）。\n\n    # ---- 组件：只收标签平衡的片段；根节点补 data-anim ----\n    def balanced(fragment):\n        stack = []\n        for match in re.finditer(r\"<(/?)([A-Za-z][\\w-]*)([^>]*?)(/?)>\", fragment):\n            closing, name, _, selfclose = match.groups()\n            name = name.lower()\n            if closing:\n                if not stack or stack[-1] != name:\n                    return False\n                stack.pop()\n            elif not selfclose and name not in VOID:\n                stack.append(name)\n        return not stack\n\n    comp_rows = []\n    for item in (spec.get(\"components\") or [])[:2]:\n        if not isinstance(item, dict):\n            continue\n        fragment = str(item.get(\"html\") or \"\").strip()\n        if not fragment.startswith(\"<\") or not balanced(fragment):\n            continue\n        anim = re.sub(r\"[^\\w-]\", \"\", str(item.get(\"anim\") or \"comp\")) or \"comp\"\n        if 'data-anim=' not in fragment.split(\">\", 1)[0]:\n            fragment = re.sub(r\"^<([A-Za-z][\\w-]*)\", r'<\\1 data-anim=\"%s\"' % anim, fragment, count=1)\n        comp_rows.append(\"    \" + fragment)\n\n    # ---- css：所有选择器必须以本屏作用域开头，否则整段丢弃 ----\n    css = str(spec.get(\"css\") or \"\").strip()\n    if css:\n        selectors = re.findall(r\"([^{}]+)\\{\", css)\n        scoped = '[data-scene=\"%s\"]' % sid\n        if not selectors or any(scoped not in sel for sel in selectors):\n            css = \"\"\n\n    media_html = \"\"\n    media = spec.get(\"media\") if isinstance(spec.get(\"media\"), dict) else {}\n    if visual == \"photo\" and media:\n        # 照片框不采用模型随手给的坐标：按 role + 文字构图算出唯一槽位，\n        # 文字区自动落到另一半。模型写什么 x/y 都不影响\"字不压图\"。\n        role = str(media.get(\"role\") or \"band\").lower()\n        # 2026-11-19：**左右并排整体删除**，照片只剩一种落法——通栏横带。\n        # 所有 role 一律 840 宽（左 120 到右 960），放上带或下带，文字占另一条整带。\n        # role 不再决定\"哪一侧\"，只决定横带高度：\n        #   band / large  高度按标题字数：≤8 字 600 / ≤16 字 420 / 更长 300\n        #   portrait 520（最高）  inset 360（扁带）  thumb 300（小带）\n        #   texture 620（底纹也落成横带，只有 full 才满屏）\n        # 为什么删：并排时文字栏只剩 300–440，标题挤成 3 行 4 字、断行还落在词中间；\n        # 横带下文字永远是整条 840，标题 110 也排得开。\n        # 数字人版：横带只落**下带**（右上角小窗压着上带），文字回到上带。\n        if role not in (\"band\", \"large\", \"inset\", \"portrait\", \"thumb\", \"texture\", \"full\"):\n            role = \"band\"\n        zone_word = zone.lower()\n        # full 已在 H01PV 归一成 band，这里实际只剩 texture；底纹也不许铺满整屏——\n        # 满屏图让文字区无处可去，media_fix 再把它压成横带时 anchor 已被重置，\n        # 结果就是文字压在照片上（2026-11-19 s06 实测：正文 96px 整块落在图上）。\n        # 数字人版：右上角常驻小窗压住上带（y 120–600 是视频窗），所以横带只落**下带**。\n        slot = \"full\" if role == \"full\" else \"bottom\"\n        if slot == \"bottom\":\n            zone = {\"left\": \"upper-left\", \"center\": \"top\", \"right\": \"upper-right\"}[align]\n        elif slot == \"top\":\n            zone = {\"left\": \"lower-left\", \"center\": \"bottom-band\", \"right\": \"lower-right\"}[align]\n        # 高度：band/large 按标题字数三档，其它 role 固定高度——都是通栏带，只是高矮不同，\n        # 相邻两屏不会因为\"照片一样大\"看着像同一版。\n        _copy_rows = spec.get(\"copy\") if isinstance(spec.get(\"copy\"), list) else []\n        _title_text = \"\"\n        for _row in _copy_rows:\n            if isinstance(_row, dict) and str(_row.get(\"role\")) == \"title\":\n                _title_text = str(_row.get(\"text\") or \"\")\n                break\n        _n_title = len(_title_text)\n        _band_h = 600 if _n_title <= 8 else (420 if _n_title <= 16 else 300)\n        FIXED_H = {\"portrait\": 520, \"inset\": 360, \"thumb\": 300, \"texture\": 620}\n        if role == \"full\":\n            x, y, w, h = 0, 0, 1080, 1920\n        else:\n            w = 840\n            h = FIXED_H.get(role, _band_h)\n            x = 120\n            y = 150 if slot == \"top\" else 1533 - h\n        media_html = ('  <div class=\"%s media\" data-anim=\"media\" data-media-slot=\"%s\" data-media-role=\"%s\" '\n                      'style=\"left:%dpx;top:%dpx;width:%dpx;height:%dpx\">\\n'\n                      '    <img src=\"{{IMG:%s}}\" alt=\"\" />\\n  </div>'\n                      % (sid, slot, role, x, y, w, h, sid))\n\n    # ---- 动效目标自检：点不到元素的卡在浏览器里就是 `if (!_t) return;`，整张静默空转 ----\n    # H02S 写 target 用的是语义名（dilemma-label / body），不一定和这一屏实际产出的\n    # data-anim 对得上；空转之后检查器只数 preset 条数，照样报\"达标\"（2026-11-16 实测：\n    # s03 的 S23 找 body、s06 的 S25 找 body，两屏只有 lead，两张卡一条都没跑）。\n    # 这里把点不到的目标拉到本屏主文字上，并把原编号写进 data-motion-skipped，\n    # 让检查器点名 H02S 重出——不是替它补一条，是把\"这条没生效\"变成看得见的记录。\n    comp_anims = set()\n    for item in (spec.get(\"components\") or [])[:2]:\n        if isinstance(item, dict):\n            comp_anims.add(re.sub(r\"[^\\w-]\", \"\", str(item.get(\"anim\") or \"comp\")) or \"comp\")\n    available = set(seen) | {\"bg\"} | comp_anims\n    if media_html:\n        available.add(\"media\")\n    TEXT_ORDER = (\"title\", \"lead\", \"body\", \"note\", \"label\", \"accent\", \"num\")\n    text_hit = next((role for role in TEXT_ORDER if role in seen), \"\")\n    motion_fixes = []\n\n    markup = \"\\n\".join(copy_rows + comp_rows + ([media_html] if media_html else []))\n\n    def _fix_block(match):\n        block = match.group(0)\n        pid = match.group(1)\n        hit = \"、\".join(sorted(set(re.findall(r'\\[data-anim=\"([^\"]+)\"\\]', block)))) or \"?\"\n        dead = [a for a in sorted(set(re.findall(r'\\[data-scene=\"[^\"]*\"\\]\\s*\\[data-anim=\"([^\"]+)\"\\]', block)))\n                if a not in available]\n        if dead:\n            motion_fixes.append(\"%s:%s→丢弃\" % (pid, \"、\".join(dead)))\n            return \"\"      # 目标不在本屏 = 这条卡没有落点，直接丢掉；不再改拍到主文字上\n        # 卡要元素自带属性才能跑（G03 读 data-morph-to）：页面里没人写那个属性，卡里\n        # `if (_to.length < 4) return;` 静默退出，只剩下面那句 `set opacity 1`——\n        # 观感就是\"标题在 0.3 秒时啪一下出现\"，等于没做动效（2026-11-18 s02 实测）。\n        if \"data-morph-to\" in block and \"data-morph-to\" not in markup:\n            motion_fixes.append(\"%s:%s→卡要 data-morph-to，页面没给，丢弃\" % (pid, hit))\n            return \"\"\n        return block\n\n    # 2026-11-19：先剥掉上游自带的 <script> 壳，再处理正文。\n    # 壳留着的话，下面 `_fix_block` 的正则以 `\\Z` 收尾，最后一个 preset 块被丢弃时\n    # 会把结尾的 `</script>` 当成块的一部分一起吃掉，`s` 就变成「有开标签、没闭标签」；\n    # 后面按「有壳原样用、没壳套一层」处理时正则匹配失败 → fallback 又套一层 →\n    # 双开单闭。浏览器在第一个 `</script>` 处收尾，脚本内容以 `<script>` 开头，\n    # 整段 SyntaxError，这一屏的 builder 根本不注册，动效全丢（2026-11-19 s01/s06 实测）。\n    # 外壳由本节点唯一生成（2026-11-20）：先把 <script>、push 头、结尾括号和上游那行 cue\n    # 全部剥掉，只留「块」交给下面的过滤去动；外壳在最后统一拼一次，块怎么丢都碰不到它。\n    # 旧写法把补出来的 `});` 挂在最后一块身上，那块被「同一元素第二张进入卡」丢掉时\n    # 外壳跟着没了 → 整块 script 语法错误 → 这一屏的背景卡和入场卡一条都不注册\n    # （2026-11-19 s01 实测：从第 0 帧就是最终态）。\n    PUSH_HEAD = \"window.__sceneBuilders.push(function(timeline, at){\"\n    CUE_LINE = \"  var cue = function(s, w, f){ return window.__cue ? window.__cue(s, w, f) : f; };\"\n    s = re.sub(r\"</?script\\b[^>]*>\", \"\", str(script or \"\"), flags=re.I).strip()\n    if PUSH_HEAD in s:\n        s = s.split(PUSH_HEAD, 1)[1]\n    s = s.replace(CUE_LINE, \"\").strip()\n    for _tail in (\"})();\", \"});\"):\n        if s.endswith(_tail):\n            s = s[: -len(_tail)].rstrip()\n            break\n    s = re.sub(r\"/\\* preset: ([A-Z]\\d+) \\*/.*?(?=/\\* preset: |\\Z)\", _fix_block, s, flags=re.S)\n\n\n    # ---- 同一元素只许一次「进入」（2026-11-19）----\n    # H02S 的入场按元素发，状态卡却常常挑同一个元素，于是同一层先被一张卡带到可见、\n    # 几秒后又被另一张卡从隐藏/折叠里重新长出来：成片里就是\n    # 「先出现 → 突然缩掉/消失 → 再展开」（2026-11-19 s05 的 process 实测：\n    # 29.66s 滑入，33.93s 又被 scaleY 0.06 压回去再长出来）。\n    # 这里按顺序只保留第一张进入型卡，后面的丢弃并点名 H02S——结构问题在生成端消灭，\n    # 不留给检查器去报「1→0→1 闪回」。\n    FROM_STATE = re.compile(r\"fromTo\\([^,]+,\\s*\\{([^}]*)\\}\", re.S)\n\n    def is_enter(blk):\n        # 展开后的 from 态键名有两种写法：TPL 出来的 `opacity: 0`（不带引号）\n        # 和手写卡的 `'opacity': 0`，所以正则必须两种都认（2026-11-19 踩过）。\n        for state in FROM_STATE.findall(blk):\n            if re.search(r\"['\\\"]?opacity['\\\"]?\\s*:\\s*0(?![\\d.])\", state):\n                return True\n            m2 = re.search(r\"['\\\"]?scaleY['\\\"]?\\s*:\\s*(0?\\.\\d+|\\d+)\", state)\n            if m2 and float(m2.group(1)) < 0.2:\n                return True\n            m2 = re.search(r\"['\\\"]?y['\\\"]?\\s*:\\s*(-?\\d{2,})\", state)\n            if m2 and abs(float(m2.group(1))) >= 120:\n                return True\n        return False\n\n    entered = set()\n    kept = []\n    for _chunk in re.split(r\"(?=/\\* preset: )\", s):\n        if not _chunk.startswith(\"/* preset: \"):\n            kept.append(_chunk)\n            continue\n        _head = re.match(r\"/\\* preset: ([A-Z]\\d+) \\*/\", _chunk)\n        _pid = _head.group(1) if _head else \"?\"\n        _anims = set(re.findall(r'\\[data-scene=\"%s\"\\]\\s*\\[data-anim=\"([^\"]+)\"\\]' % re.escape(sid), _chunk)) - {\"bg\"}\n        if _anims and (_anims & entered) and is_enter(_chunk):\n            motion_fixes.append(\"%s:%s→丢弃（同一元素第二张进入卡会把前一张重置）\"\n                                % (_pid, \"、\".join(sorted(_anims & entered))))\n            continue\n        entered |= _anims\n        kept.append(_chunk)\n    s = \"\".join(kept)\n\n    # ---- 首帧空屏：这一屏的内容层在屏起点一律不可见，等各自的入场卡把它们带出来 ----\n    # 2026-11-18：每张卡前面那句 `set opacity 1` 一直假定\"首帧已经被整体隐藏过\"，\n    # 但页面里从来没有这条规则——元素从切点起就是最终态，页间转场再把整屏一起擦开，\n    # 观众看到的是\"完整画面先出现，然后没有动效\"。这里补上真正的首帧空屏。\n    # 只隐藏**确实有卡覆盖**的层：没被任何卡覆盖的层保持原样并点名 H02S，\n    # 否则那部分内容会整块不出现（那比\"没有动效\"更糟）。\n    covered = set(re.findall(r'\\[data-scene=\"%s\"\\]\\s*\\[data-anim=\"([^\"]+)\"\\]' % re.escape(sid), s)) - {\"bg\"}\n    layers = set(seen) | comp_anims | ({\"media\"} if media_html else set())\n    # 每层最早的开场时刻 = 卡里那句 `timeline.set(..., at(X))` 的 X（cue 取 fallback）。\n    starts = {}\n    for blk in re.split(r\"(?=/\\* preset: )\", s):\n        anims = set(re.findall(r'\\[data-scene=\"%s\"\\]\\s*\\[data-anim=\"([^\"]+)\"\\]' % re.escape(sid), blk)) - {\"bg\"}\n        if not anims:\n            continue\n        m2 = re.search(r\"at\\((?:cue\\('[^']*',\\s*'[^']*',\\s*([\\d.]+)\\)|([\\d.]+))\\)\", blk)\n        t0 = float(m2.group(1) or m2.group(2)) if m2 else None\n        for a in anims:\n            if a not in starts:\n                starts[a] = t0\n            elif t0 is not None and (starts[a] is None or t0 < starts[a]):\n                starts[a] = t0\n    # 只在 1.2s 内就开场的层才隐藏：晚开场的层藏起来就是\"内容消失一大段\"，\n    # 那比\"直接出现\"更糟——这类层保持原样，点名 H02S 把入场挪到 0.2–1.2。\n    early = {a for a, tv in starts.items() if tv is not None and tv <= 1.2}\n    late = sorted(a for a in starts if a not in early)\n    missing = sorted(layers - covered)\n    if late:\n        motion_fixes.append(\"入场晚于 1.2s:%s→H02S 调到 0.2–1.2\" % \"、\".join(late))\n    if missing:\n        motion_fixes.append(\"缺入场:%s→H02S 该给编号卡（模板先补默认淡入）\" % \"、\".join(missing))\n    # ---- 每个内容层都必须有入场（2026-11-18 晚，结构保证）----\n    # H02S 漏给某层时，那一层原来会直接从切点出现。这里给它一条最保守的入场：\n    # 屏首不可见 → 0.35s 起淡入 0.5s。用模板补，不改编号、不猜内容；\n    # 同时把这一层写进 data-motion-skipped，点名 H02S 该补哪一条。\n    # 为什么必须补：不补就是\"内容直接出现在画面上\"，比\"入场不够好看\"严重得多。\n    fill = \"\".join(\n        \"  timeline.set('[data-scene=\\\"%s\\\"] [data-anim=\\\"%s\\\"]', {'opacity':0}, at(0));\\n\"\n        \"  timeline.to('[data-scene=\\\"%s\\\"] [data-anim=\\\"%s\\\"]', \"\n        \"{'opacity':1, 'duration':0.5, 'ease':'power2.out'}, at(0.35));\\n\" % (sid, a, sid, a)\n        for a in missing)\n    hidden = fill + \"\".join(\n        \"  timeline.set('[data-scene=\\\"%s\\\"] [data-anim=\\\"%s\\\"]', {'opacity':0}, at(0));\\n\" % (sid, a)\n        for a in sorted((early & layers) - set(missing)))\n    skip_attr = \"\"\n    if motion_fixes:\n        skip_attr = ' data-motion-skipped=\"%s\"' % html_lib.escape(\"；\".join(motion_fixes), quote=True)\n\n    style_block = (\"<style>\\n%s\\n</style>\" % css) if css else \"\"\n    section = (\n        '<section class=\"scene clip\" id=\"scene-%s\" data-scene=\"%s\" data-sentence-ids=\"%s\" '\n        'data-start=\"0\" data-duration=\"4.200\" data-visual=\"%s\" '\n        'data-composition-zone=\"%s\" data-composition-align=\"%s\" data-composition-scale=\"%s\" data-bg-family=\"%s\"%s>\\n'\n        '  <div class=\"scene-bg\" data-bg=\"%s\" data-anim=\"bg\"></div>\\n'\n        '%s\\n  <div class=\"scene-copy\">\\n%s\\n%s\\n  </div>\\n'\n        '</section>'\n    ) % (sid, sid, \" \".join(str(x) for x in (scene.get(\"sentence_ids\") or [sid])), visual,\n         zone, align, scale, bg_family, skip_attr, bg, media_html, \"\\n\".join(copy_rows), \"\\n\".join(comp_rows))\n\n    # 动效脚本：正文已在上面剥过壳，这里只包一次——无论上游给什么形态，\n    # 出片里永远是恰好一对 <script> 标签（2026-11-19）。\n    body = \"\\n\".join(part for part in (hidden, s.strip()) if part.strip())\n    block = (\"<script>\\n\" + PUSH_HEAD + \"\\n\" + CUE_LINE + \"\\n\" + body + \"\\n});\\n</script>\") if body.strip() else \"\"\n\n    return {\"output\": (style_block + \"\\n\" + section + \"\\n\" + block).strip()}\n"
        variables:
        - variable: html
          value_selector:
          - h02s
          - text
          value_type: string
        - variable: script
          value_selector:
          - h02sx
          - script
          value_type: string
        - variable: scene_json
          value_selector:
          - h02i
          - item
          value_type: string
        outputs:
          output:
            type: string
            children: null
        isInIteration: true
        iteration_id: h02i
      position:
        x: 9360
        y: 1450
      positionAbsolute:
        x: 9360
        y: 1450
      sourcePosition: right
      targetPosition: left
      width: 320
      height: 160
      zIndex: 1002
    - id: h02sx
      parentId: h02i
      type: custom
      data:
        type: code
        title: H02SX_按编号展开动效
        code_language: python3
        code: "def main(motion_json: str, scene_json: str = \"\") -> dict:\n    \"\"\"把动效判断（JSON）展开成本屏的 <script>；编号由 H00 统一分配，模型只选目标与时机。\"\"\"\n    import json\n    import re\n\n    raw = str(motion_json or \"\").strip()\n    data = {}\n    if raw:\n        try:\n            data = json.loads(raw)\n        except Exception:\n            start, end = raw.find(\"{\"), raw.rfind(\"}\")\n            if 0 <= start < end:\n                try:\n                    data = json.loads(raw[start:end + 1])\n                except Exception:\n                    data = {}\n\n    motions = data.get(\"motions\") if isinstance(data, dict) else None\n    if not isinstance(motions, list):\n        motions = []\n    scene_data = {}\n    try:\n        scene_data = json.loads(str(scene_json or \"{}\"))\n    except Exception:\n        scene_data = {}\n    if not isinstance(scene_data, dict):\n        scene_data = {}\n    sid = str(data.get(\"scene_id\") or scene_data.get(\"scene_id\") or \"\").strip()\n\n    # 全片编号由 H01X 按内容分配、H01XJ 注入这里读到的 scene_json：只把编号套到模型选的目标/时机上。\n    budget = scene_data.get(\"motion_budget\") if isinstance(scene_data.get(\"motion_budget\"), dict) else {}\n    if isinstance(motions, list):\n        motions = [item for item in motions if isinstance(item, dict)]\n    # 模型选多少展开多少；一条都没选就是没有动效，不在展开层替它补。\n    # 每个编号 = 一段可复制的代码模板；%(x)s 由这里填。\n\n\n\n\n\n    TPL = {\n        \"T01\": \"\"\"var _c = kit.split('%(sel)s', '%(unit)ss');\ntimeline.fromTo(_c, {opacity:0, y:'%(y)s'},\n  {opacity:1, y:0, duration:%(dur)s, ease:'%(ease)s', stagger:%(stagger)s}, %(at)s);\"\"\",\n        \"T02\": \"\"\"var _w = kit.split('%(sel)s', '%(unit)ss');\ntimeline.fromTo(_w, {opacity:0, filter:'blur(%(blur)s)', y:'%(y)s'},\n  {opacity:1, filter:'blur(0px)', y:0, duration:%(dur)s, ease:'power2.out', stagger:%(stagger)s}, %(at)s);\"\"\",\n        \"T03\": \"\"\"var _c = kit.split('%(sel)s', '%(unit)ss');\ntimeline.fromTo(_c, {opacity:0, rotationX:%(angle)s, transformOrigin:'50%% 0%%', transformPerspective:%(perspective)s},\n  {opacity:1, rotationX:0, duration:%(dur)s, ease:'power3.out', stagger:%(stagger)s}, %(at)s);\"\"\",\n        \"T05\": \"\"\"(function () {\n  var _t = document.querySelector('%(sel)s');\n  if (!_t) return;\n  // 不用 textContent 逐字改：seek 会跳过 .call，成片里会停在半句（2026-11-16 实测）。\n  // 改成裁剪揭示：字一直都在，只是被裁掉右边；任意一帧都能复现。\n  _t.style.display = 'inline-block';\n  _t.style.clipPath = 'inset(0 100%% 0 0)';\n  timeline.to(_t, {'clipPath': 'inset(0 0%% 0 0)', 'duration': %(dur)s, 'ease': '%(ease)s'}, %(at)s);\n})();\"\"\",\n        \"T09\": \"\"\"var _c = kit.split('%(sel)s', 'chars');\n_c.forEach(function (el, i) {\n  el.style.transformStyle = 'preserve-3d';\n  timeline.fromTo(el, {rotationX: -90, opacity: 0},\n    {rotationX: 0, opacity: 1, duration: %(dur)s, ease: 'back.out'}, %(at)s + i * %(stagger)s);\n});\"\"\",\n        \"X01\": \"\"\"var _dir = '%(direction)s';\nvar _inset = _dir === 'down' ? 'inset(-100%% 0%% 0%% 0%%)'\n  : _dir === 'left' ? 'inset(0%% 100%% 0%% 0%%)'\n  : _dir === 'right' ? 'inset(0%% 0%% 0%% 100%%)'\n  : 'inset(100%% 0%% 0%% 0%%)';\ntimeline.fromTo('%(sel)s', {clipPath: _inset},\n  {clipPath:'inset(0%% 0%% 0%% 0%%)', duration:%(dur)s, ease:'power3.inOut'}, %(at)s);\"\"\",\n        \"K03\": \"\"\"var _c = kit.split('%(sel)s', 'chars'), _r = kit.seeded(%(seed)s);\n_c.forEach(function (el, i) {\n  var _dy = 12 + _r() * 26, _rt = (_r() * 2 - 1) * %(rot)s;\n  timeline.fromTo(el, {'yPercent':_dy, 'rotation':_rt, 'opacity':0},\n    {'yPercent':0, 'rotation':0, 'opacity':1, 'duration':%(dur)s, 'ease':'power3.out'}, %(at)s + i * %(stagger)s);\n});\"\"\",\n        \"X03\": \"\"\"timeline.to('%(sel)s', {'opacity':0, 'y':-%(dist)s, 'duration':%(dur)s, 'ease':'power2.in', 'stagger':%(stagger)s}, %(at)s);\"\"\",\n        \"X05\": \"\"\"timeline.to('%(sel)s', {'opacity':0, 'x':%(dist)s, 'duration':%(dur)s, 'ease':'power2.in', 'stagger':%(stagger)s}, %(at)s);\"\"\",\n        \"K01\": \"\"\"timeline.fromTo('%(sel)s', {'scale':%(from)s, 'yPerce