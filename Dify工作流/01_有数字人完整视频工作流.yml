    - id: h01x
      type: custom
      data:
        type: llm
        title: H01X_全片编号分配
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        prompt_template:
        - role: system
          text: "# 全片编号分配\n\n你决定这支片子**每一屏用哪张背景卡、哪几个组件、哪几条动效编号**。编号在你这里定，下游全部照你选的执行——没有第二个地方会改它。\n\n## 输入\n\n- 分镜与文案：{{#a16.approved_package_json#}}\n- 视觉定调：{{#h01d.text#}}\n- 每屏画面承担者与镜头意图：{{#h01pv.image_brief_json#}}\n- 能力目录与白名单：{{#h00.catalog_json#}}\n\n## 目录怎么读\n\n- `catalog.background`：canvas 背景卡，每张有 `name`（画的是什么）、`note`（适合什么情绪/对象）、`family`（视觉族：dot / line / ring / block / light / noise）。\n- `catalog.component`：组件卡，`note` 是结构说明（它长什么样、适合什么信息形状）。一屏最多 2 个。\n- `catalog.motion` 分六组：`entrance_text`（文字入场）、`entrance_block`（整块入场）、`state_text`（文字状态变化）、`state_block`（块级状态变化）、`component_motion`（组件动效）、`decoration`（只能给装饰元素，绝不能给文字）。\n\n## 每一屏选四件事\n\n1. **background**：从 `catalog.background` 里选一张。先看这一句讲的是什么对象、什么情绪，再找 `note` 对得上的那张。**相邻两屏不许同 `family`**；全片尽量不重复，屏数超过目录张数才允许复用。`background_why` 一句话写清\"这句的什么东西让这张卡成立\"，不许写\"按顺序\"\"顺手选\"。\n2. **components**：0–2 个，**但不是可选项**——全片至少 ⌈屏数/2⌉ 屏必须带 1 个组件，且不许连续 3 屏为空。观点屏也有组件可用：一屏一个主张→`U01`；前后对照→`U55`；并列概念→`U03`；状态/等级→`U04`；步骤→`U02`；关键词堆→`U53`；有数字指标→`U05`；一件事加几个证据→`U06`；讲人或机构→`U08`；时间线/阶段→`U09`；演示产品界面、装一块 App/端界面→`U58–U63` 机身。**只有照片主体屏和纯引句屏允许空**，且必须在 `component_why` 里写明这一屏为什么放不进组件。结构从 `catalog.component` 里挑最贴合的那个：多条同质信息→`U07`、组件里装 App 界面时框内只放别的 U 组件。`component_why` 写这一屏的信息是什么形状、所以用这个结构。\n3. **entrance**：文字主体用 `entrance_text`，整块/卡片/照片用 `entrance_block`。相邻两屏不许同一个编号。\n4. **state**：`state_text` 或 `state_block`，**必填，不许留空**。优先挑这一屏真的\"从 A 变成 B\"的那张（数字涨、标签点亮、下划线擦出）；内容确实没有状态变化时按情绪挑一条最轻的（冷静→`S07`，强调→`S23`），**也不许交空值**——空值会让下游这屏只剩一条入场，成片就是一屏静止文字。有组件时再给一条 `component_motion`，从 `component_motion` 组里选。\n\n## 纪律\n\n- `decoration` 里的编号只能给装饰元素；给文字会让文字永久跑出画布（本地会换掉，就不再是你选的）。\n- 编号原样抄，位数和大小写不许改；不要发明编号，**目录里没有的编号一律不写**。\n- 输出前自检三条：① 组件非空的屏数 ≥ ⌈屏数/2⌉，没有连续 3 屏为空；② 每屏 `state` 都有值、都不是空字符串；③ 同一屏的 `entrance` 与 `state` 不是同一张，相邻两屏的 `entrance`、`state` 两两不相同。\n- 全片要有变化：背景至少落在 ⌈屏数 × 0.7⌉ 个不同 `family` 上（按**实际屏数**算，不按 6 屏算），入场和状态各屏尽量不重复。\n- 只和这一屏的内容有关，不要为了凑差异让编号和内容对不上。\n\n## 输出\n\n只输出 JSON，第一个字符 `{`，最后一个 `}`，不要代码围栏。\n\n```json\n{\n  \"casting_version\": \"1.0\",\n  \"film_note\": \"一句话：这支片子的编号策略\",\n  \"assignments\": [\n    {\n      \"scene_id\": \"s01\",\n      \"background\": \"B34\",\n      \"background_why\": \"这一句讲'成立'，一束光给出路\",\n      \"components\": [\"U01\"],\n      \"component_why\": \"单一主张，卡片就够\",\n      \"entrance\": \"T02\",\n      \"state\": \"S02\",\n      \"component_motion\": \"UA01\",\n      \"motion_why\": \"标题逐词聚焦，配光束收拢\"\n    }\n  ]\n}\n```\n\n`assignments` 必须覆盖全片每一屏，`scene_id` 与输入完全一致，顺序一致，不多不少。\n"
      position:
        x: 8760
