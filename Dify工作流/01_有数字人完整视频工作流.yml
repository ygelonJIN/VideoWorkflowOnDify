# 01 有数字人（04 派生的数字人版）：04 全链路（图像计划 / 编号分配 / 逐屏生成 / 真实口播）
# + HeyGen 数字人，整片右上角常驻 270×480 视频小窗（H01Z 注入，位置写死在 --pip-* 变量里）。
# 与 04 的差异只有两处：『小窗』（骨架锁 full、H02S/H01D/H02SK 让位右上角、H02 查小窗合同）
# 和『出口』（H01Z → H02 → HeyGen 请求 / 等待 / 打包）。04 更新后按这几处同步 01。
version: 0.7.0
kind: app
app:
  name: 通用｜01_有数字人视频
  description: 在 04 黑帧口播链路（图像计划 + 编号分配 + 逐屏生成 + 真实口播）之上加一路 HeyGen 数字人：整片右上角常驻 270×480 视频小窗，标题、照片、组件、字幕都不进这块保留区。
  icon: 🎭
  icon_type: emoji
  icon_background: '#FFEAD5'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/opencode_go:0.5.2@31f6a79969e7c240fb2fa8c9331d89079ccb048283aeba032634c5f0b831658e
    version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: a00
      type: custom
      data:
        type: start
        title: A00_输入活动需求
        variables:
        - label: 主题、原始文本或随口一句话
          variable: campaign_brief
          type: paragraph
          required: true
          max_length: 30000
        - label: 可选创作偏好
          variable: creative_preferences
          type: paragraph
          required: false
          max_length: 12000
        - label: 可选背景/规范
          variable: brand_guidelines
          type: paragraph
          required: false
          max_length: 12000
        - label: 可选历史/补充
          variable: history_notes
          type: paragraph
          required: false
          max_length: 20000
        - label: 请求编号
          variable: request_id
          type: text-input
          required: true
          max_length: 128
        - label: 生产要求
          variable: production_requirements
          type: paragraph
          required: false
          max_length: 12000
        - label: TTS 供应商
          variable: tts_provider
          type: select
          required: false
          options:
          - mimo
          - macos
          - openai-compatible
        - label: TTS 模型名（留空使用 mimo-v2.5-tts）
          variable: tts_model
          type: text-input
          required: false
          max_length: 120
        - label: TTS Base 地址
          variable: tts_base_url
          type: select
          required: false
          options:
          - 默认（按量付费）
          - Token Plan - 中国
          - Token Plan - 新加坡
          - Token Plan - 欧洲
        - label: TTS 声音
          variable: tts_voice
          type: select
          required: false
          options:
          - mimo_default
          - 冰糖
          - 茉莉
          - 苏打
          - 白桦
          - Mia
          - Chloe
          - Milo
          - Dean
      position:
        x: 30
        y: 340
      positionAbsolute:
        x: 30
        y: 340
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 260
    - id: a01
      type: custom
      data:
        type: llm
        title: A01_整理自然语言需求
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        prompt_template:
        - id: a01-system
          role: system
          text: "# 任意输入整理\n\n你是内容策划助理。把用户输入整理成内部 JSON，不要询问用户，不要输出解释。输入可能是人物、经历、知识、兴趣、感受、观点、事件、一句话或任意原始文本；也可能是聊天记录、会议纪要、文章、语音转写、清单、转发片段或零散笔记。\n\n## 本次输入（必须全部使用）\n\n- `campaign_brief`：{{#a00.campaign_brief#}}\n- `creative_preferences`：{{#a00.creative_preferences#}}\n- `brand_guidelines`：{{#a00.brand_guidelines#}}\n- `history_notes`：{{#a00.history_notes#}}\n- `request_id`：{{#a00.request_id#}}\n- `production_requirements`：{{#a00.production_requirements#}}\n\n## 输出 JSON\n\n```json\n{\n  \"topic_record\": {\n    \"topic\": \"一句话主题（提炼后，不是原话）\",\n    \"source_text\": \"原始输入全文，完整保留，便于后续核对\",\n    \"audience_hint\": \"可选受众提示，不确定就留空\",\n    \"context\": {},\n    \"facts_confirmed\": [\"用户明确给出的事实、数字、经历或来源明确的说法\"],\n    \"constraints\": [\"用户明确提出的限制或要求\"],\n    \"duration_seconds\": 30\n  },\n  \"distill\": {\n    \"source_form\": \"chat_log|meeting_notes|article|voice_transcript|list|note|idea|brief|mixed\",\n    \"thesis\": \"一句话主张\",\n    \"thesis_source\": \"user_stated|implied|inferred_from_facts\",\n    \"thesis_type\": \"judgment|causal|method|prediction|experience\",\n    \"arguments\": [\n      {\"id\": \"a1\", \"claim\": \"能独立成立的论点\", \"evidence\": \"支撑它的具体事实/数字/对比/经历，没有就留空\", \"support\": \"data|experience|comparison|mechanism|counterexample|none\", \"strength\": \"high|medium|low\"}\n    ],\n    \"counterpoints\": [\"素材里需要正面回应的相反说法\"],\n    \"dropped\": [\"被丢弃的内容类别\"],\n    \"open_questions\": [\"素材没讲清、成稿不能编造的点\"]\n  },\n  \"creative\": {\n    \"topic_mode\": \"rotate\",\n    \"angle_preference\": \"可选角度偏好\"\n  },\n  \"history\": {}\n}\n```\n\n## 提炼优先（所有输入形态都先做这一步）\n\n1. **先提炼，再定主题。** 不管输入是聊天记录、文章还是几句话，都先回答一个问题：这个人真正想说的是什么判断？答案就是 `distill.thesis`。\n2. `thesis` 必须是判断句：A 导致 B / X 不是 Y / 应该做 Z / 本质上是什么。禁止写成话题名词（\"关于回乡的思考\"）、过程描述（\"聊了回乡的事\"）或口号。\n3. `thesis` 优先取输入者自己的立场。分辨依据：被追问的那句、被反驳后坚持的那句、说得最长、带数字或情绪、反复出现的那句。其他人的附和、客套和跑题不算立场。\n4. **素材只是素材，时间顺序不是结构。** \"先…然后…后来…\"只在它本身是因果链时才保留；单纯的过程、行程、寒暄、付款、打招呼一律不进 `thesis` 和 `arguments`。\n5. `arguments` 是支撑这个主张的理由，多少条由素材决定，不凑数、不硬拆：能独立成立、说得清楚的留下，说不清的并进别的论点或直接丢。\n6. 有证据就写进 `evidence`（数字、对比、亲历细节、反例、机制）；没有证据把 `support` 写成 `none`，并在 `open_questions` 记一句缺什么——**不得编造数字、案例或效果**。\n7. 素材里有冲突观点时：`thesis` 取输入者的立场，冲突说法进 `counterpoints`，成稿必须回应，不许装作没看见。\n8. 素材只有流水叙事、没有任何判断时：从 `facts_confirmed` 里推出最有支撑的一个判断，`thesis_source` 写 `inferred_from_facts`，缺的部分写进 `open_questions`。\n9. `dropped` 用短标签列清楚丢了什么类别（寒暄、重复、跑题、无关人物、玩笑、时间细节），方便后面核对没把废话写回去。\n10. 论点之间怎么排、每条讲多长，都交给你判断；不要为了整齐去做对称结构。\n\n## 规则\n\n- 不预设行业、商业结构或转化目标；用户没给的字段一律留空，不得自行补写故事。\n- 如果只是随口一句话，就把它作为 `source_text` 和 `topic`，`thesis` 用这句话的判断含义，论点按这句话能支撑的写，不要补写背景故事或商业故事。\n- 没有填写的可选内容使用空字符串、空数组或空对象。\n- 不得发明用户未提供的数字、案例、价格、经历、效果或承诺。\n- 主题完全由用户输入决定，不得默认改成商业、SaaS、获客或任何特定行业。\n- `duration_seconds` 默认 30；用户没说时长就不要按素材长度加长。\n\n## 素材类输入\n\n- 输入可能是聊天记录、笔记、文档摘录、语音转写、清单、链接摘要或碎片想法；一律当素材，不当文案。\n- `topic` 写提炼后的主题句，不要直接摘一句原话当主题。\n- `source_text` 保留原文便于核对；`facts_confirmed` 只提取能当论据的事实、经历、数字和明确观点。\n- 寒暄、语气词、表情、@、重复、玩笑、跑题和只有当事人才懂的指代，不要写进任何字段。\n- 聊天记录里\"他说/我说\"的轮次结构不是内容：先合并同一方观点，再提炼，不要把对话拆成论点。\n\n- 只输出 JSON。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 350
        y: 315
      positionAbsolute:
        x: 350
        y: 315
      sourcePosition: right
      targetPosition: left
      width: 310
      height: 155
    - id: a03
      type: custom
      data:
        type: code
        title: A03_标准化Brief
        code_language: python3
        code: "def main(structured_input_text: str) -> dict:\n    import json\n    import re\n\n    # ---- 前半：A02 的解析（原本是独立节点，2026-11-18 并进来）----\n    import json\n    import re\n\n    raw = str(structured_input_text or \"\").strip()\n    cleaned = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.I)\n    data = {}\n    try:\n        parsed = json.loads(cleaned)\n        if isinstance(parsed, dict):\n            data = parsed\n    except Exception:\n        start, end = cleaned.find(\"{\"), cleaned.rfind(\"}\")\n        if start >= 0 and end > start:\n            try:\n                parsed = json.loads(cleaned[start:end + 1])\n                if isinstance(parsed, dict):\n                    data = parsed\n            except Exception:\n                data = {}\n\n    def obj(value):\n        if isinstance(value, dict):\n            return value\n        if isinstance(value, str):\n            try:\n                parsed = json.loads(value)\n                return parsed if isinstance(parsed, dict) else {}\n            except Exception:\n                return {}\n        return {}\n\n    def str_list(value):\n        if not isinstance(value, list):\n            return []\n        return [str(item).strip() for item in value if str(item).strip()]\n\n    topic_record = obj(data.get(\"topic_record\") or data.get(\"campaign\"))\n    distill_raw = obj(data.get(\"distill\"))\n    creative = obj(data.get(\"creative\"))\n    context = obj(data.get(\"context\") or data.get(\"brand\"))\n    history = obj(data.get(\"history\"))\n\n    topic = str(topic_record.get(\"topic\") or topic_record.get(\"source_text\") or raw or \"当前主题\").strip()\n    source_text = str(topic_record.get(\"source_text\") or raw or topic).strip()\n\n    arguments = []\n    for index, item in enumerate(distill_raw.get(\"arguments\") or []):\n        if not isinstance(item, dict):\n            continue\n        claim = str(item.get(\"claim\") or \"\").strip()\n        if not claim:\n            continue\n        arguments.append({\n            \"id\": str(item.get(\"id\") or \"a%d\" % (index + 1)).strip(),\n            \"claim\": claim,\n            \"evidence\": str(item.get(\"evidence\") or \"\").strip(),\n            \"support\": str(item.get(\"support\") or \"none\").strip(),\n            \"strength\": str(item.get(\"strength\") or \"medium\").strip(),\n        })\n    seen_ids = set()\n    for argument in arguments:\n        while argument[\"id\"] in seen_ids:\n            argument[\"id\"] = argument[\"id\"] + \"_dup\"\n        seen_ids.add(argument[\"id\"])\n\n    thesis = str(distill_raw.get(\"thesis\") or \"\").strip()\n    if not thesis:\n        thesis = topic\n    distill = {\n        \"source_form\": str(distill_raw.get(\"source_form\") or \"\").strip() or \"mixed\",\n        \"thesis\": thesis,\n        \"thesis_source\": str(distill_raw.get(\"thesis_source\") or \"\").strip() or \"inferred_from_facts\",\n        \"thesis_type\": str(distill_raw.get(\"thesis_type\") or \"\").strip() or \"judgment\",\n        \"arguments\": arguments,\n        \"counterpoints\": str_list(distill_raw.get(\"counterpoints\")),\n        \"dropped\": str_list(distill_raw.get(\"dropped\")),\n        \"open_questions\": str_list(distill_raw.get(\"open_questions\")),\n    }\n\n    campaign = {\n        \"topic\": topic,\n        \"source_text\": source_text,\n        \"audience_hint\": str(topic_record.get(\"audience_hint\") or topic_record.get(\"audience\") or \"\").strip(),\n        \"context\": obj(topic_record.get(\"context\")),\n        \"facts_confirmed\": topic_record.get(\"facts_confirmed\") if isinstance(topic_record.get(\"facts_confirmed\"), list) else [],\n        \"constraints\": topic_record.get(\"constraints\") if isinstance(topic_record.get(\"constraints\"), list) else [],\n        \"duration_seconds\": topic_record.get(\"duration_seconds\", 30),\n        \"distill\": distill,\n    }\n    for key in (\"brand\", \"product\", \"audience\", \"pain\", \"offer\", \"cta\", \"tone\", \"platform\", \"proof\"):\n        value = topic_record.get(key)\n        if value not in (None, \"\", [], {}):\n            campaign[key] = value\n\n    # ---- 后半：A03 的标准化 ----\n\n    topic = str(campaign.get(\"topic\") or campaign.get(\"source_text\") or campaign.get(\"product\") or campaign.get(\"brand\") or \"当前主题\").strip()\n    source_text = str(campaign.get(\"source_text\") or topic).strip()\n    audience_hint = str(campaign.get(\"audience_hint\") or campaign.get(\"audience\") or \"\").strip()\n    facts_confirmed = campaign.get(\"facts_confirmed\") if isinstance(campaign.get(\"facts_confirmed\"), list) else []\n    constraints = campaign.get(\"constraints\") if isinstance(campaign.get(\"constraints\"), list) else []\n    normalization_warnings = []\n    if not str(campaign.get(\"topic\") or \"\").strip():\n        normalization_warnings.append(\"topic 缺失，已使用 source_text/当前主题作为主题\")\n\n    distill = campaign.get(\"distill\") if isinstance(campaign.get(\"distill\"), dict) else {}\n    arguments = [item for item in (distill.get(\"arguments\") or []) if isinstance(item, dict) and str(item.get(\"claim\") or \"\").strip()]\n    thesis = str(distill.get(\"thesis\") or \"\").strip()\n    source_form = str(distill.get(\"source_form\") or \"\").strip() or \"mixed\"\n    if not thesis:\n        thesis = topic\n        normalization_warnings.append(\"distill.thesis 缺失，已回落到主题句\")\n    if not arguments:\n        normalization_warnings.append(\"distill.arguments 为空，本次只能按单一论点展开\")\n    distill = {\n        \"source_form\": source_form,\n        \"thesis\": thesis,\n        \"thesis_source\": str(distill.get(\"thesis_source\") or \"\").strip() or \"inferred_from_facts\",\n        \"thesis_type\": str(distill.get(\"thesis_type\") or \"\").strip() or \"judgment\",\n        \"arguments\": arguments,\n        \"counterpoints\": [str(item).strip() for item in (distill.get(\"counterpoints\") or []) if str(item).strip()],\n        \"dropped\": [str(item).strip() for item in (distill.get(\"dropped\") or []) if str(item).strip()],\n        \"open_questions\": [str(item).strip() for item in (distill.get(\"open_questions\") or []) if str(item).strip()],\n    }\n    argument_count = len(distill[\"arguments\"])\n    source_chars = len(re.sub(r\"\\s+\", \"\", source_text))\n\n    raw_duration = str(campaign.get(\"duration_seconds\") or \"\").strip()\n    duration = 0.0\n    if raw_duration:\n        try:\n            duration = max(1.0, float(raw_duration))\n        except Exception:\n            duration = 0.0\n    if duration <= 0:\n        duration = 30.0\n        normalization_warnings.append(\"未指定时长，编排参考时长取 30 秒；最终以真实口播为准\")\n\n    brief = {\n        \"topic\": topic,\n        \"source_text\": source_text,\n        \"source_chars\": source_chars,\n        \"audience_hint\": audience_hint,\n        \"context\": context,\n        \"facts_confirmed\": facts_confirmed,\n        \"constraints\": constraints,\n        \"creative\": creative,\n        \"history\": history,\n        \"distill\": distill,\n        \"argument_count\": argument_count,\n        \"language\": \"zh-CN\",\n        \"aspect_ratio\": \"9:16\",\n        \"resolution\": \"1080x1920\",\n        \"fps\": 25,\n        \"target_duration_seconds\": duration,\n        \"normalization_warnings\": normalization_warnings,\n        \"hard_rules\": {\n            \"one_angle_per_video\": True,\n            \"voice_chars_per_second\": 4.2,\n            \"caption_unit\": \"complete_sentence\",\n            \"content_assumptions\": \"none\",\n            \"argument_spine\": True,\n            \"no_chronology_retelling\": True,\n            \"source_text_is_material_only\": True,\n            \"duration_is_reference_only\": True,\n            \"no_length_quota\": True,\n        }\n    }\n    for key in (\"brand\", \"product\", \"audience\", \"pain\", \"offer\", \"cta\", \"tone\", \"platform\", \"proof\"):\n        value = campaign.get(key)\n        if value not in (None, \"\", [], {}):\n            brief[key] = value\n\n    normalized_text = re.sub(r\"\\s+\", \"\", source_text).lower()\n    return {\n        \"brief_json\": json.dumps(brief, ensure_ascii=False),\n        \"target_duration_seconds\": duration,\n        \"proof_fingerprint\": normalized_text,\n        \"validation_ok\": True\n    }"
        variables:
        - variable: structured_input_text
          value_selector:
          - a01
          - text
      position:
        x: 880
        y: 330
      positionAbsolute:
        x: 880
        y: 330
      sourcePosition: right
      targetPosition: left
      width: 310
      height: 155
    - id: a03_gate
      type: custom
      data:
        type: if-else
        title: A03_Brief门禁
        cases:
        - id: valid
          case_id: valid
          logical_operator: and
          conditions:
          - id: valid-condition
            variable_selector:
            - a03
            - validation_ok
            comparison_operator: is
            value: 'true'
            varType: boolean
      position:
        x: 1415
        y: 355
      positionAbsolute:
        x: 1415
        y: 355
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 105
    - id: a04
      type: custom
      data:
        type: llm
        title: A04_选择内容角度
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        prompt_template:
        - id: a04-system
          role: system
          text: "# 内容策略师\n\n你是任意主题的中文短视频内容策略师。只能从已确认 brief 和审核主题池中选择一个角度，不得自行发明事实，也不得把主题强行解释成某个固定行业。\n\n## 输入\n\n- `brief`：主题、原始文本、已确认事实、约束，以及 `distill`（已提炼的主张与论点）\n- `approved_topics`：已审核主题池\n- `history`：已使用主题和效果反馈\n\n## 本次输入（必须全部使用）\n\n- `brief_json`：{{#a03.brief_json#}}\n- `creative_preferences`：{{#a00.creative_preferences#}}\n- `history_notes`：{{#a00.history_notes#}}\n- `request_id`：{{#a00.request_id#}}\n\n## 论点脊柱（强制，最高优先级）\n\n`brief_json.distill` 已经给出主张和论点。你的任务不是重新想题材，而是把这根脊柱排成一条能立住的叙事顺序。\n\n1. `core_message` 必须等于 `distill.thesis` 的意思：可以更锋利、更具体，但**不许换题**，也不许退回到更宽泛的话题。\n2. 输出 `argument_order`：把 `distill.arguments` 的 id 排成一个顺序，不许编造新 id，也不许为了凑数新增论点。\n3. 输出 `argument_claims`：`{id: 一句话论点}`，只做压缩，不改意思；这条会一路带到口播和分镜，必须能被观众单独听懂。\n4. 排序判断标准依次是：能直接推出结论的机制 > 有数字或对比的事实 > 亲历细节 > 类比和常识。弱的论点放到后面，讲不动就少讲一条，而不是硬撑。\n5. 自检：如果 `argument_order` 与 `distill.arguments` 的原顺序完全一致，说明你在照抄素材，重排一次再输出。\n6. 从 `distill.counterpoints` 里挑最容易让人不服的那条，写进 `proof_priority` 的前部——成稿必须正面回应它，不许回避。\n7. `distill.dropped` 里的内容一律不写回来；`distill.open_questions` 里的内容不得编造答案，写进 `claims_to_verify`。\n\n## 结构自由\n\n- 标题和副标题只要短、能一眼读完，字数由你判断。\n- 视频分几段、每段多长，由论点本身的重量决定：重要的一条可以占很久，次要的一条一句话带过也行。\n- 屏幕主文案写到能一眼读完为止，讲不完的内容留在口播里。\n- 单元之间要有递进、对比、因果或行动关系，不写时间线流水账。\n- 禁止“首先、其次、最后”式模板、空洞口号、鸡汤和无信息量过渡句。\n- 第一段直接进入 Hook，不做空白封面；结尾用一句有力总结或自然行动建议收束。\n\n## 重组规则（优先于原始输入顺序）\n\n- brief 里的原始输入只是素材，不是提纲：先提炼出一个能立住的结论，再倒推需要哪些论据。\n- 不沿用原始输入的时间顺序或原有结构；禁止把聊天记录按段改写成文案。\n- 论据按“能否让结论更快成立”排序，不按原话出现的先后排序。\n- 自检：如果连续三个论据的先后与原始输入一致，换一个顺序。\n\n## 素材类输入\n\n- 素材不是文案：先判断这段素材真正的分歧、结论或情绪落点，再选一个能立住的角度。\n- 禁止按原顺序搬运：不把聊天轮次、文档段落或清单条目当成叙事结构，也不按发言/段落顺序组织论据。\n- 素材里有多个话题时只选一个，其余写进 `excluded_topics`。\n\n## 论点要求（强制）\n\n- `core_message` 必须是一句能被单独当标题的断言，不是话题描述，也不是过程总结。\n- `hook_candidates[0]` 必须是结论型断言，不能只是一句场景或过程描述。\n- `proof_priority` 按“能否让结论更快成立”排序，不按素材出现顺序。\n- `argument_order` 与 `argument_claims` 必须齐全，缺一个都算没完成。\n\n## 目标\n\n一条视频只解决一个用户认知任务：提出问题、解释概念、展示步骤、分享经历、验证方法、给出启发，或形成自然行动建议。\n\n## 约束\n\n1. 主题可以是人物、知识、运动、感受、经历、成长、生活、观点或任意用户输入。\n2. 不选择无法由 brief 和用户事实支持的案例角度。\n3. 一条视频只讲一个核心角度，不堆砌全部知识点。\n4. Hook 必须具体，避免“大家好”“今天介绍”。\n5. 数字、价格、经历和结果只能来自 `facts_confirmed`。\n6. 输出 JSON，不输出 Markdown。\n\n## 输出 JSON\n\n```json\n{\n  \"angle_id\": \"string\",\n  \"angle_type\": \"问题型|经历型|方法型|结果型|场景型|行动型\",\n  \"core_message\": \"一句话核心结论，等义于 distill.thesis\",\n  \"argument_order\": [\"a2\", \"a1\", \"a3\"],\n  \"argument_claims\": {\"a1\": \"压缩后的一句话论点\", \"a2\": \"压缩后的一句话论点\"},\n  \"audience_tension\": \"可选的观众/情境张力；没有明确受众时写空字符串\",\n  \"hook_candidates\": [\"候选 Hook 1\", \"候选 Hook 2\", \"候选 Hook 3\"],\n  \"proof_priority\": [\"本条优先使用的已确认事实或经验\"],\n  \"claims_to_verify\": [\"无法确认、需要人工核验的内容\"],\n  \"selection_reason\": \"选择该角度的原因\",\n  \"excluded_topics\": [\"本次明确不讲的内容\"]\n}\n```\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
