# 01 有数字人（04 派生的数字人版）：04 全链路（图像计划 / 编号分配 / 逐屏生成 / 真实口播）
# + HeyGen 数字人，整片右上角常驻 270×480 视频小窗（H01Z 注入，位置写死在 --pip-* 变量里）。
# 与 04 的差异只有两处：『小窗』（骨架锁 full、H02S/H01D/H02SK 让位右上角、H02 查小窗合同）
# 和『出口』（H01Z → H02 → HeyGen 请求 / 等待 / 打包）。04 更新后按这几处同步 01。
version: 0.7.0
kind: app
app:
  name: 通用｜01_有数字人视频
  description: 在 04 黑帧口播链路（图像计划 + 编号分配 + 逐屏生成 + 真实口播）之上加一路 HeyGen 数字人：整片右上角常驻 270×480 视频小窗，标题、照片、组件、字幕都不进这块保留区。
  icon: 🎭
  icon_type: emoji
  icon_background: '#FFEAD5'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/opencode_go:0.5.2@31f6a79969e7c240fb2fa8c9331d89079ccb048283aeba032634c5f0b831658e
    version: null
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: a00
      type: custom
      data:
        type: start
        title: A00_输入活动需求
        variables:
        - label: 主题、原始文本或随口一句话
          variable: campaign_brief
          type: paragraph
          required: true
          max_length: 30000
        - label: 可选创作偏好
          variable: creative_preferences
