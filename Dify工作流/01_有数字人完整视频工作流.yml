          value_selector:
          - env
          - HEYGEN_AVATAR_ID
          value_type: string
        - variable: voice_id
          value_selector:
          - env
          - HEYGEN_VOICE_ID
          value_type: string
        outputs:
          heygen_request_json:
            type: string
            children: null
