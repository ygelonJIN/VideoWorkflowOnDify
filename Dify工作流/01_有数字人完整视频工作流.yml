    - id: h01s
      type: custom
      data:
        type: code
        title: H01S_生成HTML骨架
        code_language: python3
        code: "def main(approved_package_json: str, art_direction_json: str = \"\", design_brief: str = \"\", image_brief_json: str = \"\") -> dict:\n    \"\"\"固定骨架：画布、场景外壳、四个场景占位、动效/转场占位、媒体占位、显隐驱动、主时间线。\n\n    以前这一步是 LLM，被要求\"原样照抄\"主时间线脚本；模型偶尔抄错，整片就废。\n    现在骨架是常量，只把 :root 令牌、标题和时长换成这一支片子的值。\n    \"\"\"\n    import html as html_lib\n    import json\n    import re\n    from string import Template\n\n    RENDER_MODE = \"black-frame\"\n\n    def parse(raw):\n        text = str(raw or \"\").strip()\n        if not text:\n            return {}\n        try:\n            return json.loads(text)\n        except Exception:\n            start, end = text.find(\"{\"), text.rfind(\"}\")\n            if 0 <= start < end:\n                try:\n                    return json.loads(text[start:end + 1])\n                except Exception:\n                    return {}\n        return {}\n\n    package = parse(approved_package_json)\n    art = parse(art_direction_json)\n    brief = package.get(\"brief\") if isinstance(package.get(\"brief\"), dict) else {}\n    script = package.get(\"approved_script\") if isinstance(package.get(\"approved_script\"), dict) else {}\n    storyboard = package.get(\"storyboard\") if isinstance(package.get(\"storyboard\"), dict) else {}\n    strategy = storyboard.get(\"creative_strategy\") if isinstance(storyboard.get(\"creative_strategy\"), dict) else {}\n    typography = art.get(\"typography\") if isinstance(art.get(\"typography\"), dict) else {}\n    tokens = art.get(\"tokens\") if isinstance(art.get(\"tokens\"), dict) else {}\n\n    stack = str(typography.get(\"stack\") or \"\").strip() or '\"PingFang SC\",\"Noto Sans CJK SC\",\"Microsoft YaHei\",sans-serif'\n\n    root = []\n    for key, value in tokens.items():\n        name = str(key).strip()\n        if not name:\n            continue\n        if not name.startswith(\"--\"):\n            name = \"--\" + name\n        root.append(\"%s: %s;\" % (name, value))\n    if not any(item.startswith(\"--bg:\") for item in root):\n        root.insert(0, \"--bg: #0b0f18;\")\n    root_css = \" \".join(root)\n\n    title = str(strategy.get(\"title\") or brief.get(\"topic\") or \"视频\").strip()\n    slug_source = str(brief.get(\"topic\") or \"video\")\n    slug = re.sub(r\"[^A-Za-z0-9]+\", \"-\", slug_source).strip(\"-\").lower() or \"video\"\n    slug = slug[:48]\n    try:\n        duration = float(script.get(\"estimated_duration_seconds\") or 30.0)\n    except Exception:\n        duration = 30.0\n    if duration <= 0:\n        duration = 30.0\n\n    template = Template(\"\"\"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=1080, initial-scale=1\">\n<title>$title</title>\n<style>\n:root { $root_css }\nhtml, body { margin: 0; padding: 0; background: var(--bg, #0b0f18); }\n#stage {\n  position: relative;\n  width: 1080px;\n  height: 1920px;\n  overflow: hidden;\n  font-family: $stack;\n}\n#scenes { position: absolute; inset: 0; }\n.scene { position: absolute; inset: 0; overflow: hidden; }\n.media { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }\n.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }\n.media--inset { inset: auto; }\n.media-scrim { position: absolute; inset: 0; pointer-events: none; }\n.scene-bg { position: absolute; inset: 0; pointer-events: none; z-index: 0; }\n</style>\n<script>window.__sceneBuilders = window.__sceneBuilders || [];</script>\n</head>\n<body>\n\n<div id=\"stage\"\n     data-composition-id=\"$slug\"\n     data-width=\"1080\"\n     data-height=\"1920\"\n     data-duration=\"$duration\"\n     data-caption-sync=\"transcript-required\"\n     data-render-mode=\"$render_mode\">\n\n  <div id=\"scenes\">\n    <!-- SCENES_A -->\n    <!-- SCENES_B -->\n    <!-- SCENES_C -->\n    <!-- SCENES_D -->\n  </div>\n\n  <!-- MOTION_SCRIPTS -->\n  <!-- TRANSITION_SCRIPTS -->\n\n  <template data-media-type=\"audio\" data-audio-role=\"voiceover\" data-media-src=\"媒体/口播.mp3\"></template>\n  <template data-media-type=\"audio\" data-audio-role=\"background-music\" data-media-src=\"媒体/背景音乐.mp3\"></template>\n</div>\n\n<script id=\"scene-window-runtime\">\n(function(){\n  window.__sceneBuilders.push(function(timeline){\n    var stage = document.querySelector('#stage');\n    if (!stage) { return; }\n    var scenes = Array.prototype.slice.call(stage.querySelectorAll('#scenes .scene'));\n    if (!scenes.length) { return; }\n\n    function num(value) {\n      var n = parseFloat(value);\n      return isNaN(n) ? null : n;\n    }\n\n    function paint() {\n      var t = timeline.time();\n      for (var i = 0; i < scenes.length; i++) {\n        var scene = scenes[i];\n        var start = num(scene.getAttribute('data-start'));\n        var duration = num(scene.getAttribute('data-duration'));\n        if (start === null) { start = 0; }\n        var visible = t >= start - 0.0005;\n        if (visible && duration !== null && duration > 0) {\n          visible = t < start + duration + 0.001;\n        }\n        var nextVisibility = visible ? 'visible' : 'hidden';\n        if (scene.style.visibility !== nextVisibility) {\n          scene.style.visibility = nextVisibility;\n        }\n        var nextPointer = visible ? '' : 'none';\n        if (scene.style.pointerEvents !== nextPointer) {\n          scene.style.pointerEvents = nextPointer;\n        }\n      }\n    }\n\n    timeline.eventCallback('onUpdate', paint);\n    paint();\n  });\n})();\n</script>\n\n<script>\n(function(){\n  function boot(){\n    var root = document.querySelector('#stage');\n    var timeline = gsap.timeline({paused:true});\n    var at = function(seconds){\n      var scale = Number(root.getAttribute('data-timeline-scale')) || 1;\n      return Number(seconds) * scale;\n    };\n    (window.__sceneBuilders || []).forEach(function(build){\n      try { build(timeline, at); } catch (error) { console.warn('scene builder failed', error); }\n    });\n    window.__timelines = window.__timelines || {};\n    window.__timelines[root.getAttribute('data-composition-id')] = timeline;\n    timeline.seek(0);\n  }\n  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); } else { boot(); }\n})();\n</script>\n\n</body>\n</html>\n\"\"\")\n\n    document = template.substitute(\n        title=html_lib.escape(title),\n        root_css=root_css,\n        stack=stack,\n        slug=slug,\n        duration=\"%.3f\" % duration,\n        render_mode=RENDER_MODE,\n    )\n    return {\"text\": document}\n"
        variables:
        - variable: approved_package_json
          value_selector:
          - a16
          - approved_package_json
