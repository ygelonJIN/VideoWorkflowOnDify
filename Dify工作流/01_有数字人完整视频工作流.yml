    - id: a14
      type: custom
      data:
        type: code
        title: A14_生成审核摘要
        code_language: python3
        code: "def main(strategy_json: str, script_json: str, storyboard_json: str,\
          \ motion_plan_json: str, compliance_json: str) -> dict:\n    import json\n\
          \n    def parse(raw):\n        try:\n            data = json.loads(raw or\
          \ \"{}\")\n            return data if isinstance(data, dict) else {}\n \
          \       except Exception:\n            return {}\n\n    strategy = parse(strategy_json)\n\
          \    script = parse(script_json)\n    storyboard = parse(storyboard_json)\n\
          \    motion = parse(motion_plan_json)\n    compliance = parse(compliance_json)\n\
          \n    lines = [\"# 自动生产摘要\", \"\"]\n    lines.append(\"## 内容角度\")\n    lines.append(\"\
          - 核心结论：\" + str(strategy.get(\"core_message\") or script.get(\"hook\") or\
          \ \"未填写\"))\n    hook = str(strategy.get(\"hook\") or script.get(\"hook\"\
          ) or \"\")\n    if hook:\n        lines.append(\"- Hook：\" + hook)\n\n \
          \   lines.extend([\"\", \"## 口播草稿\", str(script.get(\"voiceover_script\"\
          ) or \"未生成\")])\n    captions = script.get(\"burned_in_caption_lines\")\
          \ or []\n    if captions:\n        lines.extend([\"\", \"## 字幕\"])\n   \
          \     lines.extend(\"- \" + str(item) for item in captions)\n\n    lines.extend([\"\
          \", \"## 分镜\"])\n    for index, scene in enumerate(storyboard.get(\"scenes\"\
          , []), 1):\n        if not isinstance(scene, dict):\n            continue\n\
          \        lines.append(\"%d. %s｜目的：%s｜画面：%s｜屏幕文字：%s\" % (\n            index,\n\
          \            scene.get(\"scene_id\", \"s%02d\" % index),\n            scene.get(\"\
          purpose\", \"\"),\n            scene.get(\"visual_brief\", scene.get(\"\
          ui_template\", \"\")),\n            scene.get(\"on_screen_text\", \"\")\n\
          \        ))\n\n    lines.extend([\"\", \"## 动效计划\"])\n    for index, item\
          \ in enumerate(motion.get(\"sequences\", []), 1):\n        if not isinstance(item,\
          \ dict):\n            continue\n        lines.append(\"%d. %s｜%s｜%s｜%sms｜%s\"\
          \ % (\n            index,\n            item.get(\"motion_id\", \"m%02d\"\
          \ % index),\n            item.get(\"scene_id\", \"\"),\n            item.get(\"\
          action\", \"\"),\n            item.get(\"duration_ms\", \"\"),\n       \
          \     item.get(\"semantic_reason\", \"\")\n        ))\n\n    lines.extend([\"\
          \", \"## 合规提示\"])\n    lines.append(\"- 审核结论：%s\" % compliance.get(\"decision\"\
          , \"待人工确认\"))\n    lines.append(\"- 风险等级：%s\" % compliance.get(\"risk_level\"\
          , \"待人工确认\"))\n    for item in compliance.get(\"required_changes\", [])\
          \ or []:\n        lines.append(\"- 需要修改：\" + str(item))\n    note = compliance.get(\"\
          review_note_for_human\")\n    if note:\n        lines.append(\"- 审核重点：\"\
          \ + str(note))\n\n    return {\"review_summary\": \"\\n\".join(lines)}\n"
        variables:
        - variable: strategy_json
          value_selector:
          - a05
          - strategy_json
          value_type: string
        - variable: script_json
          value_selector:
          - a07
          - script_json
          value_type: string
        - variable: storyboard_json
          value_selector:
          - a09
