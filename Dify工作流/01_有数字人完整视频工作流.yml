    - id: a01
      type: custom
      data:
        type: llm
        title: A01_整理自然语言需求
        model:
          provider: langgenius/mimo/mimo
          name: mimo-v2.6-pro
          mode: chat
          completion_params:
            temperature: 0.1
            max_completion_tokens: 1800
        prompt_template:
        - id: a01-system
          role: system
          text: "# 任意输入整理\n\n你是内容策划助理。把用户输入整理成内部 JSON，不要询问用户，不要输出解释。输入可能只是产品、服务、人物、经历、知识、兴趣、感受、观点、事件、一句话或任意原始文本。\n\n## 本次输入（必须全部使用）\n\n- `campaign_brief`：{{#a00.campaign_brief#}}\n- `creative_preferences`：{{#a00.creative_preferences#}}\n- `brand_guidelines`：{{#a00.brand_guidelines#}}\n- `history_notes`：{{#a00.history_notes#}}\n- `request_id`：{{#a00.request_id#}}\n- `production_requirements`：{{#a00.production_requirements#}}\n\n## 输出 JSON\n\n```json\n{\n  \"topic_record\": {\n    \"topic\": \"一句话主题\",\n    \"source_text\": \"原始输入、随口一句话或关键上下文\",\n    \"audience_hint\": \"可选受众提示，不确定就留空\",\n    \"context\": {},\n    \"facts_confirmed\": [\"用户明确给出的事实、数字、经历或来源明确的说法\"],\n    \"constraints\": [\"用户明确提出的限制或要求\"],\n    \"duration_seconds\": 30\n  },\n  \"creative\": {\n    \"topic_mode\": \"rotate\",\n    \"angle_preference\": \"可选角度偏好\"\n  },\n  \"history\": {}\n}\n```\n\n规则：\n\n- 不要求品牌、产品、公司、行业、痛点、卖点、CTA 或商业结构；只有用户明确提到时才记录。\n- 如果只是随口一句话，就把它作为 `source_text` 和 `topic`，不要补写品牌故事或产品故事。\n- 没有填写的可选内容使用空字符串、空数组或空对象。\n- 不得发明用户未提供的数字、案例、价格、经历、效果或承诺。\n- 主题完全由用户输入决定，不得默认改成商业、SaaS、获客或任何特定行业。\n- `duration_seconds` 默认 30。\n- 只输出 JSON。\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 350
        y: 315
      positionAbsolute:
        x: 350
        y: 315
      sourcePosition: right
      targetPosition: left
      width: 310
      height: 155
    - id: a02
      type: custom
      data:
        type: code
        title: A02_解析整理结果
        code_language: python3
        code: "def main(structured_input_text: str) -> dict:\n    import json\n    import re\n\n    raw = str(structured_input_text or \"\").strip()\n    cleaned = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.I)\n    data = {}\n    try:\n        parsed = json.loads(cleaned)\n        if isinstance(parsed, dict):\n            data = parsed\n    except Exception:\n        start, end = cleaned.find(\"{\"), cleaned.rfind(\"}\")\n        if start >= 0 and end > start:\n            try:\n                parsed = json.loads(cleaned[start:end + 1])\n                if isinstance(parsed, dict):\n                    data = parsed\n            except Exception:\n                data = {}\n\n    def obj(value):\n        if isinstance(value, dict):\n            return value\n        if isinstance(value, str):\n            try:\n                parsed = json.loads(value)\n                return parsed if isinstance(parsed, dict) else {}\n            except Exception:\n                return {}\n        return {}\n\n    topic_record = obj(data.get(\"topic_record\") or data.get(\"campaign\"))\n    creative = obj(data.get(\"creative\"))\n    context = obj(data.get(\"context\") or data.get(\"brand\"))\n    history = obj(data.get(\"history\"))\n\n    topic = str(topic_record.get(\"topic\") or topic_record.get(\"source_text\") or raw or \"当前主题\").strip()\n    source_text = str(topic_record.get(\"source_text\") or raw or topic).strip()\n    campaign = {\n        \"topic\": topic,\n        \"source_text\": source_text,\n        \"audience_hint\": str(topic_record.get(\"audience_hint\") or topic_record.get(\"audience\") or \"\").strip(),\n        \"context\": obj(topic_record.get(\"context\")),\n        \"facts_confirmed\": topic_record.get(\"facts_confirmed\") if isinstance(topic_record.get(\"facts_confirmed\"), list) else [],\n        \"constraints\": topic_record.get(\"constraints\") if isinstance(topic_record.get(\"constraints\"), list) else [],\n        \"duration_seconds\": topic_record.get(\"duration_seconds\", 30),\n    }\n    for key in (\"brand\", \"product\", \"audience\", \"pain\", \"offer\", \"cta\", \"tone\", \"platform\", \"proof\"):\n        value = topic_record.get(key)\n        if value not in (None, \"\", [], {}):\n            campaign[key] = value\n\n    return {\n        \"campaign_json\": json.dumps(campaign, ensure_ascii=False),\n        \"creative_json\": json.dumps(creative, ensure_ascii=False),\n        \"brand_json\": json.dumps(context, ensure_ascii=False),\n        \"history_json\": json.dumps(history, ensure_ascii=False)\n    }\n"
        variables:
        - variable: structured_input_text
          value_selector:
          - a01
          - text
          value_type: string
        outputs:
          campaign_json:
            type: string
            children: null
          creative_json:
            type: string
            children: null
          brand_json:
            type: string
            children: null
          history_json:
            type: string
            children: null
      position:
        x: 705
        y: 335
      positionAbsolute:
        x: 705
        y: 335
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 158
    - id: a03
      type: custom
      data:
        type: code
        title: A03_标准化Brief
        code_language: python3
        code: "def main(campaign_json: str, creative_json: str, brand_json: str, history_json: str) -> dict:\n    import json\n    import re\n\n    def load(value, fallback):\n        try:\n            parsed = json.loads(value or \"\")\n            return parsed if isinstance(parsed, dict) else fallback\n        except Exception:\n            return fallback\n\n    campaign = load(campaign_json, {})\n    creative = load(creative_json, {})\n    context = load(brand_json, {})\n    history = load(history_json, {})\n\n    topic = str(campaign.get(\"topic\") or campaign.get(\"source_text\") or campaign.get(\"product\") or campaign.get(\"brand\") or \"当前主题\").strip()\n    source_text = str(campaign.get(\"source_text\") or topic).strip()\n    audience_hint = str(campaign.get(\"audience_hint\") or campaign.get(\"audience\") or \"\").strip()\n    facts_confirmed = campaign.get(\"facts_confirmed\") if isinstance(campaign.get(\"facts_confirmed\"), list) else []\n    constraints = campaign.get(\"constraints\") if isinstance(campaign.get(\"constraints\"), list) else []\n    normalization_warnings = []\n    if not str(campaign.get(\"topic\") or \"\").strip():\n        normalization_warnings.append(\"topic 缺失，已使用 source_text/当前主题作为主题\")\n\n    try:\n        duration = float(campaign.get(\"duration_seconds\") or 30)\n    except Exception:\n        duration = 30.0\n        normalization_warnings.append(\"duration_seconds 无法解析，已使用默认 30 秒\")\n    duration = max(25.0, min(35.0, duration))\n\n    brief = {\n        \"topic\": topic,\n        \"source_text\": source_text,\n        \"audience_hint\": audience_hint,\n        \"context\": context,\n        \"facts_confirmed\": facts_confirmed,\n        \"constraints\": constraints,\n        \"creative\": creative,\n        \"history\": history,\n        \"language\": \"zh-CN\",\n        \"aspect_ratio\": \"9:16\",\n        \"resolution\": \"1080x1920\",\n        \"fps\": 25,\n        \"target_duration_seconds\": duration,\n        \"normalization_warnings\": normalization_warnings,\n        \"hard_rules\": {\n            \"one_angle_per_video\": True,\n            \"voice_chars_per_second\": 4.2,\n            \"caption_unit\": \"complete_sentence\",\n            \"content_assumptions\": \"none\"\n        }\n    }\n    for key in (\"brand\", \"product\", \"audience\", \"pain\", \"offer\", \"cta\", \"tone\", \"platform\", \"proof\"):\n        value = campaign.get(key)\n        if value not in (None, \"\", [], {}):\n            brief[key] = value\n\n    normalized_text = re.sub(r\"\\s+\", \"\", source_text).lower()\n    return {\n        \"brief_json\": json.dumps(brief, ensure_ascii=False),\n        \"target_duration_seconds\": duration,\n        \"max_voice_chars\": int(duration * 4.6),\n        \"min_voice_chars\": int(duration * 4.0),\n        \"proof_fingerprint\": normalized_text,\n        \"validation_ok\": True\n    }\n"
        variables:
        - variable: campaign_json
          value_selector:
          - a02
          - campaign_json
          value_type: string
        - variable: creative_json
          value_selector:
          - a02
          - creative_json
          value_type: string
        - variable: brand_json
          value_selector:
          - a02
          - brand_json
          value_type: string
        - variable: history_json
          value_selector:
          - a02
          - history_json
          value_type: string
        outputs:
          brief_json:
            type: string
            children: null
          target_duration_seconds:
            type: number
            children: null
          max_voice_chars:
            type: number
            children: null
          min_voice_chars:
            type: number
            children: null
          proof_fingerprint:
            type: string
            children: null
          validation_ok:
            type: boolean
            children: null
      position:
        x: 1060
        y: 335
      positionAbsolute:
        x: 1060
        y: 335
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 196
    - id: a03_gate
      type: custom
      data:
        type: if-else
        title: A03_Brief门禁
        cases:
        - id: valid
          case_id: valid
          logical_operator: and
          conditions:
          - id: valid-condition
            variable_selector:
            - a03
            - validation_ok
            comparison_operator: is
            value: 'true'
            varType: boolean
      position:
        x: 1415
        y: 355
      positionAbsolute:
        x: 1415
        y: 355
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 105
    - id: a04
      type: custom
      data:
        type: llm
        title: A04_选择内容角度
        model:
          provider: langgenius/mimo/mimo
          name: mimo-v2.6-pro
          mode: chat
          completion_params:
            temperature: 0.2
            max_completion_tokens: 1200
        prompt_template:
        - id: a04-system
          role: system
          text: "# 内容策略师\n\n你是任意主题的中文短视频内容策略师。只能从已确认 brief 和审核主题池中选择一个角度，不得自行发明事实，也不得把主题强行解释成某个固定行业。\n\n## 输入\n\n- `brief`：主题、原始文本、可选受众/上下文、已确认事实、约束和目标时长\n- `approved_topics`：已审核主题池\n- `history`：已使用主题和效果反馈\n\n## 本次输入（必须全部使用）\n\n- `brief_json`：{{#a03.brief_json#}}\n- `creative_preferences`：{{#a00.creative_preferences#}}\n- `history_notes`：{{#a00.history_notes#}}\n- `request_id`：{{#a00.request_id#}}\n\n## 非传记内容摘要规则（本次采用）\n\n- 标题控制在 16 字以内，副标题用一句话说明主题。\n- 建议 5–7 个内容单元，最后单元负责总结或自然行动建议；每个单元只讲一个核心观点。\n- 屏幕主文案每个单元不超过 160 字；完整口播和完整句子字幕不受此限制。\n- 用具体数字、步骤、状态、对比、案例或动作支撑观点；没有确认来源的内容不得编造。\n- 单元之间要有递进、对比、因果或行动关系，不写时间线流水账。\n- 禁止“首先、其次、最后”式模板、空洞口号、鸡汤和无信息量过渡句。\n- 第一单元直接进入 Hook，不做空白封面；结尾用一句有力总结或自然行动建议收束。\n\n## 目标\n\n一条视频只解决一个用户认知任务：提出问题、解释概念、展示步骤、分享经历、验证方法、给出启发，或形成自然行动建议。\n\n## 约束\n\n1. 主题可以是产品、人物、知识、运动、感受、经历、成长、生活、观点或任意用户输入。\n2. 不选择无法由 brief 和用户事实支持的案例角度。\n3. 一条视频只讲一个核心角度，不堆砌全部知识点。\n4. Hook 必须具体，避免“大家好”“今天介绍”。\n5. 数字、价格、经历和结果只能来自 `facts_confirmed`。\n6. 输出 JSON，不输出 Markdown。\n\n## 输出 JSON\n\n```json\n{\n  \"angle_id\": \"string\",\n  \"angle_type\": \"问题型|经历型|方法型|结果型|场景型|行动型\",\n  \"core_message\": \"一句话核心结论\",\n  \"audience_tension\": \"可选的观众/情境张力；没有明确受众时写空字符串\",\n  \"hook_candidates\": [\"候选 Hook 1\", \"候选 Hook 2\", \"候选 Hook 3\"],\n  \"proof_priority\": [\"本条优先使用的已确认事实或经验\"],\n  \"claims_to_verify\": [\"无法确认、需要人工核验的内容\"],\n  \"selection_reason\": \"选择该角度的原因\",\n  \"excluded_topics\": [\"本次明确不讲的内容\"]\n}\n```\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
      position:
        x: 1710
        y: 295
      positionAbsolute:
        x: 1710
        y: 295
      sourcePosition: right
      targetPosition: left
      width: 310
      height: 155
    - id: a05
      type: custom
      data:
        type: code
        title: A05_解析内容角度
        code_language: python3
        code: "def main(strategy_text: str) -> dict:\n    import json\n    import\
          \ re\n\n    raw = str(strategy_text or \"\").strip()\n    raw = re.sub(r\"\
          ^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.I)\n    try:\n       \
          \ data = json.loads(raw)\n    except Exception:\n        start, end = raw.find(\"\
          {\"), raw.rfind(\"}\")\n        data = {}\n        if start >= 0 and end\
          \ > start:\n            try:\n                data = json.loads(raw[start:end\
          \ + 1])\n            except Exception:\n                data = {}\n    if\
          \ not isinstance(data, dict):\n        data = {}\n    fallback_warning =\
          \ \"\"\n    if not data:\n        fallback_warning = \"内容策略 JSON 无法解析，已生成基础角度继续\"\
          \n        data = {\"core_message\": raw[:200] or \"聚焦一个具体业务问题\", \"angle_id\"\
          : \"angle_generated\"}\n\n    warnings = [fallback_warning] if fallback_warning\
          \ else []\n    core_message = str(data.get(\"core_message\", \"\")).strip()\n\
          \    hook = str(data.get(\"hook\", \"\")).strip()\n    hooks = data.get(\"\
          hook_candidates\")\n    if not isinstance(hooks, list):\n        hooks =\
          \ []\n    hooks = [str(item).strip() for item in hooks if str(item).strip()]\n\
          \    if not hooks:\n        hooks = [hook or core_message or \"聚焦一个具体业务问题\"\
          ]\n        warnings.append(\"hook_candidates 缺失，已使用 hook/core_message 生成\"\
          )\n    data[\"hook_candidates\"] = hooks\n    data[\"hook\"] = hooks[0]\n\
          \n    if not core_message:\n        core_message = data[\"hook\"]\n    \
          \    data[\"core_message\"] = core_message\n        warnings.append(\"core_message\
          \ 缺失，已使用 hook 生成\")\n    if not str(data.get(\"angle_id\", \"\")).strip():\n\
          \        data[\"angle_id\"] = \"angle_generated\"\n        warnings.append(\"\
          angle_id 缺失，已生成 angle_generated\")\n    data[\"normalization_warnings\"\
          ] = warnings\n\n    return {\n        \"strategy_json\": json.dumps(data,\
          \ ensure_ascii=False),\n        \"angle_id\": str(data[\"angle_id\"]),\n\
          \        \"hook\": str(data[\"hook\"]),\n        \"core_message\": core_message,\n\
          \        \"parse_ok\": True\n    }\n"
        variables:
