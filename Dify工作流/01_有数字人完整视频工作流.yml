      data:
        type: code
        title: A02_解析整理结果
        code_language: python3
        code: "def main(structured_input_text: str) -> dict:\n    import json\n  \
          \  import re\n\n    raw = str(structured_input_text or \"\").strip()\n \
          \   cleaned = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.I)\n\
          \    data = {}\n    try:\n        parsed = json.loads(cleaned)\n       \
          \ if isinstance(parsed, dict):\n            data = parsed\n    except Exception:\n\
          \        start, end = cleaned.find(\"{\"), cleaned.rfind(\"}\")\n      \
          \  if start >= 0 and end > start:\n            try:\n                parsed\
          \ = json.loads(cleaned[start:end + 1])\n                if isinstance(parsed,\
          \ dict):\n                    data = parsed\n            except Exception:\n\
          \                data = {}\n\n    def obj(value):\n        if isinstance(value,\
          \ dict):\n            return value\n        if isinstance(value, str):\n\
          \            try:\n                parsed = json.loads(value)\n        \
          \        return parsed if isinstance(parsed, dict) else {}\n           \
          \ except Exception:\n                return {}\n        return {}\n\n  \
          \  campaign = obj(data.get(\"campaign\"))\n    creative = obj(data.get(\"\
          creative\"))\n    brand = obj(data.get(\"brand\"))\n    history = obj(data.get(\"\
          history\"))\n\n    if not campaign:\n        fallback_text = raw or \"未提供活动需求\"\
          \n        campaign = {\n            \"brand\": \"未提供品牌\",\n            \"\
          product\": \"未提供产品\",\n            \"audience\": \"目标客户\",\n           \
          \ \"pain\": fallback_text[:120],\n            \"facts_confirmed\": [fallback_text[:200]]\
          \ if fallback_text else [],\n            \"offer\": \"\",\n            \"\
          cta\": \"进一步了解\",\n            \"duration_seconds\": 30,\n            \"\
          platform\": \"douyin\"\n        }\n\n    return {\n        \"campaign_json\"\
          : json.dumps(campaign, ensure_ascii=False),\n        \"creative_json\":\
          \ json.dumps(creative, ensure_ascii=False),\n        \"brand_json\": json.dumps(brand,\
          \ ensure_ascii=False),\n        \"history_json\": json.dumps(history, ensure_ascii=False)\n\
          \    }\n"
        variables:
        - variable: structured_input_text
          value_selector:
          - a01
          - text
          value_type: string
        outputs:
          campaign_json:
            type: string
            children: null
          creative_json:
            type: string
            children: null
          brand_json:
            type: string
            children: null
          history_json:
            type: string
            children: null
      position:
        x: 705
        y: 335
      positionAbsolute:
        x: 705
        y: 335
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 158
    - id: a03
      type: custom
      data:
        type: code
        title: A03_标准化Brief
        code_language: python3
        code: "def main(campaign_json: str, creative_json: str, brand_json: str, history_json:\
          \ str) -> dict:\n    import json\n    import re\n\n    def load(value, fallback):\n\
          \        try:\n            parsed = json.loads(value or \"\")\n        \
          \    return parsed if isinstance(parsed, dict) else fallback\n        except\
          \ Exception:\n            return fallback\n\n    campaign = load(campaign_json,\
          \ {})\n    creative = load(creative_json, {})\n    brand = load(brand_json,\
          \ {})\n    history = load(history_json, {})\n\n    required = [\"brand\"\
          , \"product\", \"audience\", \"pain\", \"cta\"]\n    missing = [key for\
          \ key in required if not str(campaign.get(key, \"\")).strip()]\n    if missing:\n\
          \        raise ValueError(\"缺少必填字段: \" + \", \".join(missing))\n\n    duration\
          \ = float(campaign.get(\"duration_seconds\") or 30)\n    duration = max(25.0,\
          \ min(35.0, duration))\n    proof = str(campaign.get(\"proof\") or \"\"\
          ).strip()\n    facts_confirmed = campaign.get(\"facts_confirmed\")\n   \
          \ if not isinstance(facts_confirmed, list):\n        facts_confirmed = [proof]\
          \ if proof else []\n\n    brief = {\n        \"brand\": campaign.get(\"\
          brand\"),\n        \"product\": campaign.get(\"product\"),\n        \"audience\"\
          : campaign.get(\"audience\"),\n        \"pain\": campaign.get(\"pain\"),\n\
          \        \"facts_confirmed\": facts_confirmed,\n        \"offer\": campaign.get(\"\
          offer\", \"\"),\n        \"cta\": campaign.get(\"cta\"),\n        \"tone\"\
          : campaign.get(\"tone\", \"专业、直接、可信\"),\n        \"platform\": campaign.get(\"\
          platform\", \"douyin\"),\n        \"language\": \"zh-CN\",\n        \"aspect_ratio\"\
          : \"9:16\",\n        \"resolution\": \"1080x1920\",\n        \"fps\": 25,\n\
          \        \"target_duration_seconds\": duration,\n        \"creative\": creative,\n\
          \        \"brand_system\": brand,\n        \"history\": history,\n     \
          \   \"hard_rules\": {\n            \"one_angle_per_video\": True,\n    \
          \        \"voice_chars_per_second\": 4.2,\n            \"caption_unit\"\
          : \"complete_sentence\",\n            \"avatar_pip_position\": \"top_right\"\
          ,\n            \"semantic_change_interval_seconds\": 2.5\n        }\n  \
          \  }\n\n    normalized_text = re.sub(r\"\\s+\", \"\", str(campaign.get(\"\
          proof\", \"\"))).lower()\n    return {\n        \"brief_json\": json.dumps(brief,\
          \ ensure_ascii=False),\n        \"target_duration_seconds\": duration,\n\
          \        \"max_voice_chars\": int(duration * 4.6),\n        \"min_voice_chars\"\
          : int(duration * 4.0),\n        \"proof_fingerprint\": normalized_text,\n\
          \        \"validation_ok\": True\n    }\n"
        variables:
        - variable: campaign_json
          value_selector:
          - a02
          - campaign_json
          value_type: string
        - variable: creative_json
          value_selector:
          - a02
          - creative_json
          value_type: string
        - variable: brand_json
          value_selector:
          - a02
          - brand_json
          value_type: string
        - variable: history_json
          value_selector:
          - a02
          - history_json
          value_type: string
        outputs:
          brief_json:
            type: string
            children: null
          target_duration_seconds:
            type: number
            children: null
          max_voice_chars:
            type: number
            children: null
          min_voice_chars:
            type: number
            children: null
          proof_fingerprint:
            type: string
            children: null
          validation_ok:
            type: boolean
            children: null
      position:
        x: 1060
        y: 335
      positionAbsolute:
        x: 1060
        y: 335
      sourcePosition: right
      targetPosition: left
      width: 270
      height: 196
    - id: a03_gate
      type: custom
      data:
        type: if-else
        title: A03_Brief门禁
        cases:
        - id: valid
          case_id: valid
          logical_operator: and
          conditions:
          - id: valid-condition
            variable_selector:
            - a03
            - validation_ok
            comparison_operator: is
            value: 'true'
