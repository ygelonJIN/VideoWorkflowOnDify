    - id: a12
      type: custom
      data:
        type: llm
        title: A12_事实与合规检查
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen3.8-flash
          mode: chat
          completion_params:
            temperature: 0.1
            max_tokens: 2200
        prompt_template:
        - id: a12-system
          role: system
          text: "# 事实与合规审核\n\n你是内容事实和合规审核员。审核口播、字幕、标题、标签和分镜中的所有可验证陈述。主题不限于商业产品，可以是知识、经历、运动、赚钱、成长、生活或观点。\n\
            \n## 检查\n\n- 主题、品牌、人物、产品、价格、CTA 是否与用户输入一致\n- 数字、经历、案例、效果是否来自已确认来源\n- 是否存在绝对化承诺、保证结果、行业第一或无法验证的比较\n\
            - 是否把示例、假设或场景演示误写成真实数据\n- 是否存在贬低他人、制造焦虑、误导或不安全建议\n- 英文词、数字和多音字是否有发音风险\n\
            \n## 输出 JSON\n\n```json\n{\n  \"decision\": \"approved|needs_changes|rejected\"\
            ,\n  \"risk_level\": \"low|medium|high\",\n  \"verified_claims\": [\n\
            \    {\"text\": \"string\", \"source\": \"string\"}\n  ],\n  \"unverified_claims\"\
            : [\n    {\"text\": \"string\", \"reason\": \"string\", \"required_action\"\
            : \"补充来源|删除|改写为待核验\"}\n  ],\n  \"violations\": [\n    {\"text\": \"string\"\
            , \"rule\": \"string\", \"severity\": \"low|medium|high\"}\n  ],\n  \"\
            revision_instructions\": [\"需要修改的具体位置和建议\"]\n}\n```\n"
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
