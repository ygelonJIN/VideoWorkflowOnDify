    - id: h01z
      type: custom
      data:
        type: code
        title: H01Z_注入数字人小窗
        code_language: python3
        code: "def main(html_document: str) -> dict:\n    \"\"\"把右上角数字人小窗写进文档。\n\n    结构由代码保证：小窗的占位、位置、尺寸都在这里落定，模型写什么都改不掉。\n    - 根节点锁成 data-render-mode=\"full\"（数字人版）；\n    - `--pip-*` 四个变量既是 CSS，也是本地版面避让的依据（sync_video.py 读它们算文字让位）；\n    - 媒体占位插在 #scenes 之后、与场景层同级：换屏和页间转场都不会把它一起带走。\n    \"\"\"\n    import json\n    import re\n\n    PIP = {\"top\": 120, \"right\": 44, \"width\": 270, \"height\": 480, \"radius\": 24, \"z\": 66}\n    CANVAS_W = 1080\n\n    html = str(html_document or \"\")\n    if \"<!doctype html>\" not in html.lower():\n        raise ValueError(\"html_document 不是完整 HTML：H01S 骨架被截断，重跑 H01S\")\n    notes = []\n\n    # 1) 模型自己写的数字人片段先清掉，避免出现两个小窗\n    before = html\n    html = re.sub(r'<template\\b[^>]*(?:data-video-role=\"avatar\"|data-media-id=\"heygen_avatar\")[^>]*>\\s*</template>', \"\", html, flags=re.I)\n    html = re.sub(r'<(?:video|div|section)\\b[^>]*(?:data-video-role=\"avatar\"|data-media-id=\"heygen_avatar\")[^>]*>[\\s\\S]*?</(?:video|div|section)>', \"\", html, flags=re.I)\n    html = re.sub(r'<style\\b[^>]*id=\"avatar-window-contract\"[^>]*>[\\s\\S]*?</style>\\s*', \"\", html, flags=re.I)\n    if html != before:\n        notes.append(\"已清掉模型自写的数字人小窗或旧合同\")\n\n    # 2) 根节点：只认 full\n    root = re.search(r'<div\\b[^>]*\\bid=[\"\\']stage[\"\\'][^>]*>', html, re.I)\n    if not root:\n        raise ValueError(\"缺少 #stage 根画布：H01S 骨架没产出根节点，重跑 H01S\")\n\n    def set_attr(tag, name, value):\n        pattern = re.compile(r\"\\s\" + re.escape(name) + r'=\"[^\"]*\"')\n        if pattern.search(tag):\n            return pattern.sub(' %s=\"%s\"' % (name, value), tag, count=1)\n        return tag[:-1].rstrip() + ' %s=\"%s\">' % (name, value)\n\n    tag = set_attr(set_attr(root.group(0), \"data-render-mode\", \"full\"), \"data-avatar-slot\", \"top-right\")\n    html = html[:root.start()] + tag + html[root.end():]\n\n    # 3) 小窗合同 CSS\n    css = (\n        '<style id=\"avatar-window-contract\">\\n'\n        '#stage{--pip-top:%dpx;--pip-right:%dpx;--pip-width:%dpx;--pip-height:%dpx;--pip-radius:%dpx;}\\n'\n        '.avatar-window{position:absolute;top:var(--pip-top);right:var(--pip-right);'\n        'width:var(--pip-width);height:var(--pip-height);border-radius:var(--pip-radius);'\n        'overflow:hidden;background:#000;z-index:%d;box-shadow:0 12px 32px rgba(0,0,0,.45);}\\n'\n        '.avatar-window video{width:100%%;height:100%%;object-fit:cover;display:block;}\\n'\n        '</style>\\n'\n    ) % (PIP[\"top\"], PIP[\"right\"], PIP[\"width\"], PIP[\"height\"], PIP[\"radius\"], PIP[\"z\"])\n    if \"</head>\" in html.lower():\n        html = re.sub(r'</head\\s*>', css + \"</head>\", html, count=1, flags=re.I)\n    else:\n        notes.append(\"骨架没有 </head>，小窗合同 CSS 放到了文档最前面\")\n        html = css + html\n\n    # 4) 媒体占位：放在 #scenes 之后\n    placeholder = (\n        '\\n  <template data-media-type=\"video\" data-media-id=\"heygen_avatar\" data-video-role=\"avatar\" '\n        'data-media-src=\"素材/avatar.mp4\" data-start=\"0\" data-duration=\"30\"></template>\\n'\n    )\n    placed = False\n    scenes = re.search(r'<div\\b[^>]*\\bid=[\"\\']scenes[\"\\'][^>]*>', html, re.I)\n    if scenes:\n        depth = 0\n        for match in re.finditer(r'<div\\b[^>]*>|</div\\s*>', html[scenes.end():], re.I):\n            if match.group(0).lower().startswith(\"</\"):\n                if depth == 0:\n                    pos = scenes.end() + match.end()\n                    html = html[:pos] + placeholder + html[pos:]\n                    placed = True\n                    break\n                depth -= 1\n            else:\n                depth += 1\n    if not placed:\n        close = html.lower().rfind(\"</div>\")\n        if close < 0:\n            raise ValueError(\"找不到 #scenes 收尾，也没有可用的 </div>：H01S 骨架重跑\")\n        notes.append(\"没定位到 #scenes 收尾，小窗占位插在最后一个 </div> 之前\")\n        html = html[:close] + placeholder + html[close:]\n\n    rect = {\n        \"left\": CANVAS_W - PIP[\"right\"] - PIP[\"width\"],\n        \"right\": CANVAS_W - PIP[\"right\"],\n        \"top\": PIP[\"top\"],\n        \"bottom\": PIP[\"top\"] + PIP[\"height\"],\n        \"width\": PIP[\"width\"],\n        \"height\": PIP[\"height\"],\n    }\n    if \"window.__timelines\" not in html:\n        notes.append(\"合并后的 HTML 没有 window.__timelines 注册，动作不会执行\")\n    return {\n        \"html_document\": html,\n        \"pip_contract_json\": json.dumps({\"slot\": \"top-right\", \"rect\": rect, \"notes\": notes}, ensure_ascii=False),\n    }"
        variables:
        - variable: html_document
          value_selector:
          - h01b
          - html_document
          value_type: string
        outputs:
          html_document:
            type: string
            children: null
          pip_contract_json:
            type: string
            children: null
