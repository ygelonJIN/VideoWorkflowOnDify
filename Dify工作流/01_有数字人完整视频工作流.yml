    - id: h01xj
      type: custom
      data:
        type: code
        title: H01XJ_注入编号到逐屏载荷
        code_language: python3
        code: "def main(scene_payloads: list, catalog_json: str, casting_text: str) -> dict:\n    \"\"\"把 H01X 的编号方案注入逐屏载荷。\n\n    编号由模型选，这里只做三件事：把选中的编号和目录里的名字/说明一起写进\n    visual_budget / motion_budget、按白名单归一非法编号、把可疑选择记成 warning。\n    不做拦截——选错了按目录兜底继续往下走，让片子能出。\n    \"\"\"\n    import json\n\n    try:\n        catalog = json.loads(catalog_json or \"{}\")\n    except Exception:\n        catalog = {}\n    if not isinstance(catalog, dict):\n        catalog = {}\n    bg_cards = catalog.get(\"background\") if isinstance(catalog.get(\"background\"), dict) else {}\n    comp_cards = catalog.get(\"component\") if isinstance(catalog.get(\"component\"), dict) else {}\n    motion = catalog.get(\"motion\") if isinstance(catalog.get(\"motion\"), dict) else {}\n\n    def group(*keys):\n        out = []\n        for key in keys:\n            value = motion.get(key)\n            if isinstance(value, list):\n                for item in value:\n                    token = str(item or \"\").strip().upper()\n                    if token and token not in out:\n                        out.append(token)\n        return out\n\n    entrance_ok = group(\"entrance_text\", \"entrance_block\")\n    state_ok = group(\"state_text\", \"state_block\")\n    component_ok = group(\"component_motion\")\n    blocked = set()  # special_dom 已整族删除（2026-11-17），空集合给下游兼容\n    bg_ids = list(bg_cards.keys()) or [\"B23\"]\n    comp_ids = list(comp_cards.keys()) or [\"U01\"]\n\n    raw = str(casting_text or \"\").strip()\n    data = {}\n    if raw:\n        try:\n            data = json.loads(raw)\n        except Exception:\n            start, end = raw.find(\"{\"), raw.rfind(\"}\")\n            if 0 <= start < end:\n                try:\n                    data = json.loads(raw[start:end + 1])\n                except Exception:\n                    data = {}\n    rows = data.get(\"assignments\") if isinstance(data, dict) else None\n    if not isinstance(rows, list):\n        rows = []\n    cast = {}\n    for row in rows:\n        if not isinstance(row, dict):\n            continue\n        sid = str(row.get(\"scene_id\") or \"\").strip()\n        if sid:\n            cast[sid] = row\n\n    warnings = []\n    payloads = []\n    meta = []\n    used_bg = []\n    prev_family = \"\"\n    prev_entrance = \"\"\n    prev_state = \"\"\n    prev_component_motion = \"\"\n\n    for index, item in enumerate(scene_payloads or []):\n        try:\n            scene = json.loads(item) if isinstance(item, str) else dict(item or {})\n        except Exception:\n            scene = {}\n        if not isinstance(scene, dict):\n            scene = {}\n        sid = str(scene.get(\"scene_id\") or \"s%02d\" % (index + 1))\n        row = cast.get(sid)\n        if not isinstance(row, dict):\n            row = {}\n\n        want = str(row.get(\"background\") or \"\").strip().upper()\n        if want not in bg_cards:\n            if want:\n                warnings.append(\"%s 的背景 %s 不在目录里：H01X 选错，需重跑 H01X\" % (sid, want))\n            want = \"\"\n        used_bg.append(want)\n        bg_meta = bg_cards.get(want) or {}\n        family = str(bg_meta.get(\"family\") or \"\")\n        if prev_family and family and family == prev_family:\n            warnings.append(\"%s 与上一屏背景同族（%s）\" % (sid, family))\n\n        comps = []\n        raw_comps = row.get(\"components\")\n        if isinstance(raw_comps, str):\n            raw_comps = [raw_comps]\n        for token in (raw_comps or []):\n            cid = str(token or \"\").strip().upper()\n            if not cid or cid in comps:\n                continue\n            if cid not in comp_ids:\n                warnings.append(\"%s 的组件 %s 不在目录里，已丢弃\" % (sid, cid))\n                continue\n            comps.append(cid)\n        comps = comps[:2]\n        # 组件可选；给的编号不可用就留空并记录，不替 H01X 换一个。\n        if not comps and row.get(\"components\"):\n            warnings.append(\"%s 的组件编号都不可用：H01X 选错，需重跑 H01X\" % sid)\n\n        def pick_motion(key, pool, previous, label):\n            choice = str(row.get(key) or \"\").strip().upper()\n            if not choice:\n                warnings.append(\"%s 的%s没有编号：H01X 漏选，需重跑 H01X\" % (sid, label))\n                return \"\"\n            if choice in blocked:\n                warnings.append(\"%s 的%s选了需要额外 DOM 的 %s：H01X 选错，需重跑 H01X\" % (sid, label, choice))\n                return \"\"\n            if choice not in pool:\n                warnings.append(\"%s 的%s编号 %s 不可用：H01X 选错，需重跑 H01X\" % (sid, label, choice))\n                return \"\"\n            return choice\n\n        entrance = pick_motion(\"entrance\", entrance_ok, prev_entrance, \"入场\")\n        state = pick_motion(\"state\", state_ok, prev_state, \"状态\")\n        component_motion = pick_motion(\"component_motion\", component_ok, prev_component_motion, \"组件动效\") if comps else \"\"\n        if component_motion:\n            prev_component_motion = component_motion\n\n        prev_entrance = entrance or prev_entrance\n        prev_state = state or prev_state\n        prev_family = family\n\n        scene[\"visual_budget\"] = {\n            \"background\": want,\n            \"background_name\": str(bg_meta.get(\"name\") or \"\"),\n            \"background_note\": str(bg_meta.get(\"note\") or \"\"),\n            \"background_family\": family,\n            \"background_why\": str(row.get(\"background_why\") or \"\").strip(),\n            \"components\": comps,\n            \"component_why\": str(row.get(\"component_why\") or \"\").strip(),\n        }\n        scene[\"motion_budget\"] = {\n            \"entrance\": entrance,\n            \"state\": state,\n            \"component\": component_motion,\n            \"why\": str(row.get(\"motion_why\") or \"\").strip(),\n        }\n        payloads.append(json.dumps(scene, ensure_ascii=False))\n        meta.append({\"scene_id\": sid, \"background\": want, \"family\": family,\n                     \"components\": comps, \"entrance\": entrance, \"state\": state})\n\n    missing = [row[\"scene_id\"] for row in meta if row[\"scene_id\"] not in cast]\n    if missing:\n        warnings.append(\"这些屏 H01X 没给 assignments：\" + \"、\".join(missing) + \"（需重跑 H01X）\")\n    if not cast:\n        warnings.append(\"H01X 没有可解析的 assignments：需要重跑 H01X，不要按顺序顶替\")\n\n    summary = {\n        \"scene_total\": len(payloads),\n        \"cast_scenes\": len(cast),\n        \"casting\": meta,\n        \"warnings\": warnings,\n    }\n    return {\n        \"payloads\": payloads,\n        \"cast_warnings_json\": json.dumps(warnings, ensure_ascii=False),\n        \"cast_summary_json\": json.dumps(summary, ensure_ascii=False),\n    }\n"
        variables:
        - variable: scene_payloads
          value_selector:
          - h00
          - scene_payloads
          value_type: array[string]
        - variable: catalog_json
          value_selector:
          - h00
          - catalog_json
          value_type: string
        - variable: casting_text
          value_selector:
          - h01x
          - text
          value_type: string
        outputs:
          payloads:
            type: array[string]
            children: null
          cast_warnings_json:
            type: string
            children: null
          cast_summary_json:
            type: string
            children: null
