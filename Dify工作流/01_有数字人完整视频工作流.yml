        code: "def main(approved_package_json: str, copy_warnings_json: str, storyboard_warnings_json:\
          \ str, motion_warnings_json: str) -> dict:\n    import json\n\n    def parse(raw):\n\
          \        try:\n            data = json.loads(raw or \"{}\")\n          \
          \  return data if isinstance(data, dict) else {}\n        except Exception:\n\
          \            return {}\n\n    def arr(raw):\n        try:\n            data\
          \ = json.loads(raw or \"[]\")\n            return data if isinstance(data,\
          \ list) else []\n        except Exception:\n            return []\n\n  \
          \  package = parse(approved_package_json)\n    brief = package.get(\"brief\"\
          ) if isinstance(package.get(\"brief\"), dict) else {}\n    script = package.get(\"\
          approved_script\") if isinstance(package.get(\"approved_script\"), dict)\
          \ else {}\n    storyboard = package.get(\"storyboard\") if isinstance(package.get(\"\
          storyboard\"), dict) else {}\n    motion = package.get(\"motion_plan\")\
          \ if isinstance(package.get(\"motion_plan\"), dict) else {}\n\n    lines\
          \ = [\"# 视频内容生产资料\", \"\", \"审核状态：已批准\", \"\"]\n    lines.append(\"## 活动信息\"\
          )\n    lines.append(\"- 品牌：%s\" % brief.get(\"brand\", \"未填写\"))\n    lines.append(\"\
          - 产品：%s\" % brief.get(\"product\", \"未填写\"))\n    lines.append(\"- 目标受众：%s\"\
          \ % brief.get(\"audience\", \"未填写\"))\n    lines.append(\"- 核心痛点：%s\" %\
          \ brief.get(\"pain\", \"未填写\"))\n    lines.append(\"- CTA：%s\" % brief.get(\"\
          cta\", \"未填写\"))\n\n    lines.extend([\"\", \"## 口播全文\", str(script.get(\"\
          voiceover_script\") or \"未生成\")])\n    captions = script.get(\"burned_in_caption_lines\"\
          ) or []\n    if captions:\n        lines.extend([\"\", \"## 字幕\"])\n   \
          \     lines.extend(\"- \" + str(item) for item in captions)\n\n    title\
          \ = script.get(\"title\")\n    if title:\n        lines.extend([\"\", \"\
          ## 发布标题\", str(title)])\n    hashtags = script.get(\"hashtags\") or []\n\
          \    if hashtags:\n        lines.extend([\"\", \"## 标签\", \" \".join(str(item)\
          \ for item in hashtags)])\n\n    lines.extend([\"\", \"## 分镜\"])\n    for\
          \ index, scene in enumerate(storyboard.get(\"scenes\", []), 1):\n      \
          \  if not isinstance(scene, dict):\n            continue\n        lines.append(\"\
          %d. 场景 %s｜目的：%s｜画面来源：%s｜模板：%s｜画面：%s｜屏幕文字：%s\" % (\n            index,\n\
          \            scene.get(\"scene_id\", \"s%02d\" % index),\n            scene.get(\"\
          purpose\", \"\"),\n            scene.get(\"visual_source\", \"\"),\n   \
          \         scene.get(\"ui_template\", \"\"),\n            scene.get(\"visual_brief\"\
          , \"\"),\n            scene.get(\"on_screen_text\", \"\")\n        ))\n\n\
          \    lines.extend([\"\", \"## 动效\"])\n    for index, item in enumerate(motion.get(\"\
          sequences\", []), 1):\n        if not isinstance(item, dict):\n        \
          \    continue\n        lines.append(\"%d. %s｜场景 %s｜动作：%s｜触发：%s｜时长：%sms｜原因：%s\"\
          \ % (\n            index,\n            item.get(\"motion_id\", \"m%02d\"\
          \ % index),\n            item.get(\"scene_id\", \"\"),\n            item.get(\"\
          action\", \"\"),\n            item.get(\"start_trigger\", \"\"),\n     \
          \       item.get(\"duration_ms\", \"\"),\n            item.get(\"semantic_reason\"\
          , \"\")\n        ))\n\n    warnings = []\n    warnings.extend(arr(copy_warnings_json))\n\
          \    warnings.extend(arr(storyboard_warnings_json))\n    warnings.extend(arr(motion_warnings_json))\n\
          \    if warnings:\n        lines.extend([\"\", \"## 需要注意\"])\n        lines.extend(\"\
          - \" + str(item) for item in warnings)\n\n    return {\"result_summary\"\
          : \"\\n\".join(lines)}\n"
        variables:
