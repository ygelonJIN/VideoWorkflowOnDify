          \  package = parse(approved_package_json)\n    brief = package.get(\"brief\"\
          ) if isinstance(package.get(\"brief\"), dict) else {}\n    script = package.get(\"\
          approved_script\") if isinstance(package.get(\"approved_script\"), dict)\
