        type: code
        title: H08_判断HeyGen状态
        code_language: python3
        code: "def main(response_json: str) -> dict:\n    import json\n\n    try:\n\
          \        data = json.loads(response_json or \"{}\")\n    except Exception:\n\
          \        data = {}\n    if not isinstance(data, dict):\n        data = {}\n\
          \n    def find_value(value, names):\n        if isinstance(value, dict):\n\
          \            for name in names:\n                if value.get(name) not\
          \ in (None, \"\"):\n                    return value[name]\n           \
          \ for child in value.values():\n                found = find_value(child,\
          \ names)\n                if found not in (None, \"\"):\n              \
          \      return found\n        elif isinstance(value, list):\n           \
          \ for child in value:\n                found = find_value(child, names)\n\
          \                if found not in (None, \"\"):\n                    return\
          \ found\n        return None\n\n    status = str(find_value(data, [\"status\"\
          , \"state\"]) or \"\").strip().lower()\n    done = status in {\"completed\"\
          , \"failed\", \"cancelled\"}\n    return {\n        \"status\": status,\n\
          \        \"done\": done,\n        \"response_json\": json.dumps(data, ensure_ascii=False)\n\
          \    }\n"
