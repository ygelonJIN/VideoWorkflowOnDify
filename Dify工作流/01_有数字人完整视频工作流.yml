        code_language: python3
        code: "def main(brief_json: str, draft_script_json: str, storyboard_json:\
          \ str, motion_plan_json: str, review_action: str) -> dict:\n    import hashlib\n\
          \    import json\n\n    def parse(raw, label):\n        try:\n         \
          \   data = json.loads(raw or \"\")\n        except Exception:\n        \
          \    raise ValueError(label + \" 不是合法 JSON\")\n        if not isinstance(data,\
          \ dict):\n            raise ValueError(label + \" 必须是 JSON 对象\")\n     \
          \   return data\n\n    brief = parse(brief_json, \"brief\")\n    script\
          \ = parse(draft_script_json, \"原始脚本\")\n    storyboard = parse(storyboard_json,\
          \ \"storyboard\")\n    motion = parse(motion_plan_json, \"motion_plan\"\
          )\n\n    voiceover = str(script.get(\"voiceover_script\", \"\")).strip()\n\
          \    if not voiceover:\n        raise ValueError(\"自动通过的口播不能为空\")\n\n  \
          \  package = {\n        \"approval\": {\n            \"status\": \"approved\"\
          ,\n            \"feedback\": \"自动生产模式：\" + str(review_action or \"approve\"\
          ),\n            \"approved_script_hash\": hashlib.sha256(voiceover.encode(\"\
          utf-8\")).hexdigest()\n        },\n        \"brief\": brief,\n        \"\
          approved_script\": script,\n        \"storyboard\": storyboard,\n      \
          \  \"motion_plan\": motion\n    }\n    return {\n        \"approved_package_json\"\
          : json.dumps(package, ensure_ascii=False),\n        \"approved_voiceover_script\"\
          : voiceover,\n        \"approval_status\": \"approved\"\n    }\n"
        variables:
        - variable: brief_json
          value_selector:
