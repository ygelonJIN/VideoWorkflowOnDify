    - id: h05
      type: custom
      data:
        type: code
        title: H05_解析HeyGen响应
        code_language: python3
        code: "def main(response_json: str) -> dict:\n    import json\n\n    try:\n\
          \        data = json.loads(response_json or \"{}\")\n    except Exception:\n\
          \        raise ValueError(\"HeyGen 响应不是合法 JSON\")\n    if not isinstance(data,\
          \ dict):\n        raise ValueError(\"HeyGen 响应必须是对象\")\n\n    def path_value(root,\
          \ *path):\n        value = root\n        for key in path:\n            if\
          \ not isinstance(value, dict) or key not in value:\n                return\
          \ None\n            value = value[key]\n        return value if value not\
          \ in (None, \"\") else None\n\n    def find_key(value, names):\n       \
          \ if isinstance(value, dict):\n            for name in names:\n        \
          \        candidate = value.get(name)\n                if candidate not in\
          \ (None, \"\"):\n                    return candidate\n            for child\
          \ in value.values():\n                found = find_key(child, names)\n \
          \               if found not in (None, \"\"):\n                    return\
          \ found\n        elif isinstance(value, list):\n            for child in\
          \ value:\n                found = find_key(child, names)\n             \
          \   if found not in (None, \"\"):\n                    return found\n  \
          \      return None\n\n    def find_url(names):\n        candidate = find_key(data,\
          \ names)\n        return str(candidate) if isinstance(candidate, str) and\
          \ candidate.startswith((\"http://\", \"https://\")) else \"\"\n\n    video_id\
          \ = str(\n        path_value(data, \"data\", \"id\") or path_value(data,\
          \ \"data\", \"video_id\") or\n        path_value(data, \"data\", \"videoId\"\
          ) or path_value(data, \"id\") or\n        path_value(data, \"video_id\"\
          ) or path_value(data, \"videoId\") or \"\"\n    ).strip()\n    status =\
          \ str(\n        path_value(data, \"data\", \"status\") or path_value(data,\
          \ \"data\", \"state\") or\n        path_value(data, \"status\") or path_value(data,\
          \ \"state\") or \"\"\n    ).strip().lower()\n    error = data.get(\"error\"\
          ) or path_value(data, \"data\", \"error\")\n    error_message = str(error.get(\"\
          message\") if isinstance(error, dict) else error or \"\")\n\n    video_url\
          \ = find_url([\"video_url\", \"videoUrl\"])\n    if video_url and video_id\
          \ and video_id not in video_url:\n        raise ValueError(\"HeyGen video_url\
          \ 与 video_id 不一致，拒绝返回可能串片的旧视频\")\n    if status == \"completed\" and not\
          \ video_url:\n        raise ValueError(\"HeyGen completed 响应缺少明确 video_url\"\
          )\n\n    return {\n        \"heygen_video_id\": video_id,\n        \"heygen_status\"\
          : status,\n        \"heygen_video_url\": video_url,\n        \"heygen_audio_url\"\
          : find_url([\"audio_url\", \"audioUrl\"]),\n        \"heygen_transcript_url\"\
          : find_url([\n            \"transcript_url\", \"transcriptUrl\", \"caption_url\"\
          , \"captionUrl\",\n            \"subtitle_url\", \"subtitleUrl\", \"srt_url\"\
          , \"srtUrl\",\n        ]),\n        \"heygen_error_message\": error_message,\n\
          \        \"heygen_response_json\": json.dumps(data, ensure_ascii=False)\n\
          \    }\n"
        variables:
        - variable: response_json
          value_selector:
          - h04
          - body
          value_type: string
