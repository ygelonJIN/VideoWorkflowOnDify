          未发现可寻址时间线\")\n    if len(html) > 800000:\n        warnings.append(\"HTML\
          \ 体积较大，建议拆分为模板和数据\")\n\n    return {\n        \"html_valid\": not errors,\n\
          \        \"html_errors_json\": json.dumps(errors, ensure_ascii=False),\n\
          \        \"html_warnings_json\": json.dumps(warnings, ensure_ascii=False),\n\
