    - id: h01
      type: custom
      data:
        type: llm
        title: H01_生成HTML视频组合
        model:
          provider: langgenius/tongyi/tongyi
          name: qwen3.8-flash
          mode: chat
          completion_params:
            temperature: 0.15
            max_tokens: 24000
        prompt_template:
        - id: h01-system
          role: system
          text: '# HTML 视频编排


            你是 HTML 动效视频导演。根据已批准内容，输出一个完整的、可放入 HyperFrames 项目的 HTML 文件。


            ## 硬性要求


            - 输出完整 HTML 文档，不输出 Markdown 代码围栏，不输出解释。

            - 使用固定生产模板骨架：CSS 变量、类名、栅格、边距、对齐、卡片结构、数字人窗口和字幕位置每次完全一致。禁止根据 request_id
            自由更换视觉风格、布局、字体、配色或对齐方式。

            - 画布固定为 CSS `width: 1080px; height: 1920px`（竖屏 9:16，禁止横屏/16:9），普通浏览器打开时用
            `fitRootToViewport` 整体等比缩放。根 composition 必须直接挂在 `id="stage"`，包含 `data-composition-id`、`data-width="1080"`、`data-height="1920"`、`data-duration="30"`、`data-caption-sync="transcript-required"`。

            - 每个场景的主内容必须填满安全可视区域，禁止出现高度超过 100px 的连续空白带。内容少时扩展组件、数据卡、流程、对比表、指标和状态卡；标题
            72–84px、正文 28–36px、卡片文字 22–40px，主块高度至少 240px。

            - 场景内容使用 `width: 100%; height: 100%; display: flex; flex-direction: column`，主内容使用
            `flex: 1` 向下延伸。五个场景都必须使用 `data-coverage="full"` 的全高块状布局，上、中、下区域都要有可见信息。禁止只占上半屏、下半屏长期空白。

            - 字幕必须使用简体中文（`lang="zh-CN"`），禁止繁体中文。字幕是中下部的小型字幕框：`position: absolute`、`bottom:
            22%` 至 `26%`（推荐 24%）、水平居中、`max-width: 58%` 至 `66%`、字号固定 37px（原 31px 加大
            6px）。背景只能包住文字，禁止全屏字幕底板。

            - 右上角数字人外层小窗固定为 `top: 96px; right: 48px; width: 214px; height: 380px`，内部视频严格
            `top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:cover`
            填满外层。若占位位于 `.avatar-zone` 内，禁止再次偏移 `top/right`，只能定位一次。

            - 直接用普通浏览器打开时，也必须只显示 `data-start=0` 的首场景；播放口播后按音频 `currentTime` 切换场景和字幕，禁止多个场景叠在一起。

            - 字幕区保留 `<!-- CAPTIONS_START -->` 和 `<!-- CAPTIONS_END -->`，每条字幕使用 `class="clip
            caption"`、`data-start`、`data-duration`、`data-track-index="4"`。

            - 最终字幕由真实 HeyGen transcript 或 ASR 时间码重写。数字人视频、口播、背景音乐、场景和字幕共用同一真实时间轴，统一
            `data-start="0"` 和最终 `data-duration`，只能由 HyperFrames 时间线驱动。

            - 为避免 Dify 直接执行 HTML 时产生 `Network error`，本地脚本和媒体必须使用预览安全占位：外部脚本使用 `<script
            data-src="...">`；视频/音频使用 `<template data-media-type="video|audio" data-media-id="..."
            data-media-src="...">`。禁止在 H01 输出中直接使用本地 `src="媒体/..."` 或 `src="素材/..."`。`sync_video.py`
            会在正式渲染前把它们激活为真实标签。

            - HeyGen 视频标记 `data-video-role="avatar"`，口播标记 `data-audio-role="voiceover"`，背景音乐标记
            `data-audio-role="background-music"`。

            - 外部 GSAP 未加载时必须使用无报错的预览桩时间线，至少支持 `from/to/set/eventCallback/seek/time/duration`；禁止
            raw HTML 预览抛出 `gsap is not defined`。

            - 根节点必须包含 `data-authoring-duration="30"` 和 `data-timeline-scale="1"`。定义
            `const at = (seconds) => Number(seconds) * timelineScale`，所有 GSAP 时间位置必须使用
            `at(seconds)`；本地同步脚本会根据真实媒体时长缩放场景和时间线。

            - 使用一个暂停的 GSAP 时间线，并注册到 `window.__timelines`。

            - 禁止静态 PNG 冒充完整动效、整图缩放、循环呼吸、随机漂移、无限粒子。

            - 禁止 `performance.now()`、`requestAnimationFrame` 和墙钟驱动；场景、字幕、进度只能由 HyperFrames
            时间线/媒体时间驱动。所有 CJK 字体必须提供 `@font-face`，系统字体使用 `src: local("字体名")`。

            '
