    - id: a09
      type: custom
      data:
        type: code
        title: A09_整理分镜
        code_language: python3
        code: "def main(storyboard_text: str, script_json: str) -> dict:\n    import\
          \ json\n    import re\n\n    def parse(raw, label):\n        value = str(raw\
          \ or \"\").strip()\n        value = re.sub(r\"^```(?:json)?\\s*|\\s*```$\"\
          , \"\", value, flags=re.I)\n        try:\n            return json.loads(value)\n\
          \        except Exception:\n            start, end = value.find(\"{\"),\
          \ value.rfind(\"}\")\n            if start >= 0 and end > start:\n     \
          \           try:\n                    return json.loads(value[start:end\
          \ + 1])\n                except Exception:\n                    pass\n \
          \           return {\"__invalid_json__\": True, \"__label__\": label}\n\n\
          \    storyboard = parse(storyboard_text, \"分镜\")\n    script = parse(script_json,\
          \ \"文案\")\n    if not isinstance(script, dict):\n        script = {}\n \
          \   warnings = []\n    if not isinstance(storyboard, dict) or storyboard.get(\"\
          __invalid_json__\"):\n        warnings.append(\"分镜 JSON 无法解析，已按口播句子生成基础分镜继续\"\
          )\n        storyboard = {}\n    scenes = storyboard.get(\"scenes\")\n  \
          \  if not isinstance(scenes, list) or not scenes:\n        sentences = [item\
          \ for item in script.get(\"sentences\", []) if isinstance(item, dict) and\
          \ str(item.get(\"text\", \"\")).strip()]\n        if not sentences:\n  \
          \          sentences = [{\"id\": \"s01\", \"text\": str(script.get(\"voiceover_script\"\
          ) or \"继续解释当前主题\")}]\n        scenes = [{\n            \"scene_id\": \"\
          s%02d\" % (index + 1),\n            \"sentence_ids\": [str(item.get(\"id\"\
          ) or \"s%02d\" % (index + 1))],\n            \"voiceover_text\": str(item.get(\"\
          text\", \"\")),\n            \"purpose\": item.get(\"purpose\") if item.get(\"\
          purpose\") in {\"hook\", \"pain\", \"solution\", \"proof\", \"cta\"} else\
          \ (\"hook\" if index == 0 else (\"cta\" if index == len(sentences) - 1 else\
          \ \"solution\")),\n            \"visual_source\": \"reusable_ui_template\"\
          ,\n            \"ui_template\": \"workflow\",\n            \"on_screen_text\"\
          : re.sub(r\"\\s+\", \"\", str(item.get(\"text\", \"\")))[:16],\n       \
          \     \"visual_brief\": \"展示当前口播对应的可复用界面、步骤、清单或信息组件\",\n            \"motion\"\
          : \"关键信息逐项出现\",\n            \"transition\": \"cut\"\n        } for index,\
          \ item in enumerate(sentences[:7])]\n        storyboard = {\"scenes\": scenes}\n\
          \        warnings.append(\"storyboard.scenes 为空，已生成基础分镜继续\")\n        scenes\
          \ = storyboard[\"scenes\"]\n    if not 4 <= len(scenes) <= 7:\n        warnings.append(\"\
          30 秒左右视频建议 4-7 个场景，当前 %d 个，已继续输出\" % len(scenes))\n\n    sentence_ids =\
          \ [str(item.get(\"id\")) for item in script.get(\"sentences\", []) if isinstance(item,\
          \ dict) and item.get(\"id\")]\n    if not sentence_ids:\n        sentence_ids\
          \ = [\"s%02d\" % i for i in range(1, len(scenes) + 1)]\n    seen_scene_ids\
          \ = set()\n    purposes = set()\n\n    allowed_visual = {\n        \"reusable_ui_template\"\
          , \"real_footage\", \"supplied_image\",\n        \"generated_image\", \"\
          motion_graphic\"\n    }\n    allowed_templates = {\n        \"dashboard\"\
          , \"list\", \"workflow\", \"comparison\", \"timeline\",\n        \"planner\"\
          , \"tracker\", \"story\", \"none\"\n    }\n    allowed_purposes = {\"hook\"\
          , \"pain\", \"solution\", \"proof\", \"cta\"}\n\n    normalized_scenes =\
          \ []\n    for index, scene in enumerate(scenes, 1):\n        if not isinstance(scene,\
          \ dict):\n            scene = {\"voiceover_text\": str(scene)}\n       \
          \     warnings.append(\"第 %d 个 scene 不是对象，已转换为简单场景\" % index)\n\n      \
          \  scene_id = str(scene.get(\"scene_id\") or \"s%02d\" % index)\n      \
          \  original_scene_id = scene_id\n        while scene_id in seen_scene_ids:\n\
          \            scene_id += \"_dup\"\n        if scene_id != original_scene_id:\n\
          \            warnings.append(\"scene_id 重复，%s 已改为 %s\" % (original_scene_id,\
          \ scene_id))\n        seen_scene_ids.add(scene_id)\n        scene[\"scene_id\"\
          ] = scene_id\n\n        refs = [str(x) for x in scene.get(\"sentence_ids\"\
          , []) if str(x).strip()]\n        valid_refs = [ref for ref in refs if ref\
          \ in sentence_ids]\n        if not valid_refs:\n            fallback = sentence_ids[min(index\
          \ - 1, len(sentence_ids) - 1)]\n            valid_refs = [fallback]\n  \
          \          warnings.append(\"%s sentence_ids 缺失或无效，已绑定 %s\" % (scene_id,\
          \ fallback))\n        elif len(valid_refs) != len(refs):\n            warnings.append(\"\
          %s 部分 sentence_ids 无效，已移除\" % scene_id)\n        scene[\"sentence_ids\"\
          ] = valid_refs\n\n        purpose = str(scene.get(\"purpose\", \"\")).strip()\n\
          \        if purpose not in allowed_purposes:\n            old = purpose\
          \ or \"empty\"\n            purpose = \"hook\" if index == 1 else (\"cta\"\
          \ if index == len(scenes) else \"solution\")\n            warnings.append(\"\
          %s purpose=%s 已归一化为 %s\" % (scene_id, old, purpose))\n        scene[\"purpose\"\
          ] = purpose\n        purposes.add(purpose)\n\n        template = str(scene.get(\"\
          ui_template\", \"none\")).strip() or \"none\"\n        if template not in\
          \ allowed_templates:\n            old = template\n            template =\
          \ \"none\"\n            warnings.append(\"%s ui_template=%s 已归一化为 none\"\
          \ % (scene_id, old))\n        source = str(scene.get(\"visual_source\",\
          \ \"\")).strip()\n        if source not in allowed_visual:\n           \
          \ old = source or \"empty\"\n            source = \"reusable_ui_template\"\
          \ if template != \"none\" else \"motion_graphic\"\n            warnings.append(\"\
          %s visual_source=%s 已归一化为 %s\" % (scene_id, old, source))\n        if source\
          \ == \"generated_image\" and template != \"none\":\n            warnings.append(\"\
          %s 生成图不能伪装为界面模板，ui_template 已改为 none\" % scene_id)\n            template\
          \ = \"none\"\n        scene[\"visual_source\"] = source\n        scene[\"\
          ui_template\"] = template\n\n        on_screen = re.sub(r\"\\s+\", \"\"\
          , str(scene.get(\"on_screen_text\", \"\")))\n        if len(on_screen) >\
          \ 16:\n            warnings.append(\"%s 屏幕主文案超过 16 字，已截断；这不影响完整句子字幕\" %\
          \ scene_id)\n            on_screen = on_screen[:16]\n        scene[\"on_screen_text\"\
          ] = on_screen\n\n        avatar = scene.get(\"avatar_pip\") if isinstance(scene.get(\"\
          avatar_pip\"), dict) else {}\n        avatar[\"visible\"] = True\n     \
          \   avatar[\"position\"] = \"top_right\"\n        avatar[\"behavior\"] =\
          \ str(avatar.get(\"behavior\") or \"persistent\")\n        scene[\"avatar_pip\"\
          ] = avatar\n\n        variables = scene.get(\"content_variables\")\n   \
          \     if variables is not None and not isinstance(variables, dict):\n  \
          \          warnings.append(\"%s content_variables 不是对象，已改为空对象\" % scene_id)\n\
          \            variables = {}\n        if isinstance(variables, dict) and\
          \ variables:\n            labels = str(scene.get(\"labeling\", \"\"))\n\
          \            if \"示例\" not in labels and \"场景演示\" not in labels:\n     \
          \           scene[\"labeling\"] = \"场景演示\"\n                warnings.append(\"\
          %s 已自动标记“场景演示”\" % scene_id)\n        scene[\"content_variables\"] = variables\
          \ if isinstance(variables, dict) else {}\n\n        if not str(scene.get(\"\
          voiceover_text\", \"\")).strip():\n            refs_text = [item.get(\"\
          text\", \"\") for item in script.get(\"sentences\", []) if isinstance(item,\
          \ dict) and str(item.get(\"id\")) in valid_refs]\n            scene[\"voiceover_text\"\
          ] = \" \".join(str(x) for x in refs_text if x).strip()\n        normalized_scenes.append(scene)\n\
          \n    scenes = normalized_scenes\n    if \"hook\" not in purposes:\n   \
          \     scenes[0][\"purpose\"] = \"hook\"\n        warnings.append(\"缺少 hook，已将第一个场景设为\
          \ hook\")\n    if \"cta\" not in purposes:\n        scenes[-1][\"purpose\"\
          ] = \"cta\"\n        warnings.append(\"缺少 cta，已将最后一个场景设为 cta\")\n    if\
          \ \"solution\" not in {item[\"purpose\"] for item in scenes}:\n        scenes[min(1,\
          \ len(scenes) - 1)][\"purpose\"] = \"solution\"\n        warnings.append(\"\
          缺少 solution，已将中间场景设为 solution\")\n\n    storyboard[\"scenes\"] = scenes\n\
          \    storyboard[\"validation\"] = {\"errors\": [], \"warnings\": warnings}\n\
          \    return {\n        \"storyboard_json\": json.dumps(storyboard, ensure_ascii=False),\n\
          \        \"scene_count\": len(scenes),\n        \"storyboard_valid\": True,\n\
          \        \"storyboard_errors_json\": \"[]\",\n        \"storyboard_warnings_json\"\
          : json.dumps(warnings, ensure_ascii=False)\n    }\n"
        variables:
        - variable: storyboard_text
          value_selector:
          - a08
          - text
          value_type: string
        - variable: script_json
          value_selector:
          - a07
          - script_json
          value_type: string
        outputs:
          storyboard_json:
            type: string
            children: null
          scene_count:
            type: number
            children: null
          storyboard_valid:
            type: boolean
            children: null
          storyboard_errors_json:
            type: string
            children: null
          storyboard_warnings_json:
            type: string
            children: null
      position:
        x: 3780
