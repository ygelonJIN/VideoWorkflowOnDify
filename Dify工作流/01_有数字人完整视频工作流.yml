    - id: a13
      type: custom
      data:
        type: code
        title: A13_整理合规结果
        code_language: python3
        code: "def main(review_text: str) -> dict:\n    import json\n    import re\n\
          \n    raw = str(review_text or \"\").strip()\n    raw = re.sub(r\"^```(?:json)?\\\
          s*|\\s*```$\", \"\", raw, flags=re.I)\n    try:\n        data = json.loads(raw)\n\
          \    except Exception:\n        start, end = raw.find(\"{\"), raw.rfind(\"\
          }\")\n        data = {}\n        if start >= 0 and end > start:\n      \
          \      try:\n                data = json.loads(raw[start:end + 1])\n   \
          \         except Exception:\n                data = {}\n    if not isinstance(data,\
          \ dict):\n        data = {}\n    if not data:\n        data = {\n      \
          \      \"decision\": \"needs_changes\",\n            \"risk_level\": \"\
          medium\",\n            \"violations\": [],\n            \"unverified_claims\"\
          : [],\n            \"normalization_warnings\": [\"合规 JSON 无法解析，已按 needs_changes\
          \ 继续人工审核\"]\n        }\n\n    warnings = list(data.get(\"normalization_warnings\"\
          , [])) if isinstance(data.get(\"normalization_warnings\"), list) else []\n\
          \    decision = str(data.get(\"decision\", \"\")).strip().lower()\n    if\
          \ decision not in {\"approved\", \"needs_changes\", \"rejected\"}:\n   \
          \     decision = \"needs_changes\"\n        data[\"decision\"] = decision\n\
          \        warnings.append(\"decision 缺失或无效，已归一化为 needs_changes\")\n    risk_level\
          \ = str(data.get(\"risk_level\", \"\")).strip().lower()\n    if risk_level\
          \ not in {\"low\", \"medium\", \"high\"}:\n        risk_level = \"medium\"\
          \n        data[\"risk_level\"] = risk_level\n        warnings.append(\"\
          risk_level 缺失或无效，已归一化为 medium\")\n\n    violations = data.get(\"violations\"\
          )\n    if not isinstance(violations, list):\n        violations = []\n \
          \       data[\"violations\"] = violations\n    unverified = data.get(\"\
          unverified_claims\")\n    if not isinstance(unverified, list):\n       \
          \ unverified = []\n        data[\"unverified_claims\"] = unverified\n\n\
          \    error_count = len(unverified)\n    error_count += sum(1 for item in\
          \ violations if isinstance(item, dict) and item.get(\"severity\") == \"\
          error\")\n    if decision == \"rejected\":\n        error_count += 1\n \
          \   data[\"normalization_warnings\"] = warnings\n\n    return {\n      \
          \  \"compliance_json\": json.dumps(data, ensure_ascii=False),\n        \"\
          compliance_decision\": decision,\n        \"risk_level\": risk_level,\n\
          \        \"compliance_error_count\": error_count\n    }\n"
        variables:
        - variable: review_text
          value_selector:
          - a12
          - text
          value_type: string
        outputs:
          compliance_json:
            type: string
            children: null
          compliance_decision:
            type: string
            children: null
          risk_level:
            type: string
            children: null
          compliance_error_count:
            type: number
            children: null
      position:
        x: 5790
