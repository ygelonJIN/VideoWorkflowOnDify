          - a11
          - motion_plan_json
          value_type: string
        - variable: review_action
          value_selector:
          - a00
          - request_id
          value_type: string
        outputs:
          approved_package_json:
            type: string
            children: null
          approved_voiceover_script:
            type: string
            children: null
          approval_status:
            type: string
            children: null
