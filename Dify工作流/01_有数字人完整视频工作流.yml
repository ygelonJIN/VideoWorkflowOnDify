    - id: h02s
      parentId: h02i
      type: custom
      data:
        type: llm
        title: H02S_单屏场景
        model:
          provider: langgenius/opencode_go/opencode_go
          name: gpt-6-luna
          mode: chat
          completion_params:
            max_tokens: 128000
        prompt_template:
        - id: h02s-system
          role: system
          text: "# 单屏场景（逐屏生成 · 只输出规格）\n\n你只负责**一屏**的画面，但**不写整屏 HTML**：你输出一份 JSON 规格，本地按固定模板渲染成 `<section>`。唯一要写 HTML 的地方是 `components[].html`（组件结构照抄）。\n这样做是为了让每一屏的结构永远完整（标签闭合、属性齐全、槽位不缺），模型只负责内容和版面判断。\n\n## 输入\n\n- `scene_json`：{{#h02i.item#}}（本屏分镜：`scene_id`、`sentence_ids`、`voiceover_text`、`on_screen_text`、`visual_brief`、`composition`、`visual_budget`、`index`、`total`、`prev_scene`、`next_scene`）\n- `skeleton_html`：{{#h01s.text#}}（骨架与图片基础样式，只读；你不需要复述）\n- `art_direction_json`：{{#h01d.text#}}（色彩、字体、材质、光、纵深；字号和间距不在里面）\n- `component_grammar_json`：{{#h01c.text#}}（文字块、字法、状态语言、`data-anim` 命名规则）\n- `image_brief_json`：{{#h01pv.image_brief_json#}}（本屏 `role` / `why` / 图占多大 / 文字压哪侧）\n- `composition_ledger_json`：{{#h00.composition_ledger_json#}}（全片构图账本）\n\n## 输出（只输出 JSON，第一个字符 `{`）\n\n```json\n{\n  \"scene_id\": \"s03\",\n  \"visual\": \"photo\",\n  \"bg\": \"B26\",\n  \"layout\": {\"zone\": \"center-middle\", \"align\": \"center\", \"scale\": \"两行块\"},\n  \"media\": {\"role\": \"large\", \"x\": 72, \"y\": 640, \"w\": 936, \"h\": 900},\n  \"copy\": [\n    {\"role\": \"title\", \"text\": \"这一屏的主张\"},\n    {\"role\": \"body\", \"text\": \"支撑它的一句话\"}\n  ],\n  \"components\": [\n    {\"id\": \"U05\", \"anim\": \"row-1\", \"html\": \"<div class=\\\"ui-row\\\"><span class=\\\"k\\\">本周新增</span><span class=\\\"v\\\">128</span></div>\"}\n  ],\n  \"css\": \"[data-scene=\\\"s03\\\"] .s03-media{left:72px;top:640px;width:936px;height:900px}\"\n}\n```\n\n字段规则：\n\n- `scene_id` 与 `scene_json.scene_id` 一致。\n- `visual`：`photo`（有图屏）或 `html`（无图屏）。`role=html` 的屏必须写 `html` 且不给 `media`。\n- `bg`：`visual_budget.background` 的 B 编号，原样抄。\n- `layout`：从 `scene_json.composition` 抄 `text_zone` / `align`。`scale` 只认 `vertical` 一个值（这一屏要竖排才写），写别的无效——字号不由它决定。\n- `media`：仅照片屏。`role` 只能取 `band` / `inset` / `portrait` / `thumb` / `texture`（`large` 等同 `band`，`full` 只为兼容旧稿）；`x/y/w/h` 不生效，矩形由本地按 `role` 落版。\n- `copy`：**纯文本，不许带任何 HTML 标签**。`role` 只能是 `title` / `lead` / `body` / `note` / `num` / `label` / `accent`。一屏 2–5 条，**`title` 必须有且只有一条**；**漏写 `title` 视为不合格，整屏重写**——缺 title 时这屏最大的字只能落在 lead/body 上，整屏字会小一圈。`body` 多行用 `\\n`。\n- `components`：0–2 个。**`visual_budget.components` 非空时至少 1 个**：这一屏有组件槽位就必须用，纯文字屏在竖屏成片里没有视觉锚。`id` 来自 `visual_budget.components`；`html` 必须照抄下面「组件结构」里的结构，标签闭合、属性用双引号；`anim` 给这个组件的根节点起一个 `data-anim` 名字（英文小写 + 连字符）。\n- `css`：可选，只写这一屏特有的定位与装饰，**每条选择器都必须以 `[data-scene=\"本屏id\"]` 开头**，否则整段丢弃。\n\n## 画什么、不画什么\n\n- 允许：文字、照片、`visual_budget.components` 里的 U 组件、B 背景卡、为保证可读性写的遮罩（写在 `css` 里，作用于本屏）。\n- **禁止自己画图形**：图标、插画、示意图、图表、线条、分隔线、网格、刻度、色块、圆点、卡片外框、SVG、canvas、emoji 当图形。这些要么用 U 组件，要么不要。\n- 字号、字色、位置、行高、对齐**不归你**，也不许用 scale 之类的措辞去暗示大小：「大字」「超大」「三行」这些词都不再影响字号——本地按**栏宽 ÷ 每行字数**直接算，写得越长字越小。`css` 只用来放照片/组件的定位和遮罩。\n- 每屏只讲一件事；文案超过 3 行说明该拆屏。**放不下没有别的解法**：本地会按栏宽把字号算到刚好填满，字多就必然更小、折行更多。\n\n## 组件结构（必须照抄，不要自己发明）\n\n组件只写 `components[].html` 这一段，结构照下面抄，只改文案与数字；标签闭合、属性用双引号。\n\n<!-- CATALOG:COMPONENTS:START -->\n\n### MD01 流程图·三段推进\n\n```html\n<div class=\"dsfig\"><svg class=\"dsvg\" viewBox=\"0 0 1080 1920\" xmlns=\"http://www.w3.org/2000/svg\" ><defs><marker id=\"arw\" viewBox=\"0 0 12 12\" refX=\"10\" refY=\"6\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M1 1 L11 6 L1 11\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"2\"/></marker></defs><g class=\"dn\"><rect x=\"330.0\" y=\"485.0\" width=\"420\" height=\"150\" rx=\"20\" fill=\"rgba(255,255,255,.05)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"540\" y=\"572\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">拿到线索</text></g><g class=\"dn\"><rect x=\"100.0\" y=\"785.0\" width=\"360\" height=\"150\" rx=\"20\" fill=\"rgba(255,255,255,.05)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"280\" y=\"872\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">自动筛选</text></g><g class=\"dn\"><rect x=\"620.0\" y=\"785.0\" width=\"360\" height=\"150\" rx=\"20\" fill=\"rgba(255,255,255,.05)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"800\" y=\"872\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">自动分级</text></g><g class=\"dn\"><rect x=\"330.0\" y=\"1085.0\" width=\"420\" height=\"150\" rx=\"20\" fill=\"rgba(255,255,255,.05)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"540\" y=\"1172\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">按级跟进</text></g><g class=\"dn\"><rect x=\"330.0\" y=\"1365.0\" width=\"420\" height=\"150\" rx=\"20\" fill=\"rgba(255,255,255,.05)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"540\" y=\"1452\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">成交归档</text></g><path class=\"de\" d=\"M540 635 V710 H280 V785\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><path class=\"de\" d=\"M540 635 V710 H800 V785\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><path class=\"de\" d=\"M280 935 V1010 H540 V1085\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><path class=\"de\" d=\"M800 935 V1010 H540 V1085\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><path class=\"de\" d=\"M540 1235 V1365\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/></svg></div>\n```\n\n### MD02 时序图·三方往返\n\n```html\n<div class=\"dsfig\"><svg class=\"dsvg\" viewBox=\"0 0 1080 1920\" xmlns=\"http://www.w3.org/2000/svg\" ><defs><marker id=\"arw\" viewBox=\"0 0 12 12\" refX=\"10\" refY=\"6\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M1 1 L11 6 L1 11\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"2\"/></marker></defs><g class=\"dn\"><rect x=\"140\" y=\"520\" width=\"220\" height=\"90\" rx=\"16\" fill=\"rgba(255,255,255,.06)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"250\" y=\"576\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">客户</text></g><line class=\"de\" x1=\"250\" y1=\"610\" x2=\"250\" y2=\"1420\" stroke=\"#86F0C0\" stroke-width=\"3\" stroke-dasharray=\"10 12\"/><g class=\"dn\"><rect x=\"430\" y=\"520\" width=\"220\" height=\"90\" rx=\"16\" fill=\"rgba(255,255,255,.06)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"540\" y=\"576\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">系统</text></g><line class=\"de\" x1=\"540\" y1=\"610\" x2=\"540\" y2=\"1420\" stroke=\"#86F0C0\" stroke-width=\"3\" stroke-dasharray=\"10 12\"/><g class=\"dn\"><rect x=\"720\" y=\"520\" width=\"220\" height=\"90\" rx=\"16\" fill=\"rgba(255,255,255,.06)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"830\" y=\"576\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">后台</text></g><line class=\"de\" x1=\"830\" y1=\"610\" x2=\"830\" y2=\"1420\" stroke=\"#86F0C0\" stroke-width=\"3\" stroke-dasharray=\"10 12\"/><path class=\"de\" d=\"M250 760 H540\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><text class=\"dl\" x=\"395.0\" y=\"742\" text-anchor=\"middle\" font-size=\"28\" fill=\"#9FA9A2\">提交需求</text><path class=\"de\" d=\"M540 930 H830\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><text class=\"dl\" x=\"685.0\" y=\"912\" text-anchor=\"middle\" font-size=\"28\" fill=\"#9FA9A2\">校验参数</text><path class=\"de\" d=\"M830 1100 H540\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><text class=\"dl\" x=\"685.0\" y=\"1082\" text-anchor=\"middle\" font-size=\"28\" fill=\"#9FA9A2\">返回结果</text><path class=\"de\" d=\"M540 1270 H250\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><text class=\"dl\" x=\"395.0\" y=\"1252\" text-anchor=\"middle\" font-size=\"28\" fill=\"#9FA9A2\">给出方案</text></svg></div>\n```\n\n### MD03 泳道图·两条线并行\n\n```html\n<div class=\"dsfig\"><svg class=\"dsvg\" viewBox=\"0 0 1080 1920\" xmlns=\"http://www.w3.org/2000/svg\" ><defs><marker id=\"arw\" viewBox=\"0 0 12 12\" refX=\"10\" refY=\"6\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M1 1 L11 6 L1 11\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"2\"/></marker></defs><g class=\"dlane\"><rect x=\"100\" y=\"560\" width=\"880\" height=\"380\" rx=\"24\" fill=\"rgba(255,255,255,.03)\" stroke=\"rgba(255,255,255,.12)\" stroke-width=\"3\"/><rect x=\"100\" y=\"560\" width=\"180\" height=\"380\" rx=\"24\" fill=\"rgba(134,240,192,.10)\"/><text x=\"190\" y=\"762.0\" text-anchor=\"middle\" font-size=\"32\" font-weight=\"700\" fill=\"#86F0C0\">获客</text></g><g class=\"dlane\"><rect x=\"100\" y=\"980\" width=\"880\" height=\"380\" rx=\"24\" fill=\"rgba(255,255,255,.03)\" stroke=\"rgba(255,255,255,.12)\" stroke-width=\"3\"/><rect x=\"100\" y=\"980\" width=\"180\" height=\"380\" rx=\"24\" fill=\"rgba(134,240,192,.10)\"/><text x=\"190\" y=\"1182.0\" text-anchor=\"middle\" font-size=\"32\" font-weight=\"700\" fill=\"#86F0C0\">跟进</text></g><g class=\"dn\"><rect x=\"380.0\" y=\"630.0\" width=\"240\" height=\"140\" rx=\"16\" fill=\"rgba(255,255,255,.05)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"500\" y=\"712\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">搜索</text></g><g class=\"dn\"><rect x=\"700.0\" y=\"630.0\" width=\"240\" height=\"140\" rx=\"16\" fill=\"rgba(255,255,255,.05)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"820\" y=\"712\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">去重</text></g><g class=\"dn\"><rect x=\"380.0\" y=\"1050.0\" width=\"240\" height=\"140\" rx=\"16\" fill=\"rgba(255,255,255,.05)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"500\" y=\"1132\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">外呼</text></g><g class=\"dn\"><rect x=\"700.0\" y=\"1050.0\" width=\"240\" height=\"140\" rx=\"16\" fill=\"rgba(255,255,255,.05)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"820\" y=\"1132\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">记录</text></g><path class=\"de\" d=\"M620 700 H700\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><path class=\"de\" d=\"M820 770 V915 H500 V1050\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><path class=\"de\" d=\"M620 1120 H700\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/></svg></div>\n```\n\n### MD04 时间轴·四个节点\n\n```html\n<div class=\"dsfig\"><svg class=\"dsvg\" viewBox=\"0 0 1080 1920\" xmlns=\"http://www.w3.org/2000/svg\" ><defs><marker id=\"arw\" viewBox=\"0 0 12 12\" refX=\"10\" refY=\"6\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M1 1 L11 6 L1 11\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"2\"/></marker></defs><path class=\"de\" d=\"M140 980 H940\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"5\" marker-end=\"url(#arw)\"/><g class=\"dn\"><circle cx=\"230\" cy=\"980\" r=\"20\" fill=\"rgba(134,240,192,.14)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><line x1=\"230\" y1=\"980\" x2=\"230\" y2=\"920\" stroke=\"#86F0C0\" stroke-width=\"3\"/><text x=\"230\" y=\"880\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">立项</text></g><g class=\"dn\"><circle cx=\"450\" cy=\"980\" r=\"20\" fill=\"rgba(134,240,192,.14)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><line x1=\"450\" y1=\"980\" x2=\"450\" y2=\"1040\" stroke=\"#86F0C0\" stroke-width=\"3\"/><text x=\"450\" y=\"1090\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">试点</text></g><g class=\"dn\"><circle cx=\"670\" cy=\"980\" r=\"20\" fill=\"rgba(134,240,192,.14)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><line x1=\"670\" y1=\"980\" x2=\"670\" y2=\"920\" stroke=\"#86F0C0\" stroke-width=\"3\"/><text x=\"670\" y=\"880\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">铺开</text></g><g class=\"dn\"><circle cx=\"890\" cy=\"980\" r=\"20\" fill=\"rgba(134,240,192,.14)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><line x1=\"890\" y1=\"980\" x2=\"890\" y2=\"1040\" stroke=\"#86F0C0\" stroke-width=\"3\"/><text x=\"890\" y=\"1090\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"650\" fill=\"#F4F1E9\">复盘</text></g></svg></div>\n```\n\n### MD05 四象限·两类分选\n\n```html\n<div class=\"dsfig\"><svg class=\"dsvg\" viewBox=\"0 0 1080 1920\" xmlns=\"http://www.w3.org/2000/svg\" ><defs><marker id=\"arw\" viewBox=\"0 0 12 12\" refX=\"10\" refY=\"6\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M1 1 L11 6 L1 11\" fill=\"none\" stroke=\"#86F0C0\" stroke-width=\"2\"/></marker></defs><line class=\"de\" x1=\"540\" y1=\"560\" x2=\"540\" y2=\"1400\" stroke=\"#86F0C0\" stroke-width=\"4\"/><line class=\"de\" x1=\"140\" y1=\"980\" x2=\"940\" y2=\"980\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"540\" y=\"530\" text-anchor=\"middle\" font-size=\"28\" fill=\"#9FA9A2\">高价值</text><text x=\"540\" y=\"1440\" text-anchor=\"middle\" font-size=\"28\" fill=\"#9FA9A2\">低价值</text><text x=\"120\" y=\"985\" text-anchor=\"start\" font-size=\"28\" fill=\"#9FA9A2\">难</text><text x=\"960\" y=\"985\" text-anchor=\"end\" font-size=\"28\" fill=\"#9FA9A2\">易</text><g class=\"dn\"><circle cx=\"390\" cy=\"800\" r=\"86\" fill=\"rgba(134,240,192,.14)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"390\" y=\"811\" text-anchor=\"middle\" font-size=\"30\" font-weight=\"650\" fill=\"#F4F1E9\">重点</text></g><g class=\"dn\"><circle cx=\"700\" cy=\"810\" r=\"74\" fill=\"rgba(134,240,192,.14)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"700\" y=\"821\" text-anchor=\"middle\" font-size=\"30\" font-weight=\"650\" fill=\"#F4F1E9\">快赢</text></g><g class=\"dn\"><circle cx=\"380\" cy=\"1160\" r=\"70\" fill=\"rgba(134,240,192,.14)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"380\" y=\"1171\" text-anchor=\"middle\" font-size=\"30\" font-weight=\"650\" fill=\"#F4F1E9\">观察</text></g><g class=\"dn\"><circle cx=\"710\" cy=\"1150\" r=\"60\" fill=\"rgba(134,240,192,.14)\" stroke=\"#86F0C0\" stroke-width=\"4\"/><text x=\"710\" y=\"1161\" text-anchor=\"middle\" font-size=\"30\"