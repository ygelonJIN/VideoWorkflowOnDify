          - Token Plan - 新加坡
          - Token Plan - 欧洲
        - label: TTS 声音
          variable: tts_voice
          type: select
          required: false
          options:
          - mimo_default
          - 冰糖
          - 茉莉
          - 苏打
          - 白桦
          - Mia
          - Chloe
          - Milo
          - Dean
      position:
        x: 30
        y: 340
      positionAbsolute:
        x: 30
        y: 340
