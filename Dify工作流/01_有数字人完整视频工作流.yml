    - id: h00
      type: custom
      data:
        type: code
        title: H00_拆分场景组
        code_language: python3
        code: "def main(approved_package_json: str, motion_plan_json: str) -> dict:\n    import json\n    import re\n\n    package = json.loads(approved_package_json or \"{}\")\n    storyboard = package.get(\"storyboard\") or {}\n    scenes = [s for s in (storyboard.get(\"scenes\") or []) if isinstance(s, dict)]\n    total = len(scenes)\n    if total == 0:\n        # 分镜为空就是上游没做完：不替它编场景，返回明确错误让 A09 重跑。\n        empty = json.dumps({\"thesis\": \"\", \"arguments\": [], \"scenes\": [], \"motion\": [],\n                            \"motion_note\": \"A09 没有产出 scenes：重跑 A08/A09，不要在本节点补场景\",\n                            \"prev_hook\": \"\", \"next_hook\": \"\"}, ensure_ascii=False)\n        return {\n            \"group_a_json\": empty, \"group_b_json\": empty, \"group_c_json\": empty, \"group_d_json\": empty,\n            \"scene_total\": 0,\n            \"scene_payloads\": [],\n            \"composition_ledger_json\": \"[]\",\n            \"catalog_json\": json.dumps(CATALOG, ensure_ascii=False),\n            \"design_brief\": json.dumps({\"error\": \"分镜为空：A09 必须先产出 scenes\"}, ensure_ascii=False),\n        }\n    brief = package.get(\"brief\") if isinstance(package.get(\"brief\"), dict) else {}\n    distill = brief.get(\"distill\") if isinstance(brief.get(\"distill\"), dict) else {}\n    thesis = str(distill.get(\"thesis\") or \"\").strip()\n    arguments = [item for item in (distill.get(\"arguments\") or []) if isinstance(item, dict)]\n    claims = {}\n    for index, item in enumerate(arguments):\n        claim = str(item.get(\"claim\") or \"\").strip()\n        if claim:\n            claims[str(item.get(\"id\") or \"a%d\" % (index + 1))] = claim\n\n    # 构图账本：A08 已经按全片视野分配了每屏的构图，这里只做归一化和查重。\n    # 查重结果写进 design_brief，场景组会照着避开；真正的验收在渲染前的\n    # check_composition_variation.mjs（量真实 DOM，不看模型自报）。\n    composition_warnings = []\n    ledger = []\n    seen_family = {}\n    for index, scene in enumerate(scenes):\n        raw = scene.get(\"composition\") if isinstance(scene.get(\"composition\"), dict) else {}\n        family = str(raw.get(\"family\") or \"\").strip()\n        zone = str(raw.get(\"text_zone\") or \"\").strip()\n        align = str(raw.get(\"align\") or \"\").strip().lower()\n        scale = str(raw.get(\"scale\") or \"\").strip()\n        if align not in {\"left\", \"center\", \"right\"}:\n            align = \"\"\n        scene_id = str(scene.get(\"scene_id\") or \"s%02d\" % (index + 1))\n        if not family:\n            family = \"未分配-\" + scene_id\n            composition_warnings.append(\"%s 没有 composition.family：已标记未分配，场景组会按内容自拟\" % scene_id)\n        if not zone or not align or not scale:\n            composition_warnings.append(\"%s 的 composition 缺 text_zone/align/scale：场景组只能按内容自拟\" % scene_id)\n        if family in seen_family:\n            composition_warnings.append(\"%s 与 %s 用了同一个构图族「%s」：分镜必须逐屏变\" % (\n                scene_id, seen_family[family], family))\n        else:\n            seen_family[family] = scene_id\n        entry = {\n            \"scene_id\": scene_id,\n            \"family\": family,\n            \"text_zone\": zone,\n            \"align\": align,\n            \"scale\": scale,\n            \"why\": str(raw.get(\"why\") or \"\").strip(),\n        }\n        ledger.append(entry)\n\n    for left, right in zip(ledger, ledger[1:]):\n        if left[\"family\"] and left[\"family\"] == right[\"family\"]:\n            composition_warnings.append(\"相邻两屏构图族相同：%s 与 %s（%s）\" % (\n                left[\"scene_id\"], right[\"scene_id\"], left[\"family\"]))\n    if len(ledger) >= 2:\n        first, last = ledger[0], ledger[-1]\n        if (first[\"family\"], first[\"text_zone\"], first[\"scale\"]) == (\n                last[\"family\"], last[\"text_zone\"], last[\"scale\"]):\n            composition_warnings.append(\"首尾两屏构图三项全同（%s / %s）：必须做出对照\" % (\n                first[\"scene_id\"], last[\"scene_id\"]))\n    composition_warnings = list(dict.fromkeys(composition_warnings))\n\n    # 背景只有一族：16 张 canvas 动态卡，每张自带底色和字色，不按明暗分组。\n    # 目录（CATALOG）由 能力库/动效库/gen_catalog.py 从 presets.json 生成，这里不写卡表。\n    strategy = storyboard.get(\"creative_strategy\") or {}\n    # 这个节点只发目录 + 白名单：选哪张由 H01X 看全片内容决定，H01XJ 归一后注入逐屏载荷。\n    # >>> CATALOG（由 gen_catalog.py 生成，勿手改）\n    CATALOG = json.loads(r\"\"\"{\"background\": {\"B23\": {\"name\": \"半调网点\", \"note\": \"报纸印刷式网点，密度随位置变化；偏社会、舆论、被评价\", \"family\": \"dot\"}, \"B24\": {\"name\": \"扫描线\", \"note\": \"细横线加一条扫描带，像仪表在读数据；偏检测、审核\", \"family\": \"line\"}, \"B25\": {\"name\": \"点阵辉光\", \"note\": \"密集亮点向中心聚，有指标感；偏数字、成绩、金额\", \"family\": \"dot\"}, \"B26\": {\"name\": \"同心环\", \"note\": \"一圈一圈扩散，把注意力收到一个点；偏聚焦、回到自身\", \"family\": \"ring\"}, \"B27\": {\"name\": \"等高线\", \"note\": \"一层层波动的线场，像把标准画成地形；偏尺度、门槛、审判\", \"family\": \"line\"}, \"B28\": {\"name\": \"横向拉丝\", \"note\": \"细横线快速掠过，有速度和迭代感\", \"family\": \"line\"}, \"B29\": {\"name\": \"雪点\", \"note\": \"小点慢慢飘，安静；偏时间、回忆、等待\", \"family\": \"dot\"}, \"B30\": {\"name\": \"雨丝\", \"note\": \"斜斜的细线，压着情绪；偏低落、压力、怕\", \"family\": \"line\"}, \"B31\": {\"name\": \"像素溶解\", \"note\": \"块状像素聚散，东西在重组；偏推翻、重塑、转折\", \"family\": \"block\"}, \"B32\": {\"name\": \"棋盘\", \"note\": \"明暗方格，天生的对照与秩序；偏两种选择、取舍、规则\", \"family\": \"block\"}, \"B34\": {\"name\": \"光束\", \"note\": \"一束锥形光打下来，给出路和方向\", \"family\": \"light\"}, \"B35\": {\"name\": \"浮尘\", \"note\": \"细颗粒浮在光里，安静的资料感；偏日常、痕迹\", \"family\": \"dot\"}, \"B36\": {\"name\": \"渐变网格\", \"note\": \"四团色光慢慢游，柔和有空气；偏温和、包容、自由\", \"family\": \"light\"}, \"B37\": {\"name\": \"云纹噪声\", \"note\": \"雾一样的云纹，适合抽象概念\", \"family\": \"noise\"}, \"B38\": {\"name\": \"扰动噪声\", \"note\": \"两层噪声互相扭曲，流体感强；偏混乱、纠缠、复杂\", \"family\": \"noise\"}, \"B39\": {\"name\": \"有机漂移\", \"note\": \"点群随噪声场起伏，像星空也像人群\", \"family\": \"dot\"}, \"B49\": {\"name\": \"抖动网点\", \"note\": \"方点按明度疏密排开，暗处留黑；像老印刷或监控回放\", \"family\": \"dot\"}, \"B50\": {\"name\": \"透视网格\", \"note\": \"带透视的网格从地平线往画面外推，中间一条暖光\", \"family\": \"line\"}, \"B51\": {\"name\": \"流星\", \"note\": \"十几颗流星错峰斜下，配一层会呼吸的星点；暗底最适合压亮字\", \"family\": \"lin